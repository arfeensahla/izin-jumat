<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Perizinan Santri Al-Islam</title>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-down { animation: fadeInDown 0.3s ease-out forwards; }
    </style>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext, useMemo } = React;

        const API_BASE_URL = 'https://script.google.com/macros/s/AKfycbyddspvXA3vpGmDpHYjm5-uOlbEdSbDTYygeHsNv192SokqVrEKwBxiZAkYXVscTomM/exec';
        
        const ROLES = {
            ADMIN: 'ADMIN',
            WALI_KELAS: 'WALI_KELAS',
            SEKRETARIS_MUDIR: 'SEKRETARIS_MUDIR',
            SECURITY: 'SECURITY'
        };

        const Icons = {
            Home: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            FileText: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>,
            Scan: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
            LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
            Menu: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>,
            CheckCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#10b981" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>,
            XCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef4444" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Edit: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>,
            Search: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>,
            Calendar: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
            Grid: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>,
            TrendingUp: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>,
            Clock: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        };

        const AuthContext = createContext(null);
        const ToastContext = createContext(null);

        const apiService = {
            request: async (action, payload) => {
                // --- AWAL LOGIKA CACHING ---
                // Tentukan data master mana saja yang aman disimpan ke memori (jarang berubah)
                const cacheableActions = ['getSantri', 'getKelas', 'getJadwal', 'getTahunPelajaran'];
                const cacheKey = `cache_${action}`;

                if (cacheableActions.includes(action)) {
                    const cachedData = sessionStorage.getItem(cacheKey);
                    const cacheTimestamp = sessionStorage.getItem(`${cacheKey}_time`);
                    
                    // Cek masa kadaluarsa (Durasi: 15 Menit = 15 * 60 * 1000 milidetik)
                    const isExpired = !cacheTimestamp || (Date.now() - parseInt(cacheTimestamp)) > 15 * 60 * 1000;

                    if (cachedData && !isExpired) {
                        console.log(`⚡ Mengambil data ${action} dari Cache Lokal (Super Cepat!)`);
                        return JSON.parse(cachedData); // Langsung kembalikan, tidak perlu loading ke Google!
                    }
                }
                // --- AKHIR LOGIKA CACHING ---

                try {
                    console.log(`🌐 Meminta data ${action} dari Server Google...`);
                    const response = await fetch(API_BASE_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action, ...payload })
                    });
                    
                    const text = await response.text();
                    let data;
                    try { 
                        data = JSON.parse(text); 
                    } catch (e) { 
                        throw new Error("Gagal membaca respon server. Hubungi Admin."); 
                    }
                    
                    if (!data.success) throw new Error(data.message || 'Terjadi kesalahan dari server.');
                    
                    // --- AWAL SARINGAN TANGGAL OTOMATIS (Kode Asli Anda) ---
                    const formatDates = (obj) => {
                        for (let key in obj) {
                            if (typeof obj[key] === 'string' && obj[key].includes('T') && obj[key].endsWith('Z')) {
                                const d = new Date(obj[key]);
                                if (!isNaN(d.getTime())) {
                                    obj[key] = d.toLocaleDateString('id-ID', { 
                                        weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' 
                                    });
                                }
                            } else if (typeof obj[key] === 'object' && obj[key] !== null) {
                                formatDates(obj[key]);
                            }
                        }
                    };
                    formatDates(data);
                    // --- AKHIR SARINGAN TANGGAL OTOMATIS ---

                    // Simpan hasil (yang sudah diformat tanggalnya) ke dalam memori Cache
                    if (cacheableActions.includes(action) && data) {
                        sessionStorage.setItem(cacheKey, JSON.stringify(data));
                        sessionStorage.setItem(`${cacheKey}_time`, Date.now().toString());
                        console.log(`💾 Menyimpan data master ${action} ke Cache.`);
                    }

                    return data;
                } catch (error) {
                    console.error('API Error:', error);
                    // Cegatan khusus jika terjadi error "Failed to fetch" akibat limit Google
                    if (error.message === 'Failed to fetch' || String(error).includes('NetworkError')) {
                        throw new Error('Gagal terhubung ke server. Sistem sedang sibuk, silakan Refresh halaman.');
                    }
                    throw error;
                }
            },
            
            // Fitur tambahan opsional jika suatu saat butuh tombol "Refresh Data Total"
            clearCache: () => {
                sessionStorage.clear();
                console.log('🧹 Cache memori berhasil dibersihkan.');
            }
        };

        const Card = ({ children, className = "" }) => <div className={`bg-white rounded-xl shadow-sm border border-gray-100 p-6 ${className}`}>{children}</div>;
        
        const Button = ({ children, onClick, variant = 'primary', className = "", disabled, type="button", fullWidth, icon }) => {
            const baseStyle = "px-4 py-2 rounded-lg font-medium transition-all duration-200 flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-offset-2";
            const variants = {
                primary: "bg-emerald-600 hover:bg-emerald-700 text-white focus:ring-emerald-500",
                secondary: "bg-gray-100 hover:bg-gray-200 text-gray-800 focus:ring-gray-400",
                danger: "bg-red-500 hover:bg-red-600 text-white focus:ring-red-500",
            };
            return (
                <button type={type} onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${fullWidth ? 'w-full' : ''} ${disabled ? 'opacity-50 cursor-not-allowed' : ''} ${className}`}>
                    {icon} {children}
                </button>
            );
        };

        const Input = ({ label, type = "text", value, onChange, placeholder, required, name, readOnly }) => (
            <div className="mb-4">
                {label && <label className="block text-sm font-medium text-gray-700 mb-1">{label}</label>}
                <input name={name} type={type} value={value} onChange={onChange} placeholder={placeholder} required={required} readOnly={readOnly} className={`w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-colors ${readOnly ? 'bg-gray-100' : 'bg-white'}`} />
            </div>
        );

        const Select = ({ label, value, onChange, options, required, name, disabled }) => (
            <div className="mb-4">
                {label && <label className="block text-sm font-medium text-gray-700 mb-1">{label}</label>}
                <select disabled={disabled} name={name} value={value} onChange={onChange} required={required} className={`w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 ${disabled ? 'bg-gray-100 cursor-not-allowed' : 'bg-white'}`}>
                    <option value="">-- Pilih --</option>
                    {options.map((opt, idx) => typeof opt === 'object' ? <option key={idx} value={opt.value}>{opt.label}</option> : <option key={idx} value={opt}>{opt}</option>)}
                </select>
            </div>
        );

        const StatCard = ({ title, value, icon, color = "bg-emerald-50 text-emerald-600" }) => (
            <Card className="flex items-center gap-4">
                <div className={`p-4 rounded-full ${color}`}>{icon}</div>
                <div>
                    <p className="text-sm text-gray-500 font-medium">{title}</p>
                    <h3 className="text-2xl font-bold text-gray-800">{value}</h3>
                </div>
            </Card>
        );

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => { const timer = setTimeout(onClose, 4000); return () => clearTimeout(timer); }, [onClose]);
            return (
                <div className="fixed top-4 right-4 z-50 animate-fade-in-down">
                    <div className={`flex items-center gap-3 px-6 py-4 rounded-lg shadow-lg text-white ${type === 'error' ? 'bg-red-500' : 'bg-gray-800'}`}>
                        {type === 'error' ? <Icons.XCircle /> : <Icons.CheckCircle />}
                        <span className="font-medium">{message}</span>
                    </div>
                </div>
            );
        };

        const Modal = ({ isOpen, onClose, title, children, maxWidth = "max-w-md" }) => {
            if (!isOpen) return null;

            // Memindahkan SEMUA modal ke lapisan paling luar browser (document.body)
            return ReactDOM.createPortal(
                // Pembungkus utama bisa di-scroll jika formnya sangat panjang
                <div className="fixed inset-0 z-[9980] flex p-4 sm:p-6 bg-black/60 backdrop-blur-sm overflow-y-auto animate-fade-in-down">
                    
                    {/* Background hitam penuh (fixed agar mengcover layar 100%) */}
                    <div className="fixed inset-0 cursor-pointer" onClick={onClose}></div>
                    
                    {/* Kotak Form: Menggunakan m-auto agar selalu aman di tengah dan tidak terpotong */}
                    <div className={`relative m-auto w-full ${maxWidth} flex flex-col bg-white rounded-xl shadow-2xl overflow-hidden z-10`}>
                        
                        {/* Header Modal seragam dengan Kartu QR */}
                        <div className="px-5 py-4 border-b flex justify-between items-center bg-gray-50">
                            {title && <h3 className="font-bold text-gray-800 text-lg">{title}</h3>}
                            <button 
                                onClick={onClose} 
                                className="text-red-600 bg-red-50 hover:bg-red-100 border border-red-200 px-3 py-1 rounded-md text-xs font-bold tracking-wide transition-colors ml-auto"
                            >
                                TUTUP &#10005;
                            </button>
                        </div>
                        
                        {/* Isi Form / Konten */}
                        <div className="p-5 bg-white relative">
                            {children}
                        </div>
                        
                    </div>
                </div>,
                document.body
            );
        };

        const SidebarItem = ({ icon: Icon, label, active, onClick }) => (
            <button onClick={onClick} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition-colors ${active ? 'bg-emerald-50 text-emerald-700 font-medium' : 'text-gray-600 hover:bg-gray-50'}`}>
                <Icon /> <span>{label}</span>
            </button>
        );

        const Layout = ({ children }) => {
            const { user, logout } = useContext(AuthContext);
            const { showToast } = useContext(ToastContext); // Tambahan untuk notifikasi
            const [isSidebarOpen, setSidebarOpen] = useState(false);
            const [currentRoute, setCurrentRoute] = useState('dashboard');

            // --- STATE UNTUK GANTI PASSWORD ---
            const [isPasswordModalOpen, setPasswordModalOpen] = useState(false);
            const [passForm, setPassForm] = useState({ old_password: '', new_password: '' });
            const [passLoading, setPassLoading] = useState(false);

            if (!user) return null;
            const safeRole = user?.role || 'UNKNOWN';

            const menuItems = {
                [ROLES.ADMIN]: [
                    { id: 'dashboard', label: 'Dashboard', icon: Icons.Home },
                    { id: 'master_santri', label: 'Data Santri', icon: Icons.Users },
                    { id: 'master_kelas', label: 'Data Kelas', icon: Icons.Grid },
                    { id: 'tahun_pelajaran', label: 'Tahun Pelajaran', icon: Icons.Calendar },
                    { id: 'kenaikan_kelas', label: 'Kenaikan Kelas', icon: Icons.TrendingUp },
                    { id: 'jadwal_perizinan', label: 'Jadwal Perizinan', icon: Icons.Clock },
                    { id: 'perizinan', label: 'Semua Perizinan', icon: Icons.FileText }
                ],
                [ROLES.WALI_KELAS]: [
                    { id: 'dashboard', label: 'Dashboard', icon: Icons.Home },
                    { id: 'pengajuan', label: 'Ajukan Izin', icon: Icons.Plus },
                    { id: 'histori', label: 'Histori Kelas', icon: Icons.Users },
                ],
                [ROLES.SEKRETARIS_MUDIR]: [
                    { id: 'dashboard', label: 'Dashboard', icon: Icons.Home },
                    { id: 'screening', label: 'Screening Izin', icon: Icons.FileText },
                    { id: 'histori_global', label: 'Histori Izin', icon: Icons.Users },
                ],
                [ROLES.SECURITY]: [
                    { id: 'dashboard', label: 'Dashboard', icon: Icons.Home },
                    { id: 'scanner', label: 'Scan QR Code', icon: Icons.Scan },
                    { id: 'log', label: 'Riwayat Scan', icon: Icons.FileText },
                ]
            };

            const currentMenu = menuItems[safeRole] || [];

            // --- FUNGSI EKSEKUSI GANTI PASSWORD ---
            const handleGantiPassword = async (e) => {
                e.preventDefault();
                setPassLoading(true);
                try {
                    await apiService.request('changePassword', { 
                        username: user.username || user.nama, 
                        old_password: passForm.old_password, 
                        new_password: passForm.new_password 
                    });
                    showToast('Password berhasil diubah!', 'success');
                    
                    // Simpan Log aktivitas
                    apiService.request('saveLog', { 
                        role: user.role, 
                        nama: user.nama, 
                        aksi: 'GANTI_PASSWORD', 
                        keterangan: 'Berhasil mengubah password secara mandiri' 
                    }).catch(()=>{});
                    
                    setPasswordModalOpen(false);
                    setPassForm({ old_password: '', new_password: '' });
                } catch (e) { 
                    showToast(e.message, 'error'); 
                } finally { 
                    setPassLoading(false); 
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col md:flex-row">
                    <div className="md:hidden bg-white border-b px-4 py-3 flex justify-between items-center sticky top-0 z-20">
                        <div className="font-bold text-emerald-700">Al-Islam Permit</div>
                        <button onClick={() => setSidebarOpen(!isSidebarOpen)} className="p-2 text-gray-600"><Icons.Menu /></button>
                    </div>

                    <div className={`fixed md:static inset-y-0 left-0 w-64 bg-white border-r transform ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 transition-transform duration-300 ease-in-out z-30 flex flex-col`}>
                        <div className="p-6 border-b hidden md:block">
                            <h1 className="font-bold text-xl text-emerald-700 leading-tight">Sistem Perizinan<br/><span className="text-sm text-gray-500 font-normal">PPM Al-Islam</span></h1>
                        </div>
                        <div className="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                            <div className="mb-6 px-4 py-3 bg-emerald-50 rounded-lg text-sm border border-emerald-100">
                                <p className="text-gray-500">Masuk sebagai:</p>
                                <p className="font-semibold text-emerald-800">{user.nama}</p>
                                <p className="text-xs text-emerald-600 mt-1 uppercase tracking-wider font-bold">{safeRole.replace('_', ' ')}</p>
                                {user.kelas_id && <p className="text-xs text-gray-500 mt-1">Kelas: {user.kelas_id}</p>}
                            </div>
                            {currentMenu.length > 0 ? currentMenu.map(item => (
                                <SidebarItem key={item.id} icon={item.icon} label={item.label} active={currentRoute === item.id} onClick={() => { setCurrentRoute(item.id); setSidebarOpen(false); }} />
                            )) : <p className="text-red-500 text-sm px-4">Error Role.</p>}
                        </div>
                        <div className="p-4 border-t space-y-1">
                            {/* TOMBOL GANTI PASSWORD */}

                        height: 100,
                        colorDark : "#065f46",
                        colorLight : "#ffffff",

                    const link = document.createElement('a');
                    link.download = `Izin_${permit.nama_santri.replace(/\s+/g, '_')}_${permit.tanggal_izin}.png`;

                const search = searchTerm.toLowerCase();
                return renderNama.includes(search) || renderWali.includes(search);

            // --- LOGIKA SORTING ---
            const sortedData = [...filteredData].sort((a, b) => {
                if (!sortConfig.key) return 0;
                
                let aValue = '';
                let bValue = '';
                if (sortConfig.key === 'nama_kelas') { aValue = String(a.nama_kelas || a.nama || a.kelas || ''); bValue = String(b.nama_kelas || b.nama || b.kelas || ''); }
                if (sortConfig.key === 'wali_kelas') { aValue = String(a.wali_kelas || a.wali || ''); bValue = String(b.wali_kelas || b.wali || ''); }

                aValue = aValue.toLowerCase();
                bValue = bValue.toLowerCase();

                if (aValue < bValue) return sortConfig.direction === 'asc' ? -1 : 1;
                if (aValue > bValue) return sortConfig.direction === 'asc' ? 1 : -1;
                return 0;
            });

                    let finalKelas = [];
                    if (resKelas && resKelas.data && Array.isArray(resKelas.data.data)) finalKelas = resKelas.data.data;
                    else if (resKelas && Array.isArray(resKelas.data)) finalKelas = resKelas.data;
                    else if (Array.isArray(resKelas)) finalKelas = resKelas;
                    setKelasOptions(finalKelas);
                } catch (e) { showToast(e.message, 'error'); } 
                finally { setLoading(false); }
            };
            useEffect(() => { fetchData(); }, []);

            const handleDelete = async (id) => {
                if (!window.confirm('Yakin ingin menghapus data santri ini?')) return;
                try {
                    await apiService.request('deleteData', { sheetName: 'SANTRI', rowId: id });
                    showToast('Data santri berhasil dihapus', 'success');
                    fetchData();
                } catch (e) { showToast(e.message, 'error'); }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.kelas) return showToast('Pilih kelas terlebih dahulu!', 'error');
                
                try {
                    const payload = { 
                        nis: formData.nis,
                        nama_santri: formData.nama_santri,
                        kelas: formData.kelas,
                        gender: formData.gender
                    };
                    await apiService.request('saveData', { sheetName: 'SANTRI', data: payload });
                    showToast('Data santri berhasil ditambahkan!', 'success');
                    setIsModalOpen(false);
                    setFormData({ nis: '', nama_santri: '', kelas: '', gender: 'Laki-Laki' });
                    fetchData();
                } catch (e) { showToast(e.message, 'error'); }
            };

            const filteredSantri = santri.filter(item => {
                const renderNis = String(item.nis || item.NIS || item.id_santri || '').toLowerCase();
                const renderNama = String(item.nama_santri || item.Nama || item.nama || item.nama_lengkap || '').toLowerCase();
                const renderKelas = String(item.kelas || item.Kelas || '');
                const renderGender = String(item.gender || item.Gender || item.jk || '').toLowerCase();

                const matchSearch = renderNis.includes(searchTerm.toLowerCase()) || renderNama.includes(searchTerm.toLowerCase());
                const matchKelas = filterKelas === '' || renderKelas === filterKelas;
                const matchGender = filterGender === '' || renderGender.includes(filterGender.toLowerCase());

                return matchSearch && matchKelas && matchGender;
            });

            // --- LOGIKA SORTING ---
            const sortedSantri = [...filteredSantri].sort((a, b) => {
                if (!sortConfig.key) return 0;
                
                let aValue = '';
                let bValue = '';
                
                if (sortConfig.key === 'nis') { aValue = String(a.nis || a.NIS || a.id_santri || ''); bValue = String(b.nis || b.NIS || b.id_santri || ''); }
                if (sortConfig.key === 'nama_santri') { aValue = String(a.nama_santri || a.Nama || a.nama || a.nama_lengkap || ''); bValue = String(b.nama_santri || b.Nama || b.nama || b.nama_lengkap || ''); }
                if (sortConfig.key === 'kelas') { aValue = String(a.kelas || a.Kelas || ''); bValue = String(b.kelas || b.Kelas || ''); }
                if (sortConfig.key === 'gender') { aValue = String(a.gender || a.Gender || a.jk || ''); bValue = String(b.gender || b.Gender || b.jk || ''); }

                aValue = aValue.toLowerCase();
                bValue = bValue.toLowerCase();

                if (aValue < bValue) return sortConfig.direction === 'asc' ? -1 : 1;
                if (aValue > bValue) return sortConfig.direction === 'asc' ? 1 : -1;
                return 0;
            });

            const handleSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
                setSortConfig({ key, direction });
            };

            const SortIcon = ({ columnKey }) => {
                if (sortConfig.key !== columnKey) return <span className="text-gray-300 ml-1">↕</span>;
                return sortConfig.direction === 'asc' ? <span className="text-emerald-600 ml-1">▲</span> : <span className="text-emerald-600 ml-1">▼</span>;
            };

            return (
                <div className="space-y-6 animate-fade-in-down">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-4 gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Data Santri</h2>
                            <p className="text-gray-500">Kelola daftar santri yang aktif di pondok.</p>
                        </div>
                        <Button onClick={() => setIsModalOpen(true)} icon={<Icons.Plus />}>Tambah Santri</Button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <input 
                            type="text" placeholder="Cari NIS atau Nama Santri..." 
                            className="w-full p-2.5 border rounded-lg bg-white focus:ring-2 focus:ring-emerald-500 outline-none text-sm"
                            value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)}
                        />
                        <select className="w-full p-2.5 border rounded-lg bg-white outline-none text-sm" value={filterKelas} onChange={(e) => setFilterKelas(e.target.value)}>
                            <option value="">Semua Kelas</option>
                            {kelasOptions.map((k, i) => {
                                const kKeys = Object.keys(k);
                                const namaKelas = k[kKeys.find(key => key.toLowerCase().includes('nama')) || kKeys[1]] || k.nama_kelas;
                                return <option key={i} value={namaKelas}>{namaKelas}</option>;
                            })}
                        </select>
                        <select className="w-full p-2.5 border rounded-lg bg-white outline-none text-sm" value={filterGender} onChange={(e) => setFilterGender(e.target.value)}>
                            <option value="">Semua Gender</option>
                            <option value="laki">Laki-Laki</option>
                            <option value="perempuan">Perempuan</option>
                        </select>
                    </div>

                    <Card className="overflow-x-auto p-0">
                        <table className="w-full text-left text-sm whitespace-nowrap">
                            <thead className="bg-emerald-50 text-emerald-800 border-b">
                                <tr>
                                    <th className="p-4 cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('nis')}>
                                        NIS <SortIcon columnKey="nis" />
                                    </th>
                                    <th className="p-4 cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('nama_santri')}>
                                        Nama Lengkap <SortIcon columnKey="nama_santri" />
                                    </th>
                                    <th className="p-4 cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('kelas')}>
                                        Kelas <SortIcon columnKey="kelas" />
                                    </th>
                                    <th className="p-4 cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('gender')}>
                                        Gender <SortIcon columnKey="gender" />
                                    </th>
                                    <th className="p-4">Aksi</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {loading ? <tr><td colSpan="5" className="p-8 text-center text-gray-500">Memuat data santri...</td></tr> : 
                                 sortedSantri.length === 0 ? <tr><td colSpan="5" className="p-8 text-center text-gray-500">Data santri tidak ditemukan.</td></tr> :
                                 sortedSantri.map((item, idx) => {
                                     const renderNis = item.nis || item.NIS || item.id_santri || '-';
                                     const renderNama = item.nama_santri || item.Nama || item.nama || item.nama_lengkap || '-';
                                     const renderKelas = item.kelas || item.Kelas || '-';
                                     const renderGender = String(item.gender || item.Gender || item.jk || '-');
                                     
                                     return (
                                        <tr key={idx} className="hover:bg-gray-50">
                                            <td className="p-4 font-mono text-xs text-gray-500">{renderNis}</td>
                                            <td className="p-4 font-bold text-gray-800">{renderNama}</td>
                                            <td className="p-4 font-medium text-emerald-600">{renderKelas}</td>
                                            <td className="p-4">
                                                <span className={`px-2 py-1 rounded text-[10px] font-bold ${renderGender.toLowerCase().includes('laki') ? 'bg-blue-100 text-blue-700' : 'bg-pink-100 text-pink-700'}`}>
                                                    {renderGender.toUpperCase()}
                                                </span>
                                            </td>
                                            <td className="p-4">
                                                <button onClick={() => handleDelete(renderNis)} className="text-red-600 bg-red-50 hover:bg-red-100 px-3 py-1 rounded-md text-xs font-bold transition-colors">Hapus</button>
                                            </td>
                                        </tr>
                                     )
                                 })}
                            </tbody>
                        </table>
                    </Card>

                    <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title="Tambah Data Santri">
                        {/* Form tidak berubah */}
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Nomor Induk Santri (NIS)</label>
                                <input type="text" required placeholder="Contoh: 20261001" className="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-emerald-500 outline-none" value={formData.nis} onChange={e => setFormData({...formData, nis: e.target.value})} />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap Santri</label>
                                <input type="text" required placeholder="Masukkan nama lengkap" className="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-emerald-500 outline-none" value={formData.nama_santri} onChange={e => setFormData({...formData, nama_santri: e.target.value})} />
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Kelas</label>
                                    <select className="w-full p-2 border rounded-lg bg-gray-50 outline-none" value={formData.kelas} onChange={e => setFormData({...formData, kelas: e.target.value})}>
                                        <option value="">-- Pilih Kelas --</option>
                                        {kelasOptions.map((k, i) => {
                                            const kKeys = Object.keys(k);
                                            const namaKelas = k[kKeys.find(key => key.toLowerCase().includes('nama')) || kKeys[1]] || k.nama_kelas;
                                            return <option key={i} value={namaKelas}>{namaKelas}</option>;
                                        })}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Gender</label>
                                    <select className="w-full p-2 border rounded-lg bg-gray-50 outline-none" value={formData.gender} onChange={e => setFormData({...formData, gender: e.target.value})}>
                                        <option>Laki-Laki</option>
                                        <option>Perempuan</option>
                                    </select>
                                </div>
                            </div>
                            <Button fullWidth type="submit" className="mt-6">Simpan Santri</Button>
                        </form>
                    </Modal>
                </div>
            );
        };
        
        const MasterKelasPage = () => {
            const { showToast } = useContext(ToastContext);
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [formData, setFormData] = useState({});

            const fetchData = async () => {
                setLoading(true);
                try {
                    const res = await apiService.request('getKelas');
                    setData(res.data || []);
                } catch (e) { showToast(e.message, 'error'); } finally { setLoading(false); }
            };
            useEffect(() => { fetchData(); }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    const res = await apiService.request('saveKelas', formData);
                    showToast(res.message, 'success');
                    setIsModalOpen(false);
                    fetchData();
                } catch (e) { showToast(e.message, 'error'); }
            };

            return (
                <div className="space-y-6 animate-fade-in-down">
                    <div className="flex justify-between items-center">
                        <div><h2 className="text-2xl font-bold text-gray-800">Master Data Kelas</h2></div>
                        <Button onClick={() => { setFormData({}); setIsModalOpen(true); }} icon={<Icons.Plus />}>Tambah Kelas</Button>
                    </div>
                    <Card>
                        <table className="w-full text-left text-sm border-collapse whitespace-nowrap">
                            <thead><tr className="bg-gray-50 border-b"><th className="p-3">Nama Kelas</th><th className="p-3">Jenjang</th><th className="p-3">Wali Kelas</th><th className="p-3">Aksi</th></tr></thead>
                            <tbody>
                                {loading ? <tr><td colSpan="4" className="p-4 text-center">Memuat data...</td></tr> : data.map((item, idx) => (
                                    <tr key={idx} className="border-b hover:bg-gray-50"><td className="p-3 font-bold">{item.nama_kelas}</td><td className="p-3">{item.jenjang}</td><td className="p-3 text-emerald-700">{item.wali_kelas}</td><td className="p-3"><button onClick={() => { setFormData(item); setIsModalOpen(true); }} className="p-1 text-blue-600 hover:bg-blue-50 rounded"><Icons.Edit /></button></td></tr>
                                ))}
                            </tbody>
                        </table>
                    </Card>
                    <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title="Form Kelas">
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <Input label="Nama Kelas (Contoh: VII-A)" value={formData.nama_kelas || ''} onChange={(e) => setFormData({...formData, nama_kelas: e.target.value})} required />
                            <Select label="Jenjang" options={['SMP', 'SMA']} value={formData.jenjang || ''} onChange={(e) => setFormData({...formData, jenjang: e.target.value})} required />
                            <Input label="Wali Kelas (ID/Username)" value={formData.wali_kelas || ''} onChange={(e) => setFormData({...formData, wali_kelas: e.target.value})} required />
                            <div className="pt-4 flex justify-end gap-2 border-t"><Button type="button" variant="secondary" onClick={() => setIsModalOpen(false)}>Batal</Button><Button type="submit">Simpan</Button></div>
                        </form>
                    </Modal>
                </div>
            );
        };

        // --- PHASE 3 COMPONENTS ---
        const KenaikanKelasPage = () => {
            const { showToast } = useContext(ToastContext);
            const [santriData, setSantriData] = useState([]);
            const [tpData, setTpData] = useState([]);
            const [kelasData, setKelasData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [processing, setProcessing] = useState(false);
            
            const [selectedTp, setSelectedTp] = useState('');
            const [fromKelas, setFromKelas] = useState('');
            const [toKelas, setToKelas] = useState('');
            const [previewData, setPreviewData] = useState([]);

            useEffect(() => {
                const fetchDeps = async () => {
                    try {
                        const [resSantri, resTp, resKelas] = await Promise.all([
                            apiService.request('getSantri'),
                            apiService.request('getTahunPelajaran'),
                            apiService.request('getKelas')
                        ]);
                        
                        // 1. Ekstrak Data Santri (Aman dari bungkus ganda)
                        let finalSantri = [];
                        if (resSantri && resSantri.data && Array.isArray(resSantri.data.data)) finalSantri = resSantri.data.data;
                        else if (resSantri && Array.isArray(resSantri.data)) finalSantri = resSantri.data;
                        else if (Array.isArray(resSantri)) finalSantri = resSantri;

                        // 2. Ekstrak Data Tahun Pelajaran (TP)
                        let finalTp = [];
                        if (resTp && resTp.data && Array.isArray(resTp.data.data)) finalTp = resTp.data.data;
                        else if (resTp && Array.isArray(resTp.data)) finalTp = resTp.data;
                        else if (Array.isArray(resTp)) finalTp = resTp;

                        // 3. Ekstrak Data Kelas
                        let finalKelas = [];
                        if (resKelas && resKelas.data && Array.isArray(resKelas.data.data)) finalKelas = resKelas.data.data;
                        else if (resKelas && Array.isArray(resKelas.data)) finalKelas = resKelas.data;
                        else if (Array.isArray(resKelas)) finalKelas = resKelas;

                        // --- PENYARINGAN AMAN ---
                        // Mencari status aktif tanpa peduli huruf besar/kecil
                        const aktifSantri = finalSantri.filter(s => String(s.status || s.Status || '').toLowerCase() === 'aktif');
                        const aktifTp = finalTp.filter(t => String(t.status || t.Status || '').toLowerCase() === 'aktif');
                        
                        setSantriData(aktifSantri);
                        setTpData(aktifTp);
                        setKelasData(finalKelas);

                        // Set TP default ke yang aktif (Sapu Jagat untuk nama ID)
                        if (aktifTp.length > 0) {
                            setSelectedTp(aktifTp[0].tp_id || aktifTp[0].id_tp || aktifTp[0].id || aktifTp[0].tahun_pelajaran);
                        } else if (finalTp.length > 0) {
                            setSelectedTp(finalTp[0].tp_id || finalTp[0].id_tp || finalTp[0].id || finalTp[0].tahun_pelajaran);
                        }

                    } catch (e) { 
                        showToast(e.message, 'error'); 
                    } finally { 
                        setLoading(false); 
                    }
                };
                fetchDeps();
            }, []);

            const handlePreview = () => {
                if (!selectedTp || !fromKelas || !toKelas) return showToast('Pilih TP, Kelas Asal, dan Kelas Tujuan', 'error');
                
                // Menarik santri sesuai kelas asalnya
                const targetSantri = santriData.filter(s => (s.kelas || s.Kelas) === fromKelas);
                
                // Menyiapkan draft (Dilengkapi Sapu Jagat untuk mengatasi perbedaan nama kolom NIS/Nama)
                const draft = targetSantri.map(s => ({
                    santri_id: s.santri_id || s.nis || s.NIS || s.id, 
                    nama: s.nama || s.nama_santri || s.Nama, 
                    kelas_lama: s.kelas || s.Kelas, 
                    kelas_baru: toKelas, 
                    status_baru: toKelas === 'LULUS' ? 'Lulus' : 'Aktif'
                }));
                
                setPreviewData(draft);
                showToast(`Menemukan ${draft.length} santri untuk diproses.`, 'success');
            };

            const handleIndividualChange = (idx, field, value) => {
                const updated = [...previewData];
                updated[idx][field] = value;
                setPreviewData(updated);
            };

            const handleSubmit = async () => {
                if (previewData.length === 0) return;
                if (!confirm("Apakah Anda yakin memproses kenaikan kelas ini? Proses ini akan mencatat histori di database.")) return;
                setProcessing(true);
                try {
                    const payload = { mutations: previewData.map(d => ({ santri_id: d.santri_id, tp_id: selectedTp, kelas_baru: d.kelas_baru, status_baru: d.status_baru })) };
                    const res = await apiService.request('saveKenaikanKelas', payload);
                    showToast(res.message || 'Proses kenaikan kelas berhasil!', 'success');
                    setPreviewData([]);
                    setFromKelas('');
                    setToKelas('');
                } catch (e) { showToast(e.message, 'error'); } finally { setProcessing(false); }
            };

            // Mengambil daftar nama kelas secara unik & aman
            const listNamaKelas = [...new Set(kelasData.map(k => k.nama_kelas || k.kelas || k.nama).filter(Boolean))].sort();

            return (
                <div className="space-y-6 animate-fade-in-down">
                    <div>
                        <h2 className="text-2xl font-bold text-gray-800">Proses Kenaikan Kelas</h2>
                        <p className="text-gray-500">Pindahkan kelas santri secara massal dengan aman (histori tahun lalu terjaga).</p>
                    </div>
                    <Card>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                            <Select 
                                label="Tahun Pelajaran Target" 
                                options={tpData.map(t => ({value: t.tp_id || t.id_tp || t.id || t.tahun_pelajaran, label: t.nama_periode || t.tahun_pelajaran || t.nama}))} 
                                value={selectedTp} 
                                onChange={(e) => setSelectedTp(e.target.value)} 
                                disabled={loading} 
                            />
                            <Select 
                                label="Dari Kelas (Lama)" 
                                options={listNamaKelas} 
                                value={fromKelas} 
                                onChange={(e) => setFromKelas(e.target.value)} 
                                disabled={loading} 
                            />
                            <Select 
                                label="Ke Kelas (Baru)" 
                                options={[...listNamaKelas, 'LULUS', 'TIDAK NAIK']} 
                                value={toKelas} 
                                onChange={(e) => setToKelas(e.target.value)} 
                                disabled={loading} 
                            />
                            <div className="flex items-end">
                                <Button fullWidth onClick={handlePreview} disabled={loading || !selectedTp || !fromKelas || !toKelas}>Tampilkan Preview</Button>
                            </div>
                        </div>
                        
                        {previewData.length > 0 && (
                            <div className="mt-8 border-t pt-4 animate-fade-in-down">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="font-bold text-emerald-800">Preview Pemindahan ({previewData.length} Santri)</h3>
                                    <Button onClick={handleSubmit} disabled={processing}>{processing ? 'Memproses...' : 'Simpan Perubahan Permanen'}</Button>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-sm border-collapse">
                                        <thead>
                                            <tr className="bg-gray-50 border-b">
                                                <th className="p-3">Nama Santri</th>
                                                <th className="p-3">Kelas Lama</th>
                                                <th className="p-3">Ubah Kelas Baru (Koreksi)</th>
                                                <th className="p-3">Ubah Status</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {previewData.map((d, idx) => (
                                                <tr key={idx} className="border-b bg-emerald-50 hover:bg-emerald-100 transition-colors">
                                                    <td className="p-3 font-medium">{d.nama}</td>
                                                    <td className="p-3">{d.kelas_lama}</td>
                                                    <td className="p-3">
                                                        <select className="w-full p-2 border rounded outline-none" value={d.kelas_baru} onChange={(e) => handleIndividualChange(idx, 'kelas_baru', e.target.value)}>
                                                            <option value="LULUS">LULUS</option>
                                                            <option value="TIDAK NAIK">TIDAK NAIK</option>
                                                            {listNamaKelas.map(k => <option key={k} value={k}>{k}</option>)}
                                                        </select>
                                                    </td>
                                                    <td className="p-3">
                                                        <select className="w-full p-2 border rounded outline-none" value={d.status_baru} onChange={(e) => handleIndividualChange(idx, 'status_baru', e.target.value)}>
                                                            <option value="Aktif">Aktif</option>
                                                            <option value="Lulus">Lulus</option>
                                                            <option value="Nonaktif">Nonaktif</option>
                                                        </select>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </Card>
                </div>
            );
        };

        // --- PHASE 4 COMPONENTS ---
        const JadwalPerizinanPage = () => {
            const { showToast } = useContext(ToastContext);
            const [jadwal, setJadwal] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [loading, setLoading] = useState(true);
            const [formData, setFormData] = useState({ pekan: 'Pekan 1', jenjang: 'SEMUA', gender: 'SEMUA', hari: 'Sabtu', jam_mulai: '08:00', jam_selesai: '16:00' });

            const [filterHari, setFilterHari] = useState('');
            const [filterJenjang, setFilterJenjang] = useState('');
            const [filterGender, setFilterGender] = useState('');

            // --- STATE UNTUK SORTING ---
            const [sortConfig, setSortConfig] = useState({ key: 'pekan', direction: 'asc' });

            const fetchData = async () => {
                setLoading(true);
                try { 
                    const res = await apiService.request('getJadwal'); 
                    
                    let finalData = [];
                    if (res && res.data && Array.isArray(res.data.data)) finalData = res.data.data;
                    else if (res && Array.isArray(res.data)) finalData = res.data;
                    else if (Array.isArray(res)) finalData = res;
                    
                    setJadwal(finalData); 
                } catch (e) { showToast(e.message, 'error'); } 
                finally { setLoading(false); }
            };
            useEffect(() => { fetchData(); }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    const newId = 'JDW-' + Math.floor(Math.random() * 10000);
                    const payload = { 
                        ...formData, 
                        id_jadwal: newId,
                        jadwal_id: newId, 
                        jam_mulai: "'" + formData.jam_mulai,
                        jam_selesai: "'" + formData.jam_selesai
                    };
                    await apiService.request('saveData', { sheetName: 'JADWAL', data: payload });
                    showToast('Aturan jadwal baru berhasil ditambahkan!', 'success');
                    setIsModalOpen(false);
                    fetchData();
                } catch (e) { showToast(e.message, 'error'); }
            };

            const handleDelete = async (id) => {
                if (!window.confirm('Yakin ingin menghapus aturan jadwal ini?')) return;
                try {
                    await apiService.request('deleteData', { sheetName: 'JADWAL', rowId: id });
                    showToast('Aturan berhasil dihapus', 'success');
                    fetchData();
                } catch (e) { showToast(e.message, 'error'); }
            };

            const formatJam = (val) => {
                if (!val) return '-';
                if (typeof val === 'object' && val instanceof Date) return val.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                return String(val).substring(0, 5); 
            };

            const filteredJadwal = jadwal.filter(j => {
                const keys = Object.keys(j);
                const jenjang = String(j[keys[2]] || j.jenjang || '-').toUpperCase();
                const gender = String(j[keys[3]] || j.gender || '-').toLowerCase();
                const hari = String(j[keys[4]] || j.hari || '-').toLowerCase();

                const matchHari = filterHari === '' || hari.includes(filterHari.toLowerCase());
                const matchJenjang = filterJenjang === '' || jenjang === filterJenjang.toUpperCase() || jenjang === 'SEMUA';
                const matchGender = filterGender === '' || gender.includes(filterGender.toLowerCase()) || gender === 'semua';

                return matchHari && matchJenjang && matchGender;
            });

            // --- LOGIKA SORTING ---
            const sortedJadwal = [...filteredJadwal].sort((a, b) => {
                if (!sortConfig.key) return 0;
                
                const getVal = (item) => {
                    const keys = Object.keys(item);
                    if (sortConfig.key === 'pekan') return String(item[keys[1]] || item.pekan || '');
                    if (sortConfig.key === 'jenjang') return String(item[keys[2]] || item.jenjang || '');
                    if (sortConfig.key === 'gender') return String(item[keys[3]] || item.gender || '');
                    if (sortConfig.key === 'hari') return String(item[keys[4]] || item.hari || '');
                    if (sortConfig.key === 'jam_mulai') return formatJam(item[keys[5]] || item.jam_mulai);
                    return '';
                };
                
                let aValue = getVal(a).toLowerCase();
                let bValue = getVal(b).toLowerCase();

                if (aValue < bValue) return sortConfig.direction === 'asc' ? -1 : 1;
                if (aValue > bValue) return sortConfig.direction === 'asc' ? 1 : -1;
                return 0;
            });

            const handleSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
                setSortConfig({ key, direction });
            };

            const SortIcon = ({ columnKey }) => {
                if (sortConfig.key !== columnKey) return <span className="text-gray-300 ml-1">↕</span>;
                return sortConfig.direction === 'asc' ? <span className="text-emerald-600 ml-1">▲</span> : <span className="text-emerald-600 ml-1">▼</span>;
            };

            return (
                <div className="space-y-6 animate-fade-in-down">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-4 gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Aturan Jadwal Perizinan</h2>
                            <p className="text-gray-500">Kelola jadwal keluar santri secara spesifik.</p>
                        </div>
                        <Button onClick={() => setIsModalOpen(true)} icon={<Icons.Plus />}>Tambah Aturan Baru</Button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <select className="w-full p-2.5 border rounded-lg bg-white outline-none text-sm" value={filterHari} onChange={(e) => setFilterHari(e.target.value)}>
                            <option value="">Semua Hari</option>
                            <option value="jumat">Jumat</option>
                            <option value="sabtu">Sabtu</option>
                            <option value="ahad">Ahad</option>
                        </select>
                        <select className="w-full p-2.5 border rounded-lg bg-white outline-none text-sm" value={filterJenjang} onChange={(e) => setFilterJenjang(e.target.value)}>
                            <option value="">Semua Jenjang</option>
                            <option value="smp">SMP</option>
                            <option value="sma">SMA</option>
                        </select>
                        <select className="w-full p-2.5 border rounded-lg bg-white outline-none text-sm" value={filterGender} onChange={(e) => setFilterGender(e.target.value)}>
                            <option value="">Semua Gender</option>
                            <option value="laki">Laki-Laki</option>
                            <option value="perempuan">Perempuan</option>
                        </select>
                    </div>

                    <Card className="overflow-x-auto p-0">
                        <table className="w-full text-left text-sm whitespace-nowrap">
                            <thead className="bg-emerald-50 text-emerald-800 border-b">
                                <tr>
                                    <th className="p-4 cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('pekan')}>
                                        Pekan <SortIcon columnKey="pekan" />
                                    </th>
                                    <th className="p-4 cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('jenjang')}>
                                        Jenjang <SortIcon columnKey="jenjang" />
                                    </th>
                                    <th className="p-4 cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('gender')}>
                                        Gender <SortIcon columnKey="gender" />
                                    </th>
                                    <th className="p-4 cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('hari')}>
                                        Hari <SortIcon columnKey="hari" />
                                    </th>
                                    <th className="p-4 text-center cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('jam_mulai')}>
                                        Jam Berlaku <SortIcon columnKey="jam_mulai" />
                                    </th>
                                    <th className="p-4">Aksi</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {loading ? <tr><td colSpan="6" className="p-8 text-center text-gray-500">Memuat aturan jadwal...</td></tr> : 
                                 sortedJadwal.length === 0 ? <tr><td colSpan="6" className="p-8 text-center text-gray-500">Tidak ada jadwal yang sesuai filter.</td></tr> :
                                 sortedJadwal.map((j, idx) => {
                                     const keys = Object.keys(j);
                                     const id = j[keys[0]] || j.id_jadwal || j.id || `temp-${idx}`;
                                     const pekan = String(j[keys[1]] || j.pekan || '-');
                                     const jenjang = String(j[keys[2]] || j.jenjang || '-');
                                     const gender = String(j[keys[3]] || j.gender || '-');
                                     const hari = String(j[keys[4]] || j.hari || '-');
                                     const jamMulai = formatJam(j[keys[5]] || j.jam_mulai);
                                     const jamSelesai = formatJam(j[keys[6]] || j.jam_selesai);

                                     return (
                                        <tr key={idx} className="hover:bg-gray-50">
                                            <td className="p-4 font-bold text-gray-800">{pekan}</td>
                                            <td className="p-4"><span className="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-bold">{jenjang}</span></td>
                                            <td className="p-4"><span className="bg-purple-100 text-purple-800 px-2 py-1 rounded text-xs font-bold">{gender}</span></td>
                                            <td className="p-4 font-medium">{hari}</td>
                                            <td className="p-4 text-center font-mono text-emerald-600 font-bold">{jamMulai} - {jamSelesai}</td>
                                            <td className="p-4">
                                                <button onClick={() => handleDelete(id)} className="text-red-600 bg-red-50 hover:bg-red-100 px-3 py-1 rounded-md text-xs font-bold transition-colors">Hapus</button>
                                            </td>
                                        </tr>
                                     );
                                 })}
                            </tbody>
                        </table>
                    </Card>

                    <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title="Tambah Aturan Jadwal">
                        {/* Form tidak ada perubahan */}
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Pekan Ke-</label>
                                    <select className="w-full p-2 border rounded-lg bg-gray-50" value={formData.pekan} onChange={e => setFormData({...formData, pekan: e.target.value})}>
                                        <option>Pekan 1</option><option>Pekan 2</option><option>Pekan 3</option><option>Pekan 4</option><option>Pekan 5</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Hari</label>
                                    <select className="w-full p-2 border rounded-lg bg-gray-50" value={formData.hari} onChange={e => setFormData({...formData, hari: e.target.value})}>
                                        <option>Jumat</option><option>Sabtu</option><option>Ahad</option>
                                    </select>
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Target Jenjang</label>
                                    <select className="w-full p-2 border rounded-lg bg-gray-50" value={formData.jenjang} onChange={e => setFormData({...formData, jenjang: e.target.value})}>
                                        <option>SEMUA</option><option>SMP</option><option>SMA</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Target Gender</label>
                                    <select className="w-full p-2 border rounded-lg bg-gray-50" value={formData.gender} onChange={e => setFormData({...formData, gender: e.target.value})}>
                                        <option>SEMUA</option><option>Laki-Laki</option><option>Perempuan</option>
                                    </select>
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Jam Mulai (Misal: 08:00)</label>
                                    <input type="time" required className="w-full p-2 border rounded-lg bg-gray-50" value={formData.jam_mulai} onChange={e => setFormData({...formData, jam_mulai: e.target.value})} />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Jam Selesai (Misal: 16:00)</label>
                                    <input type="time" required className="w-full p-2 border rounded-lg bg-gray-50" value={formData.jam_selesai} onChange={e => setFormData({...formData, jam_selesai: e.target.value})} />
                                </div>
                            </div>
                            <Button fullWidth type="submit" className="mt-6">Simpan Aturan</Button>
                        </form>
                    </Modal>
                </div>
            );
        };

        // --- PHASE 5 COMPONENTS ---
        const helper = {
            getNextFriday: () => {
                const d = new Date();
                d.setDate(d.getDate() + ((5 + 7 - d.getDay()) % 7 || 7)); // 5 = Jumat
                return d;
            },
            getWeekOfMonth: (date) => {
                const firstDay = new Date(date.getFullYear(), date.getMonth(), 1).getDay();
                return Math.ceil((date.getDate() + firstDay) / 7);
            },
            // FORMAT TANGGAL LEBIH SIMPEL: Jum, 28 Ags 2026
            formatDate: (date) => date.toLocaleDateString('id-ID', { weekday: 'short', year: 'numeric', month: 'short', day: '2-digit' })
        };

        // --- AJUAN IZIN PAGE ---
        const AjukanIzinPage = ({ setCurrentRoute }) => {
            const { user } = useContext(AuthContext);
            const { showToast } = useContext(ToastContext);
            const [santriData, setSantriData] = useState([]);
            const [allSantriData, setAllSantriData] = useState([]); 
            const [jadwalData, setJadwalData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [submitting, setSubmitting] = useState(false);
            
            const [searchSaudaraTerm, setSearchSaudaraTerm] = useState('');

            // --- PERBAIKAN BUG TANGGAL JUMAT DI SINI 👇 ---
            const nextFriday = useMemo(() => {
                const today = new Date();
                // Jika hari ini adalah Jumat (Index hari ke-5), gunakan hari ini.
                if (today.getDay() === 5) {
                    return today;
                }
                // Jika hari lain, gunakan helper untuk mencari Jumat terdekat.
                return helper.getNextFriday();
            }, []);
            // ----------------------------------------------
            const weekNumber = useMemo(() => {
                let week = helper.getWeekOfMonth(nextFriday);
                return week > 4 ? '4' : week.toString();
            }, [nextFriday]);

            const initialForm = { santri_id: '', keperluan: '', tujuan: '', wali_safar: '', hubungan_wali: '', hubungan_lainnya: '', ikut_jadwal_saudara: false, saudara_santri_id: '', keterangan_luar_jadwal: '' };
            const [form, setForm] = useState(initialForm);

            useEffect(() => {
                const fetchDeps = async () => {
                    try {
                        const [resSantri, resJadwal] = await Promise.all([
                            apiService.request('getSantri'),
                            apiService.request('getJadwal')
                        ]);
                        
                        let finalSantri = [];
                        if (resSantri && resSantri.data && Array.isArray(resSantri.data.data)) finalSantri = resSantri.data.data;
                        else if (resSantri && Array.isArray(resSantri.data)) finalSantri = resSantri.data;
                        else if (Array.isArray(resSantri)) finalSantri = resSantri;

                        let finalJadwal = [];
                        if (resJadwal && resJadwal.data && Array.isArray(resJadwal.data.data)) finalJadwal = resJadwal.data.data;
                        else if (resJadwal && Array.isArray(resJadwal.data)) finalJadwal = resJadwal.data;
                        else if (Array.isArray(resJadwal)) finalJadwal = resJadwal;

                        const aktifSantri = finalSantri.filter(s => String(s.status || s.Status || '').toLowerCase() === 'aktif');
                        setAllSantriData(aktifSantri);

                        const mySantri = aktifSantri.filter(s => s.kelas === user.kelas_id);
                        setSantriData(mySantri);
                        setJadwalData(finalJadwal);
                    } catch (e) { showToast(e.message, 'error'); } finally { setLoading(false); }
                };
                fetchDeps();
            }, [user.kelas_id]);

            const selectedSantri = useMemo(() => santriData.find(s => (s.santri_id || s.nis || s.id) === form.santri_id), [santriData, form.santri_id]);
            const selectedSaudara = useMemo(() => allSantriData.find(s => (s.santri_id || s.nis || s.id) === form.saudara_santri_id), [allSantriData, form.saudara_santri_id]);
            
            // --- 1. MENGHITUNG STATUS JADWAL ASLI (MURNI SANTRI ITU SENDIRI) ---
            const statusJadwalAsli = useMemo(() => {
                if (!selectedSantri || jadwalData.length === 0) return null;
                const currentPekanNum = String(weekNumber).replace(/\D/g, ''); 
                const rule = jadwalData.find(j => String(j.pekan || j.Pekan || '').replace(/\D/g, '') === currentPekanNum);
                
                if (!rule) return 'Di Luar Jadwal';

                const targetJenjang = String(selectedSantri.jenjang || selectedSantri.Jenjang || '').toUpperCase();
                const ruleJenjang = String(rule.jenjang || rule.Jenjang || '').toUpperCase();
                const isJenjangMatch = (ruleJenjang === 'SEMUA' || ruleJenjang === targetJenjang);

                const targetGender = String(selectedSantri.gender || selectedSantri.jk || '').toUpperCase();
                const ruleGender = String(rule.gender || rule.Gender || '').toUpperCase();
                const isGenderMatch = (ruleGender === 'SEMUA' || targetGender.includes(ruleGender) || ruleGender.includes(targetGender));

                return (isJenjangMatch && isGenderMatch) ? 'Sesuai Jadwal' : 'Di Luar Jadwal';
            }, [selectedSantri, jadwalData, weekNumber]);

            // --- 2. MENGHITUNG STATUS JADWAL FINAL (DENGAN EFEK KAKAK/ADIK) ---
            const statusJadwal = useMemo(() => {
                // Jika aslinya sudah Sesuai Jadwal, hiraukan apapun inputan kakaknya
                if (statusJadwalAsli === 'Sesuai Jadwal') return 'Sesuai Jadwal';
                // Jika tidak menceklis ikut kakak/adik, kembalikan status asli (Di Luar Jadwal)
                if (!form.ikut_jadwal_saudara) return statusJadwalAsli;
                
                // --- Pengecekan Jadwal Kakak/Adik ---
                if (!selectedSaudara || jadwalData.length === 0) return 'Di Luar Jadwal';
                
                const currentPekanNum = String(weekNumber).replace(/\D/g, ''); 
                const rule = jadwalData.find(j => String(j.pekan || j.Pekan || '').replace(/\D/g, '') === currentPekanNum);
                
                if (!rule) return 'Di Luar Jadwal';

                const targetJenjang = String(selectedSaudara.jenjang || selectedSaudara.Jenjang || '').toUpperCase();
                const ruleJenjang = String(rule.jenjang || rule.Jenjang || '').toUpperCase();
                const isJenjangMatch = (ruleJenjang === 'SEMUA' || ruleJenjang === targetJenjang);

                const targetGender = String(selectedSaudara.gender || selectedSaudara.jk || '').toUpperCase();
                const ruleGender = String(rule.gender || rule.Gender || '').toUpperCase();
                const isGenderMatch = (ruleGender === 'SEMUA' || targetGender.includes(ruleGender) || ruleGender.includes(targetGender));

                return (isJenjangMatch && isGenderMatch) ? 'Sesuai Jadwal' : 'Di Luar Jadwal';
            }, [statusJadwalAsli, selectedSaudara, form.ikut_jadwal_saudara, jadwalData, weekNumber]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (statusJadwal === 'Di Luar Jadwal' && !form.keterangan_luar_jadwal) return showToast("Keterangan Di Luar Jadwal wajib diisi!", "error");
