<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Perizinan Santri Al-Islam</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-down { animation: fadeInDown 0.3s ease-out forwards; }
    </style>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext, useMemo } = React;

        // MASUKKAN URL BACKEND ANDA DI SINI
        const API_BASE_URL = 'https://script.google.com/macros/s/AKfycbyddspvXA3vpGmDpHYjm5-uOlbEdSbDTYygeHsNv192SokqVrEKwBxiZAkYXVscTomM/exec';
        
        // JALAN DENGAN BACKEND ASLI (MOCK DIMATIKAN)
        const USE_MOCK_API = false;

        const ROLES = {
            ADMIN: 'ADMIN',
            WALI_KELAS: 'WALI_KELAS',
            SEKRETARIS_MUDIR: 'SEKRETARIS_MUDIR',
            SECURITY: 'SECURITY'
        };

        const Icons = {
            Home: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            FileText: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>,
            Scan: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
            LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
            Menu: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>,
            CheckCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#10b981" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>,
            XCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef4444" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Edit: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>,
            Search: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>,
            Calendar: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
            Grid: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>,
            TrendingUp: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>,
            Clock: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        };

        const AuthContext = createContext(null);
        const ToastContext = createContext(null);

        const apiService = {
            request: async (action, payload) => {
                if (USE_MOCK_API) {
                    return new Promise((resolve, reject) => {
                        setTimeout(() => {
                            if (action === 'login') {
                                if (payload.username === 'admin' && payload.password === '123') resolve({ success: true, data: { user_id: 'U001', username: 'admin', nama: 'Administrator', role: ROLES.ADMIN } });
                                else if (payload.username === 'walikelas' && payload.password === '123') resolve({ success: true, data: { user_id: 'U002', username: 'walikelas', nama: 'Ust. Ahmad', role: ROLES.WALI_KELAS, kelas_id: 'VII-A' } });
                                else reject(new Error("Username atau password salah"));
                            } else resolve({ success: true, data: {} });
                        }, 800);
                    });
                }
                
                try {
                    const response = await fetch(API_BASE_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action, ...payload })
                    });
                    const text = await response.text();
                    let data;
                    try { data = JSON.parse(text); } catch (e) { throw new Error("Gagal membaca respon server."); }
                    if (!data.success) throw new Error(data.message || 'Terjadi kesalahan dari server.');
                    return data;
                } catch (error) {
                    console.error('API Error:', error);
                    throw error;
                }
            }
        };

        const Card = ({ children, className = "" }) => <div className={`bg-white rounded-xl shadow-sm border border-gray-100 p-6 ${className}`}>{children}</div>;
        
        const Button = ({ children, onClick, variant = 'primary', className = "", disabled, type="button", fullWidth, icon }) => {
            const baseStyle = "px-4 py-2 rounded-lg font-medium transition-all duration-200 flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-offset-2";
            const variants = {
                primary: "bg-emerald-600 hover:bg-emerald-700 text-white focus:ring-emerald-500",
                secondary: "bg-gray-100 hover:bg-gray-200 text-gray-800 focus:ring-gray-400",
                danger: "bg-red-500 hover:bg-red-600 text-white focus:ring-red-500",
            };
            return (
                <button type={type} onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${fullWidth ? 'w-full' : ''} ${disabled ? 'opacity-50 cursor-not-allowed' : ''} ${className}`}>
                    {icon} {children}
                </button>
            );
        };

        const Input = ({ label, type = "text", value, onChange, placeholder, required, name, readOnly }) => (
            <div className="mb-4">
                {label && <label className="block text-sm font-medium text-gray-700 mb-1">{label}</label>}
                <input name={name} type={type} value={value} onChange={onChange} placeholder={placeholder} required={required} readOnly={readOnly} className={`w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-colors ${readOnly ? 'bg-gray-100' : 'bg-white'}`} />
            </div>
        );

        const Select = ({ label, value, onChange, options, required, name, disabled }) => (
            <div className="mb-4">
                {label && <label className="block text-sm font-medium text-gray-700 mb-1">{label}</label>}
                <select disabled={disabled} name={name} value={value} onChange={onChange} required={required} className={`w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 ${disabled ? 'bg-gray-100 cursor-not-allowed' : 'bg-white'}`}>
                    <option value="">-- Pilih --</option>
                    {options.map((opt, idx) => typeof opt === 'object' ? <option key={idx} value={opt.value}>{opt.label}</option> : <option key={idx} value={opt}>{opt}</option>)}
                </select>
            </div>
        );

        const StatCard = ({ title, value, icon, color = "bg-emerald-50 text-emerald-600" }) => (
            <Card className="flex items-center gap-4">
                <div className={`p-4 rounded-full ${color}`}>{icon}</div>
                <div>
                    <p className="text-sm text-gray-500 font-medium">{title}</p>
                    <h3 className="text-2xl font-bold text-gray-800">{value}</h3>
                </div>
            </Card>
        );

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => { const timer = setTimeout(onClose, 4000); return () => clearTimeout(timer); }, [onClose]);
            return (
                <div className="fixed top-4 right-4 z-50 animate-fade-in-down">
                    <div className={`flex items-center gap-3 px-6 py-4 rounded-lg shadow-lg text-white ${type === 'error' ? 'bg-red-500' : 'bg-gray-800'}`}>
                        {type === 'error' ? <Icons.XCircle /> : <Icons.CheckCircle />}
                        <span className="font-medium">{message}</span>
                    </div>
                </div>
            );
        };

        const SidebarItem = ({ icon: Icon, label, active, onClick }) => (
            <button onClick={onClick} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition-colors ${active ? 'bg-emerald-50 text-emerald-700 font-medium' : 'text-gray-600 hover:bg-gray-50'}`}>
                <Icon /> <span>{label}</span>
            </button>
        );

        const Layout = ({ children }) => {
            const { user, logout } = useContext(AuthContext);
            const [isSidebarOpen, setSidebarOpen] = useState(false);
            const [currentRoute, setCurrentRoute] = useState('dashboard');

            if (!user) return null;
            const safeRole = user?.role || 'UNKNOWN';

            const menuItems = {
                [ROLES.ADMIN]: [
                    { id: 'dashboard', label: 'Dashboard', icon: Icons.Home },
                    { id: 'master_santri', label: 'Data Santri', icon: Icons.Users },
                    { id: 'master_kelas', label: 'Data Kelas', icon: Icons.Grid },
                    { id: 'tahun_pelajaran', label: 'Tahun Pelajaran', icon: Icons.Calendar },
                    { id: 'kenaikan_kelas', label: 'Kenaikan Kelas', icon: Icons.TrendingUp },
                    { id: 'jadwal_perizinan', label: 'Jadwal Perizinan', icon: Icons.Clock },
                    { id: 'perizinan', label: 'Semua Perizinan', icon: Icons.FileText },
                    { id: 'settings', label: 'Pengaturan', icon: Icons.Settings },
                ],
                [ROLES.WALI_KELAS]: [
                    { id: 'dashboard', label: 'Dashboard', icon: Icons.Home },
                    { id: 'pengajuan', label: 'Ajukan Izin', icon: Icons.Plus },
                    { id: 'histori', label: 'Histori Kelas', icon: Icons.Users },
                ],
                [ROLES.SEKRETARIS_MUDIR]: [
                    { id: 'dashboard', label: 'Dashboard', icon: Icons.Home },
                    { id: 'screening', label: 'Screening Izin', icon: Icons.FileText },
                ],
                [ROLES.SECURITY]: [
                    { id: 'scanner', label: 'Scan QR Code', icon: Icons.Scan },
                    { id: 'log', label: 'Riwayat Scan', icon: Icons.FileText },
                ]
            };

            const currentMenu = menuItems[safeRole] || [];

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col md:flex-row">
                    <div className="md:hidden bg-white border-b px-4 py-3 flex justify-between items-center sticky top-0 z-20">
                        <div className="font-bold text-emerald-700">Al-Islam Permit</div>
                        <button onClick={() => setSidebarOpen(!isSidebarOpen)} className="p-2 text-gray-600"><Icons.Menu /></button>
                    </div>

                    <div className={`fixed md:static inset-y-0 left-0 w-64 bg-white border-r transform ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 transition-transform duration-300 ease-in-out z-30 flex flex-col`}>
                        <div className="p-6 border-b hidden md:block">
                            <h1 className="font-bold text-xl text-emerald-700 leading-tight">Sistem Perizinan<br/><span className="text-sm text-gray-500 font-normal">PPM Al-Islam</span></h1>
                        </div>
                        <div className="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                            <div className="mb-6 px-4 py-3 bg-emerald-50 rounded-lg text-sm border border-emerald-100">
                                <p className="text-gray-500">Masuk sebagai:</p>
                                <p className="font-semibold text-emerald-800">{user.nama}</p>
                                <p className="text-xs text-emerald-600 mt-1 uppercase tracking-wider font-bold">{safeRole.replace('_', ' ')}</p>
                                {user.kelas_id && <p className="text-xs text-gray-500 mt-1">Kelas: {user.kelas_id}</p>}
                            </div>
                            {currentMenu.length > 0 ? currentMenu.map(item => (
                                <SidebarItem key={item.id} icon={item.icon} label={item.label} active={currentRoute === item.id} onClick={() => { setCurrentRoute(item.id); setSidebarOpen(false); }} />
                            )) : <p className="text-red-500 text-sm px-4">Error Role.</p>}
                        </div>
                        <div className="p-4 border-t">
                            <button onClick={logout} className="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left text-red-600 hover:bg-red-50 transition-colors">
                                <Icons.LogOut /> <span className="font-medium">Keluar</span>
                            </button>
                        </div>
                    </div>

                    {isSidebarOpen && <div className="fixed inset-0 bg-black/20 z-20 md:hidden" onClick={() => setSidebarOpen(false)} />}
                    <div className="flex-1 overflow-y-auto h-screen">
                        <main className="p-4 md:p-8 max-w-6xl mx-auto pb-24 md:pb-8">
                            {React.cloneElement(children, { currentRoute, setCurrentRoute })}
                        </main>
                    </div>
                </div>
            );
        };

        const helper = {
            getNextFriday: () => {
                const d = new Date();
                d.setDate(d.getDate() + ((5 + 7 - d.getDay()) % 7 || 7)); // Cari hari Jumat (5)
                return d;
            },
            getWeekOfMonth: (date) => {
                const firstDay = new Date(date.getFullYear(), date.getMonth(), 1).getDay();
                return Math.ceil((date.getDate() + firstDay) / 7);
            },
            formatDate: (date) => {
                return date.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            }
        };

        const AjukanIzinPage = ({ setCurrentRoute }) => {
            const { user } = useContext(AuthContext);
            const { showToast } = useContext(ToastContext);
            
            const [santriData, setSantriData] = useState([]);
            const [jadwalData, setJadwalData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [submitting, setSubmitting] = useState(false);

            // Cerdas Penjadwalan
            const nextFriday = useMemo(() => helper.getNextFriday(), []);
            const weekNumber = useMemo(() => {
                let week = helper.getWeekOfMonth(nextFriday);
                if (week > 4) week = 4; // PRD: Capping ke pekan 4
                return week.toString();
            }, [nextFriday]);

            const initialForm = {
                santri_id: '',
                keperluan: '',
                tujuan: '',
                wali_safar: '',
                hubungan_wali: '',
                hubungan_lainnya: '',
                ikut_jadwal_saudara: false,
                saudara_santri_id: '',
                keterangan_luar_jadwal: ''
            };
            const [form, setForm] = useState(initialForm);

            useEffect(() => {
                const fetchDeps = async () => {
                    try {
                        const [resSantri, resJadwal] = await Promise.all([
                            apiService.request('getSantri'),
                            apiService.request('getJadwal')
                        ]);
                        // Untuk mockup, semua santri ditampilkan atau di-filter sesuai kelas Wali Kelas
                        // Karena role mock wali kelas memiliki kelas_id: 'VII-A'
                        const allSantri = resSantri.data.filter(s => s.status === 'Aktif');
                        setSantriData(allSantri);
                        setJadwalData(resJadwal.data);
                    } catch (e) {
                        showToast(e.message, 'error');
                    } finally {
                        setLoading(false);
                    }
                };
                fetchDeps();
            }, []);

            // Data Santri yang terpilih
            const selectedSantri = useMemo(() => santriData.find(s => s.santri_id === form.santri_id), [santriData, form.santri_id]);
            const selectedSaudara = useMemo(() => santriData.find(s => s.santri_id === form.saudara_santri_id), [santriData, form.saudara_santri_id]);
            
            // Logika Cerdas Status Jadwal
            const statusJadwal = useMemo(() => {
                if (!selectedSantri || jadwalData.length === 0) return null;
                
                // Gunakan data Saudara jika checkbox dicentang, jika tidak gunakan data Santri
                const targetSantri = (form.ikut_jadwal_saudara && selectedSaudara) ? selectedSaudara : selectedSantri;
                
                // Cari aturan untuk pekan Jumat depan
                const rule = jadwalData.find(j => j.pekan === weekNumber);
                if (!rule) return 'Di Luar Jadwal'; // Fallback

                const isMatch = (targetSantri.jenjang === rule.jenjang) && (targetSantri.jk === rule.gender);
                return isMatch ? 'Sesuai Jadwal' : 'Di Luar Jadwal';

            }, [selectedSantri, selectedSaudara, form.ikut_jadwal_saudara, jadwalData, weekNumber]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                
                // Validasi manual
                if (statusJadwal === 'Di Luar Jadwal' && !form.keterangan_luar_jadwal) {
                    return showToast("Keterangan Di Luar Jadwal wajib diisi!", "error");
                }
                if (form.hubungan_wali === 'Lainnya' && !form.hubungan_lainnya) {
                    return showToast("Detail hubungan Lainnya wajib diisi!", "error");
                }
                if (form.ikut_jadwal_saudara && !form.saudara_santri_id) {
                    return showToast("Pilih santri saudara yang diikuti jadwalnya!", "error");
                }

                setSubmitting(true);
                try {
                    const payload = {
                        ...form,
                        nama_santri: selectedSantri.nama,
                        kelas: selectedSantri.kelas,
                        tanggal_izin: helper.formatDate(nextFriday),
                        status_jadwal: statusJadwal
                    };
                    await apiService.request('savePermit', payload);
                    showToast('Pengajuan berhasil dikirim! Menunggu approval.', 'success');
                    setForm(initialForm);
                    setCurrentRoute('histori'); // Lempar ke halaman histori
                } catch (e) {
                    showToast(e.message, 'error');
                } finally {
                    setSubmitting(false);
                }
            };

            const santriOptions = santriData
                .filter(s => user.role !== 'WALI_KELAS' || s.kelas === user.kelas_id || true) // Mock: tampilkan semua
                .map(s => ({ value: s.santri_id, label: `${s.nama} (${s.kelas})` }));
            
            const hubunganOptions = ['Ayah', 'Ibu', 'Kakak Kandung', 'Adik Kandung', 'Kakek', 'Nenek', 'Paman', 'Bibi', 'Saudara', 'Wali', 'Lainnya'];

            if (loading) return <div className="p-8 text-center text-gray-500 animate-pulse">Menyiapkan Form Pengajuan...</div>;

            return (
                <div className="space-y-6 animate-fade-in-down max-w-4xl">
                    <div>
                        <h2 className="text-2xl font-bold text-gray-800">Ajukan Izin Keluar</h2>
                        <p className="text-gray-500">Sistem otomatis menghitung penjadwalan pekan ini berdasarkan identitas santri.</p>
                    </div>

                    <form onSubmit={handleSubmit} className="space-y-6">
                        <Card>
                            <h3 className="text-lg font-bold text-gray-700 border-b pb-2 mb-4">1. Identitas Santri</h3>
                            <Select name="santri_id" label="Pilih Santri di Kelas Anda" required options={santriOptions} value={form.santri_id} onChange={(e) => setForm({...form, santri_id: e.target.value})} />
                            
                            {selectedSantri && (
                                <div className="bg-emerald-50 border border-emerald-100 rounded-lg p-4 grid grid-cols-3 gap-4 text-sm mt-4">
                                    <div><p className="text-gray-500">Jenjang</p><p className="font-bold text-emerald-800">{selectedSantri.jenjang}</p></div>
                                    <div><p className="text-gray-500">Kelas</p><p className="font-bold text-emerald-800">{selectedSantri.kelas}</p></div>
                                    <div><p className="text-gray-500">Gender</p><p className="font-bold text-emerald-800">{selectedSantri.jk}</p></div>
                                </div>
                            )}
                        </Card>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <Card>
                                <h3 className="text-lg font-bold text-gray-700 border-b pb-2 mb-4">2. Detail Perizinan</h3>
                                <div className="mb-4">
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Keperluan Izin <span className="text-red-500">*</span></label>
                                    <textarea required rows="2" className="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none" value={form.keperluan} onChange={(e) => setForm({...form, keperluan: e.target.value})} placeholder="Contoh: Menghadiri pernikahan keluarga"></textarea>
                                </div>
                                <Input label="Tujuan Keluar (Tempat/Kota)" required value={form.tujuan} onChange={(e) => setForm({...form, tujuan: e.target.value})} placeholder="Contoh: Bandung" />
                            </Card>

                            <Card>
                                <h3 className="text-lg font-bold text-gray-700 border-b pb-2 mb-4">3. Wali Safar (Penjemput)</h3>
                                <Input label="Nama Wali Safar" required value={form.wali_safar} onChange={(e) => setForm({...form, wali_safar: e.target.value})} placeholder="Nama penjemput" />
                                <Select label="Hubungan Wali Safar" required options={hubunganOptions} value={form.hubungan_wali} onChange={(e) => setForm({...form, hubungan_wali: e.target.value})} />
                                {form.hubungan_wali === 'Lainnya' && (
                                    <Input label="Detail Hubungan Lainnya" required value={form.hubungan_lainnya} onChange={(e) => setForm({...form, hubungan_lainnya: e.target.value})} placeholder="Sebutkan hubungannya..." />
                                )}
                            </Card>
                        </div>

                        {selectedSantri && (
                            <Card className={statusJadwal === 'Sesuai Jadwal' ? 'border-emerald-300 ring-1 ring-emerald-300' : 'border-yellow-400 ring-1 ring-yellow-400'}>
                                <div className="flex flex-col md:flex-row justify-between items-start gap-4 border-b pb-4 mb-4">
                                    <div>
                                        <h3 className="text-lg font-bold text-gray-800">4. Analisis Penjadwalan</h3>
                                        <p className="text-sm text-gray-600 mt-1">Tanggal Izin: <strong className="text-gray-900">{helper.formatDate(nextFriday)}</strong> (Pekan {weekNumber})</p>
                                    </div>
                                    <div className={`px-4 py-2 rounded-full font-bold text-sm ${statusJadwal === 'Sesuai Jadwal' ? 'bg-emerald-100 text-emerald-800' : 'bg-yellow-100 text-yellow-800'}`}>
                                        Status: {statusJadwal}
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    <label className="flex items-center gap-3 p-3 border rounded-lg bg-gray-50 cursor-pointer hover:bg-gray-100 transition-colors">
                                        <input type="checkbox" className="w-5 h-5 text-emerald-600 rounded" checked={form.ikut_jadwal_saudara} onChange={(e) => setForm({...form, ikut_jadwal_saudara: e.target.checked, saudara_santri_id: ''})} />
                                        <span className="font-medium text-gray-700">Mengikuti Jadwal Kakak / Adik</span>
                                    </label>

                                    {form.ikut_jadwal_saudara && (
                                        <div className="pl-8 p-4 bg-blue-50 border border-blue-100 rounded-lg animate-fade-in-down">
                                            <Select label="Pilih Santri Saudara" options={santriData.filter(s => s.santri_id !== form.santri_id).map(s => ({value: s.santri_id, label: `${s.nama} (${s.kelas} - ${s.jk})`}))} value={form.saudara_santri_id} onChange={(e) => setForm({...form, saudara_santri_id: e.target.value})} />
                                            {selectedSaudara && <p className="text-xs text-blue-700 mt-1">Sistem sekarang menggunakan jadwal <strong>{selectedSaudara.jenjang} - {selectedSaudara.jk}</strong> untuk memvalidasi tanggal.</p>}
                                        </div>
                                    )}

                                    {statusJadwal === 'Di Luar Jadwal' && (
                                        <div className="mt-4 p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
                                            <label className="block text-sm font-bold text-yellow-800 mb-2">Karena izin di luar jadwal, wajib mengisi alasan berikut:</label>
                                            <textarea required rows="2" className="w-full px-4 py-2 rounded-lg border border-yellow-300 focus:ring-2 focus:ring-yellow-500 outline-none" value={form.keterangan_luar_jadwal} onChange={(e) => setForm({...form, keterangan_luar_jadwal: e.target.value})} placeholder="Alasan izin di luar pekan yang ditentukan..."></textarea>
                                        </div>
                                    )}
                                </div>
                            </Card>
                        )}

                        <Button type="submit" disabled={!selectedSantri || submitting} fullWidth className="py-4 text-lg shadow-lg">
                            {submitting ? 'Memproses ke Database...' : 'Kirim Pengajuan Izin'}
                        </Button>
                    </form>
                </div>
            );
        };

        const HistoriKelasPage = () => {
            const { showToast } = useContext(ToastContext);
            const [permits, setPermits] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const fetchPermits = async () => {
                    try {
                        const res = await apiService.request('getPermits');
                        setPermits(res.data);
                    } catch (e) {
                        showToast(e.message, 'error');
                    } finally {
                        setLoading(false);
                    }
                };
                fetchPermits();
            }, []);

            const getStatusBadge = (status) => {
                const styles = {
                    'MENUNGGU_APPROVAL': 'bg-yellow-100 text-yellow-800 border border-yellow-200',
                    'DISETUJUI': 'bg-emerald-100 text-emerald-800 border border-emerald-200',
                    'DITOLAK': 'bg-red-100 text-red-800 border border-red-200'
                };
                return <span className={`px-2 py-1 text-xs font-bold rounded-full ${styles[status] || 'bg-gray-100'}`}>{status.replace('_', ' ')}</span>;
            };

            return (
                <div className="space-y-6 animate-fade-in-down">
                    <div>
                        <h2 className="text-2xl font-bold text-gray-800">Histori Pengajuan Kelas</h2>
                        <p className="text-gray-500">Pantau status approval perizinan yang telah diajukan.</p>
                    </div>

                    <Card>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse text-sm whitespace-nowrap">
                                <thead>
                                    <tr className="bg-gray-50 text-gray-700 border-b">
                                        <th className="p-4 font-semibold">Tgl Izin</th>
                                        <th className="p-4 font-semibold">Nama Santri</th>
                                        <th className="p-4 font-semibold">Keperluan & Tujuan</th>
                                        <th className="p-4 font-semibold">Wali Safar</th>
                                        <th className="p-4 font-semibold">Status</th>
                                        <th className="p-4 font-semibold">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {loading ? <tr><td colSpan="6" className="p-8 text-center text-gray-500">Memuat data dari server...</td></tr> : 
                                     permits.length === 0 ? <tr><td colSpan="6" className="p-8 text-center text-gray-500">Belum ada histori pengajuan.</td></tr> :
                                     permits.map((p, idx) => (
                                        <tr key={idx} className="hover:bg-gray-50">
                                            <td className="p-4 font-medium text-gray-800">{p.tanggal_izin}</td>
                                            <td className="p-4">
                                                <p className="font-bold text-gray-700">{p.nama_santri}</p>
                                                <p className="text-xs text-gray-500">{p.kelas}</p>
                                            </td>
                                            <td className="p-4">
                                                <p className="text-gray-800 truncate w-48">{p.keperluan}</p>
                                                <p className="text-xs text-gray-500">Tujuan: {p.tujuan}</p>
                                            </td>
                                            <td className="p-4 text-gray-600">{p.wali_safar} ({p.hubungan_wali})</td>
                                            <td className="p-4">{getStatusBadge(p.status_pengajuan)}</td>
                                            <td className="p-4">
                                                {p.status_pengajuan === 'DISETUJUI' ? 
                                                    <button className="px-3 py-1 bg-emerald-600 text-white rounded text-xs font-medium hover:bg-emerald-700">QR Code</button> 
                                                    : <span className="text-xs text-gray-400 italic">Menunggu</span>
                                                }
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </Card>
                </div>
            );
        };

        // --- DASHBOARD PAGES ---
        const DashboardAdmin = () => (
            <div className="space-y-6">
                <div><h2 className="text-2xl font-bold text-gray-800">Dashboard Admin</h2><p className="text-gray-500">Ringkasan perizinan pondok.</p></div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <StatCard title="Total Pengajuan" value="-" icon={<Icons.FileText />} color="bg-blue-50 text-blue-600" />
                    <StatCard title="Santri Keluar" value="-" icon={<Icons.Scan />} color="bg-yellow-50 text-yellow-600" />
                    <StatCard title="Santri Kembali" value="-" icon={<Icons.Users />} color="bg-emerald-50 text-emerald-600" />
                    <StatCard title="Terlambat" value="-" icon={<Icons.Settings />} color="bg-red-50 text-red-600" />
                </div>
            </div>
        );

        const LoginPage = () => {
            const { login } = useContext(AuthContext);
            const { showToast } = useContext(ToastContext);
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault(); setLoading(true);
                try {
                    const res = await apiService.request('login', { username, password });
                    if (!res.data || !res.data.role) throw new Error("Login gagal. Periksa kembali backend/role.");
                    login(res.data);
                    showToast(`Selamat datang, ${res.data.nama}`, 'success');
                } catch (err) { showToast(err.message, 'error'); } finally { setLoading(false); }
            };

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
                    <div className="sm:mx-auto sm:w-full sm:max-w-md text-center">
                        <div className="mx-auto w-16 h-16 bg-emerald-600 rounded-full flex items-center justify-center text-white mb-4 shadow-lg shadow-emerald-200"><Icons.FileText /></div>
                        <h2 className="text-3xl font-extrabold text-gray-900">PPM Al-Islam</h2>
                        <p className="mt-2 text-sm text-gray-600">Sistem Management Perizinan Keluar Santri</p>
                    </div>
                    <div className="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
                        <Card className="py-8 px-4 sm:px-10">
                            <form className="space-y-6" onSubmit={handleSubmit}>
                                <Input name="username" label="Username" value={username} onChange={(e) => setUsername(e.target.value)} required placeholder="Misal: admin, walikelas" />
                                <Input name="password" label="Password" type="password" value={password} onChange={(e) => setPassword(e.target.value)} required placeholder="123" />
                                <Button type="submit" fullWidth disabled={loading}>{loading ? 'Memverifikasi...' : 'Masuk ke Sistem'}</Button>
                            </form>
                        </Card>
                    </div>
                </div>
            );
        };

        const MainRouter = ({ currentRoute, setCurrentRoute }) => {
            const { user } = useContext(AuthContext);

            if (currentRoute === 'dashboard') {
                if (user.role === ROLES.ADMIN) return <DashboardAdmin />;
                if (user.role === ROLES.WALI_KELAS) return (
                    <div className="space-y-6">
                        <div><h2 className="text-2xl font-bold text-gray-800">Dashboard Wali Kelas</h2></div>
                        <Button onClick={() => setCurrentRoute('pengajuan')} icon={<Icons.Plus />}>Buat Pengajuan Baru</Button>
                    </div>
                );
            }
            if (currentRoute === 'master_santri' && user.role === ROLES.ADMIN) return <div className="p-4">Menu Data Santri (Phase 2 Selesai)</div>;
            if (currentRoute === 'master_kelas' && user.role === ROLES.ADMIN) return <div className="p-4">Menu Master Kelas (Phase 2 Selesai)</div>;
            if (currentRoute === 'tahun_pelajaran' && user.role === ROLES.ADMIN) return <div className="p-4">Menu Tahun Pelajaran (Phase 2 Selesai)</div>;
            if (currentRoute === 'kenaikan_kelas' && user.role === ROLES.ADMIN) return <div className="p-4">Menu Kenaikan Kelas (Phase 3 Selesai)</div>;
            if (currentRoute === 'jadwal_perizinan' && user.role === ROLES.ADMIN) return <div className="p-4">Menu Jadwal (Phase 4 Selesai)</div>;
            
            // Phase 5 Routing
            if (currentRoute === 'pengajuan' && user.role === ROLES.WALI_KELAS) return <AjukanIzinPage setCurrentRoute={setCurrentRoute} />;
            if (currentRoute === 'histori' && user.role === ROLES.WALI_KELAS) return <HistoriKelasPage />;
            
            return (
                <div className="flex flex-col items-center justify-center py-20 text-center">
                    <Icons.FileText />
                    <h3 className="mt-4 text-lg font-medium text-gray-900">Modul {currentRoute}</h3>
                    <p className="mt-1 text-gray-500">Modul ini akan dibangun pada fase pengembangan berikutnya.</p>
                </div>
            );
        };

        function App() {
            const [user, setUser] = useState(null);
            const [toast, setToast] = useState(null);
            const showToast = (message, type = 'success') => setToast({ message, type });

            return (
                <ToastContext.Provider value={{ showToast }}>
                    <AuthContext.Provider value={{ user, login: setUser, logout: () => setUser(null) }}>
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                        {!user ? <LoginPage /> : <Layout><MainRouter /></Layout>}
                    </AuthContext.Provider>
                </ToastContext.Provider>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
