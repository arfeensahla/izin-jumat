<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Perizinan Santri Al-Islam</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' },
                        dark: '#1e293b'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .hidden { display: none !important; }
        
        /* Spinner Animation */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #22c55e;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Toast Animation */
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-enter { animation: slideInRight 0.3s ease-out forwards; }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen overflow-hidden">

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- Modal Container -->
    <div id="modal-container" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity opacity-0">
        <div id="modal-content" class="bg-white rounded-2xl shadow-2xl w-full max-w-md transform transition-transform scale-95 overflow-hidden">
            <!-- Modal Body Injected Here -->
        </div>
    </div>

    <!-- Login View -->
    <div id="view-login" class="flex h-screen items-center justify-center bg-slate-100 hidden">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 mx-4">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-100 text-primary-600 mb-4">
                    <i class="ph ph-shield-check text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">Perizinan Santri</h1>
                <p class="text-slate-500 text-sm mt-1">Pondok Pesantren Modern Al-Islam</p>
            </div>
            
            <form id="form-login" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                    <input type="text" id="login-username" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition" placeholder="Masukkan username">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition" placeholder="••••••••">
                </div>
                <button type="submit" id="btn-login" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 flex items-center justify-center gap-2">
                    <span>Masuk</span>
                    <div id="login-loader" class="loader hidden w-5 h-5 border-[2px]"></div>
                </button>
            </form>
        </div>
    </div>

    <!-- Main App View (Shell) -->
    <div id="view-app" class="flex h-screen w-full hidden">
        
        <!-- Mobile Overlay -->
        <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-20 hidden lg:hidden" onclick="App.ui.toggleSidebar()"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="bg-dark text-slate-300 w-64 flex-shrink-0 flex flex-col transition-transform transform -translate-x-full lg:translate-x-0 absolute lg:relative z-30 h-full">
            <div class="h-16 flex items-center px-6 bg-slate-900 font-bold text-white tracking-wider gap-3">
                <i class="ph-fill ph-mosque text-xl text-primary-500"></i>
                AL-ISLAM
            </div>
            
            <div class="flex-1 overflow-y-auto py-4 px-3" id="sidebar-menu">
                <!-- Menu items injected dynamically via JS based on Role -->
            </div>

            <div class="p-4 bg-slate-900 border-t border-slate-800">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-white font-bold" id="user-avatar">A</div>
                    <div class="overflow-hidden">
                        <p class="text-sm font-semibold text-white truncate" id="user-name">User Name</p>
                        <p class="text-xs text-slate-400 truncate" id="user-role">Role</p>
                    </div>
                </div>
                <button onclick="App.auth.logout()" class="w-full flex items-center justify-center gap-2 py-2 rounded-lg text-sm bg-slate-800 hover:bg-red-500/10 hover:text-red-400 transition-colors">
                    <i class="ph ph-sign-out"></i> Keluar
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col min-w-0 bg-slate-50">
            <!-- Topbar -->
            <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 lg:px-8 z-10 flex-shrink-0">
                <div class="flex items-center gap-4">
                    <button class="lg:hidden text-slate-500 hover:text-slate-800" onclick="App.ui.toggleSidebar()">
                        <i class="ph ph-list text-2xl"></i>
                    </button>
                    <h2 class="text-lg font-semibold text-slate-800" id="page-title">Dashboard</h2>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-sm text-slate-500 hidden sm:block" id="current-date"></span>
                </div>
            </header>

            <!-- Dynamic Content Container -->
            <div id="content-area" class="flex-1 overflow-y-auto p-4 lg:p-8">
                <!-- Content injected here -->
            </div>
        </main>
    </div>

    <script>
        /**
         * APPLICATION CORE
         * Phase 1: Foundation & Auth
         */
        
        // PENTING: Ganti dengan URL Google Apps Script Web App Anda setelah di-deploy
        const API_URL = "https://script.google.com/macros/s/AKfycby8bTXMgdLeVoCaT29KdqbQqIm0ms_LwzPc0G7hsXjUwPLYJe3J2aWc4pfORhfQ5v0Tpw/exec"; 

        const App = {
            state: {
                user: null,
                token: null,
                currentView: 'dashboard'
            },

            // --- API CLIENT ---
            api: {
                async post(action, data = {}) {
                    // Cek jika API_URL belum di set
                    if(API_URL.includes("REPLACE_ME_LATER") && action === 'login') {
                         return {
                             success: true, 
                             data: {
                                 token: "mock-token",
                                 user: { user_id: "1", nama: "Developer Mode", role: "ADMIN" }
                             }
                         };
                    }

                    try {
                        const payload = { action, data };
                        // Jika ada token, masukkan ke payload data
                        if (App.state.token) {
                            payload.data.token = App.state.token;
                        }

                        const response = await fetch(API_URL, {
                            method: "POST",
                            headers: { "Content-Type": "text/plain;charset=utf-8" }, // Mencegah preflight CORS issues di GAS
                            body: JSON.stringify(payload)
                        });

                        const result = await response.json();
                        if (!result.success) {
                            throw new Error(result.message || "Terjadi kesalahan server");
                        }
                        return result;
                    } catch (error) {
                        console.error(`API Error [${action}]:`, error);
                        throw new Error(error.message === "Failed to fetch" ? "Koneksi ke server gagal. Periksa jaringan Anda." : error.message);
                    }
                }
            },

            // --- AUTHENTICATION ---
            auth: {
                async init() {
                    const savedToken = localStorage.getItem('al_islam_token');
                    const savedUser = localStorage.getItem('al_islam_user');

                    if (savedToken && savedUser) {
                        App.state.token = savedToken;
                        App.state.user = JSON.parse(savedUser);
                        
                        // Secara background, verifikasi token (opsional di MVP, asumsikan valid dulu agar cepat)
                        App.ui.showApp();
                    } else {
                        App.ui.showLogin();
                    }

                    this.bindEvents();
                },

                bindEvents() {
                    document.getElementById('form-login').addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const btn = document.getElementById('btn-login');
                        const loader = document.getElementById('login-loader');
                        const username = document.getElementById('login-username').value;
                        const password = document.getElementById('login-password').value;

                        // UI Loading state
                        btn.disabled = true;
                        loader.classList.remove('hidden');

                        try {
                            const res = await App.api.post('login', { username, password });
                            
                            App.state.token = res.data.token;
                            App.state.user = res.data.user;
                            
                            localStorage.setItem('al_islam_token', res.data.token);
                            localStorage.setItem('al_islam_user', JSON.stringify(res.data.user));
                            
                            App.ui.showToast('Login berhasil', 'success');
                            App.ui.showApp();
                            
                        } catch (error) {
                            App.ui.showToast(error.message, 'error');
                        } finally {
                            btn.disabled = false;
                            loader.classList.add('hidden');
                        }
                    });
                },

                logout() {
                    App.state.token = null;
                    App.state.user = null;
                    localStorage.removeItem('al_islam_token');
                    localStorage.removeItem('al_islam_user');
                    document.getElementById('form-login').reset();
                    App.ui.showLogin();
                }
            },

            // --- UI & ROUTING ---
            ui: {
                showModal(htmlContent) {
                    const container = document.getElementById('modal-container');
                    const content = document.getElementById('modal-content');
                    content.innerHTML = htmlContent;
                    
                    container.classList.remove('hidden');
                    // Small delay to trigger animation
                    setTimeout(() => {
                        container.classList.remove('opacity-0');
                        content.classList.remove('scale-95');
                    }, 10);
                },

                closeModal() {
                    const container = document.getElementById('modal-container');
                    const content = document.getElementById('modal-content');
                    
                    container.classList.add('opacity-0');
                    content.classList.add('scale-95');
                    setTimeout(() => container.classList.add('hidden'), 300);
                },

                showLogin() {
                    document.getElementById('view-app').classList.add('hidden');
                    document.getElementById('view-login').classList.remove('hidden');
                },

                showApp() {
                    document.getElementById('view-login').classList.add('hidden');
                    document.getElementById('view-app').classList.remove('hidden');
                    
                    this.setupSidebar();
                    this.updateUserInfo();
                    App.router.navigate('dashboard');

                    // Set Date
                    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                    document.getElementById('current-date').textContent = new Date().toLocaleDateString('id-ID', options);
                },

                updateUserInfo() {
                    const user = App.state.user;
                    if(!user) return;
                    document.getElementById('user-name').textContent = user.nama;
                    document.getElementById('user-role').textContent = user.role.replace('_', ' ');
                    document.getElementById('user-avatar').textContent = user.nama.charAt(0).toUpperCase();
                },

                toggleSidebar() {
                    const sidebar = document.getElementById('sidebar');
                    const overlay = document.getElementById('mobile-overlay');
                    sidebar.classList.toggle('-translate-x-full');
                    overlay.classList.toggle('hidden');
                },

                showToast(message, type = 'info') {
                    const container = document.getElementById('toast-container');
                    const toast = document.createElement('div');
                    
                    let bg = 'bg-blue-600';
                    let icon = 'ph-info';
                    if(type === 'success') { bg = 'bg-primary-600'; icon = 'ph-check-circle'; }
                    if(type === 'error') { bg = 'bg-red-600'; icon = 'ph-warning-circle'; }
                    if(type === 'warning') { bg = 'bg-yellow-500'; icon = 'ph-warning'; }

                    toast.className = `toast-enter flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg text-white ${bg}`;
                    toast.innerHTML = `<i class="ph ${icon} text-xl"></i><span class="text-sm font-medium">${message}</span>`;
                    
                    container.appendChild(toast);
                    
                    setTimeout(() => {
                        toast.style.opacity = '0';
                        toast.style.transform = 'translateX(100%)';
                        toast.style.transition = 'all 0.3s ease';
                        setTimeout(() => toast.remove(), 300);
                    }, 3000);
                },

                renderSidebarMenu(items) {
                    const menuContainer = document.getElementById('sidebar-menu');
                    menuContainer.innerHTML = '';
                    
                    items.forEach(item => {
                        if(item.isHeader) {
                            menuContainer.innerHTML += `<div class="px-4 py-2 mt-2 text-xs font-semibold text-slate-500 uppercase tracking-wider">${item.title}</div>`;
                        } else {
                            menuContainer.innerHTML += `
                                <a href="#" onclick="App.router.navigate('${item.route}'); return false;" 
                                   class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-colors group mb-1"
                                   id="menu-${item.route}">
                                    <i class="ph ${item.icon} text-lg group-hover:text-primary-500 transition-colors"></i>
                                    ${item.title}
                                </a>
                            `;
                        }
                    });
                },

                setupSidebar() {
                    const role = App.state.user.role;
                    let menu = [];

                    // Role Based Access Control UI
                    if (role === 'ADMIN') {
                        menu = [
                            { route: 'dashboard', icon: 'ph-squares-four', title: 'Dashboard' },
                            { isHeader: true, title: 'Master Data' },
                            { route: 'master-santri', icon: 'ph-users', title: 'Data Santri' },
                            { route: 'master-kelas', icon: 'ph-chalkboard-teacher', title: 'Data Kelas' },
                            { route: 'master-tahun', icon: 'ph-calendar-blank', title: 'Tahun Pelajaran' },
                            { isHeader: true, title: 'Sistem' },
                            { route: 'jadwal', icon: 'ph-calendar-check', title: 'Jadwal Perizinan' },
                            { route: 'reports', icon: 'ph-file-text', title: 'Laporan' },
                            { route: 'settings', icon: 'ph-gear', title: 'Pengaturan' }
                        ];
                    } else if (role === 'SEKRETARIS_MUDIR') {
                        menu = [
                            { route: 'dashboard', icon: 'ph-squares-four', title: 'Dashboard' },
                            { route: 'approval', icon: 'ph-check-square-offset', title: 'Approval Izin' },
                            { route: 'monitoring', icon: 'ph-eye', title: 'Monitoring Santri' }
                        ];
                    } else if (role === 'WALI_KELAS') {
                        menu = [
                            { route: 'dashboard', icon: 'ph-squares-four', title: 'Dashboard' },
                            { route: 'pengajuan', icon: 'ph-paper-plane-tilt', title: 'Ajukan Izin' },
                            { route: 'kelas-saya', icon: 'ph-users-three', title: 'Santri Kelas' },
                            { route: 'histori', icon: 'ph-clock-counter-clockwise', title: 'Histori Izin' }
                        ];
                    } else if (role === 'SECURITY') {
                        menu = [
                            { route: 'scanner', icon: 'ph-qr-code', title: 'Scan QR' },
                            { route: 'status-luar', icon: 'ph-sign-out', title: 'Santri Di Luar' }
                        ];
                    }

                    this.renderSidebarMenu(menu);
                }
            },

            // --- ROUTER & VIEWS ---
            router: {
                navigate(route) {
                    App.state.currentView = route;
                    
                    // Highlight active menu
                    document.querySelectorAll('[id^="menu-"]').forEach(el => {
                        el.classList.remove('bg-primary-500/10', 'text-primary-400');
                        el.classList.add('text-slate-300');
                    });
                    const activeMenu = document.getElementById(`menu-${route}`);
                    if(activeMenu) {
                        activeMenu.classList.remove('text-slate-300');
                        activeMenu.classList.add('bg-primary-500/10', 'text-primary-400');
                    }

                    // Render content based on route
                    const contentArea = document.getElementById('content-area');
                    
                    // Close sidebar on mobile after navigation
                    if(window.innerWidth < 1024) {
                        document.getElementById('sidebar').classList.add('-translate-x-full');
                        document.getElementById('mobile-overlay').classList.add('hidden');
                    }

                    this.renderView(route, contentArea);
                },

                renderView(route, container) {
                    // Titles mapping
                    const titles = {
                        'dashboard': 'Dashboard',
                        'scanner': 'QR Scanner',
                        'master-tahun': 'Data Tahun Pelajaran',
                        'master-kelas': 'Data Kelas',
                        'master-santri': 'Data Santri',
                        'jadwal': 'Jadwal Perizinan (Jumat)',
                        'pengajuan': 'Form Pengajuan Izin Santri',
                        'histori': 'Histori & Status Izin'
                    };
                    document.getElementById('page-title').textContent = titles[route] || 'Halaman';

                    // Show loading state while rendering/fetching
                    container.innerHTML = `
                        <div class="flex items-center justify-center h-full min-h-[400px]">
                            <div class="loader w-8 h-8 border-[3px]"></div>
                        </div>
                    `;

                    // Use setTimeout to ensure loading UI is painted before heavy ops
                    setTimeout(() => {
                        if (route === 'dashboard') {
                            App.views.renderDashboard(container);
                        } else if (route === 'scanner') {
                            App.views.renderScanner(container);
                        } else if (App.views[route]) {
                            App.views[route](container);
                        } else {
                            container.innerHTML = `
                                <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-100 text-center max-w-lg mx-auto mt-10">
                                    <i class="ph ph-hammer text-4xl text-slate-300 mb-3"></i>
                                    <h3 class="text-lg font-medium text-slate-800">Modul dalam Pembangunan</h3>
                                    <p class="text-slate-500 text-sm mt-1">Halaman <b>${route}</b> akan tersedia pada fase pengembangan selanjutnya.</p>
                                </div>
                            `;
                        }
                    }, 50);
                }
            },

            // --- VIEW MODULES ---
            views: {
                renderDashboard(container) {
                    const isAdmin = App.state.user.role === 'ADMIN';
                    
                    container.innerHTML = `
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4">
                                <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-xl"><i class="ph-fill ph-file-text"></i></div>
                                <div><p class="text-slate-500 text-sm font-medium">Total Izin Pekan Ini</p><p class="text-2xl font-bold text-slate-800">0</p></div>
                            </div>
                            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4">
                                <div class="w-12 h-12 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center text-xl"><i class="ph-fill ph-sign-out"></i></div>
                                <div><p class="text-slate-500 text-sm font-medium">Sedang Di Luar</p><p class="text-2xl font-bold text-slate-800">0</p></div>
                            </div>
                            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4">
                                <div class="w-12 h-12 bg-primary-100 text-primary-600 rounded-full flex items-center justify-center text-xl"><i class="ph-fill ph-check-circle"></i></div>
                                <div><p class="text-slate-500 text-sm font-medium">Selesai (Kembali)</p><p class="text-2xl font-bold text-slate-800">0</p></div>
                            </div>
                        </div>
                        <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-8 text-center relative overflow-hidden">
                            <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4">
                                <i class="ph ph-rocket text-3xl text-slate-400"></i>
                            </div>
                            <h3 class="text-lg font-semibold text-slate-800 mb-2">Selamat Datang di Sistem Perizinan</h3>
                            <p class="text-slate-500 max-w-md mx-auto">Anda masuk sebagai ${App.state.user.role}.</p>
                            
                            ${isAdmin ? `
                            <div class="mt-8 p-4 bg-orange-50 border border-orange-100 rounded-lg inline-block text-left">
                                <h4 class="font-bold text-orange-800 text-sm mb-1"><i class="ph ph-magic-wand"></i> Developer Tools</h4>
                                <p class="text-xs text-orange-600 mb-3">Tekan tombol ini untuk mengisi database Google Sheets dengan data dummy (Tahun Pelajaran, Kelas, dan Santri).</p>
                                <button onclick="App.actions.generateDummy()" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">
                                    Generate Data Dummy
                                </button>
                            </div>
                            ` : ''}
                        </div>
                    `;
                },

                renderScanner(container) {
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full max-w-lg mx-auto mt-4">
                            <div class="bg-slate-900 w-full aspect-[3/4] sm:aspect-square rounded-2xl flex items-center justify-center relative overflow-hidden shadow-2xl">
                                <div class="absolute inset-0 flex items-center justify-center border-2 border-dashed border-slate-600 m-8 rounded-xl">
                                    <div class="text-center">
                                        <i class="ph ph-camera text-4xl text-slate-400 mb-2"></i>
                                        <p class="text-slate-400 text-sm font-medium">Kamera Scanner (Fase 8)</p>
                                    </div>
                                </div>
                                <div class="absolute w-full h-1 bg-primary-500 top-1/2 shadow-[0_0_15px_#22c55e]"></div>
                            </div>
                            <p class="mt-6 text-slate-500 text-center px-4">Arahkan kamera ke QR Code izin santri.</p>
                        </div>
                    `;
                },

                // Helper Table Builder
                buildTableUI(title, btnText, theadHTML, tbodyHTML) {
                    return `
                        <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden flex flex-col">
                            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                                <h3 class="font-semibold text-slate-800">${title}</h3>
                                <button class="bg-primary-600 hover:bg-primary-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
                                    <i class="ph ph-plus"></i> ${btnText}
                                </button>
                            </div>
                            <div class="overflow-x-auto w-full">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                                            ${theadHTML}
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100 text-sm">
                                        ${tbodyHTML}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                },

                // --- RESTORED MODULES ---
                
                async 'master-santri'(container) {
                    try {
                        const res = await App.api.post('getSantri');
                        let tbody = '';
                        if (res.data.length === 0) {
                            tbody = `<tr><td colspan="6" class="p-8 text-center text-slate-400">Belum ada data santri</td></tr>`;
                        } else {
                            res.data.forEach(item => {
                                tbody += `
                                    <tr class="hover:bg-slate-50 transition border-b border-slate-100">
                                        <td class="p-4 font-medium text-slate-800">${item.nama_santri}</td>

                            width: 88,
                            height: 88,
                            colorDark : "#1e293b", // slate-800
                            colorLight : "#ffffff",
                            correctLevel : QRCode.CorrectLevel.M
                        });
                    }, 50);
                },

                // Generate Canvas then trigger download
                downloadQRPNG(permitId) {
                    const permit = window[`permitData_${permitId}`];
                    if(!permit) return;

                    const relasi = permit.hubungan_wali === 'Lainnya' ? permit.hubungan_lainnya : permit.hubungan_wali;
                    
                    // Buat Canvas yang ukurannya proporsional dengan pop-up
                    const canvas = document.createElement('canvas');
                    canvas.width = 480;
                    canvas.height = 560;
                    const ctx = canvas.getContext('2d');

                    // 1. Background Kartu (Putih) & Border
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.strokeStyle = '#e2e8f0';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(0, 0, canvas.width, canvas.height);

                    // 2. Header Hijau
                    ctx.fillStyle = '#16a34a'; 
                    ctx.fillRect(0, 0, canvas.width, 90);

                    // 3. Teks Header
                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    ctx.font = 'bold 19px "Inter", Arial, sans-serif';
                    ctx.fillText('PONDOK PESANTREN MODERN AL-ISLAM', canvas.width / 2, 42);
                    
                    ctx.font = 'normal 13px "Inter", Arial, sans-serif';
                    if(ctx.letterSpacing !== undefined) ctx.letterSpacing = "2px";
                    ctx.fillText('SURAT IZIN KELUAR SANTRI', canvas.width / 2, 68);
                    if(ctx.letterSpacing !== undefined) ctx.letterSpacing = "0px"; // reset

                    // Helper function untuk menggambar label & value persis seperti di CSS
                    ctx.textAlign = 'left';
                    const drawField = (label, value, x, y, valColor = '#1e293b', valFont = 'bold 18px "Inter", Arial, sans-serif') => {
                        ctx.fillStyle = '#94a3b8'; // text-slate-400
                        ctx.font = 'normal 13px "Inter", Arial, sans-serif';
                        ctx.fillText(label, x, y);
                        
                        ctx.fillStyle = valColor; 
                        ctx.font = valFont;
                        ctx.fillText(value, x, y + 25);
                    };

                    // 4. Data Utama (Sama persis urutannya dengan HTML)
                    drawField('Nama Santri', permit.nama_santri, 40, 140);
                    
                    // Grid 2 Kolom (Jenjang & Jam)
                    drawField('Jenjang / Kelas', `${permit.jenjang} - ${permit.nama_kelas}`, 40, 210, '#1e293b', 'normal 17px "Inter", Arial, sans-serif');
                    drawField('Jam Resmi', '08.00 - 16.00', 280, 210, '#16a34a', 'bold 17px "Inter", Arial, sans-serif');
                    
                    // Grid 2 Kolom (Tanggal & Keperluan)
                    drawField('Tanggal Izin', permit.tanggal_izin_format, 40, 280, '#1e293b', 'normal 17px "Inter", Arial, sans-serif');
                    
                    // Truncate text keperluan agar tidak melewati batas kanan canvas
                    let safeKeperluan = permit.keperluan.length > 18 ? permit.keperluan.substring(0, 16) + '...' : permit.keperluan;
                    drawField('Keperluan', safeKeperluan, 280, 280, '#1e293b', 'normal 17px "Inter", Arial, sans-serif');

                    // 5. Garis Pembatas (Dashed Line)
                    ctx.beginPath();
                    ctx.setLineDash([6, 6]);
                    ctx.moveTo(40, 335);
                    ctx.lineTo(440, 335);
                    ctx.strokeStyle = '#cbd5e1';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    ctx.setLineDash([]); // reset garis

                    // 6. Section Bawah (QR di Kiri, Wali Safar di Kanan)
                    const qrCanvas = document.querySelector('#qrcode-box canvas');
                    if (qrCanvas) {
                        // Gambar QR Code persis di sisi kiri bawah
                        // Memberi background putih & border abu pada QR
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(40, 365, 130, 130);
                        ctx.strokeStyle = '#e2e8f0';
                        ctx.strokeRect(40, 365, 130, 130);
                        
                        ctx.drawImage(qrCanvas, 45, 370, 120, 120);
                        
                        // Gambar Info Wali Safar di samping kanan QR Code
                        drawField('Wali Safar (Penjemput)', permit.wali_safar, 200, 385);
                        
                        ctx.fillStyle = '#64748b'; // text-slate-500
                        ctx.font = 'normal 12px "Inter", Arial, sans-serif';
                        ctx.fillText(`(${relasi})`.toUpperCase(), 200, 430);

                        // Note kecil di bawah Wali Safar
                        ctx.fillStyle = '#94a3b8'; // text-slate-400
                        ctx.font = 'italic 11px "Inter", Arial, sans-serif';
                        ctx.fillText('* Tunjukkan QR ini ke Petugas Security', 200, 470);
                        ctx.fillText('  saat akan keluar dan kembali ke pondok.', 200, 485);
                        
                        // Eksekusi Download
                        const imgURL = canvas.toDataURL("image/png");
                        const link = document.createElement('a');
                        link.download = `Pas_Izin_${permit.nama_santri.replace(/\s+/g, '_')}.png`;
                        link.href = imgURL;
                        link.click();
                        App.ui.showToast('Berhasil mengunduh Kartu Izin PNG', 'success');
                    } else {
                        App.ui.showToast('Gagal memproses gambar QR', 'error');
                    }
                },

                async approve(permitId) {
                    if(!confirm('Anda yakin ingin menyetujui pengajuan ini? QR Code otomatis akan diterbitkan.')) return;
                    
                    const card = document.getElementById(`permit-card-${permitId}`);
                    card.style.opacity = '0.5';
                    card.style.pointerEvents = 'none';

                    try {
                        await App.api.post('approvePermit', { permit_id: permitId });
                        App.ui.showToast('Izin disetujui, QR Code diterbitkan!', 'success');
                        setTimeout(() => App.router.navigate('approval'), 500); // Reload data
                    } catch (e) {
                        App.ui.showToast(e.message, 'error');
                        card.style.opacity = '1';
                        card.style.pointerEvents = 'auto';
                    }
                },
                
                async reject(permitId) {
                    const alasan = prompt('Masukkan alasan penolakan (Wajib):');
                    if (alasan === null) return; // Cancelled
                    if (alasan.trim() === '') return App.ui.showToast('Alasan penolakan tidak boleh kosong', 'error');

                    const card = document.getElementById(`permit-card-${permitId}`);
                    card.style.opacity = '0.5';
                    card.style.pointerEvents = 'none';

                    try {
                        await App.api.post('rejectPermit', { permit_id: permitId, alasan: alasan });
                        App.ui.showToast('Izin berhasil ditolak', 'info');
                        setTimeout(() => App.router.navigate('approval'), 500); // Reload data
                    } catch (e) {
                        App.ui.showToast(e.message, 'error');
                        card.style.opacity = '1';
                        card.style.pointerEvents = 'auto';
                    }
                },

                async generateDummy() {
                    if(!confirm('Buat data dummy (Tahun, Kelas, dan 4 Santri)?')) return;
                    
                    try {
                        App.ui.showToast('Memproses data dummy, mohon tunggu...', 'info');
                        const res = await App.api.post('generateDummy');
                        App.ui.showToast(res.data.message, 'success');
                    } catch(e) {
                        App.ui.showToast(e.message, 'error');
                    }
                }
            }
        };

        // Initialize App on Load
        document.addEventListener('DOMContentLoaded', () => App.auth.init());

    </script>
</body>
</html>
