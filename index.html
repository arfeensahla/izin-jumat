        const DataSantriPage = () => {
            const { showToast } = useContext(ToastContext);
            const [santri, setSantri] = useState([]);
            const [kelasOptions, setKelasOptions] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [loading, setLoading] = useState(true);
            const [formData, setFormData] = useState({ nis: '', nama_santri: '', kelas: '', gender: 'Laki-Laki' });

            const [searchTerm, setSearchTerm] = useState('');
            const [filterKelas, setFilterKelas] = useState('');
            const [filterGender, setFilterGender] = useState('');

            // --- STATE UNTUK SORTING ---
            const [sortConfig, setSortConfig] = useState({ key: 'nama_santri', direction: 'asc' });

            const fetchData = async () => {
                setLoading(true);
                try {
                    const [resSantri, resKelas] = await Promise.all([
                        apiService.request('getSantri'),
                        apiService.request('getKelas')
                    ]);
                    
                    let finalSantri = [];
                    if (resSantri && resSantri.data && Array.isArray(resSantri.data.data)) finalSantri = resSantri.data.data;
                    else if (resSantri && Array.isArray(resSantri.data)) finalSantri = resSantri.data;
                    else if (Array.isArray(resSantri)) finalSantri = resSantri;
                    setSantri(finalSantri);

                    let finalKelas = [];
                    if (resKelas && resKelas.data && Array.isArray(resKelas.data.data)) finalKelas = resKelas.data.data;
                    else if (resKelas && Array.isArray(resKelas.data)) finalKelas = resKelas.data;
                    else if (Array.isArray(resKelas)) finalKelas = resKelas;
                    setKelasOptions(finalKelas);
                } catch (e) { showToast(e.message, 'error'); } 
                finally { setLoading(false); }
            };
            useEffect(() => { fetchData(); }, []);

            const handleDelete = async (id) => {
                if (!window.confirm('Yakin ingin menghapus data santri ini?')) return;
                try {
                    await apiService.request('deleteData', { sheetName: 'SANTRI', rowId: id });
                    showToast('Data santri berhasil dihapus', 'success');
                    fetchData();
                } catch (e) { showToast(e.message, 'error'); }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.kelas) return showToast('Pilih kelas terlebih dahulu!', 'error');
                
                try {
                    const payload = { 
                        nis: formData.nis,
                        nama_santri: formData.nama_santri,
                        kelas: formData.kelas,
                        gender: formData.gender
                    };
                    await apiService.request('saveData', { sheetName: 'SANTRI', data: payload });
                    showToast('Data santri berhasil ditambahkan!', 'success');
                    setIsModalOpen(false);
                    setFormData({ nis: '', nama_santri: '', kelas: '', gender: 'Laki-Laki' });
                    fetchData();
                } catch (e) { showToast(e.message, 'error'); }
            };

            const filteredSantri = santri.filter(item => {
                const renderNis = String(item.nis || item.NIS || item.id_santri || '').toLowerCase();
                const renderNama = String(item.nama_santri || item.Nama || item.nama || item.nama_lengkap || '').toLowerCase();
                const renderKelas = String(item.kelas || item.Kelas || '');
                const renderGender = String(item.gender || item.Gender || item.jk || '').toLowerCase();

                const matchSearch = renderNis.includes(searchTerm.toLowerCase()) || renderNama.includes(searchTerm.toLowerCase());
                const matchKelas = filterKelas === '' || renderKelas === filterKelas;
                const matchGender = filterGender === '' || renderGender.includes(filterGender.toLowerCase());

                return matchSearch && matchKelas && matchGender;
            });

            // --- LOGIKA SORTING ---
            const sortedSantri = [...filteredSantri].sort((a, b) => {
                if (!sortConfig.key) return 0;
                
                let aValue = '';
                let bValue = '';
                
                if (sortConfig.key === 'nis') { aValue = String(a.nis || a.NIS || a.id_santri || ''); bValue = String(b.nis || b.NIS || b.id_santri || ''); }
                if (sortConfig.key === 'nama_santri') { aValue = String(a.nama_santri || a.Nama || a.nama || a.nama_lengkap || ''); bValue = String(b.nama_santri || b.Nama || b.nama || b.nama_lengkap || ''); }
                if (sortConfig.key === 'kelas') { aValue = String(a.kelas || a.Kelas || ''); bValue = String(b.kelas || b.Kelas || ''); }
                if (sortConfig.key === 'gender') { aValue = String(a.gender || a.Gender || a.jk || ''); bValue = String(b.gender || b.Gender || b.jk || ''); }

                aValue = aValue.toLowerCase();
                bValue = bValue.toLowerCase();

                if (aValue < bValue) return sortConfig.direction === 'asc' ? -1 : 1;
                if (aValue > bValue) return sortConfig.direction === 'asc' ? 1 : -1;
                return 0;
            });

            const handleSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
                setSortConfig({ key, direction });
            };

            const SortIcon = ({ columnKey }) => {
                if (sortConfig.key !== columnKey) return <span className="text-gray-300 ml-1">↕</span>;
                return sortConfig.direction === 'asc' ? <span className="text-emerald-600 ml-1">▲</span> : <span className="text-emerald-600 ml-1">▼</span>;
            };

            return (
                <div className="space-y-6 animate-fade-in-down">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-4 gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Data Santri</h2>
                            <p className="text-gray-500">Kelola daftar santri yang aktif di pondok.</p>
                        </div>
                        <Button onClick={() => setIsModalOpen(true)} icon={<Icons.Plus />}>Tambah Santri</Button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <input 
                            type="text" placeholder="Cari NIS atau Nama Santri..." 
                            className="w-full p-2.5 border rounded-lg bg-white focus:ring-2 focus:ring-emerald-500 outline-none text-sm"
                            value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)}
                        />
                        <select className="w-full p-2.5 border rounded-lg bg-white outline-none text-sm" value={filterKelas} onChange={(e) => setFilterKelas(e.target.value)}>
                            <option value="">Semua Kelas</option>
                            {kelasOptions.map((k, i) => {
                                const kKeys = Object.keys(k);
                                const namaKelas = k[kKeys.find(key => key.toLowerCase().includes('nama')) || kKeys[1]] || k.nama_kelas;
                                return <option key={i} value={namaKelas}>{namaKelas}</option>;
                            })}
                        </select>
                        <select className="w-full p-2.5 border rounded-lg bg-white outline-none text-sm" value={filterGender} onChange={(e) => setFilterGender(e.target.value)}>
                            <option value="">Semua Gender</option>
                            <option value="laki">Laki-Laki</option>
                            <option value="perempuan">Perempuan</option>
                        </select>
                    </div>

                    <Card className="overflow-x-auto p-0">
                        <table className="w-full text-left text-sm whitespace-nowrap">
                            <thead className="bg-emerald-50 text-emerald-800 border-b">
                                <tr>
                                    <th className="p-4 cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('nis')}>
                                        NIS <SortIcon columnKey="nis" />
                                    </th>
                                    <th className="p-4 cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('nama_santri')}>
                                        Nama Lengkap <SortIcon columnKey="nama_santri" />
                                    </th>
                                    <th className="p-4 cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('kelas')}>
                                        Kelas <SortIcon columnKey="kelas" />
                                    </th>
                                    <th className="p-4 cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('gender')}>
                                        Gender <SortIcon columnKey="gender" />
                                    </th>
                                    <th className="p-4">Aksi</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {loading ? <tr><td colSpan="5" className="p-8 text-center text-gray-500">Memuat data santri...</td></tr> : 
                                 sortedSantri.length === 0 ? <tr><td colSpan="5" className="p-8 text-center text-gray-500">Data santri tidak ditemukan.</td></tr> :
                                 sortedSantri.map((item, idx) => {
                                     const renderNis = item.nis || item.NIS || item.id_santri || '-';
                                     const renderNama = item.nama_santri || item.Nama || item.nama || item.nama_lengkap || '-';
                                     const renderKelas = item.kelas || item.Kelas || '-';
                                     const renderGender = String(item.gender || item.Gender || item.jk || '-');
                                     
                                     return (
                                        <tr key={idx} className="hover:bg-gray-50">
                                            <td className="p-4 font-mono text-xs text-gray-500">{renderNis}</td>
                                            <td className="p-4 font-bold text-gray-800">{renderNama}</td>
                                            <td className="p-4 font-medium text-emerald-600">{renderKelas}</td>
                                            <td className="p-4">
                                                <span className={`px-2 py-1 rounded text-[10px] font-bold ${renderGender.toLowerCase().includes('laki') ? 'bg-blue-100 text-blue-700' : 'bg-pink-100 text-pink-700'}`}>
                                                    {renderGender.toUpperCase()}
                                                </span>
                                            </td>
                                            <td className="p-4">
                                                <button onClick={() => handleDelete(renderNis)} className="text-red-600 bg-red-50 hover:bg-red-100 px-3 py-1 rounded-md text-xs font-bold transition-colors">Hapus</button>
                                            </td>
                                        </tr>
                                     )
                                 })}
                            </tbody>
                        </table>
                    </Card>

                    <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title="Tambah Data Santri">
                        {/* Form tidak berubah */}
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Nomor Induk Santri (NIS)</label>
                                <input type="text" required placeholder="Contoh: 20261001" className="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-emerald-500 outline-none" value={formData.nis} onChange={e => setFormData({...formData, nis: e.target.value})} />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap Santri</label>
                                <input type="text" required placeholder="Masukkan nama lengkap" className="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-emerald-500 outline-none" value={formData.nama_santri} onChange={e => setFormData({...formData, nama_santri: e.target.value})} />
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Kelas</label>
                                    <select className="w-full p-2 border rounded-lg bg-gray-50 outline-none" value={formData.kelas} onChange={e => setFormData({...formData, kelas: e.target.value})}>
                                        <option value="">-- Pilih Kelas --</option>
                                        {kelasOptions.map((k, i) => {
                                            const kKeys = Object.keys(k);
                                            const namaKelas = k[kKeys.find(key => key.toLowerCase().includes('nama')) || kKeys[1]] || k.nama_kelas;
                                            return <option key={i} value={namaKelas}>{namaKelas}</option>;
                                        })}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Gender</label>
                                    <select className="w-full p-2 border rounded-lg bg-gray-50 outline-none" value={formData.gender} onChange={e => setFormData({...formData, gender: e.target.value})}>
                                        <option>Laki-Laki</option>
                                        <option>Perempuan</option>
                                    </select>
                                </div>
                            </div>
                            <Button fullWidth type="submit" className="mt-6">Simpan Santri</Button>
                        </form>
                    </Modal>
                </div>
            );
        };
        
        const MasterKelasPage = () => {
            const { showToast } = useContext(ToastContext);
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [formData, setFormData] = useState({});

            const fetchData = async () => {
                setLoading(true);
                try {
                    const res = await apiService.request('getKelas');
                    setData(res.data || []);
                } catch (e) { showToast(e.message, 'error'); } finally { setLoading(false); }
            };
            useEffect(() => { fetchData(); }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    const res = await apiService.request('saveKelas', formData);
                    showToast(res.message, 'success');
                    setIsModalOpen(false);
                    fetchData();
                } catch (e) { showToast(e.message, 'error'); }
            };

            return (
                <div className="space-y-6 animate-fade-in-down">
                    <div className="flex justify-between items-center">
                        <div><h2 className="text-2xl font-bold text-gray-800">Master Data Kelas</h2></div>
                        <Button onClick={() => { setFormData({}); setIsModalOpen(true); }} icon={<Icons.Plus />}>Tambah Kelas</Button>
                    </div>
                    <Card>
                        <table className="w-full text-left text-sm border-collapse whitespace-nowrap">
                            <thead><tr className="bg-gray-50 border-b"><th className="p-3">Nama Kelas</th><th className="p-3">Jenjang</th><th className="p-3">Wali Kelas</th><th className="p-3">Aksi</th></tr></thead>
                            <tbody>
                                {loading ? <tr><td colSpan="4" className="p-4 text-center">Memuat data...</td></tr> : data.map((item, idx) => (
                                    <tr key={idx} className="border-b hover:bg-gray-50"><td className="p-3 font-bold">{item.nama_kelas}</td><td className="p-3">{item.jenjang}</td><td className="p-3 text-emerald-700">{item.wali_kelas}</td><td className="p-3"><button onClick={() => { setFormData(item); setIsModalOpen(true); }} className="p-1 text-blue-600 hover:bg-blue-50 rounded"><Icons.Edit /></button></td></tr>
                                ))}
                            </tbody>
                        </table>
                    </Card>
                    <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title="Form Kelas">
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <Input label="Nama Kelas (Contoh: VII-A)" value={formData.nama_kelas || ''} onChange={(e) => setFormData({...formData, nama_kelas: e.target.value})} required />
                            <Select label="Jenjang" options={['SMP', 'SMA']} value={formData.jenjang || ''} onChange={(e) => setFormData({...formData, jenjang: e.target.value})} required />
                            <Input label="Wali Kelas (ID/Username)" value={formData.wali_kelas || ''} onChange={(e) => setFormData({...formData, wali_kelas: e.target.value})} required />
                            <div className="pt-4 flex justify-end gap-2 border-t"><Button type="button" variant="secondary" onClick={() => setIsModalOpen(false)}>Batal</Button><Button type="submit">Simpan</Button></div>
                        </form>
                    </Modal>
                </div>
            );
        };

        // --- PHASE 3 COMPONENTS ---
        const KenaikanKelasPage = () => {
            const { showToast } = useContext(ToastContext);
            const [santriData, setSantriData] = useState([]);
            const [tpData, setTpData] = useState([]);
            const [kelasData, setKelasData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [processing, setProcessing] = useState(false);
            
            const [selectedTp, setSelectedTp] = useState('');
            const [fromKelas, setFromKelas] = useState('');
            const [toKelas, setToKelas] = useState('');
            const [previewData, setPreviewData] = useState([]);

            useEffect(() => {
                const fetchDeps = async () => {
                    try {
                        const [resSantri, resTp, resKelas] = await Promise.all([
                            apiService.request('getSantri'),
                            apiService.request('getTahunPelajaran'),
                            apiService.request('getKelas')
                        ]);
                        setSantriData(resSantri.data.filter(s => s.status === 'Aktif'));
                        setTpData(resTp.data.filter(t => t.status === 'Aktif'));
                        if (resTp.data.length > 0) {
                            const aktif = resTp.data.find(t => t.status === 'Aktif');
                            if (aktif) setSelectedTp(aktif.tp_id);
                        }
                        setKelasData(resKelas.data);
                    } catch (e) { showToast(e.message, 'error'); } finally { setLoading(false); }
                };
                fetchDeps();
            }, []);

            const handlePreview = () => {
                if (!selectedTp || !fromKelas || !toKelas) return showToast('Pilih TP, Kelas Asal, dan Kelas Tujuan', 'error');
                const targetSantri = santriData.filter(s => s.kelas === fromKelas);
                const draft = targetSantri.map(s => ({
                    santri_id: s.santri_id, nama: s.nama, kelas_lama: s.kelas, kelas_baru: toKelas, status_baru: toKelas === 'LULUS' ? 'Lulus' : 'Aktif'
                }));
                setPreviewData(draft);
                showToast(`Menemukan ${draft.length} santri untuk diproses.`, 'success');
            };

            const handleIndividualChange = (idx, field, value) => {
                const updated = [...previewData];
                updated[idx][field] = value;
                setPreviewData(updated);
            };

            const handleSubmit = async () => {
                if (previewData.length === 0) return;
                if (!confirm("Apakah Anda yakin memproses kenaikan kelas ini? Proses ini akan mencatat histori di database.")) return;
                setProcessing(true);
                try {
                    const payload = { mutations: previewData.map(d => ({ santri_id: d.santri_id, tp_id: selectedTp, kelas_baru: d.kelas_baru, status_baru: d.status_baru })) };
                    const res = await apiService.request('saveKenaikanKelas', payload);
                    showToast(res.message, 'success');
                    setPreviewData([]);
                    setFromKelas('');
                    setToKelas('');
                } catch (e) { showToast(e.message, 'error'); } finally { setProcessing(false); }
            };

            return (
                <div className="space-y-6 animate-fade-in-down">
                    <div><h2 className="text-2xl font-bold text-gray-800">Proses Kenaikan Kelas</h2><p className="text-gray-500">Pindahkan kelas santri secara massal dengan aman (histori tahun lalu terjaga).</p></div>
                    <Card>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                            <Select label="Tahun Pelajaran Target" options={tpData.map(t => ({value: t.tp_id, label: t.nama_periode}))} value={selectedTp} onChange={(e) => setSelectedTp(e.target.value)} disabled={loading} />
                            <Select label="Dari Kelas (Lama)" options={kelasData.map(k => k.nama_kelas)} value={fromKelas} onChange={(e) => setFromKelas(e.target.value)} disabled={loading} />
                            <Select label="Ke Kelas (Baru)" options={[...kelasData.map(k => k.nama_kelas), 'LULUS', 'TIDAK NAIK']} value={toKelas} onChange={(e) => setToKelas(e.target.value)} disabled={loading} />
                            <div className="flex items-end"><Button fullWidth onClick={handlePreview} disabled={loading || !selectedTp || !fromKelas || !toKelas}>Tampilkan Preview</Button></div>
                        </div>
                        {previewData.length > 0 && (
                            <div className="mt-8 border-t pt-4 animate-fade-in-down">
                                <div className="flex justify-between items-center mb-4"><h3 className="font-bold text-emerald-800">Preview Pemindahan ({previewData.length} Santri)</h3><Button onClick={handleSubmit} disabled={processing}>{processing ? 'Memproses...' : 'Simpan Perubahan Permanen'}</Button></div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-sm border-collapse">
                                        <thead><tr className="bg-gray-50 border-b"><th className="p-3">Nama Santri</th><th className="p-3">Kelas Lama</th><th className="p-3">Ubah Kelas Baru (Koreksi)</th><th className="p-3">Ubah Status</th></tr></thead>
                                        <tbody>
                                            {previewData.map((d, idx) => (
                                                <tr key={idx} className="border-b bg-emerald-50"><td className="p-3 font-medium">{d.nama}</td><td className="p-3">{d.kelas_lama}</td><td className="p-3"><select className="w-full p-1 border rounded" value={d.kelas_baru} onChange={(e) => handleIndividualChange(idx, 'kelas_baru', e.target.value)}><option value="LULUS">LULUS</option><option value="TIDAK NAIK">TIDAK NAIK</option>{kelasData.map(k => <option key={k.nama_kelas} value={k.nama_kelas}>{k.nama_kelas}</option>)}</select></td><td className="p-3"><select className="w-full p-1 border rounded" value={d.status_baru} onChange={(e) => handleIndividualChange(idx, 'status_baru', e.target.value)}><option value="Aktif">Aktif</option><option value="Lulus">Lulus</option><option value="Nonaktif">Nonaktif</option></select></td></tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </Card>
                </div>
            );
        };

        // --- PHASE 4 COMPONENTS ---
        const JadwalPerizinanPage = () => {
            const { showToast } = useContext(ToastContext);
            const [jadwal, setJadwal] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [loading, setLoading] = useState(true);
            const [formData, setFormData] = useState({ pekan: 'Pekan 1', jenjang: 'SEMUA', gender: 'SEMUA', hari: 'Sabtu', jam_mulai: '08:00', jam_selesai: '16:00' });

            // State untuk Filter Dropdown
            const [filterHari, setFilterHari] = useState('');
            const [filterJenjang, setFilterJenjang] = useState('');
            const [filterGender, setFilterGender] = useState('');

            const fetchData = async () => {
                setLoading(true);
                try { 
                    const res = await apiService.request('getJadwal'); 
                    
                    let finalData = [];
                    if (res && res.data && Array.isArray(res.data.data)) finalData = res.data.data;
                    else if (res && Array.isArray(res.data)) finalData = res.data;
                    else if (Array.isArray(res)) finalData = res;
                    
                    setJadwal(finalData); 
                } catch (e) { showToast(e.message, 'error'); } 
                finally { setLoading(false); }
            };
            useEffect(() => { fetchData(); }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    const newId = 'JDW-' + Math.floor(Math.random() * 10000);
                    const payload = { 
                        ...formData, 
                        id_jadwal: newId,
                        jadwal_id: newId, 
                        jam_mulai: "'" + formData.jam_mulai,
                        jam_selesai: "'" + formData.jam_selesai
                    };
                    await apiService.request('saveData', { sheetName: 'JADWAL', data: payload });
                    showToast('Aturan jadwal baru berhasil ditambahkan!', 'success');
                    setIsModalOpen(false);
                    fetchData();
                } catch (e) { showToast(e.message, 'error'); }
            };

            const handleDelete = async (id) => {
                if (!window.confirm('Yakin ingin menghapus aturan jadwal ini?')) return;
                try {
                    await apiService.request('deleteData', { sheetName: 'JADWAL', rowId: id });
                    showToast('Aturan berhasil dihapus', 'success');
                    fetchData();
                } catch (e) { showToast(e.message, 'error'); }
            };

            const formatJam = (val) => {
                if (!val) return '-';
                if (typeof val === 'object' && val instanceof Date) return val.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                return String(val).substring(0, 5); 
            };

            // Logika Penyaringan Jadwal (Bisa kombinasi 3 filter sekaligus)
            const filteredJadwal = jadwal.filter(j => {
                const keys = Object.keys(j);
                const jenjang = String(j[keys[2]] || j.jenjang || '-').toUpperCase();
                const gender = String(j[keys[3]] || j.gender || '-').toLowerCase();
                const hari = String(j[keys[4]] || j.hari || '-').toLowerCase();

                const matchHari = filterHari === '' || hari.includes(filterHari.toLowerCase());
                const matchJenjang = filterJenjang === '' || jenjang === filterJenjang.toUpperCase() || jenjang === 'SEMUA';
                const matchGender = filterGender === '' || gender.includes(filterGender.toLowerCase()) || gender === 'semua';

                return matchHari && matchJenjang && matchGender;
            });

            return (
                <div className="space-y-6 animate-fade-in-down">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-4 gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Aturan Jadwal Perizinan</h2>
                            <p className="text-gray-500">Kelola jadwal keluar santri secara spesifik.</p>
                        </div>
                        <Button onClick={() => setIsModalOpen(true)} icon={<Icons.Plus />}>Tambah Aturan Baru</Button>
                    </div>

                    {/* KOTAK FILTER JADWAL */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <select className="w-full p-2.5 border rounded-lg bg-white outline-none text-sm" value={filterHari} onChange={(e) => setFilterHari(e.target.value)}>
                            <option value="">Semua Hari</option>
                            <option value="jumat">Jumat</option>
                            <option value="sabtu">Sabtu</option>
                            <option value="ahad">Ahad</option>
                        </select>
                        <select className="w-full p-2.5 border rounded-lg bg-white outline-none text-sm" value={filterJenjang} onChange={(e) => setFilterJenjang(e.target.value)}>
                            <option value="">Semua Jenjang</option>
                            <option value="smp">SMP</option>
                            <option value="sma">SMA</option>
                        </select>
                        <select className="w-full p-2.5 border rounded-lg bg-white outline-none text-sm" value={filterGender} onChange={(e) => setFilterGender(e.target.value)}>
                            <option value="">Semua Gender</option>
                            <option value="laki">Laki-Laki</option>
                            <option value="perempuan">Perempuan</option>
                        </select>
                    </div>

                    <Card className="overflow-x-auto p-0">
                        <table className="w-full text-left text-sm whitespace-nowrap">
                            <thead className="bg-emerald-50 text-emerald-800 border-b">
                                <tr>
                                    <th className="p-4">Pekan</th>
                                    <th className="p-4">Jenjang</th>
                                    <th className="p-4">Gender</th>
                                    <th className="p-4">Hari</th>
                                    <th className="p-4 text-center">Jam Berlaku</th>
                                    <th className="p-4">Aksi</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {loading ? <tr><td colSpan="6" className="p-8 text-center text-gray-500">Memuat aturan jadwal...</td></tr> : 
                                 filteredJadwal.length === 0 ? <tr><td colSpan="6" className="p-8 text-center text-gray-500">Tidak ada jadwal yang sesuai filter.</td></tr> :
                                 filteredJadwal.map((j, idx) => {
                                     const keys = Object.keys(j);
                                     const id = j[keys[0]] || j.id_jadwal || j.id || `temp-${idx}`;
                                     const pekan = String(j[keys[1]] || j.pekan || '-');
                                     const jenjang = String(j[keys[2]] || j.jenjang || '-');
                                     const gender = String(j[keys[3]] || j.gender || '-');
                                     const hari = String(j[keys[4]] || j.hari || '-');
                                     const jamMulai = formatJam(j[keys[5]] || j.jam_mulai);
                                     const jamSelesai = formatJam(j[keys[6]] || j.jam_selesai);

                                     return (
                                        <tr key={idx} className="hover:bg-gray-50">
                                            <td className="p-4 font-bold text-gray-800">{pekan}</td>
                                            <td className="p-4"><span className="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-bold">{jenjang}</span></td>
                                            <td className="p-4"><span className="bg-purple-100 text-purple-800 px-2 py-1 rounded text-xs font-bold">{gender}</span></td>
                                            <td className="p-4 font-medium">{hari}</td>
                                            <td className="p-4 text-center font-mono text-emerald-600 font-bold">{jamMulai} - {jamSelesai}</td>
                                            <td className="p-4">
                                                <button onClick={() => handleDelete(id)} className="text-red-600 bg-red-50 hover:bg-red-100 px-3 py-1 rounded-md text-xs font-bold transition-colors">Hapus</button>
                                            </td>
                                        </tr>
                                     );
                                 })}
                            </tbody>
                        </table>
                    </Card>

                    <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title="Tambah Aturan Jadwal">
                        {/* Form tidak ada perubahan */}
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Pekan Ke-</label>
                                    <select className="w-full p-2 border rounded-lg bg-gray-50" value={formData.pekan} onChange={e => setFormData({...formData, pekan: e.target.value})}>
                                        <option>Pekan 1</option><option>Pekan 2</option><option>Pekan 3</option><option>Pekan 4</option><option>Pekan 5</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Hari</label>
                                    <select className="w-full p-2 border rounded-lg bg-gray-50" value={formData.hari} onChange={e => setFormData({...formData, hari: e.target.value})}>
                                        <option>Jumat</option><option>Sabtu</option><option>Ahad</option>
                                    </select>
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Target Jenjang</label>
                                    <select className="w-full p-2 border rounded-lg bg-gray-50" value={formData.jenjang} onChange={e => setFormData({...formData, jenjang: e.target.value})}>
                                        <option>SEMUA</option><option>SMP</option><option>SMA</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Target Gender</label>
                                    <select className="w-full p-2 border rounded-lg bg-gray-50" value={formData.gender} onChange={e => setFormData({...formData, gender: e.target.value})}>
                                        <option>SEMUA</option><option>Laki-Laki</option><option>Perempuan</option>
                                    </select>
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Jam Mulai (Misal: 08:00)</label>
                                    <input type="time" required className="w-full p-2 border rounded-lg bg-gray-50" value={formData.jam_mulai} onChange={e => setFormData({...formData, jam_mulai: e.target.value})} />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Jam Selesai (Misal: 16:00)</label>
                                    <input type="time" required className="w-full p-2 border rounded-lg bg-gray-50" value={formData.jam_selesai} onChange={e => setFormData({...formData, jam_selesai: e.target.value})} />
                                </div>
                            </div>
                            <Button fullWidth type="submit" className="mt-6">Simpan Aturan</Button>
                        </form>
                    </Modal>
                </div>
            );
        };

        // --- PHASE 5 COMPONENTS ---
        const helper = {
            getNextFriday: () => {
                const d = new Date();
                d.setDate(d.getDate() + ((5 + 7 - d.getDay()) % 7 || 7)); // 5 = Jumat
                return d;
            },
            getWeekOfMonth: (date) => {
                const firstDay = new Date(date.getFullYear(), date.getMonth(), 1).getDay();
                return Math.ceil((date.getDate() + firstDay) / 7);
            },
            // FORMAT TANGGAL LEBIH SIMPEL: Jum, 28 Ags 2026
            formatDate: (date) => date.toLocaleDateString('id-ID', { weekday: 'short', year: 'numeric', month: 'short', day: '2-digit' })
        };

        const AjukanIzinPage = ({ setCurrentRoute }) => {
            const { user } = useContext(AuthContext);
            const { showToast } = useContext(ToastContext);
            const [santriData, setSantriData] = useState([]);
            const [jadwalData, setJadwalData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [submitting, setSubmitting] = useState(false);

            const nextFriday = useMemo(() => helper.getNextFriday(), []);
            const weekNumber = useMemo(() => {
                let week = helper.getWeekOfMonth(nextFriday);
                return week > 4 ? '4' : week.toString();
            }, [nextFriday]);

            const initialForm = { santri_id: '', keperluan: '', tujuan: '', wali_safar: '', hubungan_wali: '', hubungan_lainnya: '', ikut_jadwal_saudara: false, saudara_santri_id: '', keterangan_luar_jadwal: '' };
            const [form, setForm] = useState(initialForm);

            useEffect(() => {
                const fetchDeps = async () => {
                    try {
                        const [resSantri, resJadwal] = await Promise.all([
                            apiService.request('getSantri'),
                            apiService.request('getJadwal')
                        ]);
                        setSantriData(resSantri.data.filter(s => s.status === 'Aktif'));
                        setJadwalData(resJadwal.data);
                    } catch (e) { showToast(e.message, 'error'); } finally { setLoading(false); }
                };
                fetchDeps();
            }, []);

            const selectedSantri = useMemo(() => santriData.find(s => s.santri_id === form.santri_id), [santriData, form.santri_id]);
            const selectedSaudara = useMemo(() => santriData.find(s => s.santri_id === form.saudara_santri_id), [santriData, form.saudara_santri_id]);
            
            const statusJadwal = useMemo(() => {
                if (!selectedSantri || jadwalData.length === 0) return null;
                const targetSantri = (form.ikut_jadwal_saudara && selectedSaudara) ? selectedSaudara : selectedSantri;
                const rule = jadwalData.find(j => j.pekan === weekNumber);
                if (!rule) return 'Di Luar Jadwal';
                return (targetSantri.jenjang === rule.jenjang && targetSantri.jk === rule.gender) ? 'Sesuai Jadwal' : 'Di Luar Jadwal';
            }, [selectedSantri, selectedSaudara, form.ikut_jadwal_saudara, jadwalData, weekNumber]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (statusJadwal === 'Di Luar Jadwal' && !form.keterangan_luar_jadwal) return showToast("Keterangan Di Luar Jadwal wajib diisi!", "error");
                if (form.hubungan_wali === 'Lainnya' && !form.hubungan_lainnya) return showToast("Detail hubungan Lainnya wajib diisi!", "error");
                if (form.ikut_jadwal_saudara && !form.saudara_santri_id) return showToast("Pilih santri saudara yang diikuti jadwalnya!", "error");

                setSubmitting(true);
                try {
                    const payload = { ...form, nama_santri: selectedSantri.nama, kelas: selectedSantri.kelas, tanggal_izin: helper.formatDate(nextFriday), status_jadwal: statusJadwal };
                    await apiService.request('savePermit', payload);
                    showToast('Pengajuan berhasil dikirim! Menunggu approval.', 'success');
                    setForm(initialForm);
                    setCurrentRoute('histori');
                } catch (e) { showToast(e.message, 'error'); } finally { setSubmitting(false); }
            };

            const santriOptions = santriData.filter(s => user.role !== ROLES.WALI_KELAS || s.kelas === user.kelas_id || true).map(s => ({ value: s.santri_id, label: `${s.nama} (${s.kelas})` }));
            const hubunganOptions = ['Ayah', 'Ibu', 'Kakak Kandung', 'Adik Kandung', 'Kakek', 'Nenek', 'Paman', 'Bibi', 'Saudara', 'Wali', 'Lainnya'];

            if (loading) return <div className="p-8 text-center text-gray-500 animate-pulse">Menyiapkan Form (Membaca data dari Google Sheets)...</div>;

            return (
                <div className="space-y-6 animate-fade-in-down max-w-4xl">
                    <div><h2 className="text-2xl font-bold text-gray-800">Ajukan Izin Keluar</h2><p className="text-gray-500">Sistem otomatis menghitung penjadwalan pekan ini berdasarkan identitas santri.</p></div>
                    <form onSubmit={handleSubmit} className="space-y-6">
                        <Card><h3 className="text-lg font-bold text-gray-700 border-b pb-2 mb-4">1. Identitas Santri</h3><Select name="santri_id" label="Pilih Santri di Kelas Anda" required options={santriOptions} value={form.santri_id} onChange={(e) => setForm({...form, santri_id: e.target.value})} />{selectedSantri && (<div className="bg-emerald-50 border border-emerald-100 rounded-lg p-4 grid grid-cols-3 gap-4 text-sm mt-4"><div><p className="text-gray-500">Jenjang</p><p className="font-bold text-emerald-800">{selectedSantri.jenjang}</p></div><div><p className="text-gray-500">Kelas</p><p className="font-bold text-emerald-800">{selectedSantri.kelas}</p></div><div><p className="text-gray-500">Gender</p><p className="font-bold text-emerald-800">{selectedSantri.jk}</p></div></div>)}</Card>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6"><Card><h3 className="text-lg font-bold text-gray-700 border-b pb-2 mb-4">2. Detail Perizinan</h3><div className="mb-4"><label className="block text-sm font-medium text-gray-700 mb-1">Keperluan Izin <span className="text-red-500">*</span></label><textarea required rows="2" className="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none" value={form.keperluan} onChange={(e) => setForm({...form, keperluan: e.target.value})} placeholder="Contoh: Menghadiri pernikahan keluarga"></textarea></div><Input label="Tujuan Keluar (Tempat/Kota)" required value={form.tujuan} onChange={(e) => setForm({...form, tujuan: e.target.value})} placeholder="Contoh: Bandung" /></Card><Card><h3 className="text-lg font-bold text-gray-700 border-b pb-2 mb-4">3. Wali Safar (Penjemput)</h3><Input label="Nama Wali Safar" required value={form.wali_safar} onChange={(e) => setForm({...form, wali_safar: e.target.value})} placeholder="Nama penjemput" /><Select label="Hubungan Wali Safar" required options={hubunganOptions} value={form.hubungan_wali} onChange={(e) => setForm({...form, hubungan_wali: e.target.value})} />{form.hubungan_wali === 'Lainnya' && (<Input label="Detail Hubungan Lainnya" required value={form.hubungan_lainnya} onChange={(e) => setForm({...form, hubungan_lainnya: e.target.value})} placeholder="Sebutkan hubungannya..." />)}</Card></div>
                        {selectedSantri && (<Card className={statusJadwal === 'Sesuai Jadwal' ? 'border-emerald-300 ring-1 ring-emerald-300' : 'border-yellow-400 ring-1 ring-yellow-400'}><div className="flex flex-col md:flex-row justify-between items-start gap-4 border-b pb-4 mb-4"><div><h3 className="text-lg font-bold text-gray-800">4. Analisis Penjadwalan</h3><p className="text-sm text-gray-600 mt-1">Tanggal Izin: <strong className="text-gray-900">{helper.formatDate(nextFriday)}</strong> (Pekan {weekNumber})</p></div><div className={`px-4 py-2 rounded-full font-bold text-sm ${statusJadwal === 'Sesuai Jadwal' ? 'bg-emerald-100 text-emerald-800' : 'bg-yellow-100 text-yellow-800'}`}>Status: {statusJadwal}</div></div><div className="space-y-4"><label className="flex items-center gap-3 p-3 border rounded-lg bg-gray-50 cursor-pointer hover:bg-gray-100 transition-colors"><input type="checkbox" className="w-5 h-5 text-emerald-600 rounded" checked={form.ikut_jadwal_saudara} onChange={(e) => setForm({...form, ikut_jadwal_saudara: e.target.checked, saudara_santri_id: ''})} /><span className="font-medium text-gray-700">Mengikuti Jadwal Kakak / Adik</span></label>{form.ikut_jadwal_saudara && (<div className="pl-8 p-4 bg-blue-50 border border-blue-100 rounded-lg animate-fade-in-down"><Select label="Pilih Santri Saudara" options={santriData.filter(s => s.santri_id !== form.santri_id).map(s => ({value: s.santri_id, label: `${s.nama} (${s.kelas} - ${s.jk})`}))} value={form.saudara_santri_id} onChange={(e) => setForm({...form, saudara_santri_id: e.target.value})} />{selectedSaudara && <p className="text-xs text-blue-700 mt-1">Sistem menggunakan jadwal <strong>{selectedSaudara.jenjang} - {selectedSaudara.jk}</strong>.</p>}</div>)}{statusJadwal === 'Di Luar Jadwal' && (<div className="mt-4 p-4 bg-yellow-50 border border-yellow-200 rounded-lg"><label className="block text-sm font-bold text-yellow-800 mb-2">Karena izin di luar jadwal, wajib mengisi alasan berikut:</label><textarea required rows="2" className="w-full px-4 py-2 rounded-lg border border-yellow-300 focus:ring-2 focus:ring-yellow-500 outline-none" value={form.keterangan_luar_jadwal} onChange={(e) => setForm({...form, keterangan_luar_jadwal: e.target.value})} placeholder="Alasan izin di luar pekan yang ditentukan..."></textarea></div>)}</div></Card>)}
                        <Button type="submit" disabled={!selectedSantri || submitting} fullWidth className="py-4 text-lg shadow-lg">{submitting ? 'Memproses ke Database...' : 'Kirim Pengajuan Izin'}</Button>
                    </form>
                </div>
            );
        };

        const HistoriKelasPage = () => {
            const { showToast } = useContext(ToastContext);
            const [permits, setPermits] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedQrPermit, setSelectedQrPermit] = useState(null); // State untuk memanggil modal

            useEffect(() => {
                const fetchPermits = async () => {
                    try { const res = await apiService.request('getPermits'); setPermits(res.data); } catch (e) { showToast(e.message, 'error'); } finally { setLoading(false); }
                };
                fetchPermits();
            }, []);

            const getStatusBadge = (status) => {
                const styles = { 'MENUNGGU_APPROVAL': 'bg-yellow-100 text-yellow-800 border-yellow-200', 'DISETUJUI': 'bg-emerald-100 text-emerald-800 border-emerald-200', 'DITOLAK': 'bg-red-100 text-red-800 border-red-200' };
                return <span className={`px-2 py-1 text-xs font-bold rounded-full border ${styles[status] || 'bg-gray-100'}`}>{status.replace('_', ' ')}</span>;
            };

            return (
                <div className="space-y-6 animate-fade-in-down">
                    <div><h2 className="text-2xl font-bold text-gray-800">Histori Pengajuan Kelas</h2><p className="text-gray-500">Pantau status approval perizinan yang telah diajukan.</p></div>
                    <Card>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse text-sm whitespace-nowrap">
                                <thead><tr className="bg-gray-50 text-gray-700 border-b"><th className="p-4 font-semibold">Tgl Izin</th><th className="p-4 font-semibold">Nama Santri</th><th className="p-4 font-semibold">Keperluan & Tujuan</th><th className="p-4 font-semibold">Wali Safar</th><th className="p-4 font-semibold">Status</th><th className="p-4 font-semibold">Aksi</th></tr></thead>
                                <tbody className="divide-y divide-gray-100">
                                    {loading ? <tr><td colSpan="6" className="p-8 text-center text-gray-500">Memuat data dari server...</td></tr> : 
                                     permits.length === 0 ? <tr><td colSpan="6" className="p-8 text-center text-gray-500">Belum ada histori pengajuan.</td></tr> :
                                     permits.map((p, idx) => (
                                        <tr key={idx} className="hover:bg-gray-50"><td className="p-4 font-medium text-gray-800">{p.tanggal_izin}</td><td className="p-4"><p className="font-bold text-gray-700">{p.nama_santri}</p><p className="text-xs text-gray-500">{p.kelas}</p></td><td className="p-4"><p className="text-gray-800 truncate w-48">{p.keperluan}</p><p className="text-xs text-gray-500">Tujuan: {p.tujuan}</p></td><td className="p-4 text-gray-600">{p.wali_safar} ({p.hubungan_wali})</td><td className="p-4">{getStatusBadge(p.status_pengajuan)}</td>
                                        <td className="p-4">
                                            {p.status_pengajuan === 'DISETUJUI' ? 
                                                <button onClick={() => setSelectedQrPermit(p)} className="px-3 py-1 bg-emerald-600 text-white rounded text-xs font-medium hover:bg-emerald-700 shadow-sm transition-colors cursor-pointer">Lihat QR</button> 
                                                : <span className="text-xs text-gray-400 italic">Menunggu</span>
                                            }
                                        </td></tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </Card>
                    {/* Render Modal QR */}
                    <QrCardModal isOpen={!!selectedQrPermit} onClose={() => setSelectedQrPermit(null)} permit={selectedQrPermit} />
                </div>
            );
        };

        // --- PHASE 6 COMPONENTS ---
        const DashboardSecretary = () => {
            const { showToast } = useContext(ToastContext);
            const [stats, setStats] = useState({ total_pekan: 0, disetujui_pekan: 0, ditolak_pekan: 0, menunggu_pekan: 0, sudah_keluar: 0, sudah_kembali: 0, masih_di_luar: 0, terlambat: 0, total_bulan: 0 });
            const [loading, setLoading] = useState(true);
            const [lastUpdate, setLastUpdate] = useState(new Date());

            const fetchStats = async () => {
                try {
                    const res = await apiService.request('getDashboardStats');
                    setStats(res.data);
                    setLastUpdate(new Date());
                } catch (e) { console.error(e); } finally { setLoading(false); }
            };

            // Polling every 30 seconds
            useEffect(() => {
                fetchStats();
                const interval = setInterval(fetchStats, 30000);
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="space-y-6 animate-fade-in-down">
                    <div className="flex justify-between items-end">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Dashboard Sekretaris</h2>
                            {/* WAKTU DIPERSIMPEL: 11:47 */}
                            <p className="text-sm text-gray-500 mt-1">Update terakhir: {lastUpdate.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}</p>
                        </div>
                        <Button variant="secondary" onClick={() => { setLoading(true); fetchStats(); }} icon={<Icons.Clock />}>{loading ? 'Menyinkronkan...' : 'Refresh Manual'}</Button>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <StatCard title="Total Izin (Bulan Ini)" value={stats.total_bulan} icon={<Icons.Calendar />} color="bg-blue-50 text-blue-600" />
                        <StatCard title="Menunggu Approval" value={stats.menunggu_pekan} icon={<Icons.FileText />} color="bg-yellow-50 text-yellow-600" />
                        <StatCard title="Disetujui (Pekan Ini)" value={stats.disetujui_pekan} icon={<Icons.CheckCircle />} color="bg-emerald-50 text-emerald-600" />
                        <StatCard title="Ditolak (Pekan Ini)" value={stats.ditolak_pekan} icon={<Icons.XCircle />} color="bg-red-50 text-red-600" />
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mt-6 border-t pt-6">
                        <StatCard title="Sudah Keluar" value={stats.sudah_keluar} icon={<Icons.Scan />} color="bg-gray-100 text-gray-600" />
                        <StatCard title="Sudah Kembali" value={stats.sudah_kembali} icon={<Icons.Home />} color="bg-emerald-100 text-emerald-700" />
                        <StatCard title="Masih Di Luar" value={stats.masih_di_luar} icon={<Icons.TrendingUp />} color="bg-orange-50 text-orange-600" />
                        <StatCard title="Terlambat (Bulan Ini)" value={stats.terlambat} icon={<Icons.Clock />} color="bg-red-100 text-red-700" />
                    </div>
                </div>
            );
        };

        const ScreeningIzinPage = () => {
            const { user } = useContext(AuthContext);
            const { showToast } = useContext(ToastContext);
            const [permits, setPermits] = useState([]);
            const [santriList, setSantriList] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedPermit, setSelectedPermit] = useState(null);
            const [rejectReason, setRejectReason] = useState('');
            const [processing, setProcessing] = useState(false);

            const fetchPermits = async () => {
                setLoading(true);
                try {
                    // SEKALIGUS MENGAMBIL DATA SANTRI UNTUK NAMA SAUDARA
                    const [resPermits, resSantri] = await Promise.all([
                        apiService.request('getPermits'),
                        apiService.request('getSantri')
                    ]);
                    
                    setPermits(resPermits.data.filter(p => p.status_pengajuan === 'MENUNGGU_APPROVAL'));
                    setSantriList(resSantri.data);
                } catch (e) { showToast(e.message, 'error'); } finally { setLoading(false); }
            };
            useEffect(() => { fetchPermits(); }, []);

            const handleAction = async (action) => {
                if (action === 'REJECT' && !rejectReason) return showToast("Alasan penolakan wajib diisi!", "error");
                if (action === 'APPROVE' && !confirm("Yakin menyetujui izin ini? QR Code akan otomatis diterbitkan.")) return;

                setProcessing(true);
                try {
                    const payload = { permit_id: selectedPermit.permit_id, aksi_approval: action, alasan: rejectReason, username: user.nama };
                    const res = await apiService.request('processApproval', payload);
                    showToast(res.message, 'success');
                    setSelectedPermit(null);
                    setRejectReason('');
                    fetchPermits();
                } catch (e) { showToast(e.message, 'error'); } finally { setProcessing(false); }
            };

            return (
                <div className="space-y-6 animate-fade-in-down">
                    <div><h2 className="text-2xl font-bold text-gray-800">Screening Perizinan</h2><p className="text-gray-500">Tinjau dan berikan persetujuan untuk santri yang akan keluar.</p></div>
                    
                    {loading ? <div className="p-12 text-center text-gray-500">Membaca antrean izin dari server...</div> :
                     permits.length === 0 ? <div className="p-12 text-center bg-white rounded-xl border border-dashed border-gray-300 text-gray-500">Yeay! Tidak ada antrean perizinan saat ini.</div> :
                     <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {permits.map((p, idx) => (
                            <Card key={idx} className="flex flex-col justify-between border-l-4 border-yellow-400">
                                <div>
                                    <div className="flex justify-between items-start mb-4 border-b pb-4">
                                        <div>
                                            <h3 className="text-xl font-bold text-gray-900">{p.nama_santri}</h3>
                                            <p className="text-sm text-gray-500">{p.kelas} • Tgl Izin: <strong>{p.tanggal_izin}</strong></p>
                                        </div>
                                        <span className={`px-3 py-1 text-xs font-bold rounded-full ${p.status_jadwal === 'Sesuai Jadwal' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>
                                            {p.status_jadwal}
                                        </span>
                                    </div>
                                    <div className="space-y-2 text-sm text-gray-700 mb-6">
                                        <p><span className="text-gray-500 w-24 inline-block">Keperluan:</span> <strong>{p.keperluan}</strong></p>
                                        <p><span className="text-gray-500 w-24 inline-block">Tujuan:</span> <strong>{p.tujuan}</strong></p>
                                        <p><span className="text-gray-500 w-24 inline-block">Penjemput:</span> <strong>{p.wali_safar} ({p.hubungan_wali})</strong></p>
                                        
                                        {p.status_jadwal === 'Di Luar Jadwal' && (
                                            <div className="mt-3 p-3 bg-red-50 border border-red-100 rounded-lg">
                                                <p className="text-red-800 text-xs font-bold mb-1">ALASAN DI LUAR JADWAL:</p>
                                                <p className="text-red-700 italic">{p.keterangan_luar_jadwal}</p>
                                            </div>
                                        )}
                                        {p.ikut_jadwal_saudara === 'Ya' && (
                                            <div className="mt-2 p-2 bg-blue-50 text-blue-800 rounded-lg text-xs font-medium">
                                                {/* LOGIKA MENAMPILKAN NAMA SAUDARA BUKAN ID */}
                                                {(() => {
                                                    const saudara = santriList.find(s => s.santri_id === p.saudara_santri_id);
                                                    return saudara 
                                                        ? `Ikut jadwal saudara: ${saudara.nama} (${saudara.kelas})` 
                                                        : `Ikut jadwal saudara (ID: ${p.saudara_santri_id})`;
                                                })()}
                                            </div>
                                        )}
                                    </div>
                                </div>
                                <Button fullWidth onClick={() => setSelectedPermit(p)}>Tindak Lanjut</Button>
                            </Card>
                        ))}
                     </div>
                    }

                    {/* MODAL APPROVAL/REJECTION */}
                    <Modal isOpen={!!selectedPermit} onClose={() => setSelectedPermit(null)} title="Tindak Lanjut Izin">
                        {selectedPermit && (
                            <div className="space-y-6">
                                <div className="bg-gray-50 p-4 rounded-lg">
                                    <p className="text-sm text-gray-500 mb-1">Konfirmasi izin untuk:</p>
                                    <p className="text-lg font-bold text-gray-900">{selectedPermit.nama_santri} ({selectedPermit.kelas})</p>
                                </div>
                                
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2">Jika Anda MENOLAK, tuliskan alasannya di sini:</label>
                                    <textarea 
                                        rows="3" 
                                        className="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-500 outline-none" 
                                        placeholder="Contoh: Kuota izin bulan ini sudah habis, Alasan kurang jelas..."
                                        value={rejectReason}
                                        onChange={(e) => setRejectReason(e.target.value)}
                                    ></textarea>
                                </div>
                                
                                <div className="grid grid-cols-2 gap-4 pt-4 border-t">
                                    <Button variant="danger" disabled={processing} onClick={() => handleAction('REJECT')}>Tolak Izin</Button>
                                    <Button disabled={processing} onClick={() => handleAction('APPROVE')}>Setujui & Buat QR</Button>
                                </div>
                            </div>
                        )}
                    </Modal>
                </div>
            );
        };
             
        // --- KOMPONEN BANTUAN UNTUK TABEL REKAP (ADMIN & SEKRETARIS) ---
        const RekapRow = ({ periode, ajuan, tepatWaktu, terlambat }) => (

                            <p className="text-gray-500">Statistik Pekan Ini untuk Kelas <strong className="text-emerald-700">{user.kelas_id || 'Belum Diatur'}</strong></p>

                    <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <StatCard title="Total Ajuan" value={loading ? "..." : stats.ajuan} icon={<Icons.FileText />} color="bg-blue-50 text-blue-600" />
                        <StatCard title="Disetujui" value={loading ? "..." : stats.disetujui} icon={<Icons.CheckCircle />} color="bg-emerald-50 text-emerald-600" />
                        <StatCard title="Ditolak" value={loading ? "..." : stats.ditolak} icon={<Icons.XCircle />} color="bg-gray-100 text-gray-600" />
                        <StatCard title="Masih Di Luar" value={loading ? "..." : stats.diluar} icon={<Icons.TrendingUp />} color="bg-orange-50 text-orange-600" />
                        <StatCard title="Sudah Kembali" value={loading ? "..." : stats.kembali} icon={<Icons.Home />} color="bg-teal-50 text-teal-600" />

        const DashboardSecurity = ({ setCurrentRoute }) => {

        const SemuaPerizinanPage = () => {
            const { showToast } = useContext(ToastContext);
            const [permits, setPermits] = useState([]);
            const [loading, setLoading] = useState(true);

            // --- STATE UNTUK PENCARIAN & FILTER ---
            const [searchTerm, setSearchTerm] = useState('');
            const [filterBulan, setFilterBulan] = useState('');
            const [filterKelas, setFilterKelas] = useState('');
            const [filterStatus, setFilterStatus] = useState('');

            // --- STATE UNTUK SORTING (PENGURUTAN) ---
            const [sortConfig, setSortConfig] = useState({ key: 'tanggal_izin', direction: 'desc' });

            const getBulanTahun = (tgl) => {
                if (!tgl) return '-';
                const strTgl = String(tgl).trim();
                const d = new Date(strTgl);
                if (!isNaN(d.getTime())) return d.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
                const parts = strTgl.split(/[\/\- ]/);
                if (parts.length >= 3) {
                    const monthNames = ["", "Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
                    let m = parseInt(parts[1], 10);
                    let y = parts[2].length === 4 ? parts[2] : (parts[0].length === 4 ? parts[0] : parts[2]); 
                    if (m >= 1 && m <= 12 && String(y).length === 4) return `${monthNames[m]} ${y}`;
                }
                return strTgl; 
            };

            useEffect(() => {
                const fetchPermits = async () => {
                    try { 
                        const res = await apiService.request('getPermits'); 
                        let finalData = [];
                        if (res && res.data && Array.isArray(res.data.data)) finalData = res.data.data;
                        else if (res && Array.isArray(res.data)) finalData = res.data;
                        else if (Array.isArray(res)) finalData = res;
                        
                        const dataWithBulan = finalData.map(p => ({
                            ...p,
                            _bulan_filter: getBulanTahun(p.tanggal_izin)
                        }));
                        setPermits(dataWithBulan); 
                    } catch (e) { showToast(e.message, 'error'); } 
                    finally { setLoading(false); }
                };
                fetchPermits();
            }, []);

            const bulanOptions = [...new Set(permits.map(p => p._bulan_filter).filter(b => b && b !== '-'))];
            const kelasOptions = [...new Set(permits.map(p => p.kelas).filter(Boolean))].sort();

            // 1. FILTERING (Menyaring Data)
            const filteredPermits = permits.filter(p => {
                const nama = String(p.nama_santri || '').toLowerCase();
                const kelas = String(p.kelas || '');
                const status = String(p.status_pengajuan || '').toUpperCase();
                const bulan = String(p._bulan_filter || '');
                
                const matchSearch = nama.includes(searchTerm.toLowerCase());
                const matchBulan = filterBulan === '' || bulan === filterBulan;
                const matchKelas = filterKelas === '' || kelas === filterKelas;
                const matchStatus = filterStatus === '' || status.includes(filterStatus);
                
                return matchSearch && matchBulan && matchKelas && matchStatus;
            });

            // 2. SORTING (Mengurutkan Data yang sudah di-filter)
            const sortedPermits = [...filteredPermits].sort((a, b) => {
                if (!sortConfig.key) return 0;
                
                let aValue = a[sortConfig.key] || '';
                let bValue = b[sortConfig.key] || '';

                // Paksa jadi huruf kecil semua agar urutannya adil (tidak membedakan A besar dan a kecil)
                if (typeof aValue === 'string') aValue = aValue.toLowerCase();
                if (typeof bValue === 'string') bValue = bValue.toLowerCase();

                if (aValue < bValue) return sortConfig.direction === 'asc' ? -1 : 1;
                if (aValue > bValue) return sortConfig.direction === 'asc' ? 1 : -1;
                return 0;
            });

            // Fungsi untuk mengubah arah panah saat header di-klik
            const handleSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') {
                    direction = 'desc'; // Jika sebelumnya naik, ubah jadi turun
                }
                setSortConfig({ key, direction });
            };

            // Komponen kecil untuk menampilkan ikon panah di Header
            const SortIcon = ({ columnKey }) => {
                if (sortConfig.key !== columnKey) return <span className="text-gray-300 ml-1">↕</span>;
                return sortConfig.direction === 'asc' ? <span className="text-emerald-600 ml-1">▲</span> : <span className="text-emerald-600 ml-1">▼</span>;
            };

            return (
                <div className="space-y-6 animate-fade-in-down">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-4 gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Laporan Semua Perizinan</h2>
                            <p className="text-gray-500">Data seluruh pengajuan izin santri lintas kelas.</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <input 
                            type="text" placeholder="Cari Nama Santri..." 
                            className="w-full p-2.5 border rounded-lg bg-white focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-medium"
                            value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)}
                        />
                        <select className="w-full p-2.5 border rounded-lg bg-white outline-none text-sm font-medium" value={filterBulan} onChange={(e) => setFilterBulan(e.target.value)}>
                            <option value="">Semua Bulan</option>
                            {bulanOptions.map((b, idx) => <option key={idx} value={b}>{b}</option>)}
                        </select>
                        <select className="w-full p-2.5 border rounded-lg bg-white outline-none text-sm font-medium" value={filterKelas} onChange={(e) => setFilterKelas(e.target.value)}>
                            <option value="">Semua Kelas</option>
                            {kelasOptions.map((k, idx) => <option key={idx} value={k}>{k}</option>)}
                        </select>
                        <select className="w-full p-2.5 border rounded-lg bg-white outline-none text-sm font-medium" value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)}>
                            <option value="">Semua Status</option>
                            <option value="MENUNGGU">Menunggu</option>
                            <option value="DISETUJUI">Disetujui</option>
                            <option value="DITOLAK">Ditolak</option>
                            <option value="SELESAI">Selesai</option>
                        </select>
                    </div>

                    <div className="text-sm text-gray-500">
                        Menampilkan <span className="font-bold text-emerald-600">{sortedPermits.length}</span> dari {permits.length} perizinan
                    </div>

                    <Card className="overflow-x-auto p-0">
                        <table className="w-full text-left border-collapse text-sm whitespace-nowrap">
                            <thead>
                                <tr className="bg-emerald-50 text-emerald-800 border-b">
                                    <th className="p-4 cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('tanggal_izin')}>
                                        Tgl Izin <SortIcon columnKey="tanggal_izin" />
                                    </th>
                                    <th className="p-4 cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('nama_santri')}>
                                        Santri <SortIcon columnKey="nama_santri" />
                                    </th>
                                    <th className="p-4 cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('kelas')}>
                                        Kelas <SortIcon columnKey="kelas" />
                                    </th>
                                    <th className="p-4 cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('keperluan')}>
                                        Keperluan <SortIcon columnKey="keperluan" />
                                    </th>
                                    <th className="p-4 cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('wali_safar')}>
                                        Wali Safar <SortIcon columnKey="wali_safar" />
                                    </th>
                                    <th className="p-4 cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('status_jadwal')}>
                                        Status Jadwal <SortIcon columnKey="status_jadwal" />
                                    </th>
                                    <th className="p-4 cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('status_pengajuan')}>
                                        Status Approval <SortIcon columnKey="status_pengajuan" />
                                    </th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {loading ? <tr><td colSpan="7" className="p-8 text-center text-gray-500">Memuat data...</td></tr> : 
                                 sortedPermits.length === 0 ? <tr><td colSpan="7" className="p-8 text-center text-gray-500">Tidak ada data perizinan.</td></tr> :
                                 
                                 // PERHATIKAN: Sekarang kita me-mapping 'sortedPermits', bukan 'filteredPermits' lagi
                                 sortedPermits.map((p, idx) => (
                                    <tr key={idx} className="hover:bg-gray-50">
                                        <td className="p-4">{p.tanggal_izin}</td>
                                        <td className="p-4 font-bold text-gray-800">{p.nama_santri}</td>
                                        <td className="p-4 font-medium text-emerald-600">{p.kelas}</td>
                                        <td className="p-4 truncate max-w-[150px]" title={p.keperluan}>{p.keperluan || '-'}</td>
                                        <td className="p-4">{p.wali_safar} <span className="text-xs text-gray-500">({p.hubungan_wali})</span></td>
                                        <td className="p-4">
                                            <span className={`px-2 py-1 text-[10px] font-bold rounded-full ${p.status_jadwal === 'Sesuai Jadwal' ? 'bg-blue-100 text-blue-700' : 'bg-red-100 text-red-700'}`}>
                                                {p.status_jadwal ? p.status_jadwal.toUpperCase() : 'TIDAK DIKETAHUI'}
                                            </span>
                                        </td>
                                        <td className="p-4">
                                            <span className={`px-2 py-1 text-xs font-bold rounded-full border ${
                                                p.status_pengajuan === 'DISETUJUI' ? 'bg-emerald-100 text-emerald-800 border-emerald-200' :
                                                p.status_pengajuan === 'DITOLAK' ? 'bg-red-100 text-red-800 border-red-200' :
                                                p.status_pengajuan === 'SELESAI' ? 'bg-gray-100 text-gray-800 border-gray-200' :

                                            }`}>
                                                {p.status_pengajuan ? p.status_pengajuan.replace('_', ' ') : '-'}
                                            </span>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </Card>
                </div>
            );
        };
