</head>
<body class="h-full text-slate-800 antialiased">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const STORAGE_KEY = 'al_islam_perizinan_db_v2.0';
        
        const initialDB = {
            academicYears: [
                { id: 'ay_2026', name: '2026/2027', active: true },
                { id: 'ay_2025', name: '2025/2026', active: false }
            ],
            classes: [
                { id: 'cls_smp1_l', name: 'VII A (SMP Putra)', level: 'SMP', gender: 'Laki-laki', academic_year_id: 'ay_2026' },
                { id: 'cls_smp1_p', name: 'VII B (SMP Putri)', level: 'SMP', gender: 'Perempuan', academic_year_id: 'ay_2026' },
                { id: 'cls_sma1_l', name: 'X A (SMA Putra)', level: 'SMA', gender: 'Laki-laki', academic_year_id: 'ay_2026' },
                { id: 'cls_sma1_p', name: 'X B (SMA Putri)', level: 'SMA', gender: 'Perempuan', academic_year_id: 'ay_2026' }
            ],
            users: [
                { user_id: 'usr_admin', username: 'admin', nama: 'Ustadz Admin', role: 'ADMIN', jenjang: '', kelas_id: '', status: 'Aktif' },
                { user_id: 'usr_wk_smp_l', username: 'wk_smp_l', nama: 'Ustadz Ahmad (Wali Kelas VII A)', role: 'WALI_KELAS', jenjang: 'SMP', kelas_id: 'cls_smp1_l', status: 'Aktif' },
                { user_id: 'usr_wk_smp_p', username: 'wk_smp_p', nama: 'Ustadzah Fatimah (Wali Kelas VII B)', role: 'WALI_KELAS', jenjang: 'SMP', kelas_id: 'cls_smp1_p', status: 'Aktif' },
                { user_id: 'usr_sek', username: 'sekretaris', nama: 'K.H. Abdullah (Sekretaris Mudir)', role: 'SEKRETARIS_MUDIR', jenjang: '', kelas_id: '', status: 'Aktif' },
                { user_id: 'usr_sec', username: 'security', nama: 'Komandan Pos (Security)', role: 'SECURITY', jenjang: '', kelas_id: '', status: 'Aktif' }
            ],
            santri: [
                { santri_id: 'san_001', nama_santri: 'Muhammad Farel Al-Fatih', jenis_kelamin: 'Laki-laki', jenjang: 'SMP', kelas_id: 'cls_smp1_l', kota_asal: 'Bandung', nama_ayah: 'Budi Santoso', nomor_telepon: '081234567890', status_santri: 'Aktif' },
                { santri_id: 'san_002', nama_santri: 'Zaidan Zulfikar', jenis_kelamin: 'Laki-laki', jenjang: 'SMP', kelas_id: 'cls_smp1_l', kota_asal: 'Jakarta', nama_ayah: 'Zulfikar Ali', nomor_telepon: '081298765432', status_santri: 'Aktif' },
                { santri_id: 'san_003', nama_santri: 'Aisha Humairah', jenis_kelamin: 'Perempuan', jenjang: 'SMP', kelas_id: 'cls_smp1_p', kota_asal: 'Bogor', nama_ayah: 'Ibrahimovic', nomor_telepon: '081345678901', status_santri: 'Aktif' },
                { santri_id: 'san_004', nama_santri: 'Raihan Pratama', jenis_kelamin: 'Laki-laki', jenjang: 'SMA', kelas_id: 'cls_sma1_l', kota_asal: 'Garut', nama_ayah: 'Pratama Surya', nomor_telepon: '082123456789', status_santri: 'Aktif' }
            ],
            schedules: [
                { id: 'sch_1', pekan: 'Pekan 1', jenjang: 'SMP', gender: 'Laki-laki', hari: 'Jumat', jam_resmi: '08.00–16.00', tanggal_berikutnya: '2026-09-04' },
                { id: 'sch_2', pekan: 'Pekan 2', jenjang: 'SMP', gender: 'Perempuan', hari: 'Jumat', jam_resmi: '08.00–16.00', tanggal_berikutnya: '2026-09-11' },
                { id: 'sch_3', pekan: 'Pekan 3', jenjang: 'SMA', gender: 'Laki-laki', hari: 'Jumat', jam_resmi: '08.00–16.00', tanggal_berikutnya: '2026-09-18' },
                { id: 'sch_4', pekan: 'Pekan 4', jenjang: 'SMA', gender: 'Perempuan', hari: 'Jumat', jam_resmi: '08.00–16.00', tanggal_berikutnya: '2026-09-25' }
            ],
            permits: [
                {
                    permit_id: 'prm_001',
                    santri_id: 'san_001',
                    wali_kelas_id: 'usr_wk_smp_l',
                    tahun_pelajaran_id: 'ay_2026',
                    tanggal_izin: '2026-09-04',
                    pekan: 'Pekan 1',
                    keperluan: 'Menghadiri acara pernikahan keluarga inti di luar kota.',
                    tujuan: 'Bandung',
                    wali_safar: 'Budi Santoso',
                    hubungan_wali: 'Ayah',
                    hubungan_lainnya: '',
                    status_jadwal: 'SESUAI JADWAL',
                    keterangan_luar_jadwal: '',
                    ikut_jadwal_saudara: false,
                    saudara_santri_id: '',
                    status_pengajuan: 'DISETUJUI',
                    alasan_penolakan: '',
                    approved_by: 'usr_sek',
                    approved_at: '2026-09-02T10:00:00Z',
                    qr_token: 'QR-TOKEN-ALISLAM-9988776655',
                    qr_created_at: '2026-09-02T10:00:00Z',
                    qr_expired_at: '2026-09-04T23:59:59Z',
                    created_at: '2026-09-02T09:30:00Z',
                    updated_at: '2026-09-02T10:00:00Z'
                }
            ],
            scanLogs: [
                {
                    scan_id: 'scn_001',
                    permit_id: 'prm_001',
                    santri_id: 'san_001',
                    scan_type: 'EXIT',
                    scan_time: '2026-09-04T08:35:00Z',
                    security_id: 'usr_sec',
                    scan_status: 'SUCCESS',
                    device_info: 'Mobile Android Scanner',
                    keterangan: 'Keluar tepat waktu'
                }
            ],
            auditLogs: [
                { audit_id: 'aud_001', user_id: 'usr_admin', action: 'CREATE_SYSTEM_INIT', description: 'Inisialisasi sistem database awal', timestamp: '2026-09-01T08:00:00Z' }
            ],
            settings: {
                jam_mulai: '08.00',
                jam_selesai_resmi: '16.00',
                batas_toleransi: '16.30',
                nama_pesantren: 'Pondok Pesantren Modern Al-Islam'
            }
        };

        const getDB = () => {
            const data = localStorage.getItem(STORAGE_KEY);
            if (!data) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(initialDB));
                return initialDB;
            }
            try {
                return JSON.parse(data);
            } catch(e) {
                return initialDB;
            }
        };

        const saveDB = (db) => {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        };

        const callBackendAPI = async (action, payload = {}) => {
            await new Promise(resolve => setTimeout(resolve, 300));
            const db = getDB();

            switch(action) {
                case 'login': {
                    const user = db.users.find(u => u.username === payload.username && u.status === 'Aktif');
                    if (!user) return { success: false, message: 'Username tidak ditemukan atau akun non-aktif.' };
                    return { success: true, message: 'Login berhasil', data: { user, token: 'mock-session-token-' + user.user_id } };
                }
                case 'getDashboardData': {
                    const { role, userId } = payload;
                    const activeYear = db.academicYears.find(y => y.active) || db.academicYears[0];
                    
                    let permits = db.permits;
                    if (role === 'WALI_KELAS') {
                        const wkUser = db.users.find(u => u.user_id === userId);
                        const classSantriIds = db.santri.filter(s => s.kelas_id === wkUser.kelas_id).map(s => s.santri_id);
                        permits = db.permits.filter(p => classSantriIds.includes(p.santri_id));
                    }

                    const stats = {
                        total_izin: permits.length,
                        menunggu: permits.filter(p => p.status_pengajuan === 'MENUNGGU APPROVAL').length,
                        disetujui: permits.filter(p => p.status_pengajuan === 'DISETUJUI').length,
                        ditolak: permits.filter(p => p.status_pengajuan === 'DITOLAK').length,
                        sudah_keluar: 0,
                        sudah_kembali: 0,
                        masih_di_luar: 0,
                        terlambat: 0
                    };

                    permits.forEach(p => {
                        const logs = db.scanLogs.filter(l => l.permit_id === p.permit_id);
                        const hasExit = logs.some(l => l.scan_type === 'EXIT' && l.scan_status === 'SUCCESS');
                        const hasReturn = logs.some(l => l.scan_type === 'RETURN' && l.scan_status === 'SUCCESS');
                        if (hasExit) stats.sudah_keluar++;
                        if (hasReturn) stats.sudah_kembali++;
                        if (hasExit && !hasReturn) stats.masih_di_luar++;
                        
                        const returnLog = logs.find(l => l.scan_type === 'RETURN' && l.scan_status === 'SUCCESS');
                        if (returnLog && returnLog.keterangan && returnLog.keterangan.includes('TERLAMBAT')) {
                            stats.terlambat++;
                        }
                    });

                    return { success: true, data: { stats, permits, activeYear, schedules: db.schedules } };
                }
                case 'createPermit': {
                    const newId = 'prm_' + Date.now();
                    const schedule = db.schedules[0];
                    const newPermit = {
                        permit_id: newId,
                        santri_id: payload.santri_id,
                        wali_kelas_id: payload.wali_kelas_id,
                        tahun_pelajaran_id: (db.academicYears.find(y => y.active) || {}).id || 'ay_2026',
                        tanggal_izin: schedule ? schedule.tanggal_berikutnya : '2026-09-04',
                        pekan: schedule ? schedule.pekan : 'Pekan 1',
                        keperluan: payload.keperluan,
                        tujuan: payload.tujuan,
                        wali_safar: payload.wali_safar,
                        hubungan_wali: payload.hubungan_wali,
                        hubungan_lainnya: payload.hubungan_lainnya || '',
                        status_jadwal: payload.status_jadwal || 'SESUAI JADWAL',
                        keterangan_luar_jadwal: payload.keterangan_luar_jadwal || '',
                        ikut_jadwal_saudara: payload.ikut_jadwal_saudara || false,
                        saudara_santri_id: payload.saudara_santri_id || '',
                        status_pengajuan: 'MENUNGGU APPROVAL',
                        alasan_penolakan: '',
                        approved_by: '',
                        approved_at: '',
                        qr_token: '',
                        qr_created_at: '',
                        qr_expired_at: '',
                        created_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    };
                    db.permits.unshift(newPermit);
                    db.auditLogs.unshift({
                        audit_id: 'aud_' + Date.now(),
                        user_id: payload.wali_kelas_id,
                        action: 'CREATE_PERMIT',
                        description: `Membuat pengajuan izin untuk santri ID: ${payload.santri_id}`,
                        timestamp: new Date().toISOString()
                    });
                    saveDB(db);
                    return { success: true, message: 'Pengajuan izin berhasil dikirim ke Sekretaris Mudir.', data: newPermit };
                }
                case 'approvePermit': {
                    const permit = db.permits.find(p => p.permit_id === payload.permit_id);
                    if (!permit) return { success: false, message: 'Data izin tidak ditemukan.' };
                    permit.status_pengajuan = 'DISETUJUI';
                    permit.approved_by = payload.admin_id;
                    permit.approved_at = new Date().toISOString();
                    permit.qr_token = 'QR-' + Math.random().toString(36).substring(2, 10).toUpperCase() + '-' + Date.now();
                    permit.qr_created_at = new Date().toISOString();
                    permit.qr_expired_at = permit.tanggal_izin + 'T23:59:59Z';
                    permit.updated_at = new Date().toISOString();

                    db.auditLogs.unshift({
                        audit_id: 'aud_' + Date.now(),
                        user_id: payload.admin_id,
                        action: 'APPROVE_PERMIT',
                        description: `Menyetujui izin permit ID: ${permit.permit_id}`,
                        timestamp: new Date().toISOString()
                    });
                    saveDB(db);
                    return { success: true, message: 'Izin berhasil disetujui dan QR Code diterbitkan.', data: permit };
                }
                case 'rejectPermit': {
                    const permit = db.permits.find(p => p.permit_id === payload.permit_id);
                    if (!permit) return { success: false, message: 'Data izin tidak ditemukan.' };
                    permit.status_pengajuan = 'DITOLAK';
                    permit.alasan_penolakan = payload.alasan_penolakan;
                    permit.approved_by = payload.admin_id;
                    permit.approved_at = new Date().toISOString();
                    permit.updated_at = new Date().toISOString();

                    db.auditLogs.unshift({
                        audit_id: 'aud_' + Date.now(),
                        user_id: payload.admin_id,
                        action: 'REJECT_PERMIT',
                        description: `Menolak izin permit ID: ${permit.permit_id}. Alasan: ${payload.alasan_penolakan}`,
                        timestamp: new Date().toISOString()
                    });
                    saveDB(db);
                    return { success: true, message: 'Izin telah ditolak.', data: permit };
                }
                case 'scanQR': {
                    const { qr_token, security_id } = payload;
                    const permit = db.permits.find(p => p.qr_token === qr_token);
                    if (!permit) {
                        return { success: false, code: 'QR_NOT_FOUND', message: 'QR Code tidak valid atau tidak dikenali dalam sistem.' };
                    }
                    if (permit.status_pengajuan !== 'DISETUJUI') {
                        return { success: false, code: 'QR_NOT_APPROVED', message: 'Izin ini belum disetujui oleh Sekretaris Mudir.' };
                    }

                    const existingLogs = db.scanLogs.filter(l => l.permit_id === permit.permit_id && l.scan_status === 'SUCCESS');
                    const exitLog = existingLogs.find(l => l.scan_type === 'EXIT');
                    const returnLog = existingLogs.find(l => l.scan_type === 'RETURN');

                    const now = new Date();
                    const nowISO = now.toISOString();

                    if (!exitLog) {
                        const newScan = {
                            scan_id: 'scn_' + Date.now(),
                            permit_id: permit.permit_id,
                            santri_id: permit.santri_id,
                            scan_type: 'EXIT',
                            scan_time: nowISO,
                            security_id: security_id,
                            scan_status: 'SUCCESS',
                            device_info: 'Mobile Camera Scanner',
                            keterangan: 'Keluar Pondok (Scan Pertama)'
                        };
                        db.scanLogs.unshift(newScan);
                        db.auditLogs.unshift({
                            audit_id: 'aud_' + Date.now(),
                            user_id: security_id,
                            action: 'SCAN_EXIT',
                            description: `Scan EXIT berhasil untuk permit ID: ${permit.permit_id}`,
                            timestamp: nowISO
                        });
                        saveDB(db);
                        const santriInfo = db.santri.find(s => s.santri_id === permit.santri_id);
                        return { 
                            success: true, 
                            type: 'EXIT', 
                            message: `EXIT BERHASIL: ${santriInfo ? santriInfo.nama_santri : 'Santri'} diizinkan keluar pondok.`,
                            data: { permit, santri: santriInfo, scan_time: nowISO }
                        };
                    } else if (!returnLog) {
                        const hours = now.getHours();
                        const minutes = now.getMinutes();
                        const totalMinutes = hours * 60 + minutes;
                        const limitStandard = 16 * 60;
                        const limitTolerance = 16 * 60 + 30;

                        let statusKembali = 'TEPAT WAKTU';
                        if (totalMinutes > limitStandard && totalMinutes <= limitTolerance) {
                            statusKembali = 'TERLAMBAT KEMBALI - DALAM TOLERANSI';
                        } else if (totalMinutes > limitTolerance) {
                            statusKembali = 'TERLAMBAT KEMBALI - MELEWATI TOLERANSI';
                        }

                        const newScan = {
                            scan_id: 'scn_' + Date.now(),
                            permit_id: permit.permit_id,
                            santri_id: permit.santri_id,
                            scan_type: 'RETURN',
                            scan_time: nowISO,
                            security_id: security_id,
                            scan_status: 'SUCCESS',
                            device_info: 'Mobile Camera Scanner',
                            keterangan: statusKembali
                        };
                        db.scanLogs.unshift(newScan);
                        db.auditLogs.unshift({
                            audit_id: 'aud_' + Date.now(),
                            user_id: security_id,
                            action: 'SCAN_RETURN',
                            description: `Scan RETURN (${statusKembali}) untuk permit ID: ${permit.permit_id}`,
                            timestamp: nowISO
                        });
                        saveDB(db);
                        const santriInfo = db.santri.find(s => s.santri_id === permit.santri_id);
                        return {
                            success: true,
                            type: 'RETURN',
                            message: `KEMBALI DICATAT: ${statusKembali}`,
                            data: { permit, santri: santriInfo, scan_time: nowISO, statusKembali }
                        };
                    } else {
                        return { 
                            success: false, 
                            code: 'QR_ALREADY_COMPLETED', 
                            message: 'QR sudah selesai digunakan. QR hanya dapat digunakan 2 kali (Exit & Return).' 
                        };
                    }
                }
                case 'promoteStudents': {
                    const { from_year, to_year } = payload;
                    db.classes.forEach(cls => {
                        if (cls.name.startsWith('VII')) cls.name = cls.name.replace('VII', 'VIII');
                        else if (cls.name.startsWith('VIII')) cls.name = cls.name.replace('VIII', 'IX');
                        else if (cls.name.startsWith('X ')) cls.name = cls.name.replace('X ', 'XI ');
                        else if (cls.name.startsWith('XI ')) cls.name = cls.name.replace('XI ', 'XII ');
                    });
                    db.academicYears.forEach(y => {
                        if (y.id === to_year) y.active = true;
                        else y.active = false;
                    });
                    db.auditLogs.unshift({
                        audit_id: 'aud_' + Date.now(),
                        user_id: 'usr_admin',
                        action: 'PROMOTE_STUDENT',
                        description: `Kenaikan kelas berhasil diproses dari ${from_year} ke ${to_year}`,
                        timestamp: new Date().toISOString()
                    });
                    saveDB(db);
                    return { success: true, message: 'Proses kenaikan kelas berhasil dijalankan.' };
                }
                case 'createSantri': {
                    const newSantri = {
                        santri_id: 'san_' + Date.now(),
                        nama_santri: payload.nama_santri,
                        jenis_kelamin: payload.jenis_kelamin,
                        jenjang: payload.jenjang,
                        kelas_id: payload.kelas_id,
                        kota_asal: payload.kota_asal,
                        nama_ayah: payload.nama_ayah,
                        nomor_telepon: payload.nomor_telepon,
                        status_santri: 'Aktif'
                    };
                    db.santri.push(newSantri);
                    saveDB(db);
                    return { success: true, message: 'Data santri berhasil ditambahkan.', data: newSantri };
                }
                default:
                    return { success: false, message: 'Action tidak dikenal.' };
            }
        };

        function App() {
            const [currentUser, setCurrentUser] = React.useState(null);
            const [currentView, setCurrentView] = React.useState('login');
            const [loading, setLoading] = React.useState(false);
            const [toast, setToast] = React.useState(null);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            const handleLogin = async (username, password) => {
                setLoading(true);
                const res = await callBackendAPI('login', { username, password });
                setLoading(false);
                if (res.success) {
                    setCurrentUser(res.data.user);
                    setCurrentView('dashboard');
                    showToast(`Selamat datang, ${res.data.user.nama}`);
                } else {
                    showToast(res.message, 'error');
                }
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setCurrentView('login');
                showToast('Anda telah keluar dari sistem.');
            };

            if (!currentUser || currentView === 'login') {
                return <LoginScreen onLogin={handleLogin} loading={loading} toast={toast} />;
            }

            return (
                <div className="h-full flex flex-col bg-slate-50">
                    <header className="bg-emerald-800 text-white shadow-md sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <div className="bg-white p-2 rounded-lg text-emerald-800 font-bold text-lg shadow">
                                    <i className="fa-solid fa-mosque"></i>
                                </div>
                                <div>
                                    <h1 className="font-bold text-base md:text-lg leading-tight">Pesantren Modern Al-Islam</h1>
                                    <p className="text-xs text-emerald-200">Sistem Management Perizinan Keluar Santri</p>
                                </div>
                            </div>
                            <div className="flex items-center space-x-4">
                                <div className="hidden md:block text-right">
                                    <p className="text-sm font-semibold">{currentUser.nama}</p>
                                    <span className="inline-block bg-emerald-700 text-emerald-100 text-xs px-2 py-0.5 rounded-full uppercase tracking-wide">
                                        {currentUser.role.replace('_', ' ')}
                                    </span>
                                </div>
                                <button onClick={handleLogout} className="bg-emerald-700 hover:bg-emerald-600 text-white px-3 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-1">
                                    <i className="fa-solid fa-right-from-bracket"></i>
                                    <span className="hidden sm:inline">Keluar</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {toast && (

                            <div>
                                <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                                <input 
                                    type="password"

                                    onChange={e => setPassword(e.target.value)} 
                                    className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm"

                                <button onClick={() => fillDemo('sekretaris')} className="text-xs bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 p-2 rounded-lg font-medium text-slate-700 border">Sekretaris Mudir</button>
                                <button onClick={() => fillDemo('security')} className="text-xs bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 p-2 rounded-lg font-medium text-slate-700 border">Security</button>
                                <button onClick={() => fillDemo('wk_smp_l')} className="text-xs bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 p-2 rounded-lg font-medium text-slate-700 border">Wali Kelas</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function AdminModule({ currentUser, showToast }) {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [dashboardData, setDashboardData] = React.useState(null);
            const [loading, setLoading] = React.useState(true);

            const loadData = async () => {
                setLoading(true);
                const res = await callBackendAPI('getDashboardData', { role: currentUser.role, userId: currentUser.user_id });
                if (res.success) setDashboardData(res.data);
                setLoading(false);
            };

            React.useEffect(() => {
                loadData();
            }, []);

            const handlePromote = async () => {
                if (window.confirm('Jalankan proses kenaikan kelas massal tahun pelajaran?')) {
                    const res = await callBackendAPI('promoteStudents', { from_year: 'ay_2025', to_year: 'ay_2026' });
                    if (res.success) {
                        showToast(res.message);
                        loadData();
                    } else {
                        showToast(res.message, 'error');
                    }
                }

            if (loading || !dashboardData) {
                return <div className="text-center py-12"><i className="fa-solid fa-spinner animate-spin text-2xl text-emerald-600"></i><p className="text-sm text-slate-500 mt-2">Memuat dashboard admin...</p></div>;
            }

            const stats = dashboardData.stats;

            return (

                        <button onClick={() => setActiveTab('master')} className={`px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap transition ${activeTab === 'master' ? 'bg-emerald-600 text-white shadow' : 'bg-white text-slate-600 hover:bg-slate-100'}`}>Master Data Santri & Kelas</button>
                        <button onClick={() => setActiveTab('audit')} className={`px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap transition ${activeTab === 'audit' ? 'bg-emerald-600 text-white shadow' : 'bg-white text-slate-600 hover:bg-slate-100'}`}>Audit Log & Keamanan</button>

                                </div>
                                <div className="bg-white p-5 rounded-2xl shadow border-l-4 border-blue-500">
                                    <p className="text-xs text-slate-500 uppercase font-semibold">Disetujui</p>

                                </div>
                                <div className="bg-white p-5 rounded-2xl shadow border-l-4 border-rose-500">
                                    <p className="text-xs text-slate-500 uppercase font-semibold">Terlambat Kembali</p>
                                    <h3 className="text-2xl font-bold text-slate-800 mt-1">{stats.terlambat}</h3>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">

                                        <span className="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full">Tahun: {dashboardData.activeYear.name}</span>
                                    </h3>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm">
                                            <thead>
                                                <tr className="border-b bg-slate-50 text-slate-600 font-semibold text-xs uppercase">
                                                    <th className="p-3">Permit ID</th>
                                                    <th className="p-3">Tanggal</th>
                                                    <th className="p-3">Keperluan</th>
                                                    <th className="p-3">Wali Safar</th>
                                                    <th className="p-3">Status</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {dashboardData.permits.map(p => (
                                                    <tr key={p.permit_id} className="border-b hover:bg-slate-50">
                                                        <td className="p-3 font-medium text-emerald-700">{p.permit_id}</td>
                                                        <td className="p-3 text-slate-600">{p.tanggal_izin}</td>
                                                        <td className="p-3 truncate max-w-xs">{p.keperluan}</td>

                                                        <td className="p-3">
                                                            <span className={`px-2 py-1 rounded-full text-xs font-semibold ${p.status_pengajuan === 'DISETUJUI' ? 'bg-emerald-100 text-emerald-800' : p.status_pengajuan === 'DITOLAK' ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-800'}`}>
                                                                {p.status_pengajuan}
                                                            </span>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                <div className="bg-white p-6 rounded-2xl shadow space-y-4">
                                    <h3 className="font-bold text-slate-800">Jadwal Perizinan Aktif</h3>
                                    <div className="space-y-3">
                                        {dashboardData.schedules.map(s => (
                                            <div key={s.id} className="p-3 rounded-xl bg-slate-50 border text-sm">
                                                <div className="flex justify-between font-semibold text-slate-800">
                                                    <span>{s.pekan}</span>
                                                    <span className="text-emerald-700">{s.jenjang} - {s.gender}</span>
                                                </div>
                                                <p className="text-xs text-slate-500 mt-1">{s.hari}, {s.jam_resmi} | {s.tanggal_berikutnya}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeTab === 'promosi' && (
                        <div className="bg-white p-6 rounded-2xl shadow space-y-4">
                            <h3 className="font-bold text-slate-800 text-lg">Proses Kenaikan Kelas Santri</h3>
                            <p className="text-sm text-slate-600">
                                Fitur ini mengelola kenaikan tingkat santri secara otomatis (VII→VIII, VIII→IX, X→XI, XI→XII) ke tahun pelajaran aktif berikutnya tanpa menghapus histori kelas sebelumnya.
                            </p>
                            <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-xl text-emerald-800 text-sm flex items-center justify-between">
                                <div>
                                    <p className="font-semibold">Tahun Pelajaran Aktif: {dashboardData.activeYear.name}</p>
                                    <p className="text-xs mt-0.5">Semua data santri dan histori perizinan aman tersimpan.</p>
                                </div>
                                <button onClick={handlePromote} className="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-xl text-sm transition shadow">
                                    Jalankan Kenaikan Kelas
                                </button>
                            </div>
                        </div>
                    )}

                    {activeTab === 'master' && (
                        <div className="bg-white p-6 rounded-2xl shadow space-y-4">
                            <h3 className="font-bold text-slate-800 text-lg">Master Data Santri & Rombel Kelas</h3>
                            <p className="text-sm text-slate-600">Kelola database santri, kelas, dan akun pengguna secara terpusat melalui backend.</p>
                            <div className="overflow-x-auto mt-2">
                                <table className="w-full text-left text-sm">
                                    <thead>
                                        <tr className="border-b bg-slate-50 text-slate-600 font-semibold text-xs uppercase">
                                            <th className="p-3">Nama Santri</th>
                                            <th className="p-3">Jenjang</th>
                                            <th className="p-3">Kota Asal</th>
                                            <th className="p-3">Nama Ayah</th>
                                            <th className="p-3">Telepon</th>
                                            <th className="p-3">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {getDB().santri.map(s => (
                                            <tr key={s.santri_id} className="border-b hover:bg-slate-50">
                                                <td className="p-3 font-medium text-slate-800">{s.nama_santri}</td>
                                                <td className="p-3 text-slate-600">{s.jenjang}</td>
                                                <td className="p-3">{s.kota_asal}</td>
                                                <td className="p-3">{s.nama_ayah}</td>
                                                <td className="p-3">{s.nomor_telepon}</td>
                                                <td className="p-3"><span className="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-full text-xs">{s.status_santri}</span></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {activeTab === 'audit' && (
                        <div className="bg-white p-6 rounded-2xl shadow space-y-4">
                            <h3 className="font-bold text-slate-800 text-lg">Audit Log Sistem</h3>
                            <p className="text-sm text-slate-600">Catatan aktivitas penting pengguna, login, approval, dan pemindaian QR.</p>
                            <div className="space-y-2 mt-2">
                                {getDB().auditLogs.map(a => (
                                    <div key={a.audit_id} className="p-3 bg-slate-50 rounded-xl border text-xs flex justify-between items-center">
                                        <div>
                                            <span className="font-semibold text-emerald-700 mr-2">[{a.action}]</span>
                                            <span className="text-slate-800">{a.description}</span>

                                        <span className="text-slate-400">{new Date(a.timestamp).toLocaleString()}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function WaliKelasModule({ currentUser, showToast }) {
            const [activeTab, setActiveTab] = React.useState('ajukan');
            const [dashboardData, setDashboardData] = React.useState(null);
            const [loading, setLoading] = React.useState(true);

            const [selectedSantriId, setSelectedSantriId] = React.useState('');
            const [keperluan, setKeperluan] = React.useState('');
            const [tujuan, setTujuan] = React.useState('');
            const [waliSafar, setWaliSafar] = React.useState('');
            const [hubunganWali, setHubunganWali] = React.useState('Ayah');
            const [hubunganLainnya, setHubunganLainnya] = React.useState('');
            const [statusJadwal, setStatusJadwal] = React.useState('SESUAI JADWAL');
            const [keteranganLuar, setKeteranganLuar] = React.useState('');
            const [ikutSaudara, setIkutSaudara] = React.useState(false);
            const [saudaraId, setSaudaraId] = React.useState('');

            const loadData = async () => {
                setLoading(true);
                const res = await callBackendAPI('getDashboardData', { role: currentUser.role, userId: currentUser.user_id });
                if (res.success) setDashboardData(res.data);
                setLoading(false);
            };

            React.useEffect(() => {
                loadData();
            }, []);

            const db = getDB();
            const classSantriList = db.santri.filter(s => s.kelas_id === currentUser.kelas_id);

            const handleSubmitPermit = async (e) => {
                e.preventDefault();
                if (!selectedSantriId || !keperluan || !tujuan || !waliSafar) {
                    showToast('Harap lengkapi field wajib pada form pengajuan.', 'error');
                    return;
                }
                const payload = {
                    santri_id: selectedSantriId,
                    wali_kelas_id: currentUser.user_id,
                    keperluan,
                    tujuan,
                    wali_safar: waliSafar,
                    hubungan_wali: hubunganWali,
                    hubungan_lainnya: hubunganWali === 'Lainnya' ? hubunganLainnya : '',
                    status_jadwal: statusJadwal,
                    keterangan_luar_jadwal: statusJadwal === 'DI LUAR JADWAL' ? keteranganLuar : '',
                    ikut_jadwal_saudara: ikutSaudara,
                    saudara_santri_id: ikutSaudara ? saudaraId : ''
                };
                const res = await callBackendAPI('createPermit', payload);
                if (res.success) {
                    showToast(res.message);
                    setKeperluan('');
                    setTujuan('');
                    setWaliSafar('');
                    loadData();
                    setActiveTab('histori');
                } else {
                    showToast(res.message, 'error');
                }
            };

            if (loading || !dashboardData) {
                return <div className="text-center py-12"><i className="fa-solid fa-spinner animate-spin text-2xl text-emerald-600"></i><p className="text-sm text-slate-500 mt-2">Memuat data kelas wali...</p></div>;
            }

            return (
                <div className="space-y-6">
                    <div className="flex space-x-2 border-b overflow-x-auto pb-2">
                        <button onClick={() => setActiveTab('ajukan')} className={`px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap transition ${activeTab === 'ajukan' ? 'bg-emerald-600 text-white shadow' : 'bg-white text-slate-600 hover:bg-slate-100'}`}>Form Pengajuan Izin</button>
                        <button onClick={() => setActiveTab('histori')} className={`px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap transition ${activeTab === 'histori' ? 'bg-emerald-600 text-white shadow' : 'bg-white text-slate-600 hover:bg-slate-100'}`}>Histori & Status Kelas</button>
                    </div>

                    {activeTab === 'ajukan' && (
                        <div className="bg-white p-6 rounded-2xl shadow max-w-2xl mx-auto">
                            <h3 className="font-bold text-slate-800 text-lg mb-2">Formulir Pengajuan Izin Keluar Santri</h3>
                            <p className="text-xs text-slate-500 mb-6">Tanggal izin otomatis diatur oleh sistem berdasarkan jadwal Jumat aktif.</p>
                            
                            <form onSubmit={handleSubmitPermit} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Pilih Santri Kelas</label>
                                    <select 
                                        value={selectedSantriId} 
                                        onChange={e => setSelectedSantriId(e.target.value)} 
                                        required 
                                        className="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 text-sm"
                                    >
                                        <option value="">-- Pilih Santri --</option>
                                        {classSantriList.map(s => (
                                            <option key={s.santri_id} value={s.santri_id}>{s.nama_santri} ({s.kota_asal})</option>
                                        ))}
                                    </select>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Keperluan Izin</label>
                                        <input 
                                            type="text" 
                                            value={keperluan} 
                                            onChange={e => setKeperluan(e.target.value)} 
                                            required 
                                            placeholder="contoh: Menghadiri pernikahan keluarga"
                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 text-sm"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Tujuan (Kota/Tempat)</label>
                                        <input 
                                            type="text" 
                                            value={tujuan} 
                                            onChange={e => setTujuan(e.target.value)} 
                                            required 
                                            placeholder="contoh: Bandung"
                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 text-sm"
                                        />
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nama Wali Safar</label>
                                        <input 
                                            type="text" 
                                            value={waliSafar} 
                                            onChange={e => setWaliSafar(e.target.value)} 
                                            required 
                                            placeholder="Nama lengkap penjemput"
                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 text-sm"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Hubungan Wali Safar</label>
                                        <select 
                                            value={hubunganWali} 
                                            onChange={e => setHubunganWali(e.target.value)} 
                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 text-sm"
                                        >
                                            <option value="Ayah">Ayah</option>
                                            <option value="Ibu">Ibu</option>
                                            <option value="Kakak Kandung">Kakak Kandung</option>
                                            <option value="Adik Kandung">Adik Kandung</option>
                                            <option value="Kakek">Kakek</option>
                                            <option value="Nenek">Nenek</option>
                                            <option value="Paman">Paman</option>
                                            <option value="Bibi">Bibi</option>
                                            <option value="Lainnya">Lainnya</option>
                                        </select>
                                    </div>
                                </div>

                                {hubunganWali === 'Lainnya' && (
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Sebutkan Hubungan Lainnya</label>
                                        <input 
                                            type="text" 
                                            value={hubunganLainnya} 
                                            onChange={e => setHubunganLainnya(e.target.value)} 
                                            required 
                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 text-sm"
                                        />
                                    </div>
                                )}

                                <div className="p-4 bg-slate-50 rounded-xl border space-y-3">
                                    <div className="flex items-center space-x-2">
                                        <input 
                                            type="checkbox" 
                                            id="ikutSaudara" 
                                            checked={ikutSaudara} 
                                            onChange={e => setIkutSaudara(e.target.checked)} 
                                            className="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500"
                                        />
                                        <label htmlFor="ikutSaudara" className="text-sm font-medium text-slate-700">Mengikuti Jadwal Kakak / Adik Santri</label>
                                    </div>
                                    {ikutSaudara && (
                                        <select 
                                            value={saudaraId} 
                                            onChange={e => setSaudaraId(e.target.value)} 
                                            className="w-full px-4 py-2 rounded-xl border border-slate-300 text-sm"
                                        >
                                            <option value="">-- Pilih Kakak/Adik Santri --</option>
                                            {db.santri.filter(s => s.santri_id !== selectedSantriId).map(s => (
                                                <option key={s.santri_id} value={s.santri_id}>{s.nama_santri} ({s.jenjang})</option>
                                            ))}
                                        </select>
                                    )}
                                </div>

                                <div className="pt-2">
                                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow transition">
                                        Kirim Pengajuan Izin
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    {activeTab === 'histori' && (
                        <div className="bg-white p-6 rounded-2xl shadow space-y-4">
                            <h3 className="font-bold text-slate-800 text-lg">Histori Perizinan Santri Kelas</h3>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm">
                                    <thead>
                                        <tr className="border-b bg-slate-50 text-slate-600 font-semibold text-xs uppercase">
                                            <th className="p-3">Santri</th>
                                            <th className="p-3">Tanggal Izin</th>
                                            <th className="p-3">Keperluan / Tujuan</th>
                                            <th className="p-3">Wali Safar</th>
                                            <th className="p-3">Status</th>
                                            <th className="p-3">Aksi / QR</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {dashboardData.permits.map(p => {
                                            const sInfo = db.santri.find(s => s.santri_id === p.santri_id);
                                            return (
                                                <tr key={p.permit_id} className="border-b hover:bg-slate-50">
                                                    <td className="p-3 font-medium text-slate-800">{sInfo ? sInfo.nama_santri : '-'}</td>
                                                    <td className="p-3 text-slate-600">{p.tanggal_izin}</td>
                                                    <td className="p-3">{p.keperluan} ({p.tujuan})</td>
                                                    <td className="p-3">{p.wali_safar}</td>
                                                    <td className="p-3">
                                                        <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${p.status_pengajuan === 'DISETUJUI' ? 'bg-emerald-100 text-emerald-800' : p.status_pengajuan === 'DITOLAK' ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-800'}`}>
                                                            {p.status_pengajuan}
                                                        </span>
                                                    </td>
                                                    <td className="p-3">
                                                        {p.status_pengajuan === 'DISETUJUI' ? (
                                                            <button onClick={() => window.alert(`QR Token untuk ${sInfo?.nama_santri}:\n${p.qr_token}\n\nJam Perizinan Resmi: 08.00–16.00`)} className="bg-emerald-600 text-white px-3 py-1 rounded-lg text-xs font-medium hover:bg-emerald-700">
                                                                <i className="fa-solid fa-qrcode mr-1"></i> Lihat QR
                                                            </button>
                                                        ) : (
                                                            <span className="text-xs text-slate-400">-</span>
                                                        )}
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function SekretarisModule({ currentUser, showToast }) {
            const [dashboardData, setDashboardData] = React.useState(null);
            const [loading, setLoading] = React.useState(true);
            const [rejectModalPermitId, setRejectModalPermitId] = React.useState(null);
            const [alasanPenolakan, setAlasanPenolakan] = React.useState('');

            const loadData = async () => {
                setLoading(true);
                const res = await callBackendAPI('getDashboardData', { role: currentUser.role, userId: currentUser.user_id });
                if (res.success) setDashboardData(res.data);
                setLoading(false);
            };

            React.useEffect(() => {
                loadData();
                const interval = setInterval(loadData, 20000);
                return () => clearInterval(interval);
            }, []);

            const handleApprove = async (permitId) => {
                const res = await callBackendAPI('approvePermit', { permit_id: permitId, admin_id: currentUser.user_id });
                if (res.success) {
                    showToast(res.message);
                    loadData();
                } else {
                    showToast(res.message, 'error');
                }
            };

            const handleRejectSubmit = async (e) => {
                e.preventDefault();
                if (!alasanPenolakan) return;
                const res = await callBackendAPI('rejectPermit', { permit_id: rejectModalPermitId, admin_id: currentUser.user_id, alasan_penolakan: alasanPenolakan });
                if (res.success) {
                    showToast(res.message);
                    setRejectModalPermitId(null);
                    setAlasanPenolakan('');
                    loadData();
                } else {
                    showToast(res.message, 'error');
                }
            };

            if (loading || !dashboardData) {
                return <div className="text-center py-12"><i className="fa-solid fa-spinner animate-spin text-2xl text-emerald-600"></i><p className="text-sm text-slate-500 mt-2">Memuat dashboard sekretaris mudir...</p></div>;
            }

            const stats = dashboardData.stats;
            const db = getDB();

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center bg-white p-4 rounded-2xl shadow">
                        <div>
                            <h3 className="font-bold text-slate-800 text-lg">Dashboard Sekretaris Mudir (Near Real-Time)</h3>
                            <p className="text-xs text-slate-500">Screening dan approval perizinan keluar santri.</p>
                        </div>
                        <button onClick={loadData} className="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-medium px-4 py-2 rounded-xl text-sm transition flex items-center space-x-2">
                            <i className="fa-solid fa-rotate"></i>
                            <span>Refresh Data</span>
                        </button>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div className="bg-white p-4 rounded-2xl shadow border-l-4 border-amber-500">
                            <p className="text-xs text-slate-500 font-semibold">Menunggu Approval</p>
                            <h3 className="text-2xl font-bold text-slate-800 mt-1">{stats.menunggu}</h3>
                        </div>
                        <div className="bg-white p-4 rounded-2xl shadow border-l-4 border-blue-500">
                            <p className="text-xs text-slate-500 font-semibold">Sudah Keluar</p>
                            <h3 className="text-2xl font-bold text-slate-800 mt-1">{stats.sudah_keluar}</h3>
                        </div>
                        <div className="bg-white p-4 rounded-2xl shadow border-l-4 border-emerald-500">
                            <p className="text-xs text-slate-500 font-semibold">Sudah Kembali</p>
                            <h3 className="text-2xl font-bold text-slate-800 mt-1">{stats.sudah_kembali}</h3>
                        </div>
                        <div className="bg-white p-4 rounded-2xl shadow border-l-4 border-rose-500">
                            <p className="text-xs text-slate-500 font-semibold">Masih di Luar / Terlambat</p>
                            <h3 className="text-2xl font-bold text-slate-800 mt-1">{stats.masih_di_luar} / {stats.terlambat}</h3>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-2xl shadow space-y-4">
                        <h3 className="font-bold text-slate-800 text-lg">Daftar Pengajuan Masuk</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm">
                                <thead>
                                    <tr className="border-b bg-slate-50 text-slate-600 font-semibold text-xs uppercase">
                                        <th className="p-3">Santri</th>
                                        <th className="p-3">Tanggal Izin</th>
                                        <th className="p-3">Keperluan / Tujuan</th>
                                        <th className="p-3">Wali Safar</th>
                                        <th className="p-3">Status</th>
                                        <th className="p-3 text-right">Aksi Screening</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {dashboardData.permits.map(p => {
                                        const sInfo = db.santri.find(s => s.santri_id === p.santri_id);
                                        return (
                                            <tr key={p.permit_id} className="border-b hover:bg-slate-50">
                                                <td className="p-3 font-medium text-slate-800">{sInfo ? sInfo.nama_santri : '-'}</td>
                                                <td className="p-3 text-slate-600">{p.tanggal_izin}</td>
                                                <td className="p-3">{p.keperluan} ({p.tujuan})</td>
                                                <td className="p-3">{p.wali_safar} ({p.hubungan_wali})</td>
                                                <td className="p-3">
                                                    <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${p.status_pengajuan === 'DISETUJUI' ? 'bg-emerald-100 text-emerald-800' : p.status_pengajuan === 'DITOLAK' ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-800'}`}>
                                                        {p.status_pengajuan}
                                                    </span>
                                                </td>
                                                <td className="p-3 text-right space-x-2">
                                                    {p.status_pengajuan === 'MENUNGGU APPROVAL' ? (
                                                        <>
                                                            <button onClick={() => handleApprove(p.permit_id)} className="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded-lg text-xs font-medium">Setujui</button>
                                                            <button onClick={() => setRejectModalPermitId(p.permit_id)} className="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1 rounded-lg text-xs font-medium">Tolak</button>
                                                        </>
                                                    ) : (
                                                        <span className="text-xs text-slate-400">Selesai</span>
                                                    )}
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {rejectModalPermitId && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full space-y-4">
                                <h3 className="font-bold text-lg text-slate-800">Alasan Penolakan Izin</h3>
                                <form onSubmit={handleRejectSubmit} className="space-y-4">
                                    <textarea 
                                        value={alasanPenolakan} 
                                        onChange={e => setAlasanPenolakan(e.target.value)} 
                                        required 
                                        placeholder="Tuliskan alasan penolakan secara jelas..."
                                        className="w-full px-3 py-2 border rounded-xl h-28 text-sm focus:ring-2 focus:ring-emerald-500"
                                    ></textarea>
                                    <div className="flex justify-end space-x-2">
                                        <button type="button" onClick={() => setRejectModalPermitId(null)} className="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl text-sm font-medium">Batal</button>
                                        <button type="submit" className="px-4 py-2 bg-rose-600 text-white rounded-xl text-sm font-medium">Konfirmasi Tolak</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function SecurityModule({ currentUser, showToast }) {
            const [qrInput, setQrInput] = React.useState('');
            const [scanResult, setScanResult] = React.useState(null);
            const [cameraActive, setCameraActive] = React.useState(false);

            const handleScan = async (tokenToScan) => {
                const token = tokenToScan || qrInput;
                if (!token) return;
                const res = await callBackendAPI('scanQR', { qr_token: token, security_id: currentUser.user_id });
                setScanResult(res);
                if (res.success) {
                    showToast(res.message);
                } else {
                    showToast(res.message, 'error');
                }
                setQrInput('');
            };

            const db = getDB();
            const sampleApprovedPermit = db.permits.find(p => p.status_pengajuan === 'DISETUJUI');

            return (
                <div className="max-w-xl mx-auto space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow text-center space-y-4">
                        <div className="inline-flex bg-emerald-100 text-emerald-800 p-4 rounded-2xl text-3xl">
                            <i className="fa-solid fa-qrcode"></i>
                        </div>
                        <h3 className="font-bold text-slate-800 text-xl">Scanner Pos Keamanan (Security)</h3>
                        <p className="text-xs text-slate-500">Scan QR Code santri untuk pencatatan Exit (Keluar) dan Return (Kembali).</p>

                        <div className="p-4 bg-slate-900 rounded-2xl text-white relative overflow-hidden flex flex-col items-center justify-center min-h-[180px]">
                            {cameraActive ? (
                                <div className="space-y-2 text-center">
                                    <div className="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                                    <p className="text-xs text-slate-300">Kamera aktif menyorot QR Code...</p>
                                    <button onClick={() => setCameraActive(false)} className="px-3 py-1 bg-rose-600 text-white rounded-lg text-xs font-medium">Matikan Kamera</button>
                                </div>
                            ) : (
                                <div className="space-y-2 text-center">
                                    <i className="fa-solid fa-camera text-3xl text-slate-400"></i>
                                    <p className="text-xs text-slate-400">Kamera siap digunakan untuk pemindaian</p>
                                    <button onClick={() => setCameraActive(true)} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-semibold transition shadow">
                                        Aktifkan Kamera Scanner
                                    </button>
                                </div>
                            )}
                        </div>

                        <div className="space-y-3 pt-2">
                            <input 
                                type="text" 
                                value={qrInput} 
                                onChange={e => setQrInput(e.target.value)} 
                                placeholder="Masukkan atau scan token QR..."
                                className="w-full px-4 py-3 border rounded-xl text-center font-mono text-sm focus:ring-2 focus:ring-emerald-500"
                            />
                            <button onClick={() => handleScan()} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow transition">
                                Proses Scan QR Code
                            </button>
                        </div>

                        {sampleApprovedPermit && (
                            <div className="pt-4 border-t text-left">
                                <p className="text-xs text-slate-400 mb-2 font-medium">Simulator Contoh QR Aktif:</p>
                                <button onClick={() => handleScan(sampleApprovedPermit.qr_token)} className="w-full bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 p-2 rounded-xl text-xs font-mono text-slate-700 border truncate">
                                    Simulasikan Scan: {sampleApprovedPermit.qr_token}
                                </button>
                            </div>
                        )}
                    </div>

                    {scanResult && (
                        <div className={`p-5 rounded-2xl shadow border ${scanResult.success ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-rose-50 border-rose-200 text-rose-900'}`}>
                            <div className="flex items-center space-x-3 mb-2">
                                <i className={`fa-solid text-xl ${scanResult.success ? 'fa-circle-check text-emerald-600' : 'fa-circle-exclamation text-rose-600'}`}></i>
                                <h4 className="font-bold text-base">{scanResult.success ? 'Scan Berhasil' : 'Scan Ditolak'}</h4>
                            </div>
                            <p className="text-sm font-medium">{scanResult.message}</p>
                            {scanResult.data && scanResult.data.santri && (
                                <div className="mt-3 pt-3 border-t text-xs space-y-1">
                                    <p><span className="font-semibold">Nama Santri:</span> {scanResult.data.santri.nama_santri}</p>
                                    <p><span className="font-semibold">Wali Safar:</span> {scanResult.data.permit.wali_safar}</p>
                                    <p><span className="font-semibold">Waktu Tercatat:</span> {new Date(scanResult.data.scan_time).toLocaleString()}</p>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
