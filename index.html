                    nama.includes(searchTerm.toLowerCase()) &&
                    (filterBulan === '' || bulan === filterBulan) &&
                    (filterKelas === '' || kelas === filterKelas) &&
                    (filterStatus === '' || status.includes(filterStatus)) &&
                    (filterMobilitas === '' || mobilitas === filterMobilitas)
                );
            });

            const sortedPermits = [...filteredPermits].sort((a, b) => {
                if (!sortConfig.key) return 0;
                let aValue = a[sortConfig.key] || '';
                let bValue = b[sortConfig.key] || '';

                if (typeof aValue === 'string') aValue = aValue.toLowerCase();
                if (typeof bValue === 'string') bValue = bValue.toLowerCase();

                if (aValue < bValue) return sortConfig.direction === 'asc' ? -1 : 1;
                if (aValue > bValue) return sortConfig.direction === 'asc' ? 1 : -1;
                return 0;
            });

            const handleSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
                setSortConfig({ key, direction });
            };

            const SortIcon = ({ columnKey }) => {
                if (sortConfig.key !== columnKey) return <span className="text-gray-300 ml-1">↕</span>;
                return sortConfig.direction === 'asc' ? <span className="text-emerald-600 ml-1">▲</span> : <span className="text-emerald-600 ml-1">▼</span>;
            };

            const getStatusBadge = (status) => {
                if (!status) return <span className="bg-gray-100 px-2 py-1 text-xs font-bold rounded-full border">-</span>;
                const styles = { 'MENUNGGU': 'bg-yellow-100 text-yellow-800 border-yellow-200', 'MENUNGGU_APPROVAL': 'bg-yellow-100 text-yellow-800 border-yellow-200', 'DISETUJUI': 'bg-emerald-100 text-emerald-800 border-emerald-200', 'DITOLAK': 'bg-red-100 text-red-800 border-red-200', 'SELESAI': 'bg-gray-100 text-gray-800 border-gray-200' };
                const st = status.toUpperCase();
                return <span className={`px-2 py-1 text-xs font-bold rounded-full border ${styles[st] || 'bg-gray-100'}`}>{st.replace('_', ' ')}</span>;
            };

            const getMobilityBadge = (mobilitas) => {
                if (mobilitas === '-') return <span className="text-gray-400">-</span>;
                if (mobilitas === 'Belum Keluar') return <span className="px-2 py-1 text-[10px] font-bold rounded bg-gray-100 text-gray-600 border border-gray-200">BELUM KELUAR</span>;
                if (mobilitas === 'Masih Di Luar') return <span className="px-2 py-1 text-[10px] font-bold rounded bg-orange-100 text-orange-600 border border-orange-200">MASIH DI LUAR</span>;
                if (mobilitas === 'Tepat Waktu') return <span className="px-2 py-1 text-[10px] font-bold rounded bg-emerald-100 text-emerald-700 border border-emerald-200">TEPAT WAKTU</span>;
                if (mobilitas === 'Terlambat') return <span className="px-2 py-1 text-[10px] font-bold rounded bg-red-100 text-red-700 border border-red-200">TERLAMBAT</span>;
                return <span>{mobilitas}</span>;
            };

            return (
                <div className="space-y-6 animate-fade-in-down">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-4 gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Laporan Semua Perizinan</h2>
                            <p className="text-gray-500">Data seluruh pengajuan izin dan pantauan posisi santri lintas kelas.</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
                        <input 
                            type="text" placeholder="Cari Nama Santri..." 
                            className="w-full p-2.5 border rounded-lg bg-white focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-medium"
                            value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)}
                        />
                        <select className="w-full p-2.5 border rounded-lg bg-white outline-none text-sm font-medium" value={filterBulan} onChange={(e) => setFilterBulan(e.target.value)}>
                            <option value="">Semua Bulan</option>
                            {bulanOptions.map((b, idx) => <option key={idx} value={b}>{b}</option>)}
                        </select>
                        <select className="w-full p-2.5 border rounded-lg bg-white outline-none text-sm font-medium" value={filterKelas} onChange={(e) => setFilterKelas(e.target.value)}>
                            <option value="">Semua Kelas</option>
                            {kelasOptions.map((k, idx) => <option key={idx} value={k}>{k}</option>)}
                        </select>
                        <select className="w-full p-2.5 border rounded-lg bg-white outline-none text-sm font-medium" value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)}>
                            <option value="">Semua Status Approval</option>
                            <option value="MENUNGGU">Menunggu</option>
                            <option value="DISETUJUI">Disetujui</option>
                            <option value="DITOLAK">Ditolak</option>
                            <option value="SELESAI">Selesai</option>
                        </select>
                        <select className="w-full p-2.5 border rounded-lg bg-emerald-50 outline-none text-sm font-bold text-emerald-800" value={filterMobilitas} onChange={(e) => setFilterMobilitas(e.target.value)}>
                            <option value="">Semua Posisi Santri</option>
                            <option value="Masih Di Luar">Masih Di Luar</option>
                            <option value="Tepat Waktu">Kembali Tepat Waktu</option>
                            <option value="Terlambat">Terlambat</option>
                            <option value="Belum Keluar">Belum Keluar</option>
                        </select>
                    </div>

                    <div className="text-sm text-gray-500">
                        Menampilkan <span className="font-bold text-emerald-600">{sortedPermits.length}</span> dari {permits.length} perizinan
                    </div>

                    <Card className="overflow-x-auto p-0">
                        <table className="w-full text-left border-collapse text-sm whitespace-nowrap">
                            <thead>
                                <tr className="bg-emerald-50 text-emerald-800 border-b">
                                    <th className="p-4 cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('tanggal_izin')}>
                                        Tgl Izin <SortIcon columnKey="tanggal_izin" />
                                    </th>
                                    <th className="p-4 cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('nama_santri')}>
                                        Santri & Kelas <SortIcon columnKey="nama_santri" />
                                    </th>
                                    <th className="p-4 cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('keperluan')}>
                                        Keperluan <SortIcon columnKey="keperluan" />
                                    </th>
                                    <th className="p-4 cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('status_jadwal')}>
                                        Penjadwalan <SortIcon columnKey="status_jadwal" />
                                    </th>
                                    <th className="p-4 cursor-pointer hover:bg-emerald-100 transition-colors select-none" onClick={() => handleSort('status_pengajuan')}>
                                        Status ACC <SortIcon columnKey="status_pengajuan" />
                                    </th>
                                    <th className="p-4 cursor-pointer hover:bg-emerald-200 transition-colors select-none bg-emerald-100/50" onClick={() => handleSort('_status_mobilitas')}>
                                        Posisi Santri <SortIcon columnKey="_status_mobilitas" />
                                    </th>
                                    <th className="p-4 font-semibold">Aksi</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {loading ? <tr><td colSpan="7" className="p-8 text-center text-gray-500">Memuat data...</td></tr> : 
                                 sortedPermits.length === 0 ? <tr><td colSpan="7" className="p-8 text-center text-gray-500">Tidak ada data perizinan.</td></tr> :
                                 
                                 sortedPermits.map((p, idx) => (
                                    <tr key={idx} className="hover:bg-gray-50">
                                        <td className="p-4">{p.tanggal_izin}</td>
                                        <td className="p-4">
                                            <p className="font-bold text-gray-800">{p.nama_santri}</p>
                                            <p className="text-xs text-emerald-600 font-medium">{p.kelas}</p>
                                        </td>
                                        <td className="p-4 max-w-[250px] whitespace-normal break-words" title={p.keperluan}>
                                            <p className="font-medium text-gray-800">{p.keperluan || '-'}</p>
                                            <p className="text-[11px] text-gray-500 mt-1 leading-tight">
                                            Penjemput: <span className="font-medium text-gray-700">{p.wali_safar}</span> ({p.hubungan_wali})
                                            </p>
                                        </td>
                                        <td className="p-4">
                                            <span className={`px-2 py-1 text-[10px] font-bold rounded-full ${p.status_jadwal === 'Sesuai Jadwal' ? 'bg-blue-100 text-blue-700' : 'bg-red-100 text-red-700'}`}>
                                                {p.status_jadwal ? p.status_jadwal.toUpperCase() : 'TIDAK DIKETAHUI'}
                                            </span>
                                            {(p.ikut_jadwal_saudara === 'Ya' || p.ikut_jadwal_saudara === true || p.ikut_jadwal_saudara === 'TRUE') && (
                                                <p className="text-[10px] text-orange-600 mt-1.5 font-bold italic">
                                                    (Ikut Izin Saudara)
                                                </p>
                                            )}
                                        </td>
                                        <td className="p-4">{getStatusBadge(p.status_pengajuan)}</td>
                                        <td className="p-4 bg-emerald-50/20">{getMobilityBadge(p._status_mobilitas)}</td>
                                        <td className="p-4">
                                            {p.status_pengajuan === 'DISETUJUI' ? 
                                                <button onClick={() => setSelectedQrPermit(p)} className="px-3 py-1 bg-emerald-600 text-white rounded text-xs font-bold hover:bg-emerald-700 shadow-sm transition-colors cursor-pointer">Lihat QR</button> 
                                                : <span className="text-xs text-gray-400">-</span>
                                            }
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </Card>
                    <QrCardModal isOpen={!!selectedQrPermit} onClose={() => setSelectedQrPermit(null)} permit={selectedQrPermit} />
                </div>
            );
        };

        // --- RIWAYAT SCAN PAGE ---
        const RiwayatScanPage = () => {
            const { showToast } = useContext(ToastContext);
            const [logs, setLogs] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState('');

            useEffect(() => {
                const fetchLogs = async () => {
                    try { 
                        const res = await apiService.request('getScanLogs'); 
                        let finalLogs = [];
                        if (res && res.data && Array.isArray(res.data.data)) finalLogs = res.data.data;
                        else if (res && Array.isArray(res.data)) finalLogs = res.data;
                        else if (Array.isArray(res)) finalLogs = res;

                        setLogs(finalLogs); 
                    } catch (e) { showToast(e.message, 'error'); } finally { setLoading(false); }
                };
                fetchLogs();
            }, []);

            // REVISI: Filter pencarian sekarang mencari Nama Santri (bukan ID lagi)
            const filteredLogs = logs.filter(log => {
                const nama = String(log.nama_santri || log.santri_id || '').toLowerCase();
                const ket = String(log.keterangan || '').toLowerCase();
                const search = searchTerm.toLowerCase();
                return nama.includes(search) || ket.includes(search);
            });

            return (
                <div className="space-y-6 animate-fade-in-down">
                    <div>
                        <h2 className="text-2xl font-bold text-gray-800">Riwayat Scan Security</h2>
                        <p className="text-gray-500">Log aktivitas santri keluar & masuk gerbang pos keamanan.</p>
                    </div>

                    <div className="w-full md:w-1/3">
                        {/* REVISI: Mengubah teks placeholder */}
                        <input 
                            type="text" 
                            placeholder="Cari Nama Santri / Keterangan..." 
                            className="w-full p-2.5 border rounded-lg bg-white focus:ring-2 focus:ring-emerald-500 outline-none text-sm"
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                        />
                    </div>

                    <Card className="overflow-x-auto p-0">
                        <table className="w-full text-left border-collapse text-sm whitespace-nowrap">
                            <thead>
                                <tr className="bg-emerald-50 text-emerald-800 border-b">
                                    <th className="p-4">Waktu</th>
                                    <th className="p-4">Aksi</th>
                                    {/* REVISI: Mengubah Judul Kolom */}
                                    <th className="p-4">Nama Santri</th>
                                    <th className="p-4">Keterangan</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {loading ? <tr><td colSpan="4" className="p-8 text-center text-gray-500">Memuat log...</td></tr> : 
                                 filteredLogs.length === 0 ? <tr><td colSpan="4" className="p-8 text-center text-gray-500">Belum ada riwayat scan.</td></tr> :
                                 filteredLogs.map((log, idx) => (
                                    <tr key={idx} className="hover:bg-gray-50">
                                        <td className="p-4 font-medium text-gray-800">{log.waktu} WIB</td>
                                        <td className="p-4">
                                            <span className={`px-2 py-1 text-xs font-bold rounded-full ${log.tipe_scan === 'EXIT' ? 'bg-orange-100 text-orange-800' : 'bg-emerald-100 text-emerald-800'}`}>
                                                {log.tipe_scan}
                                            </span>
                                        </td>
                                        {/* REVISI: Menampilkan Nama Santri, dengan fallback ke ID jika data log lama belum ada namanya */}
                                        <td className="p-4 font-bold text-gray-900">{log.nama_santri || log.santri_id}</td>
                                        <td className="p-4 text-gray-600">{log.keterangan}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </Card>
                </div>
            );
        };

        const LoginPage = () => {
            const { login } = useContext(AuthContext);
            const { showToast } = useContext(ToastContext);
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault(); setLoading(true);
                try {
                    const res = await apiService.request('login', { username, password });
                    if (!res.data || !res.data.role) throw new Error("Login gagal. Periksa kembali backend/role.");
                    login(res.data);
                    const sessionData = { ...res.data, username: username };
                    login(sessionData);
                    showToast(`Selamat datang, ${res.data.nama}`, 'success');
                    
                    // --- KAMERA PENGINTAI: LOG LOGIN ---
                    apiService.request('saveLog', {
                        role: res.data.role,
                        nama: res.data.nama,
                        aksi: 'LOGIN',
                        keterangan: 'Berhasil masuk ke dalam sistem'
                    }).catch(e => console.log("Log error:", e));
                    // -----------------------------------
                    
                } catch (err) { showToast(err.message, 'error'); } finally { setLoading(false); }
            };

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
                    <div className="sm:mx-auto sm:w-full sm:max-w-md text-center">
                        <div className="mx-auto w-16 h-16 bg-emerald-600 rounded-full flex items-center justify-center text-white mb-4 shadow-lg shadow-emerald-200"><Icons.FileText /></div>
                        <h2 className="text-3xl font-extrabold text-gray-900">PPM Al-Islam</h2>
                        <p className="mt-2 text-sm text-gray-600">Sistem Management Perizinan Keluar Santri v1.1</p>
                    </div>
                    <div className="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
                        <Card className="py-8 px-4 sm:px-10">
                            <form className="space-y-6" onSubmit={handleSubmit}>
                                <Input name="username" label="Username" value={username} onChange={(e) => setUsername(e.target.value)} required placeholder="Misal: admin, walikelas, sekretaris" />
                                <Input name="password" label="Password" type="password" value={password} onChange={(e) => setPassword(e.target.value)} required placeholder="123" />
                                <Button type="submit" fullWidth disabled={loading}>{loading ? 'Memverifikasi...' : 'Masuk ke Sistem'}</Button>
                            </form>
                        </Card>
                    </div>
                </div>
            );
        };

        // --- SECURITY SCANNER PAGE ---
        const SecurityScannerPage = () => {
    const { user } = useContext(AuthContext);
    const { showToast } = useContext(ToastContext);
    const [scanning, setScanning] = useState(false);
    const [scanResult, setScanResult] = useState(null);
    const [processing, setProcessing] = useState(false);
    
    // --- JEDA 3 DETIK & ANTI DOUBLE-HIT ---
    const [cooldown, setCooldown] = useState(0);
    const cooldownRef = React.useRef(0); 
    const isProcessingRef = React.useRef(false); 
    const timerRef = React.useRef(null);
    // --------------------------------------

    const html5QrCodeRef = React.useRef(null);

    useEffect(() => {
        return () => {
            if (html5QrCodeRef.current && html5QrCodeRef.current.isScanning) {
                html5QrCodeRef.current.stop().catch(console.error);
            }
            if (timerRef.current) clearInterval(timerRef.current);
        };
    }, []);

    const startScanner = async () => {
        if (cooldownRef.current > 0) return;

        setScanResult(null);
        setScanning(true);
        try {
            const html5QrCode = new Html5Qrcode("reader");
            html5QrCodeRef.current = html5QrCode;
            
            // REVISI UI: aspectRatio: 1.0 memaksa rasio kamera menjadi KOTAK (tidak memanjang)
            const config = { 
                fps: 10, 
                qrbox: { width: 220, height: 220 },
                aspectRatio: 1.0 
            };
            
            await html5QrCode.start(
                { facingMode: "environment" }, 
                config,
                onScanSuccess
            );
        } catch (err) {
            console.error("Gagal membuka kamera:", err);
            showToast("Gagal mengakses kamera. Pastikan izin kamera aktif.", "error");
            setScanning(false);
        }
    };

    const stopScanner = async () => {
        if (html5QrCodeRef.current && html5QrCodeRef.current.isScanning) {
            await html5QrCodeRef.current.stop();
        }
        setScanning(false);
        setScanResult(null);
    };

    const startCooldown = () => {
        setCooldown(3); 
        cooldownRef.current = 3;
        
        if (timerRef.current) clearInterval(timerRef.current);
        
        timerRef.current = setInterval(() => {
            cooldownRef.current -= 1;
            setCooldown(cooldownRef.current);
            
            if (cooldownRef.current <= 0) {
                clearInterval(timerRef.current);
            }
        }, 1000);
    };

    const onScanSuccess = async (decodedText) => {
        if (cooldownRef.current > 0 || isProcessingRef.current) return;

        isProcessingRef.current = true;
        setProcessing(true);
        
        // --- UX HACK: Getar & Suara Bip Instan ---
        if (navigator.vibrate) navigator.vibrate(200);
        new Audio('https://www.soundjay.com/buttons/sounds/beep-07a.mp3').play().catch(()=>{});
        // -----------------------------------------

        try {
            const res = await apiService.request('scanQR', {
                qr_token: decodedText,
                security_name: user.nama
            });
            
            const resData = (res && res.data && res.data.data) ? res.data.data : (res.data || {});
            
            setScanResult({ success: true, data: resData, message: resData.pesan || 'Scan berhasil diproses.' });
            showToast(resData.pesan || 'Scan berhasil!', "success");

            startCooldown(); 

            // 🚀 PERCEPATAN: saveLog untuk SCAN SUKSES dihapus di sini, 
            // karena backend (Google Apps Script) sudah otomatis mencatatnya di sheet SCAN_LOG.
            // Beban loading server dipangkas 50%!
            
        } catch (err) {
            setScanResult({ success: false, message: err.message || 'QR Code ditolak / Kedaluwarsa.' });
            showToast(err.message || 'Scan gagal.', "error");

            startCooldown(); 

            // 🛡️ KEAMANAN: saveLog untuk SCAN GAGAL TETAP DIPERTAHANKAN.
            // Catatan ditolak ini akan masuk ke sheet SYSTEM_LOG.
            apiService.request('saveLog', {
                role: user.role,
                nama: user.nama,
                aksi: 'SCAN_DITOLAK',
                keterangan: `Percobaan scan ditolak: ${err.message || 'Token tidak valid'}`
            }).catch(e => console.log("Log error:", e));
            
        } finally {
            setProcessing(false);
            isProcessingRef.current = false;
        }
    };

    return (
        <div className="space-y-4 max-w-lg mx-auto animate-fade-in-down">
            <div className="text-center mb-2">
                <h2 className="text-2xl font-bold text-gray-800">Scanner Pos Security</h2>
                <p className="text-sm text-emerald-600 mt-1 font-semibold">Mode Auto-Scan (Berkelanjutan)</p>
            </div>

            {/* --- REVISI UI: KOTAK HASIL DIPINDAH KE ATAS KAMERA --- */}
            {/* Dengan begini, hasil selalu ada di tengah layar, Satpam tidak perlu scroll! */}
            {processing && (
                <div className="p-4 bg-white rounded-xl shadow-md border text-center animate-pulse">
                    <p className="text-emerald-700 font-bold">Memproses data ke server...</p>
                </div>
            )}

            {scanResult && !processing && (
                <Card className={`border-2 shadow-lg mb-4 ${scanResult.success ? 'border-emerald-500 bg-emerald-50/50' : 'border-red-500 bg-red-50/50'}`}>
                    <div className="flex items-start gap-4">
                        <div className="mt-1">
                            {scanResult.success ? <Icons.CheckCircle /> : <Icons.XCircle />}
                        </div>
                        <div className="flex-1">
                            <h3 className={`font-bold text-lg ${scanResult.success ? 'text-emerald-800' : 'text-red-800'}`}>
                                {scanResult.success ? `SCAN ${scanResult.data?.type || 'BERHASIL'} SUKSES` : 'SCAN DITOLAK'}
                            </h3>
                            <p className="text-sm text-gray-700 mt-1">{scanResult.message}</p>

                            {scanResult.success && scanResult.data && scanResult.data.nama && (
                                <div className="mt-3 p-2 bg-white/80 rounded border border-gray-200 text-sm space-y-1">
                                    <p><span className="text-gray-500">Nama:</span> <strong>{scanResult.data.nama}</strong> ({scanResult.data.kelas})</p>
                                    <p><span className="text-gray-500">Waktu Scan:</span> <strong>{scanResult.data.waktu} WIB</strong></p>
                                    {scanResult.data.status_kembali && (
                                        <p className="mt-1">
                                            <span className={`px-2 py-0.5 text-xs font-bold rounded-full ${
                                                scanResult.data.status_kembali === 'TEPAT WAKTU' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'
                                            }`}>
                                                {scanResult.data.status_kembali}
                                            </span>
                                        </p>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                </Card>
            )}
            {/* ------------------------------------------------------ */}

            <Card className={`p-4 flex flex-col items-center border-2 transition-colors duration-300 ${cooldown > 0 ? 'border-orange-400' : 'border-transparent'}`}>
                {/* REVISI UI: Hapus minHeight 300px agar tidak memanjang */}
                <div id="reader" className={`w-full bg-black rounded-lg overflow-hidden shadow-inner ${scanning ? 'block' : 'hidden'}`}></div>

                {!scanning && (
                    <div className="py-8 flex flex-col items-center text-center">
                        <div className="w-16 h-16 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center mb-4 shadow-sm">
                            <Icons.Scan />
                        </div>
                        <p className="text-gray-600 font-medium mb-6">Kamera pengawas gerbang siap</p>
                        <Button onClick={startScanner} className="px-6 py-2.5 shadow-md" icon={<Icons.Scan />}>
                            Buka Kamera Scan
                        </Button>
                    </div>
                )}

                {scanning && (
                    <div className="w-full mt-4 space-y-3">
                        <div className={`p-2.5 text-sm text-center rounded-lg font-bold transition-colors duration-300 ${cooldown > 0 ? 'bg-orange-100 text-orange-700' : 'bg-emerald-100 text-emerald-700 animate-pulse'}`}>
                            {cooldown > 0 ? `Jeda Keamanan... ${cooldown}s` : 'KAMERA AKTIF - SIAP SCAN'}
                        </div>
                        <Button variant="secondary" fullWidth onClick={stopScanner}>Tutup Kamera</Button>
                    </div>
                )}
            </Card>
        </div>
    );
};

        const MainRouter = ({ currentRoute, setCurrentRoute }) => {
            const { user } = useContext(AuthContext);

            if (currentRoute === 'dashboard') {
                if (user.role === ROLES.ADMIN) return <DashboardManajemen title="Dashboard Admin" subtitle="Ringkasan perizinan pondok secara keseluruhan." />;
                if (user.role === ROLES.SEKRETARIS_MUDIR) return <DashboardManajemen title="Dashboard Sekretaris" subtitle="Rekapitulasi perizinan dan approval santri." />;
                if (user.role === ROLES.WALI_KELAS) return <DashboardWaliKelas setCurrentRoute={setCurrentRoute} />;
                if (user.role === ROLES.SECURITY) return <DashboardSecurity setCurrentRoute={setCurrentRoute} />;
            }
            
            // ADMIN MENU ROUTING
            if (currentRoute === 'master_santri' && user.role === ROLES.ADMIN) return <DataSantriPage />;
            if (currentRoute === 'master_kelas' && user.role === ROLES.ADMIN) return <DataKelasPage />;
            if (currentRoute === 'tahun_pelajaran' && user.role === ROLES.ADMIN) return <TahunPelajaranPage />;
            if (currentRoute === 'kenaikan_kelas' && user.role === ROLES.ADMIN) return <KenaikanKelasPage />;
            if (currentRoute === 'jadwal_perizinan' && user.role === ROLES.ADMIN) return <JadwalPerizinanPage />;
            if (currentRoute === 'perizinan' && user.role === ROLES.ADMIN) return <SemuaPerizinanPage />;
            
            // WALI KELAS MENU ROUTING
            if (currentRoute === 'pengajuan' && user.role === ROLES.WALI_KELAS) return <AjukanIzinPage setCurrentRoute={setCurrentRoute} />;
            if (currentRoute === 'histori' && user.role === ROLES.WALI_KELAS) return <HistoriKelasPage />;

            // SEKRETARIS MENU ROUTING
            if (currentRoute === 'screening' && user.role === ROLES.SEKRETARIS_MUDIR) return <ScreeningIzinPage />;
            if (currentRoute === 'histori_global' && user.role === ROLES.SEKRETARIS_MUDIR) return <HistoriSekretarisPage />;

            // SECURITY MENU ROUTING
            if (currentRoute === 'dashboard' && user.role === ROLES.SECURITY) return <DashboardSecurity setCurrentRoute={setCurrentRoute} />;
            if (currentRoute === 'scanner' && user.role === ROLES.SECURITY) return <SecurityScannerPage />;
            if (currentRoute === 'log' && user.role === ROLES.SECURITY) return <RiwayatScanPage />;            
            
            return (
                <div className="flex flex-col items-center justify-center py-20 text-center">
                    <Icons.FileText />
                    <h3 className="mt-4 text-lg font-medium text-gray-900">Modul {currentRoute}</h3>
                    <p className="mt-1 text-gray-500">Modul ini akan dibangun pada fase pengembangan berikutnya.</p>
                </div>
            );
        };

        function App() {
            // 1. Ambil sesi dari localStorage saat pertama kali web dibuka
            const [user, setUser] = useState(() => {
                const savedUser = localStorage.getItem('al_islam_session');
                return savedUser ? JSON.parse(savedUser) : null;
            });
            const [toast, setToast] = useState(null);
            
            const showToast = (message, type = 'success') => setToast({ message, type });

            // 2. Fungsi Login: Simpan ke State DAN localStorage
            const handleLogin = (userData) => {
                setUser(userData);
                localStorage.setItem('al_islam_session', JSON.stringify(userData));
            };

            // 3. Fungsi Logout: Hapus dari State DAN localStorage
            const handleLogout = () => {
                setUser(null);
                localStorage.removeItem('al_islam_session');
            };

            return (
                <ToastContext.Provider value={{ showToast }}>
                    {/* 4. Tautkan fungsi baru ke Context */}
                    <AuthContext.Provider value={{ user, login: handleLogin, logout: handleLogout }}>
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                        {!user ? <LoginPage /> : <Layout><MainRouter /></Layout>}
                    </AuthContext.Provider>
                </ToastContext.Provider>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
