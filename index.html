<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Perizinan Santri Al-Islam</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
        }
        /* Custom scrollbar untuk tabel */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-down {
            animation: fadeInDown 0.3s ease-out forwards;
        }
    </style>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext, useMemo } = React;

        const API_BASE_URL = 'https://script.google.com/macros/s/AKfycbyddspvXA3vpGmDpHYjm5-uOlbEdSbDTYygeHsNv192SokqVrEKwBxiZAkYXVscTomM/exec';
        const USE_MOCK_API = false; // Diubah ke false agar menggunakan GAS asli milik Anda

        const ROLES = {
            ADMIN: 'ADMIN',
            WALI_KELAS: 'WALI_KELAS',
            SEKRETARIS_MUDIR: 'SEKRETARIS_MUDIR',
            SECURITY: 'SECURITY'
        };

        const Icons = {
            Home: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            FileText: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>,
            Scan: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
            LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
            Menu: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>,
            CheckCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#10b981" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>,
            XCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef4444" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Edit: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>,
            Search: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>,
            Calendar: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
            Grid: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        };

        const AuthContext = createContext(null);
        const ToastContext = createContext(null);

        const apiService = {
            request: async (action, payload) => {
                if (USE_MOCK_API) {
                    return new Promise((resolve, reject) => {
                        setTimeout(() => {
                            if (action === 'login') {
                                if (payload.username === 'admin') resolve({ success: true, data: { user_id: 'U1', nama: 'Admin', role: ROLES.ADMIN } });
                                else reject(new Error("Mock Login Failed"));
                            } else if (action === 'getSantri') {
                                resolve({ success: true, data: [
                                    { santri_id: 'S001', nama: 'Ahmad Fulan', jk: 'Laki-laki', jenjang: 'SMP', kelas: 'VII-A', kota_asal: 'Cirebon', nama_ayah: 'Budi', no_telp: '0812' }
                                ]});
                            } else {
                                resolve({ success: true, data: {} });
                            }
                        }, 800);
                    });
                }

                try {
                    const response = await fetch(API_BASE_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // Wajib text/plain untuk GAS CORS
                        body: JSON.stringify({ action, ...payload }),
                        redirect: 'follow'
                    });
                    
                    const text = await response.text();
                    let data;
                    try {
                        data = JSON.parse(text);
                    } catch (e) {
                        console.error("Bukan JSON:", text);
                        throw new Error("Gagal terhubung. Pastikan Google Apps Script sudah di 'New Deployment'.");
                    }

                    if (!data.success) throw new Error(data.message || 'Terjadi kesalahan dari server.');
                    return data;
                } catch (error) {
                    console.error('API Error:', error);
                    throw error;
                }
            }
        };

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white rounded-xl shadow-sm border border-gray-100 p-6 ${className}`}>{children}</div>
        );

        const Button = ({ children, onClick, variant = 'primary', className = "", disabled, type="button", fullWidth }) => {
            const baseStyle = "px-4 py-2 rounded-lg font-medium transition-all duration-200 flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-offset-2";
            const variants = {
                primary: "bg-emerald-600 hover:bg-emerald-700 text-white focus:ring-emerald-500",
                secondary: "bg-gray-100 hover:bg-gray-200 text-gray-800 focus:ring-gray-400",
                danger: "bg-red-500 hover:bg-red-600 text-white focus:ring-red-500",
            };
            return (
                <button type={type} onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${fullWidth ? 'w-full' : ''} ${disabled ? 'opacity-50 cursor-not-allowed' : ''} ${className}`}>
                    {children}
                </button>
            );
        };

        const Input = ({ label, type = "text", value, onChange, placeholder, required, name }) => (
            <div className="mb-4">
                {label && <label className="block text-sm font-medium text-gray-700 mb-1">{label}</label>}
                <input
                    name={name}
                    type={type}
                    value={value}
                    onChange={onChange}
                    placeholder={placeholder}
                    required={required}
                    className="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-colors"
                />
            </div>
        );

        const Select = ({ label, value, onChange, options, required, name }) => (
            <div className="mb-4">
                {label && <label className="block text-sm font-medium text-gray-700 mb-1">{label}</label>}
                <select name={name} value={value} onChange={onChange} required={required} className="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 bg-white">
                    <option value="">-- Pilih --</option>
                    {options.map((opt, idx) => (
                        <option key={idx} value={opt}>{opt}</option>
                    ))}
                </select>
            </div>
        );

        const StatCard = ({ title, value, icon, color = "bg-emerald-50 text-emerald-600" }) => (
            <Card className="flex items-center gap-4">
                <div className={`p-4 rounded-full ${color}`}>{icon}</div>
                <div>
                    <p className="text-sm text-gray-500 font-medium">{title}</p>
                    <h3 className="text-2xl font-bold text-gray-800">{value}</h3>
                </div>
            </Card>
        );

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 4000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return (
                <div className="fixed top-4 right-4 z-50 animate-fade-in-down">
                    <div className={`flex items-center gap-3 px-6 py-4 rounded-lg shadow-lg text-white ${type === 'error' ? 'bg-red-500' : 'bg-gray-800'}`}>
                        {type === 'error' ? <Icons.XCircle /> : <Icons.CheckCircle />}
                        <span className="font-medium">{message}</span>
                    </div>
                </div>
            );
        };

        const SidebarItem = ({ icon: Icon, label, active, onClick }) => (
            <button
                onClick={onClick}
                className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition-colors ${active ? 'bg-emerald-50 text-emerald-700 font-medium' : 'text-gray-600 hover:bg-gray-50'}`}
            >
                <Icon />
                <span>{label}</span>
            </button>
        );

        const Layout = ({ children }) => {
            const { user, logout } = useContext(AuthContext);
            const [isSidebarOpen, setSidebarOpen] = useState(false);
            const [currentRoute, setCurrentRoute] = useState('dashboard');

            if (!user) return null;

            // Proteksi aman dari error jika backend memberikan respon role yang salah
            const safeRole = user?.role || 'UNKNOWN';

            const menuItems = {
                [ROLES.ADMIN]: [
                    { id: 'dashboard', label: 'Dashboard', icon: Icons.Home },
                    { id: 'master_santri', label: 'Data Santri', icon: Icons.Users },
                    { id: 'master_kelas', label: 'Data Kelas', icon: Icons.Grid },
                    { id: 'tahun_pelajaran', label: 'Tahun Pelajaran', icon: Icons.Calendar },
                    { id: 'perizinan', label: 'Semua Perizinan', icon: Icons.FileText },
                    { id: 'settings', label: 'Pengaturan', icon: Icons.Settings },
                ],
                [ROLES.WALI_KELAS]: [
                    { id: 'dashboard', label: 'Dashboard', icon: Icons.Home },
                    { id: 'pengajuan', label: 'Ajukan Izin', icon: Icons.FileText },
                    { id: 'histori', label: 'Histori Kelas', icon: Icons.Users },
                ],
                [ROLES.SEKRETARIS_MUDIR]: [
                    { id: 'dashboard', label: 'Dashboard', icon: Icons.Home },
                    { id: 'screening', label: 'Screening Izin', icon: Icons.FileText },
                ],
                [ROLES.SECURITY]: [
                    { id: 'scanner', label: 'Scan QR Code', icon: Icons.Scan },
                    { id: 'log', label: 'Riwayat Scan', icon: Icons.FileText },
                ]
            };

            const currentMenu = menuItems[safeRole] || [];

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col md:flex-row">
                    <div className="md:hidden bg-white border-b px-4 py-3 flex justify-between items-center sticky top-0 z-20">
                        <div className="font-bold text-emerald-700">Al-Islam Permit</div>
                        <button onClick={() => setSidebarOpen(!isSidebarOpen)} className="p-2 text-gray-600">
                            <Icons.Menu />
                        </button>
                    </div>

                    <div className={`fixed md:static inset-y-0 left-0 w-64 bg-white border-r transform ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 transition-transform duration-300 ease-in-out z-30 flex flex-col`}>
                        <div className="p-6 border-b hidden md:block">
                            <h1 className="font-bold text-xl text-emerald-700 leading-tight">Sistem Perizinan<br/><span className="text-sm text-gray-500 font-normal">PPM Al-Islam</span></h1>
                        </div>
                        <div className="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                            <div className="mb-6 px-4 py-3 bg-emerald-50 rounded-lg text-sm border border-emerald-100">
                                <p className="text-gray-500">Masuk sebagai:</p>
                                <p className="font-semibold text-emerald-800">{user.nama || 'Pengguna'}</p>
                                <p className="text-xs text-emerald-600 mt-1 uppercase tracking-wider font-bold">{safeRole.replace('_', ' ')}</p>
                            </div>
                            {currentMenu.length > 0 ? currentMenu.map(item => (
                                <SidebarItem
                                    key={item.id}
                                    icon={item.icon}
                                    label={item.label}
                                    active={currentRoute === item.id}
                                    onClick={() => { setCurrentRoute(item.id); setSidebarOpen(false); }}
                                />
                            )) : (
                                <p className="text-red-500 text-sm px-4">Error Role: Menu tidak tersedia.</p>
                            )}
                        </div>
                        <div className="p-4 border-t">
                            <button onClick={logout} className="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left text-red-600 hover:bg-red-50 transition-colors">
                                <Icons.LogOut />
                                <span className="font-medium">Keluar</span>
                            </button>
                        </div>
                    </div>

                    {isSidebarOpen && <div className="fixed inset-0 bg-black/20 z-20 md:hidden" onClick={() => setSidebarOpen(false)} />}
                    <div className="flex-1 overflow-y-auto h-screen">
                        <main className="p-4 md:p-8 max-w-6xl mx-auto pb-24 md:pb-8">
                            {React.cloneElement(children, { currentRoute })}
                        </main>
                    </div>
                </div>
            );
        };

        const DataSantriPage = () => {
            const { showToast } = useContext(ToastContext);
            const [santri, setSantri] = useState([]);
            const [loading, setLoading] = useState(true);
            const [search, setSearch] = useState('');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingData, setEditingData] = useState(null);
            
            const initialForm = { santri_id: '', nama: '', jk: '', jenjang: '', kelas: '', kota_asal: '', nama_ayah: '', no_telp: '', status: 'Aktif' };
            const [formData, setFormData] = useState(initialForm);
            const [saving, setSaving] = useState(false);

            useEffect(() => {
                fetchSantri();
            }, []);

            const fetchSantri = async () => {
                setLoading(true);
                try {
                    const res = await apiService.request('getSantri');
                    setSantri(res.data || []);
                } catch (err) {
                    showToast(err.message, 'error');
                } finally {
                    setLoading(false);
                }
            };

            const filteredSantri = useMemo(() => {
                return santri.filter(s => s.nama.toLowerCase().includes(search.toLowerCase()) || (s.kelas && s.kelas.toLowerCase().includes(search.toLowerCase())));
            }, [santri, search]);

            const handleOpenModal = (data = null) => {
                if (data) {
                    setEditingData(data);
                    setFormData(data);
                } else {
                    setEditingData(null);
                    setFormData(initialForm);
                }
                setIsModalOpen(true);
            };

            const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });

            const handleSubmit = async (e) => {
                e.preventDefault();
                setSaving(true);
                try {
                    // Panggil API saveSantri
                    await apiService.request('saveSantri', formData);
                    showToast('Data santri berhasil disimpan!', 'success');
                    setIsModalOpen(false);
                    fetchSantri(); // Refresh table
                } catch (err) {
                    showToast(err.message, 'error');
                } finally {
                    setSaving(false);
                }
            };

            return (
                <div className="space-y-6 animate-fade-in-down">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Master Data Santri</h2>
                            <p className="text-gray-500">Kelola informasi santri aktif pondok pesantren.</p>
                        </div>
                        <Button onClick={() => handleOpenModal()} icon={<Icons.Plus />}>
                            <Icons.Plus /> Tambah Santri
                        </Button>
                    </div>

                    <Card>
                        <div className="flex mb-4 items-center gap-2 bg-gray-50 p-2 rounded-lg border border-gray-200 w-full md:w-1/3">
                            <Icons.Search />
                            <input 
                                type="text" placeholder="Cari nama atau kelas..." 
                                className="bg-transparent border-none outline-none w-full text-sm"
                                value={search} onChange={(e) => setSearch(e.target.value)}
                            />
                        </div>

                        <div className="overflow-x-auto rounded-lg border border-gray-200">
                            <table className="w-full text-left border-collapse text-sm whitespace-nowrap">
                                <thead>
                                    <tr className="bg-gray-100 text-gray-700">
                                        <th className="p-4 font-semibold">Nama Santri</th>
                                        <th className="p-4 font-semibold">L/P</th>
                                        <th className="p-4 font-semibold">Kelas</th>
                                        <th className="p-4 font-semibold">Kota Asal</th>
                                        <th className="p-4 font-semibold">Status</th>
                                        <th className="p-4 font-semibold text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {loading ? (
                                        <tr><td colSpan="6" className="p-8 text-center text-gray-500">Memuat data dari Google Sheets...</td></tr>
                                    ) : filteredSantri.length === 0 ? (
                                        <tr><td colSpan="6" className="p-8 text-center text-gray-500">Tidak ada data ditemukan.</td></tr>
                                    ) : (
                                        filteredSantri.map(s => (
                                            <tr key={s.santri_id} className="hover:bg-gray-50 transition-colors">
                                                <td className="p-4 font-medium text-gray-800">{s.nama}</td>
                                                <td className="p-4 text-gray-600">{s.jk === 'Laki-laki' ? 'L' : 'P'}</td>
                                                <td className="p-4"><span className="px-2 py-1 bg-blue-50 text-blue-700 rounded text-xs font-medium">{s.jenjang} - {s.kelas}</span></td>
                                                <td className="p-4 text-gray-600">{s.kota_asal}</td>
                                                <td className="p-4">
                                                    <span className={`px-2 py-1 rounded text-xs font-medium ${s.status === 'Aktif' ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700'}`}>
                                                        {s.status}
                                                    </span>
                                                </td>
                                                <td className="p-4 flex justify-center gap-2">
                                                    <button onClick={() => handleOpenModal(s)} className="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition-colors"><Icons.Edit /></button>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </Card>

                    {/* MODAL FORM TAMBAH/EDIT */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden animate-fade-in-down">
                                <div className="p-6 border-b border-gray-100 flex justify-between items-center">
                                    <h3 className="text-xl font-bold text-gray-800">{editingData ? 'Edit Data Santri' : 'Tambah Santri Baru'}</h3>
                                    <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-gray-600"><Icons.XCircle /></button>
                                </div>
                                <div className="p-6 overflow-y-auto max-h-[70vh]">
                                    <form id="santriForm" onSubmit={handleSubmit} className="space-y-4">
                                        <Input name="nama" label="Nama Lengkap Santri" required value={formData.nama} onChange={handleChange} />
                                        <div className="grid grid-cols-2 gap-4">
                                            <Select name="jk" label="Jenis Kelamin" required options={['Laki-laki', 'Perempuan']} value={formData.jk} onChange={handleChange} />
                                            <Select name="jenjang" label="Jenjang" required options={['SMP', 'SMA']} value={formData.jenjang} onChange={handleChange} />
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <Input name="kelas" label="Kelas (Contoh: VII-A)" required value={formData.kelas} onChange={handleChange} />
                                            <Input name="kota_asal" label="Kota Asal" required value={formData.kota_asal} onChange={handleChange} />
                                        </div>
                                        <Input name="nama_ayah" label="Nama Ayah" required value={formData.nama_ayah} onChange={handleChange} />
                                        <Input name="no_telp" label="Nomor Telepon (WA)" required value={formData.no_telp} onChange={handleChange} />
                                        <Select name="status" label="Status Santri" required options={['Aktif', 'Nonaktif', 'Lulus']} value={formData.status} onChange={handleChange} />
                                    </form>
                                </div>
                                <div className="p-6 border-t border-gray-100 flex justify-end gap-3 bg-gray-50">
                                    <Button variant="secondary" onClick={() => setIsModalOpen(false)}>Batal</Button>
                                    <Button type="submit" onClick={(e) => { e.preventDefault(); document.getElementById('santriForm').requestSubmit(); }} disabled={saving}>
                                        {saving ? 'Menyimpan...' : 'Simpan Data'}
                                    </Button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const TahunPelajaranPage = () => {
            const { showToast } = useContext(ToastContext);
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [formData, setFormData] = useState({ tp_id: '', nama_periode: '', status: 'Arsip' });
            const [saving, setSaving] = useState(false);

            useEffect(() => { fetchTahunPelajaran(); }, []);

            const fetchTahunPelajaran = async () => {
                setLoading(true);
                try {
                    const res = await apiService.request('getTahunPelajaran');
                    setData(res.data || []);
                } catch (err) {
                    showToast(err.message, 'error');
                } finally { setLoading(false); }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setSaving(true);
                try {
                    await apiService.request('saveTahunPelajaran', formData);
                    showToast('Tahun Pelajaran berhasil disimpan!', 'success');
                    setIsModalOpen(false);
                    fetchTahunPelajaran();
                } catch (err) {
                    showToast(err.message, 'error');
                } finally { setSaving(false); }
            };

            return (
                <div className="space-y-6 animate-fade-in-down">
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Tahun Pelajaran</h2>
                            <p className="text-gray-500">Kelola periode akademik pondok pesantren.</p>
                        </div>
                        <Button onClick={() => { setFormData({ tp_id: '', nama_periode: '', status: 'Arsip' }); setIsModalOpen(true); }} icon={<Icons.Plus />}>
                            <Icons.Plus /> Tambah Periode
                        </Button>
                    </div>
                    <Card>
                        <div className="overflow-x-auto rounded-lg border border-gray-200">
                            <table className="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr className="bg-gray-100 text-gray-700">
                                        <th className="p-4 font-semibold">Tahun Pelajaran</th>
                                        <th className="p-4 font-semibold">Status</th>
                                        <th className="p-4 font-semibold text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {loading ? (
                                        <tr><td colSpan="3" className="p-8 text-center text-gray-500">Memuat data dari Google Sheets...</td></tr>
                                    ) : data.length === 0 ? (
                                        <tr><td colSpan="3" className="p-8 text-center text-gray-500">Belum ada data.</td></tr>
                                    ) : (
                                        data.map(item => (
                                            <tr key={item.tp_id} className="hover:bg-gray-50">
                                                <td className="p-4 font-medium text-gray-800">{item.nama_periode}</td>
                                                <td className="p-4">
                                                    <span className={`px-2 py-1 rounded text-xs font-medium ${item.status === 'Aktif' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-gray-100 text-gray-600'}`}>
                                                        {item.status}
                                                    </span>
                                                </td>
                                                <td className="p-4 flex justify-center">
                                                    <button onClick={() => { setFormData(item); setIsModalOpen(true); }} className="p-2 text-blue-600 hover:bg-blue-50 rounded-lg"><Icons.Edit /></button>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </Card>

                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden animate-fade-in-down">
                                <div className="p-6 border-b border-gray-100 flex justify-between items-center">
                                    <h3 className="text-xl font-bold text-gray-800">{formData.tp_id ? 'Edit Tahun Pelajaran' : 'Tambah Tahun Pelajaran'}</h3>
                                    <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-gray-600"><Icons.XCircle /></button>
                                </div>
                                <form id="tpForm" onSubmit={handleSubmit} className="p-6 space-y-4">
                                    <Input name="nama_periode" label="Periode (Contoh: 2026/2027)" required value={formData.nama_periode} onChange={(e) => setFormData({...formData, nama_periode: e.target.value})} />
                                    <Select name="status" label="Status" required options={['Aktif', 'Arsip']} value={formData.status} onChange={(e) => setFormData({...formData, status: e.target.value})} />
                                </form>
                                <div className="p-6 border-t border-gray-100 flex justify-end gap-3 bg-gray-50">
                                    <Button variant="secondary" onClick={() => setIsModalOpen(false)}>Batal</Button>
                                    <Button type="submit" onClick={(e) => { e.preventDefault(); document.getElementById('tpForm').requestSubmit(); }} disabled={saving}>
                                        {saving ? 'Menyimpan...' : 'Simpan Data'}
                                    </Button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const MasterKelasPage = () => {
            const { showToast } = useContext(ToastContext);
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [formData, setFormData] = useState({ kelas_id: '', nama_kelas: '', jenjang: 'SMP', wali_kelas: '' });
            const [saving, setSaving] = useState(false);

            useEffect(() => { fetchKelas(); }, []);

            const fetchKelas = async () => {
                setLoading(true);
                try {
                    const res = await apiService.request('getKelas');
                    setData(res.data || []);
                } catch (err) {
                    showToast(err.message, 'error');
                } finally { setLoading(false); }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setSaving(true);
                try {
                    await apiService.request('saveKelas', formData);
                    showToast('Kelas berhasil disimpan!', 'success');
                    setIsModalOpen(false);
                    fetchKelas();
                } catch (err) {
                    showToast(err.message, 'error');
                } finally { setSaving(false); }
            };

            return (
                <div className="space-y-6 animate-fade-in-down">
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Master Kelas</h2>
                            <p className="text-gray-500">Kelola data kelas dan rombongan belajar.</p>
                        </div>
                        <Button onClick={() => { setFormData({ kelas_id: '', nama_kelas: '', jenjang: 'SMP', wali_kelas: '' }); setIsModalOpen(true); }} icon={<Icons.Plus />}>
                            <Icons.Plus /> Tambah Kelas
                        </Button>
                    </div>
                    <Card>
                        <div className="overflow-x-auto rounded-lg border border-gray-200">
                            <table className="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr className="bg-gray-100 text-gray-700">
                                        <th className="p-4 font-semibold">Nama Kelas</th>
                                        <th className="p-4 font-semibold">Jenjang</th>
                                        <th className="p-4 font-semibold">Wali Kelas</th>
                                        <th className="p-4 font-semibold text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {loading ? (
                                        <tr><td colSpan="4" className="p-8 text-center text-gray-500">Memuat data dari Google Sheets...</td></tr>
                                    ) : data.length === 0 ? (
                                        <tr><td colSpan="4" className="p-8 text-center text-gray-500">Belum ada data.</td></tr>
                                    ) : (
                                        data.map(item => (
                                            <tr key={item.kelas_id} className="hover:bg-gray-50">
                                                <td className="p-4 font-medium text-gray-800">{item.nama_kelas}</td>
                                                <td className="p-4"><span className="px-2 py-1 bg-blue-50 text-blue-700 rounded text-xs font-medium">{item.jenjang}</span></td>
                                                <td className="p-4 text-gray-600">{item.wali_kelas || '-'}</td>
                                                <td className="p-4 flex justify-center">
                                                    <button onClick={() => { setFormData(item); setIsModalOpen(true); }} className="p-2 text-blue-600 hover:bg-blue-50 rounded-lg"><Icons.Edit /></button>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </Card>

                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden animate-fade-in-down">
                                <div className="p-6 border-b border-gray-100 flex justify-between items-center">
                                    <h3 className="text-xl font-bold text-gray-800">{formData.kelas_id ? 'Edit Kelas' : 'Tambah Kelas'}</h3>
                                    <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-gray-600"><Icons.XCircle /></button>
                                </div>
                                <form id="kelasForm" onSubmit={handleSubmit} className="p-6 space-y-4">
                                    <Input name="nama_kelas" label="Nama Kelas (Contoh: VII-A)" required value={formData.nama_kelas} onChange={(e) => setFormData({...formData, nama_kelas: e.target.value})} />
                                    <Select name="jenjang" label="Jenjang" required options={['SMP', 'SMA']} value={formData.jenjang} onChange={(e) => setFormData({...formData, jenjang: e.target.value})} />
                                    <Input name="wali_kelas" label="Nama Wali Kelas" value={formData.wali_kelas} onChange={(e) => setFormData({...formData, wali_kelas: e.target.value})} />
                                </form>
                                <div className="p-6 border-t border-gray-100 flex justify-end gap-3 bg-gray-50">
                                    <Button variant="secondary" onClick={() => setIsModalOpen(false)}>Batal</Button>
                                    <Button type="submit" onClick={(e) => { e.preventDefault(); document.getElementById('kelasForm').requestSubmit(); }} disabled={saving}>
                                        {saving ? 'Menyimpan...' : 'Simpan Data'}
                                    </Button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const DashboardAdmin = () => (
            <div className="space-y-6">
                <div>
                    <h2 className="text-2xl font-bold text-gray-800">Dashboard Admin</h2>
                    <p className="text-gray-500">Ringkasan perizinan pondok secara keseluruhan.</p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <StatCard title="Total Pengajuan Hari Ini" value="0" icon={<Icons.FileText />} color="bg-blue-50 text-blue-600" />
                    <StatCard title="Santri Keluar" value="0" icon={<Icons.Scan />} color="bg-yellow-50 text-yellow-600" />
                    <StatCard title="Santri Kembali" value="0" icon={<Icons.Users />} color="bg-emerald-50 text-emerald-600" />
                    <StatCard title="Terlambat" value="0" icon={<Icons.Settings />} color="bg-red-50 text-red-600" />
                </div>
                <Card>
                    <h3 className="font-semibold text-lg mb-4">Integrasi Google Sheets Terhubung</h3>
                    <p className="text-gray-600 text-sm">Dashboard statistik akan diaktifkan setelah tabel PERIZINAN dan SCAN_LOG selesai dirancang di Phase berikutnya.</p>
                </Card>
            </div>
        );

        const LoginPage = () => {
            const { login } = useContext(AuthContext);
            const { showToast } = useContext(ToastContext);
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    const res = await apiService.request('login', { username, password });
                    
                    // PROTEKSI: Mencegah layar putih jika Backend (GAS) memberikan data kosong
                    if (!res.data || !res.data.role) {
                        throw new Error("Login ditolak oleh server. Harap pastikan Code.gs sudah di-Deploy ulang (New deployment) di Google Apps Script.");
                    }

                    login(res.data);
                    showToast(`Selamat datang, ${res.data.nama}`, 'success');
                } catch (err) {
                    showToast(err.message, 'error');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
                    <div className="sm:mx-auto sm:w-full sm:max-w-md text-center">
                        <div className="mx-auto w-16 h-16 bg-emerald-600 rounded-full flex items-center justify-center text-white mb-4 shadow-lg shadow-emerald-200">
                            <Icons.FileText />
                        </div>
                        <h2 className="text-3xl font-extrabold text-gray-900">PPM Al-Islam</h2>
                        <p className="mt-2 text-sm text-gray-600">Sistem Management Perizinan Keluar Santri</p>
                    </div>

                    <div className="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
                        <Card className="py-8 px-4 sm:px-10">
                            <form className="space-y-6" onSubmit={handleSubmit}>
                                <Input name="username" label="Username" value={username} onChange={(e) => setUsername(e.target.value)} required placeholder="Masukkan username" />
                                <Input name="password" label="Password" type="password" value={password} onChange={(e) => setPassword(e.target.value)} required placeholder="••••••••" />
                                
                                <Button type="submit" fullWidth disabled={loading}>
                                    {loading ? 'Memverifikasi...' : 'Masuk ke Sistem'}
                                </Button>
                            </form>
                        </Card>
                    </div>
                </div>
            );
        };

        const MainRouter = ({ currentRoute }) => {
            const { user } = useContext(AuthContext);

            if (currentRoute === 'dashboard') {
                switch (user.role) {
                    case ROLES.ADMIN: return <DashboardAdmin />;
                    case ROLES.SEKRETARIS_MUDIR: return <div className="p-4">Dashboard Sekretaris Belum Aktif</div>;
                    default: return <div className="p-4">Dashboard Role Ini Belum Aktif</div>;
                }
            }

            if (currentRoute === 'master_santri' && user.role === ROLES.ADMIN) {
                return <DataSantriPage />;
            }
            if (currentRoute === 'master_kelas' && user.role === ROLES.ADMIN) {
                return <MasterKelasPage />;
            }
            if (currentRoute === 'tahun_pelajaran' && user.role === ROLES.ADMIN) {
                return <TahunPelajaranPage />;
            }
            
            return (
                <div className="flex flex-col items-center justify-center py-20 text-center">
                    <Icons.FileText />
                    <h3 className="mt-4 text-lg font-medium text-gray-900">Modul {currentRoute}</h3>
                    <p className="mt-1 text-gray-500">Modul ini akan dibangun pada fase pengembangan berikutnya.</p>
                </div>
            );
        };

        function App() {
            const [user, setUser] = useState(null);
            const [toast, setToast] = useState(null);

            const showToast = (message, type = 'success') => setToast({ message, type });

            const authValue = {
                user,
                login: (userData) => setUser(userData),
                logout: () => setUser(null)
            };

            return (
                <ToastContext.Provider value={{ showToast }}>
                    <AuthContext.Provider value={authValue}>
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                        
                        {!user ? (
                            <LoginPage />
                        ) : (
                            <Layout>
                                <MainRouter />
                            </Layout>
                        )}
                    </AuthContext.Provider>
                </ToastContext.Provider>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
