<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Perizinan Santri Al-Islam</title>
    
    <!-- Tailwind & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <!-- Tom Select (Dropdown Searchable) -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.default.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow: hidden; height: 100vh; }
        .loader { border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* TomSelect Tailwind Fix */
        .ts-control { border: 1px solid #cbd5e1 !important; border-radius: 0.5rem !important; padding: 0.6rem 1rem !important; font-family: 'Inter', sans-serif; box-shadow: none !important; }
        .ts-control.focus { border-color: #16a34a !important; box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.2) !important; }
        .ts-dropdown { border-radius: 0.5rem !important; margin-top: 4px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        
        /* Scanner Fix */
        #reader { width: 100%; border-radius: 12px; overflow: hidden; border: none !important; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); background: black;}
        #reader__dashboard_section_csr button { background: #16a34a; color: white; padding: 8px 16px; border-radius: 6px; border: none; font-weight: 500; cursor:pointer;}
    </style>
</head>
<body class="text-slate-800 antialiased">

    <!-- Kontainer Utama SPA -->
    <div id="app" class="h-full w-full flex flex-col"></div>

    <!-- Container Notifikasi -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxvAOtmIhJs807NRg_Q_4t2KpARj-yzEzDIoC__1Dw6QnD5zq-qF0ggsjTGqp7xarDX1g/exec";

        const App = {
            state: { user: null, token: null, html5QrCode: null },
            
            init: () => {
                const savedToken = localStorage.getItem('token');
                const savedUser = localStorage.getItem('user');
                if (savedToken && savedUser) {
                    App.state.token = savedToken;
                    App.state.user = JSON.parse(savedUser);
                    App.router('dashboard');
                } else {
                    App.router('login');
                }
            },

            api: {
                post: async (action, data = {}) => {
                    try {
                        const payload = { action, data };
                        if (App.state.token) payload.data.token = App.state.token;
                        const response = await fetch(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify(payload)
                        });
                        return await response.json();
                    } catch (error) {
                        return { success: false, message: "Koneksi ke server gagal." };
                    }
                }
            },

            ui: {
                showToast: (msg, type = 'success') => {
                    const toast = document.createElement('div');
                    toast.className = `px-6 py-3 rounded-lg shadow-lg text-white font-medium text-sm transition-opacity duration-300 ${type === 'success' ? 'bg-green-600' : 'bg-red-600'}`;
                    toast.innerHTML = `<i class="ph ${type === 'success' ? 'ph-check-circle' : 'ph-warning-circle'}"></i> ${msg}`;
                    document.getElementById('toast-container').appendChild(toast);
                    setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
                }
            },

            views: {
                login: () => `
                    <div class="h-screen flex items-center justify-center bg-slate-100 p-4">
                        <div class="max-w-sm w-full bg-white rounded-2xl shadow-xl overflow-hidden">
                            <div class="bg-green-700 p-6 text-center text-white">
                                <i class="ph ph-shield-check text-5xl mb-2"></i>
                                <h1 class="text-xl font-bold">Pondok Pesantren Al-Islam</h1>
                                <p class="text-green-200 text-xs mt-1 uppercase tracking-wider">Sistem Perizinan Santri</p>
                            </div>
                            <form id="form-login" class="p-6 space-y-4">
                                <div>
                                    <label class="block text-sm text-slate-600 mb-1">Username</label>
                                    <input type="text" id="username" class="w-full px-4 py-2 border rounded-lg focus:ring-green-500 outline-none" required>
                                </div>
                                <div>
                                    <label class="block text-sm text-slate-600 mb-1">Password</label>
                                    <input type="password" id="password" class="w-full px-4 py-2 border rounded-lg focus:ring-green-500 outline-none" required>
                                </div>
                                <button type="submit" id="btn-login" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded-lg transition-colors flex justify-center items-center h-10">
                                    Masuk Aplikasi
                                </button>
                            </form>
                        </div>
                    </div>
                `,

                layout: (content) => `
                    <div class="flex h-screen bg-slate-50 w-full">
                        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col z-20">
                            <div class="h-16 flex items-center px-6 bg-slate-950 font-bold text-white text-lg tracking-wide border-b border-slate-800">
                                <i class="ph ph-shield-check text-green-500 mr-2 text-2xl"></i> Al-Islam
                            </div>
                            <div class="p-4 flex flex-col gap-1 flex-1 overflow-y-auto" id="nav-links">
                                ${App.views.navLinks(App.state.user.role)}
                            </div>
                            <div class="p-4 bg-slate-950 border-t border-slate-800 text-center">
                                <div class="text-sm font-bold text-white truncate">${App.state.user.nama}</div>
                                <div class="text-xs text-slate-500 mb-3">${App.state.user.role.replace('_',' ')}</div>
                                <button onclick="App.actions.logout()" class="w-full bg-slate-800 hover:bg-red-900 hover:text-red-400 py-2 rounded-lg text-sm transition-colors"><i class="ph ph-sign-out"></i> Keluar</button>
                            </div>
                        </aside>
                        <main class="flex-1 flex flex-col min-w-0">
                            <header class="h-16 bg-white border-b border-slate-200 flex items-center px-6 justify-between shrink-0 shadow-sm z-10">
                                <h2 class="font-bold text-slate-800 text-lg" id="page-title">Dashboard</h2>
                            </header>
                            <div class="flex-1 overflow-auto p-6 relative" id="app-content">${content}</div>
                        </main>
                    </div>
                `,

                navLinks: (role) => {
                    let links = `<button onclick="App.router('dashboard')" class="nav-btn flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm hover:bg-slate-800 hover:text-white transition-colors w-full text-left" data-route="dashboard"><i class="ph ph-squares-four text-lg"></i> Dashboard</button>`;
                    if (role === 'ADMIN') {
                        links += `
                            <button onclick="App.router('master-santri')" class="nav-btn flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm hover:bg-slate-800 hover:text-white transition-colors w-full text-left" data-route="master-santri"><i class="ph ph-users text-lg"></i> Data Santri</button>
                            <button onclick="App.router('master-kelas')" class="nav-btn flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm hover:bg-slate-800 hover:text-white transition-colors w-full text-left" data-route="master-kelas"><i class="ph ph-chalkboard text-lg"></i> Data Kelas</button>
                        `;
                    } else if (role === 'WALI_KELAS') {
                        links += `
                            <button onclick="App.router('ajukan-izin')" class="nav-btn flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm hover:bg-slate-800 hover:text-white transition-colors w-full text-left" data-route="ajukan-izin"><i class="ph ph-paper-plane-tilt text-lg"></i> Ajukan Izin</button>
                            <button onclick="App.router('histori-izin')" class="nav-btn flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm hover:bg-slate-800 hover:text-white transition-colors w-full text-left" data-route="histori-izin"><i class="ph ph-history text-lg"></i> Histori Izin</button>
                        `;
                    } else if (role === 'SEKRETARIS_MUDIR') {
                        links += `<button onclick="App.router('approval-izin')" class="nav-btn flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm hover:bg-slate-800 hover:text-white transition-colors w-full text-left" data-route="approval-izin"><i class="ph ph-check-square text-lg"></i> Approval Izin</button>`;
                    } else if (role === 'SECURITY') {
                        links += `<button onclick="App.router('scanner')" class="nav-btn flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm hover:bg-slate-800 hover:text-white transition-colors w-full text-left" data-route="scanner"><i class="ph ph-scan text-lg"></i> Pos Scanner</button>`;
                    }
                    return links;
                },

                dashboard: (stats) => `
                    <div class="mb-6 flex justify-between items-center">
                        <div>
                            <h1 class="text-2xl font-bold text-slate-800">Statistik Real-time</h1>
                            <p class="text-sm text-slate-500">Update status perizinan dan pergerakan santri.</p>
                        </div>
                        <button onclick="App.actions.initDashboard()" class="bg-white border shadow-sm hover:bg-slate-50 px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2"><i class="ph ph-arrows-clockwise"></i> Refresh</button>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        <div class="bg-white rounded-xl p-5 border shadow-sm flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-2xl"><i class="ph ph-files"></i></div>
                            <div><p class="text-xs text-slate-500 font-bold uppercase">Total Pengajuan</p><p class="text-2xl font-black text-slate-800">${stats.total || 0}</p></div>
                        </div>
                        <div class="bg-white rounded-xl p-5 border shadow-sm flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-yellow-100 text-yellow-600 flex items-center justify-center text-2xl"><i class="ph ph-hourglass-high"></i></div>
                            <div><p class="text-xs text-slate-500 font-bold uppercase">Menunggu</p><p class="text-2xl font-black text-slate-800">${stats.menunggu || 0}</p></div>
                        </div>
                        <div class="bg-white rounded-xl p-5 border shadow-sm flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-2xl"><i class="ph ph-check-circle"></i></div>
                            <div><p class="text-xs text-slate-500 font-bold uppercase">Disetujui</p><p class="text-2xl font-black text-slate-800">${stats.disetujui || 0}</p></div>
                        </div>
                    </div>

                    <h3 class="font-bold text-slate-700 mb-3 uppercase tracking-wide text-sm border-b pb-2">Status Gerbang Utama (Scan)</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-slate-800 rounded-xl p-5 shadow-sm text-white relative overflow-hidden">
                            <i class="ph ph-sign-out absolute -right-4 -bottom-4 text-7xl text-slate-700 opacity-50"></i>
                            <p class="text-xs text-slate-400 font-bold uppercase mb-1">Sudah Keluar</p>
                            <p class="text-3xl font-black">${stats.keluar || 0}</p>
                        </div>
                        <div class="bg-green-600 rounded-xl p-5 shadow-sm text-white relative overflow-hidden">
                            <i class="ph ph-sign-in absolute -right-4 -bottom-4 text-7xl text-green-800 opacity-50"></i>
                            <p class="text-xs text-green-200 font-bold uppercase mb-1">Sudah Kembali</p>
                            <p class="text-3xl font-black">${stats.kembali || 0}</p>
                        </div>
                        <div class="bg-red-500 rounded-xl p-5 shadow-sm text-white relative overflow-hidden">
                            <i class="ph ph-warning-circle absolute -right-4 -bottom-4 text-7xl text-red-700 opacity-50"></i>
                            <p class="text-xs text-red-200 font-bold uppercase mb-1">Masih Di Luar</p>
                            <p class="text-3xl font-black">${stats.masih_diluar || 0}</p>
                        </div>
                    </div>
                    
                    ${App.state.user.role === 'ADMIN' ? `<div class="mt-8 bg-orange-50 p-4 border border-orange-200 rounded-lg"><h4 class="font-bold text-orange-800 mb-2">Developer Tools</h4><button onclick="App.actions.generateDummy()" class="bg-orange-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-orange-700">Buat Data Dummy Otomatis</button></div>` : ''}
                `,

                formIzin: (optionsSantri, optionsSaudara) => `
                    <div class="max-w-2xl bg-white rounded-xl shadow-sm border overflow-hidden mx-auto">
                        <div class="bg-green-600 p-4 text-white"><h3 class="font-bold text-lg"><i class="ph ph-paper-plane-tilt"></i> Form Pengajuan Izin</h3></div>
                        <form id="form-izin" class="p-6 space-y-4">
                            <div>
                                <label class="block text-sm font-medium mb-1 text-slate-700">Pilih Santri di Kelas Anda *</label>
                                <select id="izin-santri" required class="w-full p-2.5 border rounded-lg outline-none focus:border-green-500 bg-slate-50">${optionsSantri}</select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1 text-slate-700">Keperluan Izin *</label>
                                <textarea id="izin-keperluan" required rows="2" class="w-full p-2.5 border rounded-lg outline-none focus:border-green-500"></textarea>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium mb-1 text-slate-700">Tujuan Kota/Alamat *</label>
                                    <input type="text" id="izin-tujuan" required class="w-full p-2.5 border rounded-lg outline-none focus:border-green-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1 text-slate-700">Penjemput (Wali Safar) *</label>
                                    <input type="text" id="izin-wali" required class="w-full p-2.5 border rounded-lg outline-none focus:border-green-500">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium mb-1 text-slate-700">Hubungan Penjemput *</label>
                                    <select id="izin-hubungan" required class="w-full p-2.5 border rounded-lg outline-none focus:border-green-500 bg-white">
                                        <option value="">-- Pilih --</option><option value="Ayah">Ayah</option><option value="Ibu">Ibu</option><option value="Kakak Kandung">Kakak Kandung</option><option value="Paman">Paman</option><option value="Lainnya">Lainnya...</option>
                                    </select>
                                </div>
                                <div id="div-lainnya" class="hidden">
                                    <label class="block text-sm font-medium mb-1 text-slate-700">Sebutkan Hubungan *</label>
                                    <input type="text" id="izin-lainnya" class="w-full p-2.5 border rounded-lg outline-none focus:border-green-500">
                                </div>
                            </div>

                            <div class="border rounded-lg p-4 bg-slate-50 mt-2">
                                <label class="flex items-center gap-2 cursor-pointer font-bold text-slate-700">
                                    <input type="checkbox" id="izin-ikut-saudara" class="w-5 h-5 text-green-600 rounded"> Ikut Jadwal Saudara (Kakak/Adik)
                                </label>
                                <div id="div-saudara" class="hidden mt-3 pt-3 border-t">
                                    <label class="block text-sm font-medium mb-1 text-slate-700">Cari dan Pilih Kakak/Adik *</label>
                                    <select id="izin-saudara" autocomplete="off" class="w-full text-sm outline-none">${optionsSaudara}</select>
                                    
                                    <div id="div-saudara-manual" class="hidden mt-3">
                                        <label class="block text-sm font-medium mb-1 text-red-600"><i class="ph ph-warning"></i> Nama Saudara (Manual) *</label>
                                        <input type="text" id="izin-saudara-manual" placeholder="Contoh: Fulan - Kelas XI" class="w-full p-2 border border-red-300 rounded-lg">
                                    </div>
                                </div>
                            </div>

                            <button type="submit" id="btn-submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition-colors mt-4">Kirim Pengajuan</button>
                        </form>
                    </div>
                `,

                approval: (permits) => `
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                        ${permits.length > 0 ? permits.map(p => `
                            <div class="bg-white rounded-xl shadow-sm border p-5 relative" id="card-${p.permit_id}">
                                <span class="absolute top-4 right-4 bg-yellow-100 text-yellow-700 text-xs font-bold px-2 py-1 rounded">MENUNGGU</span>
                                <h3 class="font-bold text-slate-800 text-lg">${p.nama_santri}</h3>
                                <p class="text-sm text-slate-500 mb-3">${p.jenjang} | Kelas ${p.nama_kelas}</p>
                                <div class="bg-slate-50 rounded p-3 text-sm space-y-1 mb-4 border border-slate-100">
                                    <p><span class="text-slate-500">Tujuan:</span> ${p.tujuan}</p>
                                    <p><span class="text-slate-500">Keperluan:</span> ${p.keperluan}</p>
                                    <p><span class="text-slate-500">Penjemput:</span> ${p.wali_safar} (${p.hubungan_wali})</p>
                                    ${p.keterangan_luar_jadwal ? `<p class="text-red-600 text-xs font-bold mt-2"><i class="ph ph-warning"></i> ${p.keterangan_luar_jadwal}</p>` : ''}
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="App.actions.approve('${p.permit_id}')" class="flex-1 bg-green-600 text-white font-bold py-2 rounded-lg text-sm hover:bg-green-700"><i class="ph ph-check"></i> Setujui</button>
                                    <button onclick="App.actions.reject('${p.permit_id}')" class="flex-1 bg-red-100 text-red-600 font-bold py-2 rounded-lg text-sm hover:bg-red-200"><i class="ph ph-x"></i> Tolak</button>
                                </div>
                            </div>
                        `).join('') : `<div class="col-span-full py-12 text-center text-slate-500">Tidak ada pengajuan baru.</div>`}
                    </div>
                `,

                historiList: (permits) => `
                    <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
                                <tr><th class="p-4">Santri</th><th class="p-4">Tgl (Otomatis)</th><th class="p-4">Keperluan</th><th class="p-4">Penjemput</th><th class="p-4">Status</th><th class="p-4 text-center">Aksi (QR)</th></tr>
                            </thead>
                            <tbody>
                                ${permits.length > 0 ? permits.map(p => `
                                    <tr class="border-t hover:bg-slate-50">
                                        <td class="p-4 font-bold text-slate-800">${p.nama_santri}</td>
                                        <td class="p-4">${p.tanggal_izin_format}</td>
                                        <td class="p-4 text-slate-600 truncate max-w-[150px]">${p.keperluan}</td>
                                        <td class="p-4">${p.wali_safar}</td>
                                        <td class="p-4">
                                            <span class="px-2 py-1 rounded text-xs font-bold ${p.status_pengajuan === 'DISETUJUI' ? 'bg-green-100 text-green-700' : p.status_pengajuan === 'DITOLAK' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'}">${p.status_pengajuan}</span>
                                        </td>
                                        <td class="p-4 text-center">
                                            ${p.status_pengajuan === 'DISETUJUI' ? `<button onclick="App.actions.showQR('${p.qr_token}', '${p.nama_santri}', '${p.jenjang} / ${p.nama_kelas}', '${p.tanggal_izin_format}', '${p.wali_safar}', '${p.hubungan_wali}', '${p.keperluan}')" class="bg-slate-800 text-white px-3 py-1.5 rounded hover:bg-slate-700"><i class="ph ph-qr-code"></i> Lihat QR</button>` : '-'}
                                        </td>
                                    </tr>
                                `).join('') : `<tr><td colspan="6" class="p-8 text-center text-slate-500">Belum ada histori</td></tr>`}
                            </tbody>
                        </table>
                    </div>

                    <!-- Modal QR -->
                    <div id="qr-modal" class="hidden fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4">
                        <div class="bg-white rounded-xl shadow-2xl w-[380px] overflow-hidden relative">
                            <button onclick="document.getElementById('qr-modal').classList.add('hidden')" class="absolute top-3 right-3 text-white z-10 hover:text-slate-200"><i class="ph ph-x text-xl"></i></button>
                            
                            <div class="bg-green-700 p-5 text-center text-white">
                                <h2 class="font-bold text-sm tracking-wide">PONDOK PESANTREN<br>MODERN AL-ISLAM</h2>
                                <p class="text-[10px] text-green-200 mt-1 uppercase tracking-widest font-bold">Kartu Izin Keluar</p>
                            </div>
                            
                            <div class="p-5">
                                <div class="grid grid-cols-2 gap-y-3 mb-4 border-b border-dashed pb-4 text-sm">
                                    <div><p class="text-[10px] text-slate-400 font-bold uppercase">Nama Santri</p><p class="font-bold text-slate-800 truncate" id="qr-nama"></p></div>
                                    <div><p class="text-[10px] text-slate-400 font-bold uppercase">Jenjang/Kelas</p><p class="font-bold text-slate-800" id="qr-kelas"></p></div>
                                    <div><p class="text-[10px] text-slate-400 font-bold uppercase">Tgl Izin</p><p class="font-bold text-slate-800" id="qr-tgl"></p></div>
                                    <div><p class="text-[10px] text-slate-400 font-bold uppercase">Keperluan</p><p class="font-bold text-slate-800 truncate" id="qr-kep"></p></div>
                                </div>
                                <div class="flex items-center justify-between">
                                    <div class="flex-1 pr-2">
                                        <p class="text-[10px] text-slate-400 font-bold uppercase">Penjemput</p>
                                        <p class="font-bold text-slate-800 mb-3" id="qr-wali"></p>
                                        <div class="bg-slate-50 p-2 border rounded text-center">
                                            <p class="text-[9px] text-slate-500 uppercase font-bold">Jam Resmi Izin</p>
                                            <p class="font-black text-green-700">08.00 - 16.00</p>
                                        </div>
                                    </div>
                                    <div class="border p-1 rounded-lg bg-white shadow-sm" id="qr-container"></div>
                                </div>
                            </div>
                            <div class="p-4 bg-slate-50 border-t">
                                <button onclick="App.actions.downloadPNG()" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-lg hover:bg-blue-700 flex items-center justify-center gap-2"><i class="ph ph-download-simple"></i> Unduh Gambar (PNG)</button>
                            </div>
                        </div>
                    </div>
                `,

                scanner: () => `
                    <div class="max-w-md mx-auto">
                        <div class="bg-slate-900 rounded-t-xl p-4 text-center text-white">
                            <h2 class="font-bold text-lg"><i class="ph ph-scan"></i> Scanner Pos Security</h2>
                        </div>
                        <div class="bg-black p-4"><div id="reader"></div></div>
                        <div id="scan-result" class="hidden bg-white rounded-b-xl shadow border p-5 text-center">
                            <div id="scan-badge" class="font-black text-white px-4 py-2 rounded-lg mb-3 inline-block"></div>
                            <h3 id="scan-nama" class="font-bold text-xl text-slate-800 mb-1"></h3>
                            <p id="scan-waktu" class="text-sm text-slate-500 mb-4"></p>
                            <div class="bg-slate-50 p-3 rounded border mb-4">
                                <p class="text-xs text-slate-400 font-bold uppercase mb-1">Status Kedatangan</p>
                                <p id="scan-status" class="font-black text-lg"></p>
                            </div>
                            <button onclick="App.actions.resetScanner()" class="w-full bg-slate-800 text-white font-bold py-3 rounded-lg">Scan Berikutnya</button>
                        </div>
                    </div>
                `
            },

            router: (route) => {
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('bg-slate-800', 'text-white', 'border-l-4', 'border-green-500');
                    if (btn.dataset.route === route) btn.classList.add('bg-slate-800', 'text-white', 'border-l-4', 'border-green-500', 'pl-2');
                });

                const content = document.getElementById('app-content');
                if (content && route !== 'login') {
                    const title = document.getElementById('page-title');
                    title.innerText = route.replace('-', ' ').toUpperCase();
                    content.innerHTML = '<div class="flex justify-center items-center h-64"><div class="loader w-8 h-8 border-4 border-green-600"></div></div>';
                }

                // Stop scanner if active and leaving page
                if(App.state.html5QrCode && route !== 'scanner') { App.state.html5QrCode.stop().catch(()=>{}); }

                switch (route) {
                    case 'login': document.getElementById('app').innerHTML = App.views.login(); document.getElementById('form-login').addEventListener('submit', App.actions.login); break;
                    case 'dashboard': App.actions.initDashboard(); break;
                    case 'ajukan-izin': App.actions.initForm(); break;
                    case 'approval-izin': App.actions.initApproval(); break;
                    case 'histori-izin': App.actions.initHistori(); break;
                    case 'scanner': App.actions.initScanner(); break;
                    default: content.innerHTML = '<div class="p-6 text-slate-500">Menu sedang disiapkan.</div>';
                }
            },

            actions: {
                login: async (e) => {
                    e.preventDefault();
                    const btn = document.getElementById('btn-login'); btn.innerHTML = '<div class="loader w-5 h-5 border-[2px] mx-auto"></div>'; btn.disabled = true;
                    const res = await App.api.post('login', { username: e.target.username.value, password: e.target.password.value });
                    if (res.success) {
                        localStorage.setItem('token', res.data.token); localStorage.setItem('user', JSON.stringify(res.data.user));
                        App.state.token = res.data.token; App.state.user = res.data.user;
                        document.getElementById('app').innerHTML = App.views.layout(''); App.router('dashboard');
                        App.ui.showToast('Login berhasil!');
                    } else { App.ui.showToast(res.message, 'error'); btn.innerHTML = 'Masuk Aplikasi'; btn.disabled = false; }
                },
                logout: () => { localStorage.clear(); location.reload(); },

                initDashboard: async () => {
                    const res = await App.api.post('getDashboardStats');
                    if(res.success) document.getElementById('app-content').innerHTML = App.views.dashboard(res.data);
                },

                generateDummy: async () => {
                    if(!confirm("Isi data sampel ke database?")) return;
                    App.ui.showToast("Memproses...");
                    const res = await App.api.post('generateDummy');
                    if(res.success) { App.ui.showToast("Data dibuat!"); App.router('dashboard'); }
                },

                initForm: async () => {
                    const [resSantri, resAll] = await Promise.all([App.api.post('getSantriByClass'), App.api.post('getAllSantriBasic')]);
                    
                    let opts = '<option value="">-- Pilih Santri --</option>';
                    if (resSantri.success) resSantri.data.forEach(s => opts += `<option value="${s.santri_id}">${s.nama_santri} (${s.jk})</option>`);
                    
                    let optsSdr = '<option value="">-- Cari Kakak/Adik --</option>';
                    if (resAll.success) resAll.data.forEach(s => optsSdr += `<option value="${s.santri_id}">${s.nama_santri} (${s.jenjang} ${s.nama_kelas})</option>`);
                    optsSdr += '<option value="NOT_FOUND">-- Saudara Tidak Ada di Sistem --</option>';

                    document.getElementById('app-content').innerHTML = App.views.formIzin(opts, optsSdr);

                    // Hubungan Lainnya Toggle
                    document.getElementById('izin-hubungan').addEventListener('change', (e) => {
                        const div = document.getElementById('div-lainnya');
                        if(e.target.value === 'Lainnya') { div.classList.remove('hidden'); document.getElementById('izin-lainnya').required = true; }
                        else { div.classList.add('hidden'); document.getElementById('izin-lainnya').required = false; }
                    });

                    // TomSelect Setup
                    const tomSelect = new TomSelect("#izin-saudara", { create: false, maxOptions: 50 });
                    
                    // Saudara Toggle
                    document.getElementById('izin-ikut-saudara').addEventListener('change', (e) => {
                        const div = document.getElementById('div-saudara');
                        if(e.target.checked) div.classList.remove('hidden');
                        else { div.classList.add('hidden'); tomSelect.clear(); document.getElementById('div-saudara-manual').classList.add('hidden'); }
                    });

                    tomSelect.on('change', (val) => {
                        const man = document.getElementById('div-saudara-manual');
                        if(val === 'NOT_FOUND') { man.classList.remove('hidden'); document.getElementById('izin-saudara-manual').required = true; }
                        else { man.classList.add('hidden'); document.getElementById('izin-saudara-manual').required = false; }
                    });

                    // Form Submit
                    document.getElementById('form-izin').addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const btn = document.getElementById('btn-submit'); btn.innerHTML = 'Memproses...'; btn.disabled = true;
                        
                        let sdrId = tomSelect.getValue();
                        let ketLuar = '';
                        if (document.getElementById('izin-ikut-saudara').checked && sdrId === 'NOT_FOUND') {
                            ketLuar = '[PERLU VERIFIKASI] Manual: ' + document.getElementById('izin-saudara-manual').value; sdrId = '';
                        }

                        const payload = {
                            santri_id: document.getElementById('izin-santri').value,
                            keperluan: document.getElementById('izin-keperluan').value,
                            tujuan: document.getElementById('izin-tujuan').value,
                            wali_safar: document.getElementById('izin-wali').value,
                            hubungan_wali: document.getElementById('izin-hubungan').value,
                            hubungan_lainnya: document.getElementById('izin-lainnya').value,
                            ikut_saudara: document.getElementById('izin-ikut-saudara').checked,
                            saudara_id: sdrId,
                            keterangan_luar_jadwal: ketLuar
                        };
                        
                        const res = await App.api.post('createPermit', payload);
                        if(res.success) { App.ui.showToast('Berhasil dikirim!'); App.router('histori-izin'); }
                        else { App.ui.showToast('Gagal mengirim', 'error'); btn.innerHTML = 'Kirim'; btn.disabled = false; }
                    });
                },

                initApproval: async () => {
                    const res = await App.api.post('getPendingPermits');
                    if (res.success) document.getElementById('app-content').innerHTML = App.views.approval(res.data);
                },
                approve: async (id) => {
                    if(!confirm('Setujui izin ini?')) return;
                    const res = await App.api.post('approvePermit', { permit_id: id });
                    if(res.success) { App.ui.showToast('Disetujui!'); document.getElementById(`card-${id}`).remove(); }
                },
                reject: async (id) => {
                    const alasan = prompt('Alasan tolak:'); if(!alasan) return;
                    const res = await App.api.post('rejectPermit', { permit_id: id, alasan });
                    if(res.success) { App.ui.showToast('Ditolak!'); document.getElementById(`card-${id}`).remove(); }
                },

                initHistori: async () => {
                    const res = await App.api.post('getMyPermits');
                    if (res.success) document.getElementById('app-content').innerHTML = App.views.historiList(res.data);
                },

                showQR: (token, nama, kelas, tgl, wali, hub, kep) => {
                    window.activeQR = { nama, kelas, tgl, wali: `${wali} (${hub})`, kep: kep || "-" };
                    document.getElementById('qr-nama').innerText = nama; document.getElementById('qr-kelas').innerText = kelas;
                    document.getElementById('qr-tgl').innerText = tgl; document.getElementById('qr-kep').innerText = window.activeQR.kep;
                    document.getElementById('qr-wali').innerText = window.activeQR.wali;
                    
                    const div = document.getElementById('qr-container'); div.innerHTML = '';
                    new QRCode(div, { text: token, width: 85, height: 85, colorDark: "#000", colorLight: "#fff", correctLevel: QRCode.CorrectLevel.H });
                    document.getElementById('qr-modal').classList.remove('hidden');
                },

                downloadPNG: () => {
                    const data = window.activeQR; if(!data) return;
                    const cvs = document.createElement('canvas'); const ctx = cvs.getContext('2d');
                    cvs.width = 450; cvs.height = 250;
                    
                    ctx.fillStyle = "#fff"; ctx.fillRect(0,0,450,250);
                    ctx.fillStyle = "#15803d"; ctx.fillRect(0,0,450,70);
                    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.font = "bold 16px Arial"; ctx.fillText("PONDOK PESANTREN MODERN AL-ISLAM", 225, 30);
                    ctx.fillStyle = "#bbf7d0"; ctx.font = "bold 12px Arial"; ctx.letterSpacing = "2px"; ctx.fillText("KARTU IZIN KELUAR", 225, 50);

                    ctx.textAlign = "left"; ctx.fillStyle = "#9ca3af"; ctx.font = "bold 10px Arial";
                    ctx.fillText("NAMA SANTRI", 20, 100); ctx.fillText("JENJANG / KELAS", 160, 100);
                    ctx.fillText("TANGGAL IZIN", 20, 140); ctx.fillText("KEPERLUAN", 160, 140);
                    ctx.fillText("PENJEMPUT", 20, 180); ctx.fillText("JAM RESMI IZIN", 20, 220);

                    ctx.fillStyle = "#1e293b"; ctx.font = "bold 13px Arial";
                    ctx.fillText(data.nama, 20, 115); ctx.fillText(data.kelas, 160, 115);
                    ctx.fillText(data.tgl, 20, 155); 
                    let k = data.kep; if(k.length>22) k = k.substring(0,19)+"..."; 
                    ctx.fillText(k, 160, 155);
                    ctx.fillText(data.wali, 20, 195);
                    ctx.fillStyle = "#15803d"; ctx.font = "bold 14px Arial"; ctx.fillText("08.00 - 16.00", 20, 235);

                    const qr = document.querySelector("#qr-container canvas");
                    if(qr) {
                        ctx.strokeStyle = "#e2e8f0"; ctx.lineWidth = 2; ctx.strokeRect(330, 115, 95, 95);
                        ctx.drawImage(qr, 332, 117, 91, 91);
                        ctx.fillStyle = "#9ca3af"; ctx.textAlign = "center"; ctx.font = "9px Arial"; ctx.fillText("Scan Exit/Return", 377, 225);
                    }
                    const link = document.createElement('a'); link.download = `Izin_${data.nama.replace(/\s/g,'_')}.png`;
                    link.href = cvs.toDataURL(); link.click();
                },

                initScanner: () => {
                    document.getElementById('app-content').innerHTML = App.views.scanner();
                    if(App.state.html5QrCode) App.state.html5QrCode.clear();
                    App.state.html5QrCode = new Html5Qrcode("reader");
                    
                    App.state.html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, async (token) => {
                        App.state.html5QrCode.stop();
                        document.getElementById('reader').classList.add('hidden');
                        document.getElementById('scan-result').classList.remove('hidden');
                        
                        const badge = document.getElementById('scan-badge'); badge.innerHTML = "Memproses..."; badge.className = "font-black text-white px-4 py-2 rounded-lg mb-3 inline-block bg-slate-500";
                        
                        const res = await App.api.post('scanQR', { qr_token: token });
                        if(res.success) {
                            const isExit = res.data.scan_type === 'EXIT';
                            badge.className = `font-black text-white px-4 py-2 rounded-lg mb-3 inline-block ${isExit ? 'bg-yellow-500' : 'bg-green-500'}`;
                            badge.innerHTML = `<i class="ph ${isExit ? 'ph-sign-out' : 'ph-sign-in'}"></i> SCAN ${res.data.scan_type} BERHASIL`;
                            document.getElementById('scan-nama').innerText = res.data.nama_santri;
                            document.getElementById('scan-waktu').innerText = "Waktu: " + res.data.waktu;
                            const stat = document.getElementById('scan-status'); stat.innerText = res.data.status_waktu;
                            stat.className = `font-black text-lg ${res.data.status_waktu.includes('TERLAMBAT') ? 'text-red-600' : 'text-green-600'}`;
                        } else {
                            badge.className = "font-black text-white px-4 py-2 rounded-lg mb-3 inline-block bg-red-600";
                            badge.innerHTML = `<i class="ph ph-warning-circle"></i> SCAN DITOLAK`;
                            document.getElementById('scan-nama').innerText = "Akses Dilarang";
                            document.getElementById('scan-status').innerText = res.message;
                            document.getElementById('scan-status').className = "font-black text-lg text-red-600";
                        }
                    }).catch(err => { App.ui.showToast('Gagal buka kamera', 'error'); });
                },

                resetScanner: () => {
                    document.getElementById('scan-result').classList.add('hidden');
                    document.getElementById('reader').classList.remove('hidden');
                    App.actions.initScanner();
                }
            }
        };

        window.addEventListener('DOMContentLoaded', () => { if(document.getElementById('app')) App.init(); });
    </script>
</body>
</html>
