<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Perizinan Santri | Al-Islam</title>
    <!-- Tailwind CSS (Foundation Styling) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#166534', // Hijau pesantren
                        secondary: '#bbf7d0',
                        accent: '#facc15'
                    }
                }
            }
        }
    </script>
    <style>
        /* Base styles */
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f3f4f6; }
        .hidden { display: none !important; }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; width: 20px; height: 20px; animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen overflow-hidden">

    <!-- 1. NOTIFICATION TOAST -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- MODAL FORM TAMBAH DATA (TAMBAHAN BARU) -->
    <div id="modal-container" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center px-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden transform transition-all">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 id="modal-title" class="text-lg font-bold text-gray-800">Tambah Data</h3>
                <button onclick="App.UI.closeModal()" class="text-gray-400 hover:text-red-500 transition">
                    <i class="fa-solid fa-times text-xl"></i>
                </button>
            </div>
            <div class="px-6 py-4 max-h-[70vh] overflow-y-auto">
                <form id="modal-form" onsubmit="App.MasterData.submitForm(event)">
                    <div id="modal-body" class="flex flex-col gap-4">
                        <!-- Form inputs di-generate dinamis di sini -->
                    </div>
                    <div class="mt-6 flex justify-end gap-3 pt-4 border-t border-gray-100">
                        <button type="button" onclick="App.UI.closeModal()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">Batal</button>
                        <button type="submit" id="modal-btn-save" class="px-4 py-2 text-sm font-medium text-white bg-primary rounded-lg hover:bg-green-700 flex items-center">
                            <span id="modal-btn-text">Simpan Data</span>
                            <div id="modal-spinner" class="spinner ml-2 hidden !w-4 !h-4 !border-2"></div>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 2. LOGIN VIEW -->
    <div id="view-login" class="h-screen flex items-center justify-center bg-gray-100 hidden">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md mx-4">
            <div class="text-center mb-8">
                <div class="bg-primary text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-mosque text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">Perizinan Al-Islam</h1>
                <p class="text-sm text-gray-500 mt-1">Sistem Management Perizinan Keluar Santri</p>
            </div>

            <form id="form-login" onsubmit="App.Auth.handleLogin(event)">
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2" for="username">Username</label>
                    <input type="text" id="username" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary focus:border-primary transition" placeholder="Masukkan username" required>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2" for="password">Password</label>
                    <input type="password" id="password" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary focus:border-primary transition" placeholder="Masukkan password" required>
                </div>
                <button type="submit" id="btn-login" class="w-full bg-primary hover:bg-green-800 text-white font-semibold py-3 px-4 rounded-lg flex justify-center items-center transition">
                    <span id="text-login">Masuk Sistem</span>
                    <div id="spinner-login" class="spinner ml-2 hidden"></div>
                </button>
            </form>
        </div>
    </div>

    <!-- 3. DASHBOARD SHELL (APP VIEW) -->
    <div id="view-app" class="h-screen flex flex-col md:flex-row hidden">
        
        <!-- Sidebar -->
        <aside id="sidebar" class="bg-primary text-white w-full md:w-64 flex-shrink-0 flex flex-col transition-all duration-300 transform -translate-x-full md:translate-x-0 fixed md:static h-full z-40">
            <div class="p-4 flex items-center justify-between border-b border-green-700">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-mosque text-xl"></i>
                    <span class="font-bold tracking-wider">AL-ISLAM</span>
                </div>
                <button class="md:hidden text-white" onclick="App.UI.toggleSidebar()">
                    <i class="fa-solid fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="p-4 flex items-center gap-3 border-b border-green-700 bg-green-900 bg-opacity-30">
                <div class="w-10 h-10 rounded-full bg-green-700 flex items-center justify-center font-bold" id="user-initial">A</div>
                <div class="flex flex-col">
                    <span class="font-semibold text-sm truncate" id="user-name">Loading...</span>
                    <span class="text-xs text-green-300" id="user-role">Role</span>
                </div>
            </div>

            <nav class="flex-1 overflow-y-auto py-4 px-2" id="sidebar-nav">
                <!-- Navigation items injected dynamically by Role -->
            </nav>

            <div class="p-4 border-t border-green-700">
                <button onclick="App.Auth.handleLogout()" class="w-full flex items-center gap-3 px-4 py-2 text-sm text-green-100 hover:bg-green-700 rounded-lg transition">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Wrapper -->
        <div class="flex-1 flex flex-col min-w-0 bg-gray-50 h-full overflow-hidden">
            <!-- Topbar Mobile -->
            <header class="bg-white shadow-sm h-16 flex items-center justify-between px-4 md:hidden z-30">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-mosque text-primary"></i>
                    <span class="font-bold text-gray-800">Al-Islam</span>
                </div>
                <button class="text-gray-600 hover:text-primary" onclick="App.UI.toggleSidebar()">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
            </header>

            <!-- Main Scrollable Area -->
            <main class="flex-1 overflow-y-auto p-4 md:p-8" id="main-content">
                
                <!-- PAGE: DASHBOARD -->
                <div id="page-dash" class="app-page">
                    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                        <h2 class="text-2xl font-bold text-gray-800 mb-2">Dashboard Utama</h2>
                        <p class="text-gray-600">Sistem Management Perizinan Keluar Santri.</p>
                        <p class="text-gray-600 mt-4 font-semibold text-sm bg-blue-50 p-3 rounded text-blue-800">
                            <i class="fa-solid fa-circle-check mr-2"></i> Phase 1 & 2 Aktif. API URL berhasil dikonfigurasi.
                        </p>
                    </div>
                </div>

                <!-- PAGE: MASTER DATA (DYNAMIC SHELL) -->
                <div id="page-master" class="app-page hidden flex flex-col gap-4">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                        <div class="flex justify-between items-center mb-4">
                            <h3 id="md-title" class="text-lg font-semibold text-gray-800">Master Data</h3>
                            <button id="md-btn-add" class="hidden bg-primary text-white px-3 py-1.5 rounded text-sm hover:bg-green-700 transition">
                                <i class="fa-solid fa-plus mr-1"></i> Tambah Data
                            </button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead id="md-thead" class="bg-gray-50 border-y border-gray-200 text-sm text-gray-600">
                                    <!-- Table headers injected here -->
                                </thead>
                                <tbody id="md-tbody" class="text-sm divide-y divide-gray-100">
                                    <tr><td class="py-4 text-center text-gray-500">Pilih menu master data di sidebar untuk memuat data.</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </main>
        </div>
        
        <!-- Mobile Sidebar Overlay -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden md:hidden" onclick="App.UI.toggleSidebar()"></div>
    </div>

    <!-- ============================================================================== -->
    <!-- APPLICATION LOGIC (MODULES) -->
    <!-- ============================================================================== -->
    <script>
        const App = {
            // 1. CONFIGURATION
            Config: {
                API_URL: 'https://script.google.com/macros/s/AKfycbw7uGghBuDXMNUjhUrOVltKlPVYMHQ47jvXF2NNu_VLHjzuRM4sxWXE0i24jF2gTute0A/exec'
            },

            // 2. STATE MANAGEMENT
            State: {
                user: null,
                token: localStorage.getItem('auth_token') || null
            },

            // 3. API SERVICE LAYER
            API: {
                async post(action, data = {}) {
                    const payload = {
                        action: action,
                        token: App.State.token,
                        data: data
                    };

                    try {
                        const response = await fetch(App.Config.API_URL, {
                            method: 'POST',
                            body: JSON.stringify(payload)
                        });
                        
                        if (!response.ok) throw new Error("Koneksi ke server gagal");
                        const result = await response.json();
                        
                        // Handle Token Expired
                        if (!result.success && result.code === 'UNAUTHORIZED') {
                            App.Auth.forceLogout();
                        }
                        
                        return result;
                    } catch (error) {
                        console.error('API Error:', error);
                        return { success: false, message: 'Terjadi kesalahan jaringan. Periksa koneksi Anda.' };
                    }
                }
            },

            // 4. AUTHENTICATION MODULE
            Auth: {
                async handleLogin(e) {
                    e.preventDefault();
                    
                    const userVal = document.getElementById('username').value;
                    const passVal = document.getElementById('password').value;
                    const btnText = document.getElementById('text-login');
                    const spinner = document.getElementById('spinner-login');
                    const btn = document.getElementById('btn-login');
                    
                    // UI Loading State
                    btn.disabled = true;
                    btn.classList.add('opacity-80');
                    btnText.innerText = 'Memproses...';
                    spinner.classList.remove('hidden');

                    const response = await App.API.post('login', { username: userVal, password: passVal });
                    
                    // Revert UI Loading
                    btn.disabled = false;
                    btn.classList.remove('opacity-80');
                    btnText.innerText = 'Masuk Sistem';
                    spinner.classList.add('hidden');

                    if (response.success) {
                        App.State.token = response.data.token;
                        App.State.user = response.data;
                        localStorage.setItem('auth_token', response.data.token);
                        localStorage.setItem('user_data', JSON.stringify(response.data));
                        
                        App.UI.showToast('Login berhasil!', 'success');
                        App.UI.renderApp();
                    } else {
                        App.UI.showToast(response.message, 'error');
                    }
                },

                async handleLogout() {
                    if(!confirm('Apakah Anda yakin ingin keluar?')) return;
                    App.UI.showToast('Sedang keluar sistem...', 'info');
                    await App.API.post('logout'); // Fire and forget
                    this.forceLogout();
                },

                forceLogout() {
                    App.State.token = null;
                    App.State.user = null;
                    localStorage.removeItem('auth_token');
                    localStorage.removeItem('user_data');
                    App.UI.showLogin();
                },

                async checkSession() {
                    if (!App.State.token) {
                        App.UI.showLogin();
                        return;
                    }

                    // Recover user data from local to speed up initial load
                    const savedUser = localStorage.getItem('user_data');
                    if (savedUser) {
                        App.State.user = JSON.parse(savedUser);
                        App.UI.renderApp();
                    }

                    // Verify with backend silently
                    const response = await App.API.post('getCurrentUser');
                    if (response.success) {
                        App.State.user = response.data;
                        localStorage.setItem('user_data', JSON.stringify(response.data));
                        App.UI.updateUserInfo();
                    } else {
                        this.forceLogout();
                    }
                }
            },

            // 5. UI CONTROLLER
            UI: {
                showLogin() {
                    document.getElementById('view-app').classList.add('hidden');
                    document.getElementById('view-login').classList.remove('hidden');
                    // Reset form
                    document.getElementById('form-login').reset();
                },

                renderApp() {
                    document.getElementById('view-login').classList.add('hidden');
                    document.getElementById('view-app').classList.remove('hidden');
                    this.updateUserInfo();
                    this.renderSidebar();
                },

                updateUserInfo() {
                    if (!App.State.user) return;
                    const name = App.State.user.nama || 'User';
                    document.getElementById('user-name').innerText = name;
                    document.getElementById('user-role').innerText = App.State.user.role.replace('_', ' ');
                    document.getElementById('user-initial').innerText = name.charAt(0).toUpperCase();
                },

                renderSidebar() {
                    const role = App.State.user.role;
                    const navContainer = document.getElementById('sidebar-nav');
                    let menus = [];

                    // Role-Based Menu Definition with Sections
                    if (role === 'ADMIN') {
                        menus = [
                            { id: 'dash', label: 'Dashboard', icon: 'fa-chart-pie', type: 'menu' },
                            { label: 'MASTER DATA', type: 'header' },
                            { id: 'master_TAHUN_PELAJARAN', label: 'Tahun Pelajaran', icon: 'fa-calendar', type: 'menu' },
                            { id: 'master_KELAS', label: 'Data Kelas', icon: 'fa-chalkboard-teacher', type: 'menu' },
                            { id: 'master_SANTRI', label: 'Data Santri', icon: 'fa-users', type: 'menu' },
                            { id: 'master_USERS', label: 'Data Users', icon: 'fa-user-shield', type: 'menu' },
                            { label: 'OPERASIONAL', type: 'header' },
                            { id: 'jadwal', label: 'Jadwal Perizinan', icon: 'fa-calendar-alt', type: 'menu' },
                            { id: 'laporan', label: 'Laporan', icon: 'fa-print', type: 'menu' },
                            { id: 'settings', label: 'Pengaturan', icon: 'fa-cog', type: 'menu' }
                        ];
                    } else if (role === 'WALI_KELAS') {
                        menus = [
                            { id: 'dash', label: 'Dashboard Kelas', icon: 'fa-home', type: 'menu' },
                            { label: 'PERIZINAN', type: 'header' },
                            { id: 'pengajuan', label: 'Ajukan Izin', icon: 'fa-plus-circle', type: 'menu' },
                            { id: 'histori', label: 'Histori Santri', icon: 'fa-history', type: 'menu' }
                        ];
                    } else if (role === 'SEKRETARIS_MUDIR') {
                        menus = [
                            { id: 'dash', label: 'Dashboard Real-Time', icon: 'fa-chart-line', type: 'menu' },
                            { label: 'VERIFIKASI', type: 'header' },
                            { id: 'approval', label: 'Screening & Approval', icon: 'fa-check-double', type: 'menu' }
                        ];
                    } else if (role === 'SECURITY') {
                        menus = [
                            { id: 'scan', label: 'SCAN QR', icon: 'fa-qrcode', type: 'menu' },
                            { label: 'MONITORING', type: 'header' },
                            { id: 'monitor', label: 'Santri di Luar', icon: 'fa-binoculars', type: 'menu' }
                        ];
                    }

                    // Build DOM
                    navContainer.innerHTML = '';
                    menus.forEach((menu, index) => {
                        // Render Section Header
                        if (menu.type === 'header') {
                            const header = document.createElement('div');
                            header.className = 'px-4 py-2 mt-4 mb-1 text-xs font-bold text-green-300 opacity-70 tracking-wider';
                            header.innerText = menu.label;
                            navContainer.appendChild(header);
                            return;
                        }

                        // Render Menu Items
                        const activeClass = menu.id === 'dash' ? 'bg-green-700 text-white menu-active' : 'text-green-100 hover:bg-green-800';
                        const a = document.createElement('a');
                        a.href = '#';
                        a.className = `flex items-center gap-3 px-4 py-3 rounded-lg mb-1 transition menu-item ${activeClass}`;
                        a.innerHTML = `<i class="fa-solid ${menu.icon} w-5 text-center"></i><span class="font-medium text-sm">${menu.label}</span>`;
                        
                        a.onclick = (e) => {
                            e.preventDefault();
                            // Update active styles
                            document.querySelectorAll('.menu-item').forEach(child => {
                                child.classList.remove('bg-green-700', 'text-white', 'menu-active');
                                child.classList.add('text-green-100');
                            });
                            a.classList.remove('text-green-100');
                            a.classList.add('bg-green-700', 'text-white', 'menu-active');
                            App.UI.toggleSidebar(true);
                            
                            // Route to page
                            App.Pages.switch(menu.id);
                        };

                        navContainer.appendChild(a);
                    });
                },

                toggleSidebar(forceClose = false) {
                    const sidebar = document.getElementById('sidebar');
                    const overlay = document.getElementById('sidebar-overlay');
                    
                    if (forceClose || !sidebar.classList.contains('-translate-x-full')) {
                        // Close
                        sidebar.classList.add('-translate-x-full');
                        overlay.classList.add('hidden');
                    } else {
                        // Open
                        sidebar.classList.remove('-translate-x-full');
                        overlay.classList.remove('hidden');
                    }
                },

                showToast(message, type = 'info') {
                    // ... existing toast logic ...
                    setTimeout(() => {
                        toast.classList.add('opacity-0');
                        setTimeout(() => toast.remove(), 300);
                    }, 3000);
                },

                // METHOD BARU UNTUK MODAL
                closeModal() {
                    document.getElementById('modal-container').classList.add('hidden');
                    document.getElementById('modal-form').reset();
                }
            },

            // 6. PAGE ROUTER (NEW)
            Pages: {
                switch(pageId) {
                    document.querySelectorAll('.app-page').forEach(el => el.classList.add('hidden'));
                    
                    let targetId = `page-${pageId}`;
                    let isMasterData = false;
                    let masterEntity = null;

                    // Dynamic detection for Master Data routes
                    if (pageId.startsWith('master_')) {
                        targetId = 'page-master';
                        isMasterData = true;
                        masterEntity = pageId.replace('master_', '');
                    }

                    const target = document.getElementById(targetId);
                    
                    if(target) {
                        target.classList.remove('hidden');
                    } else {
                        // Fallback for unimplemented modules
                        document.getElementById('page-dash').classList.remove('hidden');
                        App.UI.showToast('Modul dalam tahap pengembangan (MVP).', 'info');
                    }

                    // Trigger data fetch if a master data menu is clicked
                    if(isMasterData && masterEntity) {
                        App.MasterData.load(masterEntity);
                    }
                }
            },

            // 7. MASTER DATA MODULE (NEW)
            MasterData: {
                currentEntity: null,
                
                // Skema Form Dinamis
                schemas: {
                    'TAHUN_PELAJARAN': [
                        { name: 'nama_tahun', label: 'Nama Tahun Pelajaran (Misal: 2026/2027)', type: 'text', required: true }
                    ],
                    'KELAS': [
                        { name: 'nama_kelas', label: 'Nama Kelas (Misal: VII-A)', type: 'text', required: true },
                        { name: 'jenjang', label: 'Jenjang', type: 'select', options: ['SMP', 'SMA'], required: true },
                        { name: 'tahun_pelajaran_id', label: 'ID Tahun Pelajaran', type: 'text', required: true, note: 'Ambil dari data Tahun Pelajaran' },
                        { name: 'wali_kelas_id', label: 'ID Wali Kelas (User ID)', type: 'text', required: true, note: 'Ambil dari data Users' }
                    ],
                    'SANTRI': [
                        { name: 'nama_santri', label: 'Nama Lengkap Santri', type: 'text', required: true },
                        { name: 'jenis_kelamin', label: 'Jenis Kelamin', type: 'select', options: ['Laki-laki', 'Perempuan'], required: true },
                        { name: 'jenjang', label: 'Jenjang', type: 'select', options: ['SMP', 'SMA'], required: true },
                        { name: 'kelas_id', label: 'ID Kelas', type: 'text', required: true, note: 'Ambil dari data Kelas' },
                        { name: 'kota_asal', label: 'Kota Asal', type: 'text', required: true },
                        { name: 'nama_ayah', label: 'Nama Ayah', type: 'text', required: true },
                        { name: 'nomor_telepon', label: 'Nomor Telepon WA (08...)', type: 'text', required: true }
                    ],
                    'USERS': [
                        { name: 'username', label: 'Username Login', type: 'text', required: true },
                        { name: 'password', label: 'Password (Minimal 6 karakter)', type: 'password', required: true },
                        { name: 'nama', label: 'Nama Lengkap', type: 'text', required: true },
                        { name: 'role', label: 'Hak Akses (Role)', type: 'select', options: ['ADMIN', 'WALI_KELAS', 'SEKRETARIS_MUDIR', 'SECURITY'], required: true },
                        { name: 'jenjang', label: 'Jenjang (Opsional, khusus Wali Kelas)', type: 'select', options: ['', 'SMP', 'SMA'], required: false },
                        { name: 'kelas_id', label: 'ID Kelas (Opsional, khusus Wali Kelas)', type: 'text', required: false }
                    ]
                },

                async load(entity) {
                    this.currentEntity = entity;
                    document.getElementById('md-title').innerText = `Data ${entity.replace('_', ' ')}`;
                    document.getElementById('md-tbody').innerHTML = `<tr><td class="py-4 text-center text-gray-500"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Memuat data...</td></tr>`;
                    document.getElementById('md-thead').innerHTML = '';
                    
                    const btnAdd = document.getElementById('md-btn-add');
                    btnAdd.classList.remove('hidden');
                    
                    // Hubungkan tombol tambah dengan method showModal
                    btnAdd.onclick = () => this.showModal();

                    const response = await App.API.post('getMasterData', { entity: entity });
                    
                    if(response.success) {
                        this.renderTable(response.data);
                    } else {
                        document.getElementById('md-tbody').innerHTML = `<tr><td class="py-4 text-center text-red-500">Gagal memuat data: ${response.message}</td></tr>`;
                    }
                },

                renderTable(data) {
                    const thead = document.getElementById('md-thead');
                    const tbody = document.getElementById('md-tbody');
                    
                    if(!data || data.length === 0) {
                        tbody.innerHTML = `<tr><td class="py-4 text-center text-gray-500">Belum ada data tersedia.</td></tr>`;
                        thead.innerHTML = '';
                        return;
                    }

                    // Ambil kunci unik dari objek data pertama, saring kolom internal sistem yang sensitif
                    const keys = Object.keys(data[0]).filter(k => k !== 'password_hash' && k !== 'session_token');
                    
                    let trHead = '<tr>';
                    keys.forEach(k => {
                        trHead += `<th class="py-3 px-4 font-semibold uppercase tracking-wider text-xs">${k.replace(/_/g, ' ')}</th>`;
                    });
                    trHead += '</tr>';
                    thead.innerHTML = trHead;

                    // Generate Rows dengan penanganan aman untuk berbagai tipe nilai
                    let trBody = '';
                    data.forEach(row => {
                        trBody += '<tr class="hover:bg-gray-50 transition">';
                        keys.forEach(k => {
                            let val = row[k];
                            
                            // Format tanggal ISO jika ada
                            if(val && typeof val === 'string' && (val.includes('T') && val.includes('Z') || !isNaN(Date.parse(val)) && val.length > 10)) {
                                try {
                                    val = new Date(val).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
                                } catch(e) { /* fallback */ }
                            }
                            
                            // Format badge status jika kolom status
                            if(k === 'status' || k === 'status_santri') {
                                const color = val === 'AKTIF' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800';
                                val = `<span class="px-2 py-1 text-xs font-semibold rounded-full ${color}">${val}</span>`;
                            }
                            
                            trBody += `<td class="py-3 px-4 text-gray-700">${val !== undefined && val !== null && val !== '' ? val : '-'}</td>`;
                        });
                        trBody += '</tr>';
                    });
                    tbody.innerHTML = trBody;
                },

                // Tampilkan Modal Form
                showModal() {
                    const entity = this.currentEntity;
                    const schema = this.schemas[entity];
                    if(!schema) {
                        App.UI.showToast('Skema form belum dikonfigurasi untuk entitas ini.', 'error');
                        return;
                    }

                    document.getElementById('modal-title').innerText = `Tambah ${entity.replace('_', ' ')}`;
                    const container = document.getElementById('modal-body');
                    container.innerHTML = '';

                    // Generate HTML Form Dinamis
                    schema.forEach(field => {
                        let inputHtml = '';
                        const requiredAttr = field.required ? 'required' : '';
                        
                        if (field.type === 'select') {
                            let options = field.options.map(opt => `<option value="${opt}">${opt === '' ? '-- Kosongkan jika tidak perlu --' : opt}</option>`).join('');
                            inputHtml = `<select id="field_${field.name}" name="${field.name}" class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-primary focus:border-primary" ${requiredAttr}>${options}</select>`;
                        } else {
                            inputHtml = `<input type="${field.type}" id="field_${field.name}" name="${field.name}" class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-primary focus:border-primary" ${requiredAttr}>`;
                        }

                        const noteHtml = field.note ? `<p class="text-xs text-gray-500 mt-1"><i class="fa-solid fa-circle-info mr-1"></i>${field.note}</p>` : '';

                        container.innerHTML += `
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1" for="field_${field.name}">${field.label}</label>
                                ${inputHtml}
                                ${noteHtml}
                            </div>
                        `;
                    });

                    document.getElementById('modal-container').classList.remove('hidden');
                },

                // Submit Form ke Backend
                async submitForm(e) {
                    e.preventDefault();
                    
                    const btnSave = document.getElementById('modal-btn-save');
                    const btnText = document.getElementById('modal-btn-text');
                    const spinner = document.getElementById('modal-spinner');
                    
                    // Loading State
                    btnSave.disabled = true;
                    btnText.innerText = 'Menyimpan...';
                    spinner.classList.remove('hidden');

                    // Kumpulkan data dari form
                    const formData = {};
                    const schema = this.schemas[this.currentEntity];
                    schema.forEach(field => {
                        formData[field.name] = document.getElementById(`field_${field.name}`).value;
                    });

                    // Kirim ke API
                    const response = await App.API.post('createMasterData', {
                        entity: this.currentEntity,
                        formData: formData
                    });

                    // Revert Loading State
                    btnSave.disabled = false;
                    btnText.innerText = 'Simpan Data';
                    spinner.classList.add('hidden');

                    if(response.success) {
                        App.UI.showToast(response.message, 'success');
                        App.UI.closeModal();
                        this.load(this.currentEntity); // Reload tabel
                    } else {
                        App.UI.showToast(response.message, 'error');
                    }
                }
            },

            // 8. INITIALIZATION
            init() {
                console.log("App Initializing - Phase 1");
                if (this.Config.API_URL === 'ISI_URL_WEB_APP_ANDA_DISINI') {
                    this.UI.showToast('WARNING: Konfigurasi API URL belum diatur.', 'error');
                }
                this.Auth.checkSession();
            }
        };

        // Boot the app when DOM is ready
        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
