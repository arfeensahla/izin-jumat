                if (form.hubungan_wali === 'Lainnya' && !form.hubungan_lainnya) return showToast("Detail hubungan Lainnya wajib diisi!", "error");
                
                // Cegah error jika checkbox tidak sengaja kecentang tapi status asli sudah sesuai
                if (statusJadwalAsli === 'Di Luar Jadwal' && form.ikut_jadwal_saudara && !form.saudara_santri_id) {
                    return showToast("Pilih santri saudara yang diikuti jadwalnya!", "error");
                }

                setSubmitting(true);
                try {
                    const payload = { 
                        ...form, 
                        hubungan_wali: form.hubungan_wali === 'Lainnya' ? form.hubungan_lainnya : form.hubungan_wali,
                        // Bersihkan data sampah saudara jika ternyata dia lolos secara mandiri
                        ikut_jadwal_saudara: statusJadwalAsli === 'Sesuai Jadwal' ? false : form.ikut_jadwal_saudara,
                        saudara_santri_id: statusJadwalAsli === 'Sesuai Jadwal' ? '' : form.saudara_santri_id,
                        nama_santri: selectedSantri.nama || selectedSantri.nama_santri, 
                        kelas: selectedSantri.kelas, 
                        tanggal_izin: helper.formatDate(nextFriday), 
                        status_jadwal: statusJadwal 
                    };
                    await apiService.request('savePermit', payload);
                    showToast('Pengajuan berhasil dikirim! Menunggu approval.', 'success');

                    // --- KAMERA PENGINTAI: LOG PENGAJUAN ---
                    apiService.request('saveLog', {
                        role: user.role,
                        nama: user.nama,
                        aksi: 'AJUKAN_IZIN',
                        keterangan: `Mengajukan izin keluar untuk ${selectedSantri.nama || selectedSantri.nama_santri} (Kelas ${selectedSantri.kelas})`
                    }).catch(e => console.log("Log error:", e));
                    // ---------------------------------------
                    
                    setForm(initialForm);
                    setSearchSaudaraTerm(''); 
                    setCurrentRoute('histori');
                } catch (e) { showToast(e.message, 'error'); } finally { setSubmitting(false); }
            };

            const santriOptions = santriData.map(s => ({ value: (s.santri_id || s.nis || s.id), label: `${s.nama || s.nama_santri} (${s.kelas})` }));
            const hubunganOptions = ['Ayah', 'Ibu', 'Kakak Kandung', 'Adik Kandung', 'Kakek', 'Nenek', 'Paman', 'Bibi', 'Lainnya'];

            if (loading) return <div className="p-8 text-center text-gray-500 animate-pulse">Menyiapkan Form (Membaca data dari Google Sheets)...</div>;

            return (
                <div className="space-y-6 animate-fade-in-down max-w-4xl">
                    <div><h2 className="text-2xl font-bold text-gray-800">Ajukan Izin Keluar</h2><p className="text-gray-500">Sistem otomatis menghitung penjadwalan pekan ini berdasarkan identitas santri.</p></div>
                    <form onSubmit={handleSubmit} className="space-y-6">
                        <Card>
                            <h3 className="text-lg font-bold text-gray-700 border-b pb-2 mb-4">1. Identitas Santri</h3>
                            <Select name="santri_id" label={<>Pilih Santri di Kelas {user.kelas_id} <span className="text-red-500">*</span></>} required options={santriOptions} value={form.santri_id} onChange={(e) => setForm({...form, santri_id: e.target.value})} />
                            {selectedSantri && (<div className="bg-emerald-50 border border-emerald-100 rounded-lg p-4 grid grid-cols-3 gap-4 text-sm mt-4"><div><p className="text-gray-500">Jenjang</p><p className="font-bold text-emerald-800">{selectedSantri.jenjang || '-'}</p></div><div><p className="text-gray-500">Kelas</p><p className="font-bold text-emerald-800">{selectedSantri.kelas || '-'}</p></div><div><p className="text-gray-500">Gender</p><p className="font-bold text-emerald-800">{selectedSantri.gender || selectedSantri.jk || '-'}</p></div></div>)}
                        </Card>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <Card>
                                <h3 className="text-lg font-bold text-gray-700 border-b pb-2 mb-4">2. Detail Perizinan</h3>
                                <div className="mb-4">
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Keperluan Izin <span className="text-red-500">*</span></label>
                                    <textarea required rows="2" className="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none" value={form.keperluan} onChange={(e) => setForm({...form, keperluan: e.target.value})} placeholder="Contoh: Membeli Kebutuhan Santri"></textarea>
                                </div>
                                <Input label={<>Tujuan Keluar (Tempat/Kota) <span className="text-red-500">*</span></>} required value={form.tujuan} onChange={(e) => setForm({...form, tujuan: e.target.value})} placeholder="Contoh: Bandung" />
                            </Card>
                            <Card>
                                <h3 className="text-lg font-bold text-gray-700 border-b pb-2 mb-4">3. Wali Safar (Penjemput)</h3>
                                <Input label={<>Nama Wali Safar <span className="text-red-500">*</span></>} required value={form.wali_safar} onChange={(e) => setForm({...form, wali_safar: e.target.value})} placeholder="Nama penjemput" />
                                <Select label={<>Hubungan Wali Safar <span className="text-red-500">*</span></>} required options={hubunganOptions} value={form.hubungan_wali} onChange={(e) => setForm({...form, hubungan_wali: e.target.value})} />
                                {form.hubungan_wali === 'Lainnya' && (<Input label={<>Detail Hubungan Lainnya <span className="text-red-500">*</span></>} required value={form.hubungan_lainnya} onChange={(e) => setForm({...form, hubungan_lainnya: e.target.value})} placeholder="Sebutkan hubungannya..." />)}
                            </Card>
                        </div>
                        
                        {selectedSantri && (
                        <Card className={statusJadwal === 'Sesuai Jadwal' ? 'border-emerald-300 ring-1 ring-emerald-300' : 'border-yellow-400 ring-1 ring-yellow-400'}>
                            <div className="flex flex-col md:flex-row justify-between items-start gap-4 border-b pb-4 mb-4">
                                <div><h3 className="text-lg font-bold text-gray-800">4. Analisis Penjadwalan</h3><p className="text-sm text-gray-600 mt-1">Tanggal Izin: <strong className="text-gray-900">{helper.formatDate(nextFriday)}</strong> (Pekan {weekNumber})</p></div>
                                <div className={`px-4 py-2 rounded-full font-bold text-sm ${statusJadwal === 'Sesuai Jadwal' ? 'bg-emerald-100 text-emerald-800' : 'bg-yellow-100 text-yellow-800'}`}>Status: {statusJadwal}</div>
                            </div>
                            <div className="space-y-4">
                                
                                {/* CEK STATUS ASLI: Jika Sesuai Jadwal, Sembunyikan Checkbox Kakak/Adik! */}
                                {statusJadwalAsli === 'Di Luar Jadwal' && (
                                    <>
                                        <label className="flex items-center gap-3 p-3 border rounded-lg bg-gray-50 cursor-pointer hover:bg-gray-100 transition-colors">
                                            <input type="checkbox" className="w-5 h-5 text-emerald-600 rounded" checked={form.ikut_jadwal_saudara} onChange={(e) => { setForm({...form, ikut_jadwal_saudara: e.target.checked, saudara_santri_id: ''}); setSearchSaudaraTerm(''); }} />
                                            <span className="font-medium text-gray-700">Mengikuti Jadwal Kakak / Adik Lintas Kelas</span>
                                        </label>
                                        
                                        {form.ikut_jadwal_saudara && (
                                            <div className="pl-8 p-4 bg-blue-50 border border-blue-100 rounded-lg animate-fade-in-down space-y-3">
                                                <label className="block text-sm font-medium text-blue-900">Cari Nama Saudara <span className="text-red-500">*</span></label>
                                                <input 
                                                    type="text" 
                                                    placeholder="Ketik nama saudara..." 
                                                    className="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                                                    value={searchSaudaraTerm}
                                                    onChange={(e) => {
                                                        setSearchSaudaraTerm(e.target.value);
                                                        setForm({...form, saudara_santri_id: ''}); 
                                                    }}
                                                />
                                                {searchSaudaraTerm && !form.saudara_santri_id && (
                                                    <div className="max-h-40 overflow-y-auto border border-blue-200 rounded-lg bg-white shadow-sm mt-1">
                                                        {allSantriData
                                                            .filter(s => (s.santri_id || s.nis || s.id) !== form.santri_id)
                                                            .filter(s => String(s.nama || s.nama_santri).toLowerCase().includes(searchSaudaraTerm.toLowerCase()))
                                                            .slice(0, 5) 
                                                            .map(s => {
                                                                const id = s.santri_id || s.nis || s.id;
                                                                return (
                                                                    <div 
                                                                        key={id} 
                                                                        className="p-3 cursor-pointer hover:bg-blue-50 text-sm border-b last:border-0"
                                                                        onClick={() => {
                                                                            setForm({...form, saudara_santri_id: id});
                                                                            setSearchSaudaraTerm(`${s.nama || s.nama_santri} (Kelas: ${s.kelas})`); 
                                                                        }}
                                                                    >
                                                                        <span className="font-bold text-gray-800">{s.nama || s.nama_santri}</span> 
                                                                        <span className="text-gray-500 text-xs ml-1">({s.kelas} - {s.gender || s.jk})</span>
                                                                    </div>
                                                                );
                                                            })
                                                        }
                                                    </div>
                                                )}
                                                {selectedSaudara && <p className="text-xs text-blue-700 mt-2">Sistem sekarang menggunakan jadwal milik saudara: <strong className="uppercase">{selectedSaudara.jenjang} - {selectedSaudara.gender || selectedSaudara.jk}</strong>.</p>}
                                            </div>
                                        )}
                                    </>
                                )}
                                
                                {statusJadwal === 'Di Luar Jadwal' && (
                                    <div className="mt-4 p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
                                        <label className="block text-sm font-bold text-yellow-800 mb-2">Karena izin di luar jadwal, wajib mengisi alasan berikut: <span className="text-red-500">*</span></label>
                                        <textarea required rows="2" className="w-full px-4 py-2 rounded-lg border border-yellow-300 focus:ring-2 focus:ring-yellow-500 outline-none" value={form.keterangan_luar_jadwal} onChange={(e) => setForm({...form, keterangan_luar_jadwal: e.target.value})} placeholder="Alasan izin di luar pekan yang ditentukan..."></textarea>
                                    </div>
                                )}
                            </div>
                        </Card>
                        )}
                        <Button type="submit" disabled={!selectedSantri || submitting} fullWidth className="py-4 text-lg shadow-lg">{submitting ? 'Memproses ke Database...' : 'Kirim Pengajuan Izin'}</Button>
                    </form>
                </div>
            );
        };

        // --- HISTORI KELAS PAGE ---
        const HistoriKelasPage = () => {
            const { user } = useContext(AuthContext); 
            const { showToast } = useContext(ToastContext);
            const [permits, setPermits] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedQrPermit, setSelectedQrPermit] = useState(null);

            // --- STATE UNTUK PENCARIAN & FILTER ---
            const [searchTerm, setSearchTerm] = useState('');
            const [filterBulan, setFilterBulan] = useState('');
            const [filterStatus, setFilterStatus] = useState('');
            const [filterMobilitas, setFilterMobilitas] = useState(''); 
            
            const [sortConfig, setSortConfig] = useState({ key: 'tanggal_izin', direction: 'desc' });

            const getBulanTahun = (tgl) => {
                if (!tgl) return '-';
                const strTgl = String(tgl).trim();
                const d = new Date(strTgl);
                if (!isNaN(d.getTime())) return d.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
                const parts = strTgl.split(/[\/\- ]/);
                if (parts.length >= 3) {
                    const monthNames = ["", "Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
                    let m = parseInt(parts[1], 10);
                    let y = parts[2].length === 4 ? parts[2] : (parts[0].length === 4 ? parts[0] : parts[2]); 
                    if (m >= 1 && m <= 12 && String(y).length === 4) return `${monthNames[m]} ${y}`;
                }
                return strTgl; 
            };

            const fetchData = async () => {
                setLoading(true);
                try { 
                    const [resPermits, resLogs] = await Promise.all([
                        apiService.request('getPermits'),
                        apiService.request('getScanLogs')
                    ]);
                    
                    let finalPermits = [];
                    if (resPermits && resPermits.data && Array.isArray(resPermits.data.data)) finalPermits = resPermits.data.data;
                    else if (resPermits && Array.isArray(resPermits.data)) finalPermits = resPermits.data;
                    else if (Array.isArray(resPermits)) finalPermits = resPermits;

                    let finalLogs = [];
                    if (resLogs && resLogs.data && Array.isArray(resLogs.data.data)) finalLogs = resLogs.data.data;
                    else if (resLogs && Array.isArray(resLogs.data)) finalLogs = resLogs.data;
                    else if (Array.isArray(resLogs)) finalLogs = resLogs;

                    let myPermits = finalPermits.filter(p => p.kelas === user.kelas_id);
                    
                    const dataWithMobility = myPermits.map(p => {
                        let mobilitas = '-';
                        if (p.status_pengajuan === 'DISETUJUI' || p.status_pengajuan === 'SELESAI') {
                            const pId = p.permit_id || p.id || p.id_perizinan;
                            const myLogs = finalLogs.filter(l => l.permit_id === pId || l.id_perizinan === pId);
                            const hasExit = myLogs.some(l => String(l.tipe_scan||'').toUpperCase() === 'EXIT');
                            const returnLog = myLogs.find(l => String(l.tipe_scan||'').toUpperCase() === 'RETURN');
                            
                            if (!hasExit) mobilitas = 'Belum Keluar';
                            else if (hasExit && !returnLog) mobilitas = 'Masih Di Luar';
                            else if (returnLog) {
                                if (String(returnLog.keterangan||'').toUpperCase().includes('TERLAMBAT')) mobilitas = 'Terlambat';
                                else mobilitas = 'Tepat Waktu';
                            }
                        }

                        return {
                            ...p,
                            _bulan_filter: getBulanTahun(p.tanggal_izin),
                            _status_mobilitas: mobilitas
                        };
                    });
                    setPermits(dataWithMobility); 
                } catch (e) { showToast(e.message, 'error'); } 
                finally { setLoading(false); }
            };

            useEffect(() => {
                if (user.kelas_id) fetchData(); else setLoading(false);
            }, [user.kelas_id]);

            const handleDelete = async (id) => {
                if (!window.confirm('Yakin ingin membatalkan dan menghapus pengajuan izin ini secara permanen?')) return;
                try {
                    await apiService.request('deleteData', { sheetName: 'PERIZINAN', rowId: id });
                    showToast('Pengajuan berhasil dibatalkan/dihapus', 'success');

                    apiService.request('saveLog', {
                        role: user.role,
                        nama: user.nama,
                        aksi: 'BATALKAN_IZIN',
                        keterangan: `Membatalkan/Menghapus data perizinan dengan ID ${id}`
                    }).catch(e => console.log("Log error:", e));
                    
                    fetchData(); 
                } catch (e) { showToast(e.message, 'error'); }
            };

            const bulanOptions = [...new Set(permits.map(p => p._bulan_filter).filter(b => b && b !== '-'))];

            const filteredPermits = permits.filter(p => {
                const nama = String(p.nama_santri || '').toLowerCase();
                const status = String(p.status_pengajuan || '').toUpperCase();
                const bulan = String(p._bulan_filter || '');
                const mobilitas = String(p._status_mobilitas || '');
                
                return (
                    nama.includes(searchTerm.toLowerCase()) &&
                    (filterBulan === '' || bulan === filterBulan) &&
                    (filterStatus === '' || status.includes(filterStatus)) &&
                    (filterMobilitas === '' || mobilitas === filterMobilitas)
                );
            });

            const sortedPermits = [...filteredPermits].sort((a, b) => {
                if (!sortConfig.key) return 0;
                let aValue = a[sortConfig.key] || '';
                let bValue = b[sortConfig.key] || '';
                if (typeof aValue === 'string') aValue = aValue.toLowerCase();
                if (typeof bValue === 'string') bValue = bValue.toLowerCase();
                if (aValue < bValue) return sortConfig.direction === 'asc' ? -1 : 1;
                if (aValue > bValue) return sortConfig.direction === 'asc' ? 1 : -1;
                return 0;
            });

            const handleSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
                setSortConfig({ key, direction });
            };

            const SortIcon = ({ columnKey }) => {
                if (sortConfig.key !== columnKey) return <span className="text-gray-300 ml-1">↕</span>;
                return sortConfig.direction === 'asc' ? <span className="text-emerald-600 ml-1">▲</span> : <span className="text-emerald-600 ml-1">▼</span>;
            };

            const getStatusBadge = (status) => {
                if (!status) return <span className="bg-gray-100 px-2 py-1 text-xs font-bold rounded-full border">-</span>;
                const styles = { 'MENUNGGU': 'bg-yellow-100 text-yellow-800 border-yellow-200', 'MENUNGGU_APPROVAL': 'bg-yellow-100 text-yellow-800 border-yellow-200', 'DISETUJUI': 'bg-emerald-100 text-emerald-800 border-emerald-200', 'DITOLAK': 'bg-red-100 text-red-800 border-red-200', 'SELESAI': 'bg-gray-100 text-gray-800 border-gray-200' };
                const st = status.toUpperCase();
                return <span className={`px-2 py-1 text-xs font-bold rounded-full border ${styles[st] || 'bg-gray-100'}`}>{st.replace('_', ' ')}</span>;
            };

            const getMobilityBadge = (mobilitas) => {
                if (mobilitas === '-') return <span className="text-gray-400">-</span>;
                if (mobilitas === 'Belum Keluar') return <span className="px-2 py-1 text-[10px] font-bold rounded bg-gray-100 text-gray-600 border border-gray-200">BELUM KELUAR</span>;
                if (mobilitas === 'Masih Di Luar') return <span className="px-2 py-1 text-[10px] font-bold rounded bg-orange-100 text-orange-600 border border-orange-200">MASIH DI LUAR</span>;
                if (mobilitas === 'Tepat Waktu') return <span className="px-2 py-1 text-[10px] font-bold rounded bg-emerald-100 text-emerald-700 border border-emerald-200">TEPAT WAKTU</span>;
                if (mobilitas === 'Terlambat') return <span className="px-2 py-1 text-[10px] font-bold rounded bg-red-100 text-red-700 border border-red-200">TERLAMBAT</span>;
                return <span>{mobilitas}</span>;
            };

            return (
                <div className="space-y-6 animate-fade-in-down">
                    <div>
                        <h2 className="text-2xl font-bold text-gray-800">Histori Pengajuan Kelas <span className="text-emerald-700">{user.kelas_id}</span></h2>
                        <p className="text-gray-500">Pantau status approval perizinan yang telah diajukan khusus untuk kelas Anda.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <input 
                            type="text" placeholder="Cari Nama Santri..." 
                            className="w-full p-2.5 border rounded-lg bg-white focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-medium"
                            value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)}
                        />
                        <select className="w-full p-2.5 border rounded-lg bg-white outline-none text-sm font-medium" value={filterBulan} onChange={(e) => setFilterBulan(e.target.value)}>
                            <option value="">Semua Bulan</option>
                            {bulanOptions.map((b, idx) => <option key={idx} value={b}>{b}</option>)}
                        </select>
                        <select className="w-full p-2.5 border rounded-lg bg-white outline-none text-sm font-medium" value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)}>
                            <option value="">Semua Status Approval</option>
                            <option value="MENUNGGU">Menunggu</option>
                            <option value="DISETUJUI">Disetujui</option>
                            <option value="DITOLAK">Ditolak</option>
                            <option value="SELESAI">Selesai</option>
                        </select>
                        <select className="w-full p-2.5 border rounded-lg bg-emerald-50 outline-none text-sm font-bold text-emerald-800" value={filterMobilitas} onChange={(e) => setFilterMobilitas(e.target.value)}>
                            <option value="">Semua Posisi Santri</option>
                            <option value="Masih Di Luar">Masih Di Luar</option>
                            <option value="Tepat Waktu">Kembali Tepat Waktu</option>
                            <option value="Terlambat">Terlambat</option>
                            <option value="Belum Keluar">Belum Keluar</option>
                        </select>
                    </div>

                    <div className="text-sm text-gray-500">
                        Menampilkan <span className="font-bold text-emerald-600">{sortedPermits.length}</span> pengajuan di kelas ini.
                    </div>

                    <Card className="overflow-x-auto p-0">
                        <table className="w-full text-left border-collapse text-sm whitespace-nowrap">
                            <thead>
                                <tr className="bg-emerald-50 text-emerald-800 border-b">
                                    <th className="p-4 font-semibold cursor-pointer select-none hover:bg-emerald-100" onClick={() => handleSort('tanggal_izin')}>
                                        Tgl Izin <SortIcon columnKey="tanggal_izin"/>
                                    </th>
                                    <th className="p-4 font-semibold cursor-pointer select-none hover:bg-emerald-100" onClick={() => handleSort('nama_santri')}>
                                        Santri & Kelas <SortIcon columnKey="nama_santri"/>
                                    </th>
                                    <th className="p-4 font-semibold cursor-pointer select-none hover:bg-emerald-100" onClick={() => handleSort('keperluan')}>
                                        Keperluan <SortIcon columnKey="keperluan"/>
                                    </th>
                                    <th className="p-4 font-semibold cursor-pointer select-none hover:bg-emerald-100" onClick={() => handleSort('status_jadwal')}>
                                        Penjadwalan <SortIcon columnKey="status_jadwal"/>
                                    </th>
                                    <th className="p-4 font-semibold cursor-pointer select-none hover:bg-emerald-100" onClick={() => handleSort('status_pengajuan')}>
                                        Status ACC <SortIcon columnKey="status_pengajuan"/>
                                    </th>
                                    <th className="p-4 font-semibold cursor-pointer select-none hover:bg-emerald-200 bg-emerald-100/50" onClick={() => handleSort('_status_mobilitas')}>
                                        Posisi Santri <SortIcon columnKey="_status_mobilitas"/>
                                    </th>
                                    <th className="p-4 font-semibold">Aksi</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {loading ? <tr><td colSpan="7" className="p-8 text-center text-gray-500">Memuat data histori...</td></tr> : 
                                 sortedPermits.length === 0 ? <tr><td colSpan="7" className="p-8 text-center text-gray-500">Tidak ada pengajuan yang sesuai pencarian.</td></tr> :
                                 sortedPermits.map((p, idx) => (
                                    <tr key={idx} className="hover:bg-gray-50">
                                        <td className="p-4 font-medium text-gray-800">{p.tanggal_izin}</td>
                                        <td className="p-4">
                                            <p className="font-bold text-gray-700">{p.nama_santri}</p>
                                            <p className="text-xs text-emerald-600 font-medium">{p.kelas}</p>
                                        </td>
                                        <td className="p-4 max-w-[250px] whitespace-normal break-words" title={p.keperluan}>
                                            <p className="font-medium text-gray-800">{p.keperluan || '-'}</p>
                                            <p className="text-[11px] text-gray-500 mt-1 leading-tight">
                                            Penjemput: <span className="font-medium text-gray-700">{p.wali_safar}</span> ({p.hubungan_wali})
                                            </p>
                                        </td>
                                        <td className="p-4">
                                            <span className={`px-2 py-1 text-[10px] font-bold rounded-full ${p.status_jadwal === 'Sesuai Jadwal' ? 'bg-blue-100 text-blue-700' : 'bg-red-100 text-red-700'}`}>
                                                {p.status_jadwal ? p.status_jadwal.toUpperCase() : 'TIDAK DIKETAHUI'}
                                            </span>
                                            {(p.ikut_jadwal_saudara === 'Ya' || p.ikut_jadwal_saudara === true || p.ikut_jadwal_saudara === 'TRUE') && (
                                                <p className="text-[10px] text-orange-600 mt-1.5 font-bold italic">
                                                    (Ikut Izin Saudara)
                                                </p>
                                            )}
                                        </td>
                                        <td className="p-4">{getStatusBadge(p.status_pengajuan)}</td>
                                        <td className="p-4 bg-emerald-50/20">{getMobilityBadge(p._status_mobilitas)}</td>
                                        <td className="p-4">
                                            <div className="flex gap-2 items-center">
                                                {p.status_pengajuan === 'DISETUJUI' ? 
                                                    <button onClick={() => setSelectedQrPermit(p)} className="px-3 py-1 bg-emerald-600 text-white rounded text-xs font-bold hover:bg-emerald-700 shadow-sm transition-colors cursor-pointer">Lihat QR</button> 
                                                    : <span className="text-xs text-gray-400 italic">Menunggu</span>
                                                }
                                                <button onClick={() => handleDelete(p.permit_id || p.id || p.id_perizinan)} className="px-3 py-1 bg-red-50 text-red-600 rounded text-xs font-bold hover:bg-red-100 shadow-sm transition-colors cursor-pointer">Batal</button>
                                            </div>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </Card>
                    <QrCardModal isOpen={!!selectedQrPermit} onClose={() => setSelectedQrPermit(null)} permit={selectedQrPermit} />
                </div>
            );
        };

        // --- PHASE 6 COMPONENTS ---
        // --- DASHBOARD SEKRETARIS MUDIR ---
        const DashboardSecretary = () => {
            const { showToast } = useContext(ToastContext);
            const [stats, setStats] = useState({ total_pekan: 0, disetujui_pekan: 0, ditolak_pekan: 0, menunggu_pekan: 0, sudah_keluar: 0, sudah_kembali: 0, masih_di_luar: 0, terlambat: 0, total_bulan: 0 });
            const [loading, setLoading] = useState(true);
            const [lastUpdate, setLastUpdate] = useState(new Date());

            const fetchStats = async () => {
                try {
                    const res = await apiService.request('getDashboardStats');
                    // Pengaman jika data dibungkus objek res.data.data
                    const finalData = (res && res.data && res.data.data) ? res.data.data : (res.data || {});
                    setStats(finalData);
                    setLastUpdate(new Date());
                } catch (e) { console.error(e); } finally { setLoading(false); }
            };

            // Polling every 30 seconds
            useEffect(() => {
                fetchStats();
                const interval = setInterval(fetchStats, 30000);
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="space-y-6 animate-fade-in-down">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Dashboard Sekretaris</h2>
                            <p className="text-sm text-gray-500 mt-1">Update terakhir: {lastUpdate.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}</p>
                        </div>
                        <Button variant="secondary" onClick={() => { setLoading(true); fetchStats(); }} icon={<Icons.Clock />}>{loading ? 'Menyinkronkan...' : 'Refresh Manual'}</Button>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <StatCard title="Total Izin (Bulan Ini)" value={stats.total_bulan || 0} icon={<Icons.Calendar />} color="bg-blue-50 text-blue-600" />
                        <StatCard title="Menunggu Approval" value={stats.menunggu_pekan || 0} icon={<Icons.FileText />} color="bg-yellow-50 text-yellow-600" />
                        <StatCard title="Disetujui (Pekan Ini)" value={stats.disetujui_pekan || 0} icon={<Icons.CheckCircle />} color="bg-emerald-50 text-emerald-600" />
                        <StatCard title="Ditolak (Pekan Ini)" value={stats.ditolak_pekan || 0} icon={<Icons.XCircle />} color="bg-red-50 text-red-600" />
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mt-6 border-t pt-6">
                        <StatCard title="Sudah Keluar" value={stats.sudah_keluar || 0} icon={<Icons.Scan />} color="bg-gray-100 text-gray-600" />
                        <StatCard title="Sudah Kembali" value={stats.sudah_kembali || 0} icon={<Icons.Home />} color="bg-emerald-100 text-emerald-700" />
                        <StatCard title="Masih Di Luar" value={stats.masih_di_luar || 0} icon={<Icons.TrendingUp />} color="bg-orange-50 text-orange-600" />
                        <StatCard title="Terlambat (Bulan Ini)" value={stats.terlambat || 0} icon={<Icons.Clock />} color="bg-red-100 text-red-700" />
                    </div>
                </div>
            );
        };

        // --- SCREENING IZIN ---
        const ScreeningIzinPage = () => {
            const { user } = useContext(AuthContext);
            const { showToast } = useContext(ToastContext);
            const [permits, setPermits] = useState([]);
            const [santriList, setSantriList] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedPermit, setSelectedPermit] = useState(null); // Hanya dipakai untuk modal Penolakan
            const [rejectReason, setRejectReason] = useState('');
            const [processing, setProcessing] = useState(false);

            // State Pencarian dan Filter
            const [searchTerm, setSearchTerm] = useState('');
            const [filterKelas, setFilterKelas] = useState('');

            const fetchPermits = async () => {
                setLoading(true);
                try {
                    const [resPermits, resSantri] = await Promise.all([
                        apiService.request('getPermits'),
                        apiService.request('getSantri')
                    ]);
                    
                    // Ekstrak Aman Perizinan
                    let finalPermits = [];
                    if (resPermits && resPermits.data && Array.isArray(resPermits.data.data)) finalPermits = resPermits.data.data;
                    else if (resPermits && Array.isArray(resPermits.data)) finalPermits = resPermits.data;
                    else if (Array.isArray(resPermits)) finalPermits = resPermits;

                    // Ekstrak Aman Data Santri
                    let finalSantri = [];
                    if (resSantri && resSantri.data && Array.isArray(resSantri.data.data)) finalSantri = resSantri.data.data;
                    else if (resSantri && Array.isArray(resSantri.data)) finalSantri = resSantri.data;
                    else if (Array.isArray(resSantri)) finalSantri = resSantri;

                    // PENAMBAHAN REVERSE() DI SINI AGAR FIFO (Terlama di atas)
                    const pendingPermits = finalPermits
                        .filter(p => p.status_pengajuan === 'MENUNGGU_APPROVAL' || p.status_pengajuan === 'MENUNGGU')
                        .reverse(); 
                    
                    setPermits(pendingPermits);
                    setSantriList(finalSantri);
                } catch (e) { showToast(e.message, 'error'); } finally { setLoading(false); }
            };
            
            useEffect(() => { fetchPermits(); }, []);

            // FUNGSI 1: Eksekusi Setuju Langsung (Sat-Set)
            const handleApprove = async (permit) => {
                if (!window.confirm(`Yakin menyetujui izin untuk ${permit.nama_santri}? QR Code akan otomatis diterbitkan.`)) return;

                setProcessing(true);
                try {
                    const payload = { permit_id: permit.permit_id || permit.id_perizinan, aksi_approval: 'APPROVE', alasan: '', username: user.nama };
                    const res = await apiService.request('processApproval', payload);
                    showToast(`Izin ${permit.nama_santri} berhasil disetujui!`, 'success');

                    apiService.request('saveLog', {
                        role: user.role,
                        nama: user.nama,
                        aksi: 'SCREENING_APPROVE',
                        keterangan: `Memberikan status APPROVE izin atas nama ${permit.nama_santri} (${permit.kelas}).`
                    }).catch(e => console.log("Log error:", e));
                    
                    fetchPermits(); // Refresh data agar kartu langsung hilang
                } catch (e) { showToast(e.message, 'error'); } finally { setProcessing(false); }
            };

            // FUNGSI 2: Eksekusi Tolak (Dari dalam Modal)
            const handleProcessReject = async () => {
                if (!rejectReason) return showToast("Alasan penolakan wajib diisi!", "error");

                setProcessing(true);
                try {
                    const payload = { permit_id: selectedPermit.permit_id || selectedPermit.id_perizinan, aksi_approval: 'REJECT', alasan: rejectReason, username: user.nama };
                    const res = await apiService.request('processApproval', payload);
                    showToast(`Izin ${selectedPermit.nama_santri} berhasil ditolak.`, 'success');

                    apiService.request('saveLog', {
                        role: user.role,
                        nama: user.nama,
                        aksi: 'SCREENING_REJECT',
                        keterangan: `Memberikan status REJECT izin atas nama ${selectedPermit.nama_santri} (${selectedPermit.kelas}). Alasan: ${rejectReason}`
                    }).catch(e => console.log("Log error:", e));
                    
                    setSelectedPermit(null);
                    setRejectReason('');
                    fetchPermits();
                } catch (e) { showToast(e.message, 'error'); } finally { setProcessing(false); }
            };

            const kelasOptions = [...new Set(permits.map(p => p.kelas).filter(Boolean))].sort();

            const filteredPermits = permits.filter(p => {
                const nama = String(p.nama_santri || '').toLowerCase();
                const kelas = String(p.kelas || '');
                const matchSearch = nama.includes(searchTerm.toLowerCase());
                const matchKelas = filterKelas === '' || kelas === filterKelas;
                return matchSearch && matchKelas;
            });

            return (
                <div className="space-y-6 animate-fade-in-down">
                    <div>
                        <h2 className="text-2xl font-bold text-gray-800">Screening Perizinan</h2>
                        <p className="text-gray-500">Tinjau dan berikan persetujuan untuk santri yang akan keluar.</p>
                    </div>
                    
                    {!loading && permits.length > 0 && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input 
                                type="text" 
                                placeholder="Cari Nama Santri di Antrean..." 
                                className="w-full p-2.5 border rounded-lg bg-white focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-medium"
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                            />
                            <select 
                                className="w-full p-2.5 border rounded-lg bg-white outline-none text-sm font-medium"
                                value={filterKelas}
                                onChange={(e) => setFilterKelas(e.target.value)}
                            >
                                <option value="">Semua Kelas</option>
                                {kelasOptions.map((k, idx) => (
                                    <option key={idx} value={k}>{k}</option>
                                ))}
                            </select>
                        </div>
                    )}

                    {loading ? <div className="p-12 text-center text-gray-500">Membaca antrean izin dari server...</div> :
                     permits.length === 0 ? <div className="p-12 text-center bg-white rounded-xl border border-dashed border-gray-300 text-gray-500">Yeay! Tidak ada antrean perizinan saat ini.</div> :
                     filteredPermits.length === 0 ? <div className="p-12 text-center bg-white rounded-xl border border-dashed border-gray-300 text-gray-500">Santri yang dicari tidak ditemukan dalam antrean.</div> :
                     <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {filteredPermits.map((p, idx) => (
                            <Card key={idx} className="flex flex-col justify-between border-l-4 border-yellow-400 hover:shadow-md transition-shadow">
                                <div>
                                    <div className="flex justify-between items-start mb-4 border-b pb-4">
                                        <div>
                                            <h3 className="text-xl font-bold text-gray-900">{p.nama_santri}</h3>
                                            <p className="text-sm text-gray-500">{p.kelas} • Tgl Izin: <strong>{p.tanggal_izin}</strong></p>
                                        </div>
                                        <span className={`px-3 py-1 text-xs font-bold rounded-full ${p.status_jadwal === 'Sesuai Jadwal' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>
                                            {p.status_jadwal}
                                        </span>
                                    </div>
                                    <div className="space-y-2 text-sm text-gray-700 mb-6">
                                        <p><span className="text-gray-500 w-24 inline-block">Keperluan:</span> <strong>{p.keperluan}</strong></p>
                                        <p><span className="text-gray-500 w-24 inline-block">Tujuan:</span> <strong>{p.tujuan}</strong></p>
                                        <p><span className="text-gray-500 w-24 inline-block">Penjemput:</span> <strong>{p.wali_safar} ({p.hubungan_wali})</strong></p>
                                        
                                        {p.status_jadwal === 'Di Luar Jadwal' && (
                                            <div className="mt-3 p-3 bg-red-50 border border-red-100 rounded-lg">
                                                <p className="text-red-800 text-xs font-bold mb-1">ALASAN DI LUAR JADWAL:</p>
                                                <p className="text-red-700 italic">{p.keterangan_luar_jadwal}</p>
                                            </div>
                                        )}
                                        {(p.ikut_jadwal_saudara === 'Ya' || p.ikut_jadwal_saudara === true || p.ikut_jadwal_saudara === 'TRUE') && (
                                            <div className="mt-2 p-2 bg-blue-50 text-blue-800 rounded-lg text-xs font-medium">
                                                {(() => {
                                                    const saudara = santriList.find(s => (s.santri_id || s.nis || s.id) === p.saudara_santri_id);
                                                    return saudara 
                                                        ? `Ikut jadwal saudara: ${saudara.nama || saudara.nama_santri} (${saudara.kelas})` 
                                                        : `Ikut jadwal saudara (ID: ${p.saudara_santri_id})`;
                                                })()}
                                            </div>
                                        )}
                                    </div>
                                </div>
                                {/* PERUBAHAN UI: Dua tombol berdampingan */}
                                <div className="grid grid-cols-2 gap-3 mt-2 border-t pt-4">
                                    <button 
                                        onClick={() => setSelectedPermit(p)} 
                                        disabled={processing}
                                        className="py-2.5 px-4 bg-red-50 text-red-700 hover:bg-red-100 font-bold rounded-lg transition-colors border border-red-200"
                                    >
                                        Tolak Izin
                                    </button>
                                    <button 
                                        onClick={() => handleApprove(p)} 
                                        disabled={processing}
                                        className="py-2.5 px-4 bg-emerald-600 text-white hover:bg-emerald-700 font-bold rounded-lg transition-colors shadow-sm"
                                    >
                                        {processing ? 'Memproses...' : 'Setujui & Buat QR'}
                                    </button>
                                </div>
                            </Card>
                        ))}
                     </div>
                    }

                    {/* MODAL KHUSUS PENOLAKAN */}
                    <Modal isOpen={!!selectedPermit} onClose={() => setSelectedPermit(null)} title="Tolak Pengajuan Izin">
                        {selectedPermit && (
                            <div className="space-y-4">
                                <div className="bg-red-50 p-4 rounded-lg border border-red-100">
                                    <p className="text-sm text-red-600 mb-1">Anda akan menolak izin untuk:</p>
                                    <p className="text-lg font-bold text-red-900">{selectedPermit.nama_santri} ({selectedPermit.kelas})</p>
                                </div>
                                
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2">Alasan Penolakan <span className="text-red-500">*</span></label>
                                    <textarea 
                                        rows="3" 
                                        className="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-500 outline-none" 
                                        placeholder="Contoh: Kuota izin bulan ini sudah habis, alasan kurang mendesak..."
                                        value={rejectReason}
                                        onChange={(e) => setRejectReason(e.target.value)}
                                    ></textarea>
                                </div>
                                
                                <div className="flex gap-3 pt-2">
                                    <button 
                                        className="flex-1 py-2.5 bg-gray-100 text-gray-700 rounded-lg font-bold hover:bg-gray-200 transition-colors"
                                        onClick={() => { setSelectedPermit(null); setRejectReason(''); }}
                                        disabled={processing}
                                    >
                                        Batal
                                    </button>
                                    <button 
                                        className="flex-1 py-2.5 bg-red-600 text-white rounded-lg font-bold hover:bg-red-700 transition-colors shadow-sm"
                                        onClick={handleProcessReject}
                                        disabled={processing}
                                    >
                                        {processing ? 'Memproses...' : 'Kirim Penolakan'}
                                    </button>
                                </div>
                            </div>
                        )}
                    </Modal>
                </div>
            );
        };

        // --- HISTORI GLOBAL SEKRETARIS ---
        const HistoriSekretarisPage = () => {
            const { showToast } = useContext(ToastContext);
            const [permits, setPermits] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedQrPermit, setSelectedQrPermit] = useState(null);

            // --- STATE UNTUK PENCARIAN, FILTER, & SORTING ---
            const [searchTerm, setSearchTerm] = useState('');
            const [filterBulan, setFilterBulan] = useState('');
            const [filterKelas, setFilterKelas] = useState('');
            const [filterStatus, setFilterStatus] = useState('');
            const [filterMobilitas, setFilterMobilitas] = useState(''); // FITUR BARU: Filter Mobilitas
            const [sortConfig, setSortConfig] = useState({ key: 'tanggal_izin', direction: 'desc' });

            const getBulanTahun = (tgl) => {
                if (!tgl) return '-';
                const strTgl = String(tgl).trim();
                const d = new Date(strTgl);
                if (!isNaN(d.getTime())) return d.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
                const parts = strTgl.split(/[\/\- ]/);
                if (parts.length >= 3) {
                    const monthNames = ["", "Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
                    let m = parseInt(parts[1], 10);
                    let y = parts[2].length === 4 ? parts[2] : (parts[0].length === 4 ? parts[0] : parts[2]); 
                    if (m >= 1 && m <= 12 && String(y).length === 4) return `${monthNames[m]} ${y}`;
                }
                return strTgl; 
            };

            useEffect(() => {
                const fetchPermits = async () => {
                    try { 
                        const [resPermits, resLogs] = await Promise.all([
                            apiService.request('getPermits'),
                            apiService.request('getScanLogs')
                        ]);
                        
                        let finalPermits = [];
                        if (resPermits && resPermits.data && Array.isArray(resPermits.data.data)) finalPermits = resPermits.data.data;
                        else if (resPermits && Array.isArray(resPermits.data)) finalPermits = resPermits.data;
                        else if (Array.isArray(resPermits)) finalPermits = resPermits;

                        let finalLogs = [];
                        if (resLogs && resLogs.data && Array.isArray(resLogs.data.data)) finalLogs = resLogs.data.data;
                        else if (resLogs && Array.isArray(resLogs.data)) finalLogs = resLogs.data;
                        else if (Array.isArray(resLogs)) finalLogs = resLogs;

                        const dataWithMobilitas = finalPermits.map(p => {
                            // Hitung Status Mobilitas dari Log Security
                            let mobilitas = '-';
                            if (p.status_pengajuan === 'DISETUJUI' || p.status_pengajuan === 'SELESAI') {
                                const pId = p.permit_id || p.id || p.id_perizinan;
                                const myLogs = finalLogs.filter(l => l.permit_id === pId || l.id_perizinan === pId);
                                const hasExit = myLogs.some(l => String(l.tipe_scan||'').toUpperCase() === 'EXIT');
                                const returnLog = myLogs.find(l => String(l.tipe_scan||'').toUpperCase() === 'RETURN');
                                
                                if (!hasExit) mobilitas = 'Belum Keluar';
                                else if (hasExit && !returnLog) mobilitas = 'Masih Di Luar';
                                else if (returnLog) {
                                    if (String(returnLog.keterangan||'').toUpperCase().includes('TERLAMBAT')) mobilitas = 'Terlambat';
                                    else mobilitas = 'Tepat Waktu';
                                }
                            }

                            return {
                                ...p,
                                _bulan_filter: getBulanTahun(p.tanggal_izin),
                                _status_mobilitas: mobilitas
                            };
                        });

                        setPermits(dataWithMobilitas); 
                    } catch (e) { showToast(e.message, 'error'); } finally { setLoading(false); }
                };
                fetchPermits();
            }, []);

            const bulanOptions = [...new Set(permits.map(p => p._bulan_filter).filter(b => b && b !== '-'))];
            const kelasOptions = [...new Set(permits.map(p => p.kelas).filter(Boolean))].sort();

            // 1. FILTERING
            const filteredPermits = permits.filter(p => {
                const nama = String(p.nama_santri || '').toLowerCase();
                const kelas = String(p.kelas || '');
                const status = String(p.status_pengajuan || '').toUpperCase();
                const bulan = String(p._bulan_filter || '');
                const mobilitas = String(p._status_mobilitas || '');
                
                return (
                    nama.includes(searchTerm.toLowerCase()) &&
                    (filterBulan === '' || bulan === filterBulan) &&
                    (filterKelas === '' || kelas === filterKelas) &&
                    (filterStatus === '' || status.includes(filterStatus)) &&
                    (filterMobilitas === '' || mobilitas === filterMobilitas)
                );
            });

            // 2. SORTING
            const sortedPermits = [...filteredPermits].sort((a, b) => {
                if (!sortConfig.key) return 0;
                let aValue = a[sortConfig.key] || '';
                let bValue = b[sortConfig.key] || '';
                if (typeof aValue === 'string') aValue = aValue.toLowerCase();
                if (typeof bValue === 'string') bValue = bValue.toLowerCase();
                if (aValue < bValue) return sortConfig.direction === 'asc' ? -1 : 1;
                if (aValue > bValue) return sortConfig.direction === 'asc' ? 1 : -1;
                return 0;
            });

            const handleSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
                setSortConfig({ key, direction });
            };

            const SortIcon = ({ columnKey }) => {
                if (sortConfig.key !== columnKey) return <span className="text-gray-300 ml-1">↕</span>;
                return sortConfig.direction === 'asc' ? <span className="text-emerald-600 ml-1">▲</span> : <span className="text-emerald-600 ml-1">▼</span>;
            };

            const getStatusBadge = (status) => {
                if (!status) return <span className="bg-gray-100 px-2 py-1 text-xs font-bold rounded-full border">-</span>;
                const styles = { 'MENUNGGU': 'bg-yellow-100 text-yellow-800 border-yellow-200', 'MENUNGGU_APPROVAL': 'bg-yellow-100 text-yellow-800 border-yellow-200', 'DISETUJUI': 'bg-emerald-100 text-emerald-800 border-emerald-200', 'DITOLAK': 'bg-red-100 text-red-800 border-red-200', 'SELESAI': 'bg-gray-100 text-gray-800 border-gray-200' };
                const st = status.toUpperCase();
                return <span className={`px-2 py-1 text-xs font-bold rounded-full border ${styles[st] || 'bg-gray-100'}`}>{st.replace('_', ' ')}</span>;
            };

            const getMobilityBadge = (mobilitas) => {
                if (mobilitas === '-') return <span className="text-gray-400">-</span>;
                if (mobilitas === 'Belum Keluar') return <span className="px-2 py-1 text-[10px] font-bold rounded bg-gray-100 text-gray-600 border border-gray-200">BELUM KELUAR</span>;
                if (mobilitas === 'Masih Di Luar') return <span className="px-2 py-1 text-[10px] font-bold rounded bg-orange-100 text-orange-600 border border-orange-200">MASIH DI LUAR</span>;
                if (mobilitas === 'Tepat Waktu') return <span className="px-2 py-1 text-[10px] font-bold rounded bg-emerald-100 text-emerald-700 border border-emerald-200">TEPAT WAKTU</span>;
                if (mobilitas === 'Terlambat') return <span className="px-2 py-1 text-[10px] font-bold rounded bg-red-100 text-red-700 border border-red-200">TERLAMBAT</span>;
                return <span>{mobilitas}</span>;
            };

            return (
                <div className="space-y-6 animate-fade-in-down">
                    <div>
                        <h2 className="text-2xl font-bold text-gray-800">Riwayat Seluruh Perizinan</h2>
                        <p className="text-gray-500">Arsip global seluruh pengajuan izin santri lintas kelas untuk pelaporan Mudir.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
                        <input 
                            type="text" placeholder="Cari Nama Santri..." 
                            className="w-full p-2.5 border rounded-lg bg-white focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-medium"
                            value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)}
                        />
                        <select className="w-full p-2.5 border rounded-lg bg-white outline-none text-sm font-medium" value={filterBulan} onChange={(e) => setFilterBulan(e.target.value)}>
                            <option value="">Semua Bulan</option>
                            {bulanOptions.map((b, idx) => <option key={idx} value={b}>{b}</option>)}
                        </select>
                        <select className="w-full p-2.5 border rounded-lg bg-white outline-none text-sm font-medium" value={filterKelas} onChange={(e) => setFilterKelas(e.target.value)}>
                            <option value="">Semua Kelas</option>
                            {kelasOptions.map((k, idx) => <option key={idx} value={k}>{k}</option>)}
                        </select>
                        <select className="w-full p-2.5 border rounded-lg bg-white outline-none text-sm font-medium" value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)}>
                            <option value="">Semua Status Approval</option>
                            <option value="MENUNGGU_APPROVAL">Menunggu</option>
                            <option value="DISETUJUI">Disetujui</option>
                            <option value="DITOLAK">Ditolak</option>
                            <option value="SELESAI">Selesai</option>
                        </select>
                        <select className="w-full p-2.5 border rounded-lg bg-emerald-50 outline-none text-sm font-bold text-emerald-800" value={filterMobilitas} onChange={(e) => setFilterMobilitas(e.target.value)}>
                            <option value="">Semua Posisi Santri</option>
                            <option value="Masih Di Luar">Masih Di Luar</option>
                            <option value="Tepat Waktu">Kembali Tepat Waktu</option>
                            <option value="Terlambat">Terlambat</option>
                            <option value="Belum Keluar">Belum Keluar</option>
                        </select>
                    </div>

                    <div className="text-sm text-gray-500">
                        Menampilkan <span className="font-bold text-emerald-600">{sortedPermits.length}</span> data riwayat perizinan.
                    </div>

                    <Card className="overflow-x-auto p-0">
                        <table className="w-full text-left border-collapse text-sm whitespace-nowrap">
                            <thead>
                                <tr className="bg-emerald-50 text-emerald-800 border-b">
                                    <th className="p-4 font-semibold cursor-pointer select-none hover:bg-emerald-100" onClick={() => handleSort('tanggal_izin')}>
                                        Tgl Izin <SortIcon columnKey="tanggal_izin"/>
                                    </th>
                                    <th className="p-4 font-semibold cursor-pointer select-none hover:bg-emerald-100" onClick={() => handleSort('nama_santri')}>
                                        Santri & Kelas <SortIcon columnKey="nama_santri"/>
                                    </th>
                                    <th className="p-4 font-semibold cursor-pointer select-none hover:bg-emerald-100" onClick={() => handleSort('keperluan')}>
                                        Keperluan <SortIcon columnKey="keperluan"/>
                                    </th>
                                    <th className="p-4 font-semibold cursor-pointer select-none hover:bg-emerald-100" onClick={() => handleSort('status_jadwal')}>
                                        Status Jadwal <SortIcon columnKey="status_jadwal"/>
                                    </th>
                                    <th className="p-4 font-semibold cursor-pointer select-none hover:bg-emerald-100" onClick={() => handleSort('status_pengajuan')}>
                                        Status Approval <SortIcon columnKey="status_pengajuan"/>
                                    </th>
                                    <th className="p-4 font-semibold cursor-pointer select-none hover:bg-emerald-200 bg-emerald-100/50" onClick={() => handleSort('_status_mobilitas')}>
                                        Posisi Santri <SortIcon columnKey="_status_mobilitas"/>
                                    </th>
                                    <th className="p-4 font-semibold">Aksi</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {loading ? <tr><td colSpan="7" className="p-8 text-center text-gray-500">Memuat data arsip...</td></tr> : 
                                 sortedPermits.length === 0 ? <tr><td colSpan="7" className="p-8 text-center text-gray-500">Tidak ada data yang sesuai pencarian.</td></tr> :
                                 sortedPermits.map((p, idx) => (
                                    <tr key={idx} className="hover:bg-gray-50">

            try {

                // Ekstrak Aman Array Perizinan
                let allPermits = [];
                if (resPermits && resPermits.data && Array.isArray(resPermits.data.data)) allPermits = resPermits.data.data;
                else if (resPermits && Array.isArray(resPermits.data)) allPermits = resPermits.data;
                else if (Array.isArray(resPermits)) allPermits = resPermits;

                // Ekstrak Aman Array Logs
                let allLogs = [];

                else if (resLogs && Array.isArray(resLogs.data)) allLogs = resLogs.data;
                else if (Array.isArray(resLogs)) allLogs = resLogs;
                
                let sPekan = { ajuan: 0, disetujui: 0, ditolak: 0, diluar: 0, kembali: 0, terlambat: 0 };
                let sTotal = { ajuan: allPermits.length, rekapTepat: 0, terlambat: 0 };
                
                // RUMUS WAKTU: Menentukan rentang hari Senin s.d. Minggu pada pekan berjalan
                const now = new Date();
                const day = now.getDay() || 7; // Ubah index hari Minggu dari 0 menjadi 7
                const startOfWeek = new Date(now);
                startOfWeek.setHours(0, 0, 0, 0);
                startOfWeek.setDate(now.getDate() - day + 1); // Tarik mundur ke hari Senin
                
                const endOfWeek = new Date(startOfWeek);
                endOfWeek.setDate(startOfWeek.getDate() + 6); // Tarik maju ke hari Minggu
                endOfWeek.setHours(23, 59, 59, 999);

                allPermits.forEach(p => {
                    const pLogs = allLogs.filter(l => l.permit_id === p.permit_id || l.permit_id === p.id_perizinan);
                    const hasExit = pLogs.some(l => l.tipe_scan === 'EXIT');
                    const returnLog = pLogs.find(l => l.tipe_scan === 'RETURN');
                    
                    // --- 1. LOGIKA HISTORI TOTAL (Tabel Bawah) ---
                    if (returnLog) {
                        if (returnLog.keterangan && returnLog.keterangan.includes('TERLAMBAT')) sTotal.terlambat++;
                        else sTotal.rekapTepat++;
                    }

                    // --- 2. LOGIKA PEKAN INI (Kotak Atas) ---

                        if (p.status_pengajuan === 'DISETUJUI') sPekan.disetujui++;
                        if (p.status_pengajuan === 'DITOLAK') sPekan.ditolak++;

                        if (returnLog) {
                            sPekan.kembali++;
                            if (returnLog.keterangan && returnLog.keterangan.includes('TERLAMBAT')) sPekan.terlambat++;
                        }
