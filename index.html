<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Perizinan Santri Al-Islam</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- HTML5 QR Code Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Tom Select (Searchable Dropdown) -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.default.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: '#16a34a', secondary: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        .loader { border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .toast-enter { transform: translateY(100%); opacity: 0; }
        .toast-enter-active { transform: translateY(0); opacity: 1; transition: all 0.3s ease-out; }
        
        /* Tom Select Tailwind Override */
        .ts-control { border: 1px solid #cbd5e1 !important; border-radius: 0.5rem !important; padding: 0.5rem 1rem !important; min-height: 42px; font-family: 'Inter', sans-serif; box-shadow: none !important; }
        .ts-control.focus { border-color: #22c55e !important; box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2) !important; }
        .ts-dropdown { border-radius: 0.5rem !important; border-color: #cbd5e1 !important; margin-top: 4px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); font-family: 'Inter', sans-serif; }
        .ts-dropdown .option { padding: 0.5rem 1rem !important; }
        .ts-dropdown .active { background-color: #f0fdf4 !important; color: #16a34a !important; }

        /* Scanner Styles */
        #reader { width: 100%; max-width: 500px; margin: 0 auto; border-radius: 12px; overflow: hidden; border: none !important; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
        #reader__scan_region { background: #000; }
        #reader__dashboard_section_csr button { background-color: #16a34a; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: 'Inter'; font-weight: 500; margin: 4px; }
        #reader__dashboard_section_swaplink { color: #16a34a; text-decoration: none; font-weight: 500; margin-top:10px; display:inline-block; }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen overflow-hidden bg-slate-50">

    <div id="app" class="h-full w-full flex flex-col">
        <!-- Render Target -->
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <script>
        // API URL Google Apps Script Anda (PASTIKAN TIDAK BERUBAH)
        const API_URL = "https://script.google.com/macros/s/AKfycby8bTXMgdLeVoCaT29KdqbQqIm0ms_LwzPc0G7hsXjUwPLYJe3J2aWc4pfORhfQ5v0Tpw/exec";

        const App = {
            state: { user: null, token: null },
            
            init: () => {
                const savedToken = localStorage.getItem('token');
                const savedUser = localStorage.getItem('user');
                if (savedToken && savedUser) {
                    App.state.token = savedToken;
                    App.state.user = JSON.parse(savedUser);
                    App.router('dashboard');
                } else {
                    App.router('login');
                }
            },

            api: {
                post: async (action, data = {}) => {
                    try {
                        if (App.state.token) data.token = App.state.token;
                        const response = await fetch(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify({ action, data })
                        });
                        return await response.json();
                    } catch (error) {
                        return { success: false, message: "Koneksi ke server gagal. Periksa internet Anda." };
                    }
                }
            },

            ui: {
                showToast: (message, type = 'success') => {
                    const toast = document.createElement('div');
                    const colors = type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-blue-600';
                    toast.className = `${colors} text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3 toast-enter toast-enter-active font-medium text-sm`;
                    toast.innerHTML = `<i class="ph ${type === 'success' ? 'ph-check-circle' : 'ph-warning-circle'} text-xl"></i> ${message}`;
                    
                    document.getElementById('toast-container').appendChild(toast);
                    setTimeout(() => { toast.classList.remove('toast-enter-active'); setTimeout(() => toast.remove(), 300); }, 3000);
                }
            },

            views: {
                login: () => `
                    <div class="min-h-screen flex items-center justify-center bg-slate-50 p-4">
                        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
                            <div class="bg-green-600 p-8 text-center">
                                <i class="ph ph-shield-check text-5xl text-white mb-3"></i>
                                <h1 class="text-2xl font-bold text-white">Perizinan Al-Islam</h1>
                                <p class="text-green-100 text-sm mt-1">Sistem Management Santri</p>
                            </div>
                            <div class="p-8">
                                <form id="form-login" class="space-y-5">
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                                        <input type="text" id="username" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" required>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                                        <input type="password" id="password" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" required>
                                    </div>
                                    <button type="submit" id="btn-login" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded-lg transition-colors flex justify-center items-center h-11">
                                        Masuk
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                `,

                layout: (content) => `
                    <div class="flex h-screen bg-slate-50 w-full">
                        <!-- Sidebar -->
                        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col transition-all duration-300" id="sidebar">
                            <div class="h-16 flex items-center px-6 bg-slate-950 font-bold text-white text-lg tracking-wide border-b border-slate-800">
                                <i class="ph ph-shield-check text-green-500 mr-2 text-2xl"></i> Al-Islam
                            </div>
                            <div class="p-4 flex flex-col gap-1 flex-1 overflow-y-auto" id="nav-links">
                                ${App.views.navLinks(App.state.user.role)}
                            </div>
                            <div class="p-4 bg-slate-950 border-t border-slate-800">
                                <div class="text-sm font-medium text-white">${App.state.user.nama}</div>
                                <div class="text-xs text-slate-500 mb-3">${App.state.user.role}</div>
                                <button onclick="App.actions.logout()" class="w-full flex items-center justify-center gap-2 text-sm bg-slate-800 hover:bg-red-900/50 hover:text-red-400 py-2 rounded-lg transition-colors">
                                    <i class="ph ph-sign-out"></i> Keluar
                                </button>
                            </div>
                        </aside>

                        <!-- Main Content -->
                        <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
                            <header class="h-16 bg-white border-b border-slate-200 flex items-center px-6 justify-between shrink-0">
                                <h2 class="font-semibold text-slate-800 text-lg" id="page-title">Dashboard</h2>
                            </header>
                            <div class="flex-1 overflow-auto p-6" id="app-content">
                                ${content}
                            </div>
                        </main>
                    </div>
                `,

                navLinks: (role) => {
                    let links = `<button onclick="App.router('dashboard')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm hover:bg-slate-800 hover:text-white transition-colors w-full text-left"><i class="ph ph-squares-four text-lg"></i> Dashboard</button>`;
                    
                    if (role === 'ADMIN') {
                        links += `
                            <div class="text-xs font-semibold text-slate-500 mt-4 mb-2 px-3 uppercase">Master Data</div>
                            <button onclick="App.router('master-santri')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm hover:bg-slate-800 hover:text-white transition-colors w-full text-left"><i class="ph ph-users text-lg"></i> Data Santri</button>
                            <button onclick="App.router('master-kelas')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm hover:bg-slate-800 hover:text-white transition-colors w-full text-left"><i class="ph ph-chalkboard text-lg"></i> Data Kelas</button>
                            <button onclick="App.router('master-tp')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm hover:bg-slate-800 hover:text-white transition-colors w-full text-left"><i class="ph ph-calendar text-lg"></i> Tahun Pelajaran</button>
                            <div class="text-xs font-semibold text-slate-500 mt-4 mb-2 px-3 uppercase">Konfigurasi</div>
                            <button onclick="App.router('jadwal-izin')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm hover:bg-slate-800 hover:text-white transition-colors w-full text-left"><i class="ph ph-calendar-check text-lg"></i> Jadwal Perizinan</button>
                        `;
                    } else if (role === 'WALI_KELAS') {
                        links += `
                            <button onclick="App.router('ajukan-izin')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm hover:bg-slate-800 hover:text-white transition-colors w-full text-left"><i class="ph ph-paper-plane-tilt text-lg"></i> Ajukan Izin</button>
                            <button onclick="App.router('histori-izin')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm hover:bg-slate-800 hover:text-white transition-colors w-full text-left"><i class="ph ph-clock-counter-clockwise text-lg"></i> Histori Izin</button>
                        `;
                    } else if (role === 'SEKRETARIS_MUDIR') {
                        links += `
                            <button onclick="App.router('approval-izin')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm hover:bg-slate-800 hover:text-white transition-colors w-full text-left"><i class="ph ph-checks text-lg"></i> Approval Izin</button>
                        `;
                    } else if (role === 'SECURITY') {
                        links += `
                            <button onclick="App.router('scanner')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm hover:bg-slate-800 hover:text-white transition-colors w-full text-left"><i class="ph ph-qr-code text-lg"></i> Pos Scanner</button>
                        `;
                    }
                    return links;
                },

                dashboard: (stats) => `
                    <div class="mb-6 flex justify-between items-center">
                        <h1 class="text-2xl font-bold text-slate-800">Overview Statistik</h1>
                        <button onclick="App.router('dashboard')" class="bg-white border border-slate-200 shadow-sm hover:bg-slate-50 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                            <i class="ph ph-arrows-clockwise"></i> Refresh
                        </button>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div class="bg-white rounded-xl p-6 border border-slate-200 shadow-sm flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-2xl"><i class="ph ph-file-text"></i></div>
                            <div><p class="text-sm font-medium text-slate-500">Total Pengajuan</p><p class="text-2xl font-bold text-slate-800">${stats.total || 0}</p></div>
                        </div>
                        <div class="bg-white rounded-xl p-6 border border-slate-200 shadow-sm flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-orange-100 flex items-center justify-center text-orange-600 text-2xl"><i class="ph ph-clock"></i></div>
                            <div><p class="text-sm font-medium text-slate-500">Menunggu Approval</p><p class="text-2xl font-bold text-slate-800">${stats.menunggu || 0}</p></div>
                        </div>
                        <div class="bg-white rounded-xl p-6 border border-slate-200 shadow-sm flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center text-green-600 text-2xl"><i class="ph ph-check-circle"></i></div>
                            <div><p class="text-sm font-medium text-slate-500">Izin Disetujui</p><p class="text-2xl font-bold text-slate-800">${stats.disetujui || 0}</p></div>
                        </div>
                    </div>

                    <h2 class="text-lg font-bold text-slate-800 mb-4">Status Kepulangan (Scan)</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white rounded-xl p-6 border border-slate-200 shadow-sm">
                            <p class="text-sm font-medium text-slate-500 mb-1">Santri Sudah Keluar</p>
                            <p class="text-3xl font-bold text-slate-800">${stats.keluar || 0}</p>
                        </div>
                        <div class="bg-white rounded-xl p-6 border border-slate-200 shadow-sm">
                            <p class="text-sm font-medium text-slate-500 mb-1">Sudah Kembali ke Pondok</p>
                            <p class="text-3xl font-bold text-slate-800">${stats.kembali || 0}</p>
                        </div>
                        <div class="bg-indigo-600 rounded-xl p-6 shadow-sm text-white">
                            <p class="text-sm font-medium text-indigo-200 mb-1">Masih Berada di Luar</p>
                            <p class="text-3xl font-bold">${stats.masih_diluar || 0}</p>
                        </div>
                    </div>

                    ${App.state.user.role === 'ADMIN' ? `
                    <div class="mt-12 bg-orange-50 border border-orange-200 rounded-xl p-6">
                        <h3 class="font-bold text-orange-800 mb-2 flex items-center gap-2"><i class="ph ph-warning-circle"></i> Developer Tools (Admin Only)</h3>
                        <p class="text-sm text-orange-700 mb-4">Gunakan tombol ini untuk membuat Data Tahun Pelajaran, Kelas, dan Santri secara otomatis untuk keperluan testing.</p>
                        <button onclick="App.actions.generateDummy()" class="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow transition">Generate Data Dummy</button>
                    </div>` : ''}
                `,

                dataTable: (title, columns, rows) => `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                            <h3 class="font-semibold text-slate-800">${title}</h3>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-sm text-left">
                                <thead class="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">
                                    <tr>${columns.map(col => `<th class="px-6 py-3">${col}</th>`).join('')}</tr>
                                </thead>
                                <tbody>
                                    ${rows.length > 0 ? rows.map(row => `
                                        <tr class="border-b border-slate-100 hover:bg-slate-50">
                                            ${row.map(cell => `<td class="px-6 py-4">${cell}</td>`).join('')}
                                        </tr>
                                    `).join('') : `<tr><td colspan="${columns.length}" class="px-6 py-8 text-center text-slate-500">Belum ada data</td></tr>`}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `,

                formIzin: (optionsSantri, optionsSaudara) => `
                    <div class="max-w-2xl bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-green-600 px-6 py-4 text-white">
                            <h3 class="font-bold text-lg flex items-center gap-2"><i class="ph ph-paper-plane-tilt text-xl"></i> Form Pengajuan Izin Keluar</h3>
                            <p class="text-green-100 text-sm mt-1">Harap isi data dengan lengkap sesuai permintaan Walisantri.</p>
                        </div>
                        <form id="form-izin" class="p-6 space-y-5">
                            <div>
                                <label class="block text-sm font-medium mb-1 text-slate-700">Pilih Santri di Kelas Anda *</label>
                                <select id="izin-santri" required class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:border-green-500 bg-white">
                                    ${optionsSantri}
                                </select>
                            </div>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <div>
                                    <label class="block text-sm font-medium mb-1 text-slate-700">Tujuan Izin *</label>
                                    <input type="text" id="izin-tujuan" required placeholder="Contoh: Pulang ke Bandung" class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:border-green-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1 text-slate-700">Nama Wali Safar (Penjemput) *</label>
                                    <input type="text" id="izin-wali" required placeholder="Nama lengkap penjemput" class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:border-green-500">
                                </div>
                            </div>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <div>
                                    <label class="block text-sm font-medium mb-1 text-slate-700">Hubungan Wali Safar *</label>
                                    <select id="izin-hubungan" required class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:border-green-500 bg-white">
                                        <option value="">-- Pilih Hubungan --</option>
                                        <option value="Ayah">Ayah</option>
                                        <option value="Ibu">Ibu</option>
                                        <option value="Kakak Kandung">Kakak Kandung</option>
                                        <option value="Paman">Paman</option>
                                        <option value="Lainnya">Lainnya...</option>
                                    </select>
                                </div>
                                <div id="hubungan-lainnya-container" class="hidden">
                                    <label class="block text-sm font-medium mb-1 text-slate-700">Sebutkan Hubungan *</label>
                                    <input type="text" id="izin-hubungan-lainnya" placeholder="Contoh: Sepupu" class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:border-green-500">
                                </div>
                            </div>

                            <div>
                                <label class="block text-sm font-medium mb-1 text-slate-700">Keperluan Izin *</label>
                                <textarea id="izin-keperluan" required rows="2" placeholder="Deskripsikan keperluan secara singkat" class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:border-green-500"></textarea>
                            </div>

                            <!-- Opsi Ikut Jadwal Saudara -->
                            <div class="border border-slate-200 rounded-lg p-4 bg-slate-50">
                                <label class="flex items-center gap-2 cursor-pointer font-medium text-slate-700">
                                    <input type="checkbox" id="izin-ikut-saudara" class="w-4 h-4 text-green-600 rounded border-slate-300 focus:ring-green-500">
                                    Ikut Jadwal Saudara (Kakak/Adik)
                                </label>
                                
                                <div id="saudara-container" class="hidden mt-3 p-4 bg-white rounded-lg border border-slate-200">
                                    <label class="block text-sm font-medium mb-1 text-slate-700">Pilih Kakak/Adik *</label>
                                    <select id="izin-saudara" autocomplete="off" class="w-full text-sm outline-none">
                                        ${optionsSaudara}
                                    </select>
                                    
                                    <div id="saudara-manual-container" class="hidden mt-3 pt-3 border-t border-slate-200">
                                        <div class="flex items-start gap-2 text-amber-600 bg-amber-50 p-3 rounded mb-3">
                                            <i class="ph ph-warning-circle text-lg mt-0.5"></i>
                                            <p class="text-xs">Data saudara tidak ditemukan di sistem. Silakan ketik nama dan kelas secara manual. Pengajuan ini akan melalui verifikasi ekstra.</p>
                                        </div>
                                        <label class="block text-sm font-medium mb-1 text-slate-700">Nama Lengkap & Kelas Saudara *</label>
                                        <input type="text" id="izin-saudara-manual" placeholder="Contoh: Fulan - Kelas XI" class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none text-sm">
                                    </div>
                                </div>
                            </div>

                            <div class="pt-4 border-t border-slate-100 flex justify-end">
                                <button type="submit" id="btn-submit-izin" class="bg-green-600 hover:bg-green-700 text-white font-medium py-2.5 px-6 rounded-lg transition-colors shadow-sm">
                                    Kirim Pengajuan
                                </button>
                            </div>
                        </form>
                    </div>
                `,

                approvalList: (permits) => `
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                        ${permits.length > 0 ? permits.map(p => `
                            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col justify-between" id="permit-card-${p.permit_id}">
                                <div>
                                    <div class="flex justify-between items-start mb-3">
                                        <div>
                                            <h3 class="font-bold text-slate-800 text-lg">${p.nama_santri}</h3>
                                            <p class="text-sm text-slate-500">${p.jenjang} | Tgl: ${p.tanggal_izin_format}</p>
                                        </div>
                                        <span class="bg-amber-100 text-amber-700 text-xs font-semibold px-2.5 py-1 rounded-full border border-amber-200">Menunggu</span>
                                    </div>
                                    <div class="bg-slate-50 rounded p-3 text-sm space-y-1 mb-4 border border-slate-100">
                                        <p><span class="font-medium text-slate-600">Tujuan:</span> ${p.tujuan}</p>
                                        <p><span class="font-medium text-slate-600">Keperluan:</span> ${p.keperluan}</p>
                                        <p><span class="font-medium text-slate-600">Penjemput:</span> ${p.wali_safar} (${p.hubungan_wali})</p>
                                        ${p.keterangan_luar_jadwal ? `<p class="text-red-600 mt-2 text-xs font-semibold bg-red-50 p-1 rounded border border-red-100"><i class="ph ph-warning"></i> ${p.keterangan_luar_jadwal}</p>` : ''}
                                    </div>
                                </div>
                                <div class="flex gap-2 border-t border-slate-100 pt-3">
                                    <button onclick="App.actions.approvePermit('${p.permit_id}')" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-medium py-2 rounded-lg text-sm flex items-center justify-center gap-1 transition"><i class="ph ph-check"></i> Setujui</button>
                                    <button onclick="App.actions.rejectPermit('${p.permit_id}')" class="flex-1 bg-red-50 hover:bg-red-100 text-red-600 font-medium py-2 rounded-lg text-sm flex items-center justify-center gap-1 transition"><i class="ph ph-x"></i> Tolak</button>
                                </div>
                            </div>
                        `).join('') : `<div class="col-span-full py-12 text-center text-slate-500 bg-white rounded-xl border border-slate-200"><i class="ph ph-check-circle text-4xl text-slate-300 mb-2 block"></i>Semua pengajuan sudah diproses.</div>`}
                    </div>
                `,

                scanner: () => `
                    <div class="max-w-md mx-auto">
                        <div class="bg-slate-900 rounded-t-xl p-4 text-center text-white border-b border-slate-800">
                            <h2 class="font-bold text-lg"><i class="ph ph-qr-code"></i> Pos Security Scanner</h2>

            router: (route) => {
                const titleEl = document.getElementById('page-title');

                    titleEl.innerText = route.replace('-', ' ').replace(/\b\w/g, l => l.toUpperCase());
                }
                
                // Active link styling
                document.querySelectorAll('#nav-links button').forEach(btn => {
                    btn.classList.remove('bg-slate-800', 'text-white', 'border-l-4', 'border-green-500');

                        btn.classList.add('bg-slate-800', 'text-white', 'border-l-4', 'border-green-500', 'pl-2');
                    }
                });

                const content = document.getElementById('app-content');
                if (content && route !== 'login') {
                    content.innerHTML = '<div class="flex justify-center items-center h-64"><div class="loader w-8 h-8 border-[3px] border-green-600"></div></div>';

                // Route handling
                switch (route) {
                    case 'login': 
                        document.getElementById('app').innerHTML = App.views.login(); 
                        document.getElementById('form-login').addEventListener('submit', App.actions.login);
                        break;
                    case 'dashboard': App.actions.initDashboard(); break;
                    case 'master-santri': App.actions.initMasterData('getSantri', 'Direktori Santri', ['Nama Santri', 'L/P', 'Jenjang', 'Kelas Aktif', 'Kota Asal', 'Status']); break;
                    case 'master-kelas': App.actions.initMasterData('getClasses', 'Direktori Kelas', ['ID Kelas', 'Nama Kelas', 'Jenjang']); break;
                    case 'master-tp': App.actions.initMasterData('getAcademicYears', 'Tahun Pelajaran', ['ID', 'Periode', 'Status']); break;
                    case 'jadwal-izin': App.actions.initMasterData('getSchedules', 'Jadwal Perizinan Aktif', ['Pekan', 'Jenjang', 'Gender', 'Hari', 'Status']); break;
                    case 'ajukan-izin': App.actions.initFormIzin(); break;
                    case 'approval-izin': App.actions.initApproval(); break;
                    case 'histori-izin': App.actions.initHistori(); break;

            actions: {
                login: async (e) => {

                    const btn = document.getElementById('btn-login'); btn.innerHTML = '<div class="loader w-5 h-5 border-[2px] mx-auto"></div>'; btn.disabled = true;

                    if (res.success) {
                        localStorage.setItem('token', res.data.token);
                        localStorage.setItem('user', JSON.stringify(res.data.user));
                        App.state.token = res.data.token; App.state.user = res.data.user;
                        document.getElementById('app').innerHTML = App.views.layout('');
                        App.router('dashboard');
                        App.ui.showToast('Login berhasil!');
                    } else {
                        App.ui.showToast(res.message, 'error');
                        btn.innerHTML = 'Masuk'; btn.disabled = false;
                    }
                },
                logout: () => { localStorage.clear(); App.state.token = null; App.state.user = null; App.router('login'); },
                
                initDashboard: async () => {
                    try {
                        const res = await App.api.post('getDashboardStats', {});
                        if(res.success) {
                            document.getElementById('app-content').innerHTML = App.views.dashboard(res.data);
                        } else {
                            document.getElementById('app-content').innerHTML = `<div class="p-4 text-red-500">Gagal memuat dashboard: ${res.message}</div>`;
                        }
                    } catch (e) {
                        document.getElementById('app-content').innerHTML = `<div class="p-4 text-red-500">Error jaringan.</div>`;
                    }
                },

                generateDummy: async () => {
                    App.ui.showToast('Membangun data dummy, mohon tunggu...', 'info');
                    const res = await App.api.post('generateDummy');
                    if(res.success) {
                        App.ui.showToast('Data dummy berhasil dibuat!');
                        App.router('dashboard');
                    } else {
                        App.ui.showToast(res.message, 'error');
                    }
                },

                initMasterData: async (action, title, columns) => {

                    if (res.success) {

                            if(action === 'getSantri') return [item.nama_santri, item.jenis_kelamin.substring(0,1), item.jenjang, item.nama_kelas || '-', item.kota_asal, item.status_santri];
                            if(action === 'getClasses') return [item.kelas_id, item.nama_kelas, item.jenjang];
                            if(action === 'getAcademicYears') return [item.tahun_pelajaran_id, item.nama_periode, item.status];
                            if(action === 'getSchedules') return [item.pekan, item.jenjang, item.gender, item.hari, item.status];

                        });

                                else { container.classList.add('hidden'); document.getElementById('izin-hubungan-lainnya').required = false; }

                            document.getElementById('form-izin').addEventListener('submit', async (e) => {

                                        wali_safar: document.getElementById('izin-wali').value,
                                        hubungan_wali: document.getElementById('izin-hubungan').value,
                                        hubungan_lainnya: document.getElementById('izin-hubungan-lainnya').value,

                initApproval: async () => {
                    const res = await App.api.post('getPendingPermits');
                    if (res.success) { document.getElementById('app-content').innerHTML = App.views.approvalList(res.data); }
                },

                approvePermit: async (permitId) => {
                    if(!confirm('Setujui izin ini dan terbitkan QR Code?')) return;
                    const res = await App.api.post('approvePermit', { permit_id: permitId });
                    if(res.success) { App.ui.showToast('Izin disetujui, QR Diterbitkan!'); document.getElementById(`permit-card-${permitId}`).remove(); }
                },

                rejectPermit: async (permitId) => {
                    const alasan = prompt('Masukkan alasan penolakan:');
                    if(!alasan) return;
                    const res = await App.api.post('rejectPermit', { permit_id: permitId, alasan: alasan });
                    if(res.success) { App.ui.showToast('Izin ditolak!'); document.getElementById(`permit-card-${permitId}`).remove(); }
                },

                initHistori: async () => {
                    const res = await App.api.post('getMyPermits');
                    if (res.success) { document.getElementById('app-content').innerHTML = App.views.historiList(res.data); }
                },

                showQR: (token, name, className, date, wali, hubungan, keperluan) => {
                    document.getElementById('qr-santri-name').innerText = name;
                    document.getElementById('qr-santri-class').innerText = className;
                    document.getElementById('qr-date').innerText = date;
                    document.getElementById('qr-wali').innerText = wali;
                    document.getElementById('qr-hubungan').innerText = `(${hubungan})`;
                    
                    // Simpan data untuk digambar di canvas
                    window.currentQRData = { token, name, className, date, wali, hubungan, keperluan };

                    const container = document.getElementById('qr-container'); container.innerHTML = '';
                    new QRCode(container, { text: token, width: 200, height: 200, colorDark : "#000000", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H });
                    document.getElementById('qr-modal').classList.remove('hidden');
                },

                downloadQRPNG: () => {
                    const data = window.currentQRData;
                    if(!data) return;

                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 600; canvas.height = 360;

                    // 1. Background Kartu (Putih, Border, Shadow visual)
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2; ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);

                    // 2. Header Hijau
                    ctx.fillStyle = '#16a34a'; ctx.fillRect(0, 0, canvas.width, 70);
                    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
                    ctx.font = 'bold 20px Arial'; ctx.fillText('KARTU IZIN KELUAR SANTRI', canvas.width/2, 32);
                    ctx.font = '14px Arial'; ctx.fillText('PONDOK PESANTREN MODERN AL-ISLAM', canvas.width/2, 54);

                    // 3. Data Santri (Sebelah Kiri)
                    ctx.textAlign = 'left';
                    ctx.fillStyle = '#0f172a'; ctx.font = 'bold 22px Arial'; ctx.fillText(data.name, 30, 110);
                    ctx.fillStyle = '#64748b'; ctx.font = '16px Arial'; ctx.fillText(data.className, 30, 135);

                    // Grid Data Rincian
                    let startY = 180; const lineSpacing = 35;
                    ctx.font = '14px Arial';
                    
                    ctx.fillStyle = '#64748b'; ctx.fillText('Tanggal Izin', 30, startY);
                    ctx.fillStyle = '#0f172a'; ctx.font = 'bold 15px Arial'; ctx.fillText(data.date, 130, startY);

                    ctx.fillStyle = '#64748b'; ctx.font = '14px Arial'; ctx.fillText('Jam Resmi', 30, startY + lineSpacing);
                    ctx.fillStyle = '#16a34a'; ctx.font = 'bold 15px Arial'; ctx.fillText('08.00 - 16.00', 130, startY + lineSpacing);

                    ctx.fillStyle = '#64748b'; ctx.font = '14px Arial'; ctx.fillText('Penjemput', 30, startY + (lineSpacing*2));
                    ctx.fillStyle = '#0f172a'; ctx.font = 'bold 15px Arial'; ctx.fillText(`${data.wali} (${data.hubungan})`, 130, startY + (lineSpacing*2));

                    ctx.fillStyle = '#64748b'; ctx.font = '14px Arial'; ctx.fillText('Keperluan', 30, startY + (lineSpacing*3));
                    ctx.fillStyle = '#0f172a'; ctx.font = 'bold 14px Arial'; 
                    // Truncate keperluan jika terlalu panjang
                    let shortKeperluan = data.keperluan.length > 35 ? data.keperluan.substring(0, 32) + '...' : data.keperluan;
                    ctx.fillText(shortKeperluan, 130, startY + (lineSpacing*3));

                    // 4. Garis Pembatas Vertikal Putus-putus
                    ctx.beginPath(); ctx.setLineDash([5, 5]);
                    ctx.moveTo(380, 90); ctx.lineTo(380, 330);
                    ctx.strokeStyle = '#cbd5e1'; ctx.stroke(); ctx.setLineDash([]); // Reset dash

                    // 5. Draw QR Code (Sebelah Kanan)
                    const qrImg = document.querySelector('#qr-container img');
                    if (qrImg && qrImg.src) {
                        const img = new Image();
                        img.onload = () => {
                            // Gambar QR di sebelah kanan
                            ctx.drawImage(img, 400, 100, 170, 170);
                            
                            // Teks Bantuan di bawah QR
                            ctx.textAlign = 'center';
                            ctx.fillStyle = '#64748b'; ctx.font = '12px Arial';
                            ctx.fillText('Pindai kode ini di', 485, 295);
                            ctx.fillText('Pos Security (Keluar & Kembali)', 485, 315);

                            // Trigger Download
                            const link = document.createElement('a');
                            link.download = `Izin_${data.name.replace(/\s+/g, '_')}_${data.date}.png`;
                            link.href = canvas.toDataURL();
                            link.click();
                        };
                        img.src = qrImg.src;
                    }
                },

                initScanner: () => {
                    document.getElementById('app-content').innerHTML = App.views.scanner();
                    
                    if (window.html5QrCode) { window.html5QrCode.clear(); }
                    
                    window.html5QrCode = new Html5Qrcode("reader");
                    const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };
                    
                    window.html5QrCode.start({ facingMode: "environment" }, config, async (decodedText) => {
                        window.html5QrCode.stop(); // Stop scanning on first success
                        document.getElementById('reader').classList.add('hidden');
                        
                        const resultContainer = document.getElementById('scan-result-container');
                        const header = document.getElementById('scan-result-header');
                        
                        header.innerHTML = '<div class="loader w-6 h-6 border-[3px] border-white mx-auto"></div>';
                        header.className = 'p-4 text-center text-white font-bold text-lg uppercase tracking-wide bg-slate-500';
                        resultContainer.classList.remove('hidden');

                        try {
                            const res = await App.api.post('scanQR', { qr_token: decodedText });
                            
                            if(res.success) {
                                const isExit = res.data.scan_type === 'EXIT';
                                header.className = `p-4 text-center text-white font-bold text-lg uppercase tracking-wide ${isExit ? 'bg-amber-500' : 'bg-green-500'}`;
                                header.innerHTML = `<i class="ph ph-${isExit ? 'sign-out' : 'sign-in'} text-xl mb-1 block"></i> SCAN ${res.data.scan_type} BERHASIL`;
                                
                                document.getElementById('scan-santri-name').innerText = res.data.nama_santri;
                                document.getElementById('scan-time').innerText = `Waktu Scan: ${res.data.waktu}`;
                                
                                const statusEl = document.getElementById('scan-status-waktu');
                                statusEl.innerText = res.data.status_waktu;
                                if(res.data.status_waktu.includes('TERLAMBAT')) { statusEl.classList.add('text-red-600'); } 
                                else { statusEl.classList.remove('text-red-600'); statusEl.classList.add('text-green-600'); }
                                
                                if("vibrate" in navigator) navigator.vibrate([200, 100, 200]); // Success vibration
                            } else {
                                throw new Error(res.message);
                            }
                        } catch (err) {
                            header.className = 'p-4 text-center text-white font-bold text-lg tracking-wide bg-red-600';
                            header.innerHTML = `<i class="ph ph-warning-circle text-2xl mb-1 block"></i> SCAN DITOLAK`;
                            document.getElementById('scan-santri-name').innerText = "Akses Tidak Sah";
                            document.getElementById('scan-time').innerText = "";
                            document.getElementById('scan-status-waktu').innerText = err.message || "QR Code tidak valid.";
                            document.getElementById('scan-status-waktu').classList.add('text-red-600');
                            
                            if("vibrate" in navigator) navigator.vibrate([500]); // Error vibration
                        }
                    }).catch(err => {
                        App.ui.showToast('Gagal mengakses kamera.', 'error');
                    });
                },

                resetScanner: () => {
                    document.getElementById('scan-result-container').classList.add('hidden');
                    document.getElementById('reader').classList.remove('hidden');
                    App.actions.initScanner(); // Restart
                }
            }
        };

        // Initialize App on load
        window.addEventListener('DOMContentLoaded', () => {
            if (document.getElementById('app')) {
                const user = localStorage.getItem('user');
                if(user) { document.getElementById('app').innerHTML = App.views.layout(''); App.init(); } 
                else { App.init(); }
            }
        });
    </script>
</body>
</html>
